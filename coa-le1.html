const TOPIC = {NS:'Number Systems',IC:'IC & Semiconductor Background',COMP:'SAP-1 Components',ASM:'Assembly Language',ML:'Machine Language',PC:'Program Counter',IN:'Input',MEM:'MAR and RAM'};
const TOPIC_ORDER = ['NS','IC','COMP','ASM','ML','PC','IN','MEM'];
const DIFF = {E:'Easy',M:'Moderate',D:'Difficult'};
const DOTS = {E:'●',M:'●●',D:'●●●'};
const KEY = 'sap1-exam-attempt-v1';
const TOTAL = QUESTIONS.length;
const byId = new Map(QUESTIONS.map(q => [q.id, q]));
const app = document.getElementById('app');

let S = { screen:'start', order:[], perms:{}, answers:{}, idx:0, confirm:false, filter:'all', topic:'all', mapOpen:false, shuffleRetake:true, attempt:0 };
let saved = null;

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const L = k => 'ABCD'[k];
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function view(id){
  const q = byId.get(id), p = S.perms[id];
  const choices = p.map((orig,k) => ({k, orig, text:q.ch[orig], why:q.why[orig]}));
  return { q, choices, correctK: p.indexOf(q.a) };
}
function newAttempt(doShuffle){
  const ids = QUESTIONS.map(q => q.id);
  if (doShuffle) shuffle(ids);
  const perms = {};
  for (const q of QUESTIONS){ const p=[0,1,2,3]; if (doShuffle) shuffle(p); perms[q.id]=p; }
  S.order = ids; S.perms = perms; S.answers = {}; S.idx = 0; S.confirm = false;
  S.filter = 'all'; S.topic = 'all'; S.screen = 'exam'; S.mapOpen = false; S.attempt++;
  persist(); render(); window.scrollTo(0,0);
}
function persist(){
  if (S.screen === 'start') return;
  try {
    localStorage.setItem(KEY, JSON.stringify({ screen:S.screen, order:S.order, perms:S.perms, answers:S.answers, idx:S.idx, shuffleRetake:S.shuffleRetake, attempt:S.attempt }));
  } catch(e){}
}
function loadSaved(){
  try {
    const raw = localStorage.getItem(KEY); if (!raw) return null;
    const d = JSON.parse(raw);
    if (!d || !Array.isArray(d.order) || d.order.length !== TOTAL || !d.perms || !d.answers) return null;
    if (!d.order.every(id => byId.has(id) && Array.isArray(d.perms[id]) && d.perms[id].length === 4)) return null;
    if (d.screen !== 'exam' && d.screen !== 'results') return null;
    return d;
  } catch(e){ return null; }
}
function grade(){
  let c=0,w=0,u=0; const byT={}, byD={};
  for (const t of TOPIC_ORDER) byT[t]={c:0,n:0};
  for (const d of ['E','M','D']) byD[d]={c:0,n:0};
  for (const id of S.order){
    const v = view(id), a = S.answers[id];
    byT[v.q.t].n++; byD[v.q.d].n++;
    if (a == null) u++;
    else if (a === v.correctK){ c++; byT[v.q.t].c++; byD[v.q.d].c++; }
    else w++;
  }
  return { c, w, u, pct:(c/TOTAL*100).toFixed(2), byT, byD };
}
function status(id){
  const a = S.answers[id], v = view(id);
  return a == null ? 'unanswered' : (a === v.correctK ? 'correct' : 'incorrect');
}

/* ---------- views ---------- */
function topBar(sub, right, prog){
  return `<header class="top"><div class="in">
    <div class="row"><div class="brand"><h1>SAP-1 Examination</h1><p>${esc(sub)}</p></div>${right||''}</div>${prog||''}
  </div></header>`;
}

function renderStart(){
  const counts = {}; QUESTIONS.forEach(q => counts[q.t] = (counts[q.t]||0)+1);
  const rows = TOPIC_ORDER.map((t,i) => `<tr><td>${i+1}. ${esc(TOPIC[t])}</td><td>${counts[t]} items</td></tr>`).join('');
  let resume = '';
  if (saved){
    const n = Object.keys(saved.answers).length;
    resume = saved.screen === 'results'
      ? `<button class="btn" data-act="viewlast">View last results</button>`
      : `<button class="btn cu" data-act="resume">Resume attempt (${n} of ${TOTAL} answered)</button>`;
  }
  return topBar('Computer Organization · SAP-1 study exam') + `<main class="wrap">
    <section class="card hero">
      <h2>150-item multiple-choice exam</h2>
      <p>Questions apply what you studied about number systems, SAP-1 components, assembly and machine language, the program counter, input, and the MAR and RAM. Difficulty is mixed throughout.</p>
      <div class="facts">
        <div class="fact"><b>${TOTAL}</b><span>questions, 4 choices each</span></div>
        <div class="fact"><b>8</b><span>topics from your coursework</span></div>
        <div class="fact"><b>Review</b><span>explanations after you submit</span></div>
      </div>
      <div class="tablewrap"><table class="topics"><tbody>${rows}</tbody></table></div>
      <div class="note"><b>About topic 2.</b> The slides and chapter you provided cover computer generations, ICs, microprocessors, RISC/CISC and the chips in the SAP-1 schematic. They show no wafer-fabrication steps, so none are tested.</div>
      <label class="chk"><input type="checkbox" id="shuf" data-act="shuf" ${S.shuffleRetake?'checked':''}><span>Shuffle question order and answer choices when I retake the exam</span></label>
      <div class="btnrow"><button class="btn pri" data-act="start">Start Exam</button>${resume}</div>
    </section></main>`;
}

function renderExam(){
  const id = S.order[S.idx], v = view(id), sel = S.answers[id];
  const answered = Object.keys(S.answers).length;
  const pct = answered / TOTAL * 100;
  const prog = `<div class="prog"><div class="lab"><span><b>Question ${S.idx+1} of ${TOTAL}</b></span><span>${answered} of ${TOTAL} answered</span></div>
    <div class="bar" role="progressbar" aria-label="Questions answered" aria-valuemin="0" aria-valuemax="${TOTAL}" aria-valuenow="${answered}"><i style="width:${pct}%"></i></div></div>`;
  const opts = v.choices.map(c => `<li><button class="opt" role="radio" aria-checked="${sel===c.k}" data-act="pick" data-k="${c.k}"><span class="lt">${L(c.k)}</span><span class="tx">${esc(c.text)}</span></button></li>`).join('');
  const map = S.order.map((qid,i) => `<button class="mc ${S.answers[qid]!=null?'done':''} ${i===S.idx?'cur':''}" data-act="goto" data-i="${i}" aria-label="Question ${i+1}${S.answers[qid]!=null?', answered':', not answered'}">${i+1}</button>`).join('');
  const unans = TOTAL - answered;
  const body = `<main class="wrap">
    <button class="btn maptoggle" data-act="togglemap" aria-expanded="${S.mapOpen}">${S.mapOpen?'Hide':'Show'} question map (${unans} unanswered)</button>
    <div class="layout">
      <section class="card qcard" aria-label="Question ${S.idx+1}">
        <div class="meta"><span class="chip topic">${esc(TOPIC[v.q.t])}</span><span class="chip">${DIFF[v.q.d]} <span class="dots" aria-hidden="true">${DOTS[v.q.d]}</span></span></div>
        <p class="qtext">${esc(v.q.q)}</p>
        ${v.q.ctx ? `<pre class="ctx">${esc(v.q.ctx)}</pre>` : ''}
        <ul class="opts" role="radiogroup" aria-label="Answer choices">${opts}</ul>
        <div class="nav">
          <button class="btn" data-act="prev" ${S.idx===0?'disabled':''}>← Previous</button>
          <button class="btn pri" data-act="next" ${S.idx===TOTAL-1?'disabled':''}>Next →</button>
          <button class="link" data-act="clear" ${sel==null?'disabled':''}>Clear answer</button>
          <span class="sp"></span>
          <button class="btn cu" data-act="submit">Submit Exam</button>
        </div>
        <p class="hint">Keys: A–D or 1–4 select · ← → move between questions</p>
      </section>
      <aside class="card map ${S.mapOpen?'':'closed'}" aria-label="Question map">
        <h2>Question map</h2><p class="sub">${answered} answered · ${unans} unanswered</p>
        <div class="grid">${map}</div>
        <div class="legend"><span>Open</span><span class="l1">Answered</span><span class="l2">Current</span></div>
      </aside>
    </div></main>`;
  const modal = S.confirm ? `<div class="scrim" data-act="cancel"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt" data-stop="1">
      <h2 id="mt">Submit exam?</h2>
      <p>Are you sure you want to submit your exam?</p>
      <p class="mono" style="font-size:14px">${answered} of ${TOTAL} answered</p>
      ${unans ? `<p class="warn">${unans} unanswered question${unans===1?'':'s'} will be marked as unanswered and earn no credit.</p>` : ''}
      <div class="acts"><button class="btn" id="keep" data-act="cancel">Keep working</button><button class="btn pri" data-act="confirm">Submit Exam</button></div>
    </div></div>` : '';
  return topBar('Computer Organization · SAP-1 study exam', `<button class="btn cu" data-act="submit">Submit Exam</button>`, prog) + body + modal;
}

function bars(map, labelFn, keys){
  return keys.map(k => { const r = map[k]; const w = r.n ? r.c/r.n*100 : 0;
    return `<div class="brow"><span>${esc(labelFn(k))}</span><div class="trk" aria-hidden="true"><i style="width:${w}%"></i></div><span class="n">${r.c} / ${r.n}</span></div>`; }).join('');
}

function reviewCard(id, n){
  const v = view(id), a = S.answers[id], st = status(id);
  const pill = st==='correct' ? '<span class="pill good">Correct</span>' : st==='incorrect' ? '<span class="pill bad">Incorrect</span>' : '<span class="pill warn">Unanswered</span>';
  const opts = v.choices.map(c => {
    const isC = c.k===v.correctK, isW = a===c.k && !isC;
    return `<li><div class="opt r ${isC?'c':''} ${isW?'w':''}"><span class="lt">${L(c.k)}</span><span class="tx">${esc(c.text)}${isC?'<span class="tag">✓ Correct answer</span>':''}${isW?'<span class="tag">✕ Your answer</span>':''}</span></div></li>`; }).join('');
  const mine = a == null ? `<div class="no"><span class="lbl">My Answer</span><b>—</b> not answered</div>`
    : `<div class="${st==='correct'?'ok':'no'}"><span class="lbl">My Answer</span><b>${L(a)}</b> ${esc(v.choices[a].text)}</div>`;
  const why = st==='correct' ? '' : `<div><h4>Why your answer is incorrect</h4><div class="body">${a==null ? 'You did not select an answer for this question. Review the reasoning above and try the same steps.' : esc(v.choices[a].why)}</div></div>`;
  return `<article class="card rv" id="rv-${n}">
    <header><h3>Question ${n}</h3>${pill}<span class="chip topic">${esc(TOPIC[v.q.t])}</span><span class="chip">${DIFF[v.q.d]} <span class="dots" aria-hidden="true">${DOTS[v.q.d]}</span></span></header>
    <p class="qtext">${esc(v.q.q)}</p>
    ${v.q.ctx ? `<pre class="ctx">${esc(v.q.ctx)}</pre>` : ''}
    <div class="ans">${mine}<div class="ok"><span class="lbl">Correct Answer</span><b>${L(v.correctK)}</b> ${esc(v.choices[v.correctK].text)}</div></div>
    <ul class="opts">${opts}</ul>
    <div class="expl"><div class="eh">Explanation</div>
      <div><h4>Why ${L(v.correctK)} is correct, and how to solve it</h4><div class="body">${esc(v.q.x)}</div></div>
      ${why}
      <div><h4>Concept tested</h4><div class="body">${esc(v.q.c)} (${esc(TOPIC[v.q.t])})</div></div>
    </div></article>`;
}

function renderResults(){
  const g = grade();
  const list = S.order.map((id,i) => ({id, n:i+1})).filter(r => (S.filter==='all' || status(r.id)===S.filter) && (S.topic==='all' || byId.get(r.id).t===S.topic));
  const F = (key,label,count) => `<button data-act="filter" data-f="${key}" aria-pressed="${S.filter===key}">${label}<span>${count}</span></button>`;
  const topicOpts = `<option value="all">All topics</option>` + TOPIC_ORDER.map(t => `<option value="${t}" ${S.topic===t?'selected':''}>${esc(TOPIC[t])}</option>`).join('');
  return topBar('Results and review', `<button class="btn cu" data-act="retake">Retake Exam</button>`) + `<main class="wrap">
    <section class="card score">
      <div><div class="big mono" style="font-family:var(--display)">Score: ${g.c} <small>/ ${TOTAL}</small></div><div class="pct">Percentage: ${g.pct}%</div>
        <div class="btnrow"><button class="btn pri" data-act="retake">Retake Exam</button><button class="btn" data-act="reviewwrong">Review wrong answers only</button></div>
        <label class="chk"><input type="checkbox" id="shuf2" data-act="shuf" ${S.shuffleRetake?'checked':''}><span>Shuffle question order and answer choices on retake</span></label></div>
      <div class="tiles"><div class="tile g"><b>${g.c}</b><span>Correct</span></div><div class="tile r"><b>${g.w}</b><span>Incorrect</span></div><div class="tile w"><b>${g.u}</b><span>Unanswered</span></div></div>
    </section>
    <div class="two">
      <section class="card pan"><h3>By topic</h3>${bars(g.byT, k=>TOPIC[k], TOPIC_ORDER)}</section>
      <section class="card pan"><h3>By difficulty</h3>${bars(g.byD, k=>DIFF[k], ['E','M','D'])}</section>
    </div>
    <div class="toolbar" id="review-top">
      <div class="seg" role="group" aria-label="Filter questions">${F('all','All',TOTAL)}${F('correct','Correct',g.c)}${F('incorrect','Incorrect',g.w)}${F('unanswered','Unanswered',g.u)}</div>
      <select id="topicsel" data-act="topic" aria-label="Filter by topic">${topicOpts}</select>
    </div>
    ${list.length ? list.map(r => reviewCard(r.id, r.n)).join('') : `<div class="card empty">No questions match this filter.</div>`}
  </main>`;
}

function render(){
  const scroll = window.scrollY;
  app.innerHTML = S.screen==='start' ? renderStart() : S.screen==='exam' ? renderExam() : renderResults();
  if (S.screen==='exam' && S.confirm){ const k = document.getElementById('keep'); if (k) k.focus(); }
}

/* ---------- actions ---------- */
function go(i){ S.idx = Math.max(0, Math.min(TOTAL-1, i)); persist(); render(); window.scrollTo(0,0); }
function pick(k){ const id = S.order[S.idx]; S.answers[id] = k; persist(); render(); }

app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'cancel' && el.classList.contains('scrim') && e.target.closest('[data-stop]')) return;
  const a = el.dataset.act;
  if (a==='start') newAttempt(false);
  else if (a==='resume'){ Object.assign(S, { screen:'exam', order:saved.order, perms:saved.perms, answers:saved.answers, idx:Math.min(saved.idx||0,TOTAL-1), attempt:saved.attempt||1, confirm:false }); render(); }
  else if (a==='viewlast'){ Object.assign(S, { screen:'results', order:saved.order, perms:saved.perms, answers:saved.answers, idx:0, attempt:saved.attempt||1, filter:'all', topic:'all' }); render(); window.scrollTo(0,0); }
  else if (a==='pick') pick(+el.dataset.k);
  else if (a==='clear'){ delete S.answers[S.order[S.idx]]; persist(); render(); }
  else if (a==='prev') go(S.idx-1);
  else if (a==='next') go(S.idx+1);
  else if (a==='goto'){ S.mapOpen = false; go(+el.dataset.i); }
  else if (a==='togglemap'){ S.mapOpen = !S.mapOpen; render(); }
  else if (a==='submit'){ S.confirm = true; render(); }
  else if (a==='cancel'){ S.confirm = false; render(); }
  else if (a==='confirm'){ S.confirm = false; S.screen = 'results'; S.filter='all'; S.topic='all'; persist(); render(); window.scrollTo(0,0); }
  else if (a==='retake') newAttempt(S.shuffleRetake);
  else if (a==='filter'){ S.filter = el.dataset.f; render(); }
  else if (a==='reviewwrong'){ S.filter = 'incorrect'; S.topic='all'; render(); const t = document.getElementById('review-top'); if (t) t.scrollIntoView({block:'start'}); }
});
app.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.act === 'shuf'){ S.shuffleRetake = el.checked; persist(); render(); }
  else if (el.dataset.act === 'topic'){ S.topic = el.value; render(); }
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (S.screen==='exam' && S.confirm){ if (e.key==='Escape'){ S.confirm=false; render(); } return; }
  if (S.screen!=='exam') return;
  const tag = (e.target && e.target.tagName) || '';
  if (tag==='SELECT' || tag==='INPUT' || tag==='TEXTAREA') return;
  const k = 'abcd'.indexOf(e.key.toLowerCase());
  if (e.key.length===1 && k>=0) { pick(k); return; }
  if (e.key>='1' && e.key<='4'){ pick(+e.key-1); return; }
  if (e.key==='ArrowRight' && S.idx<TOTAL-1) go(S.idx+1);
  else if (e.key==='ArrowLeft' && S.idx>0) go(S.idx-1);
});

saved = loadSaved();
if (saved) S.shuffleRetake = saved.shuffleRetake !== false;
render();
</script>

</body></html>
