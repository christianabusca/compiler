<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SAP-1 Examination</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: datasheet-style exam console. Soldermask-green chrome, copper marks selection, question card + question map side panel. */
:root{
  --bg:#E8EEEB; --surface:#FFFFFF; --surface2:#F1F5F3; --ink:#12201B; --muted:#55675F; --line:#C6D3CD;
  --head:#0B3D2E; --head-ink:#F2F8F5; --head-dim:#9CC2B3;
  --board:#0F6149; --on-board:#FFFFFF;
  --copper:#B4691F; --copper-bg:#FBEEDD; --on-copper:#FFFFFF;
  --good:#17703A; --good-bg:#E1F3E7; --bad:#B3261E; --bad-bg:#FBE6E3; --warn:#7A5C00; --warn-bg:#FFF3C9;
  --scrim:rgba(8,18,14,.55);
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1411; --surface:#13221C; --surface2:#1A2D26; --ink:#E5EEEA; --muted:#93A8A0; --line:#2B4237;
    --head:#071F18; --head-ink:#EAF4F0; --head-dim:#7FA999;
    --board:#37AE88; --on-board:#04130D;
    --copper:#E3A15B; --copper-bg:#2C2117; --on-copper:#1B1007;
    --good:#62CE8B; --good-bg:#12301F; --bad:#FF8F85; --bad-bg:#371A17; --warn:#E8C65A; --warn-bg:#2F2810;
    --scrim:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1411; --surface:#13221C; --surface2:#1A2D26; --ink:#E5EEEA; --muted:#93A8A0; --line:#2B4237;
  --head:#071F18; --head-ink:#EAF4F0; --head-dim:#7FA999;
  --board:#37AE88; --on-board:#04130D;
  --copper:#E3A15B; --copper-bg:#2C2117; --on-copper:#1B1007;
  --good:#62CE8B; --good-bg:#12301F; --bad:#FF8F85; --bad-bg:#371A17; --warn:#E8C65A; --warn-bg:#2F2810;
  --scrim:rgba(0,0,0,.65);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--sans);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 56px}
.mono{font-family:var(--mono)}

/* top bar */
.top{background:var(--head);color:var(--head-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-bottom:3px solid var(--copper)}
.top .in{max-width:1120px;margin:0 auto;padding:12px 16px 12px}
.top .row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand h1{font:700 26px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.brand p{margin:4px 0 0;font:500 11.5px/1.2 var(--mono);color:var(--head-dim);letter-spacing:.04em}
.prog{margin-top:10px}
.prog .lab{display:flex;justify-content:space-between;gap:12px;font:500 13px/1.2 var(--mono);color:var(--head-dim);margin-bottom:6px;flex-wrap:wrap}
.prog .lab b{color:var(--head-ink);font-weight:600}
.bar{height:8px;background:rgba(255,255,255,.16);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--copper);transition:width .2s}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:8px 18px;border-radius:4px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;cursor:pointer;text-decoration:none}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--board);border-color:var(--board);color:var(--on-board)}
.btn.pri:hover:not(:disabled){filter:brightness(1.08);border-color:var(--board)}
.btn.cu{background:var(--copper);border-color:var(--copper);color:var(--on-copper)}
.btn.cu:hover:not(:disabled){filter:brightness(1.08);border-color:var(--copper)}
.btn.ghost{background:transparent}
.top .btn.cu{min-height:38px}
:focus-visible{outline:3px solid var(--copper);outline-offset:2px}

/* exam layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.qcard{padding:22px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border:1px solid var(--line);border-radius:3px;background:var(--surface2);font:500 12px/1.3 var(--mono);color:var(--muted);letter-spacing:.03em}
.chip.topic{color:var(--ink)}
.dots{letter-spacing:2px;color:var(--copper);font-size:10px}
.qtext{font:500 19px/1.45 var(--sans);margin:0 0 14px;max-width:70ch}
.ctx{margin:0 0 16px;padding:12px 14px;background:var(--surface2);border:1px solid var(--line);border-radius:4px;font:400 14px/1.6 var(--mono);overflow-x:auto;white-space:pre}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;width:100%;text-align:left;padding:12px 14px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:6px;cursor:pointer;overflow-wrap:anywhere}
.opt:hover{border-color:var(--muted)}
.opt .lt{display:grid;place-items:center;width:30px;height:30px;border-radius:4px;border:1.5px solid var(--line);background:var(--surface2);font:600 14px/1 var(--mono)}
.opt .tx{padding-top:3px}
.opt[aria-checked="true"]{border-color:var(--copper);background:var(--copper-bg)}
.opt[aria-checked="true"] .lt{background:var(--copper);border-color:var(--copper);color:var(--on-copper)}
.nav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.nav .sp{flex:1}
.link{background:none;border:0;padding:6px 2px;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px}
.link:hover{color:var(--ink)}
.hint{margin:12px 0 0;font:400 12.5px/1.4 var(--mono);color:var(--muted)}

/* question map */
.map{padding:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 132px);max-height:calc(100vh - 160px);overflow:auto}
.map h2{font:700 18px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.map .sub{margin:0 0 12px;font:400 12.5px/1.4 var(--mono);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px}
.mc{height:34px;border:1px solid var(--line);border-radius:3px;background:var(--surface);font:500 12px/1 var(--mono);cursor:pointer;padding:0}
.mc:hover{border-color:var(--ink)}
.mc.done{background:var(--board);border-color:var(--board);color:var(--on-board)}
.mc.cur{outline:3px solid var(--copper);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font:400 12px/1.2 var(--mono);color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;border:1px solid var(--line);vertical-align:-1px;background:var(--surface)}
.legend .l1::before{background:var(--board);border-color:var(--board)}
.legend .l2::before{outline:2px solid var(--copper);border-color:transparent}
.maptoggle{display:none;width:100%;margin-bottom:12px}

/* modal */
.scrim{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:6px;max-width:460px;width:100%;padding:24px}
.modal h2{font:700 24px/1.1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px}
.modal p{margin:0 0 8px}
.modal .warn{padding:10px 12px;background:var(--warn-bg);color:var(--warn);border-radius:4px;font-size:14px}
.modal .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;justify-content:flex-end}

/* start screen */
.hero{padding:28px;margin-bottom:20px}
.hero h2{font:700 40px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px}
.hero p{max-width:62ch;margin:0 0 12px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:18px 0}
.fact{padding:12px 14px;border:1px solid var(--line);border-radius:4px;background:var(--surface2)}
.fact b{display:block;font:700 28px/1 var(--display);letter-spacing:.03em}
.fact span{font:400 12.5px/1.3 var(--mono);color:var(--muted)}
.topics{width:100%;border-collapse:collapse;font-size:15px}
.topics td{padding:8px 4px;border-top:1px solid var(--line)}
.topics td:last-child{text-align:right;font-family:var(--mono);color:var(--muted)}
.tablewrap{overflow-x:auto}
.note{padding:12px 14px;border:1px dashed var(--copper);border-radius:4px;background:var(--copper-bg);font-size:14.5px;margin:18px 0}
.chk{display:flex;gap:10px;align-items:flex-start;margin:14px 0;font-size:14.5px;cursor:pointer}
.chk input{margin-top:4px;width:18px;height:18px;accent-color:var(--board)}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}

/* results */
.score{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;padding:24px;margin-bottom:20px}
.score .big{font:700 64px/1 var(--display);letter-spacing:.02em}
.score .big small{font-size:32px;color:var(--muted)}
.score .pct{font:600 22px/1.2 var(--mono);margin-top:8px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{padding:12px;border-radius:4px;border:1px solid var(--line);background:var(--surface2)}
.tile b{display:block;font:700 34px/1 var(--display)}
.tile span{font:500 12px/1.3 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tile.g b{color:var(--good)} .tile.r b{color:var(--bad)} .tile.w b{color:var(--warn)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-bottom:20px}
.pan{padding:18px}
.pan h3{font:700 18px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
.brow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) auto;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.brow .trk{height:10px;background:var(--surface2);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.brow .trk i{display:block;height:100%;background:var(--board)}
.brow .n{font:500 12.5px/1 var(--mono);color:var(--muted);min-width:52px;text-align:right}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:7px 14px;border:1.5px solid var(--line);border-radius:4px;background:var(--surface);cursor:pointer;font-weight:500;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button span{font-family:var(--mono);font-size:12px;opacity:.75;margin-left:6px}
select{min-height:38px;padding:6px 10px;border:1.5px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;max-width:100%}
.rv{padding:20px;margin-bottom:14px}
.rv header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.rv h3{font:700 24px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin-right:auto}
.pill{padding:3px 10px;border-radius:3px;font:600 12px/1.3 var(--mono);letter-spacing:.04em;text-transform:uppercase}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.ans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
.ans div{padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--surface2);overflow-wrap:anywhere;font-size:15px}
.ans .lbl{display:block;font:500 11.5px/1.2 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.ans b{font-family:var(--mono)}
.ans .ok{border-color:var(--good);background:var(--good-bg)}
.ans .no{border-color:var(--bad);background:var(--bad-bg)}
.opt.r{cursor:default}
.opt.r:hover{border-color:var(--line)}
.opt.r.c{border-color:var(--good);background:var(--good-bg)}
.opt.r.c .lt{background:var(--good);border-color:var(--good);color:var(--bg)}
.opt.r.w{border-color:var(--bad);background:var(--bad-bg)}
.opt.r.w .lt{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.tag{display:block;margin-top:2px;font:600 11.5px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.05em}
.c .tag{color:var(--good)} .w .tag{color:var(--bad)}
.expl{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:grid;gap:14px}
.expl h4{font:700 15px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.expl .body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.expl .eh{font:700 22px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.empty{padding:28px;text-align:center;color:var(--muted)}

@media (max-width:940px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .map{position:static;max-height:none}
  .map.closed{display:none}
  .maptoggle{display:inline-flex}
  .score,.two{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .qcard{padding:16px}.hero{padding:18px}.hero h2{font-size:32px}.qtext{font-size:17.5px}
  .ans{grid-template-columns:minmax(0,1fr)}
  .score .big{font-size:52px}
  .brow{grid-template-columns:minmax(0,1fr) auto}
  .brow .trk{grid-column:1 / -1;order:3}
  .nav .btn{flex:1 1 40%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
