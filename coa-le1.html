<script>
const QUESTIONS = [{"id": 1, "t": "COMP", "d": "E", "q": "What does the name SAP-1 stand for?", "c": "SAP-1 overview", "ch": ["Single Address Processor-1", "Sequential Access Processor-1", "Simple-As-Possible-1", "Standard Architecture Program-1"], "why": ["SAP is not about the number of addresses.", "SAP does not refer to sequential access.", "", "SAP is not a programming standard."], "a": 2, "x": "SAP-1 is the first, simplest model computer used to teach computer operation: Simple-As-Possible-1."}, {"id": 2, "t": "COMP", "d": "M", "q": "A program computes 5 + 4 − 6. After the first two instructions, where is the running total of 9 held?", "c": "Accumulator role", "ch": ["In the instruction register", "In the B register", "In the accumulator", "In the MAR"], "why": ["The IR holds the instruction being executed.", "The B register holds the operand currently being added or subtracted.", "", "The MAR holds an address."], "a": 2, "x": "The accumulator stores intermediate answers during a run."}, {"id": 3, "t": "NS", "d": "D", "q": "An 8-bit accumulator holds F0H and an ADD brings in 20H. What 8-bit result remains in the accumulator?", "c": "8-bit overflow", "ch": ["00H", "110H", "10H", "FFH"], "why": ["The carry is lost, but the lower 8 bits are 10H, not 00H.", "110H needs nine bits. The accumulator is only 8 bits wide.", "", "The result wraps around. It does not saturate."], "a": 2, "x": "F0H + 20H = 240 + 32 = 272 = 1 0001 0000₂ (110H).\nOnly the lower 8 bits fit in the register, so the ninth bit is lost.\n272 − 256 = 16 = 10H."}, {"id": 4, "t": "NS", "d": "D", "q": "Convert decimal 157 to binary.", "c": "Decimal → binary", "ch": ["1001 0111", "1001 1101", "1011 1001", "1001 1011"], "why": ["1001 0111 is 151.", "", "1011 1001 is 185.", "1001 1011 is 155."], "a": 1, "x": "157 − 128 = 29 → bit7 = 1.\n29 − 16 = 13 → bit4 = 1.\n13 − 8 = 5 → bit3 = 1.\n5 − 4 = 1 → bit2 = 1, then bit0 = 1.\nBits: 1001 1101 (= 9DH)."}, {"id": 5, "t": "MEM", "d": "M", "q": "Why does the MAR for a 16-word memory need exactly 4 bits?", "c": "Address width", "ch": ["Because the W bus has only 4 lines", "Because each RAM word is 4 bits wide", "Four bits give 2⁴ = 16 distinct addresses", "Because the PC counts in steps of 4"], "why": ["The W bus has 8 lines.", "RAM words are 8 bits wide.", "", "The PC counts in steps of 1."], "a": 2, "x": "n address bits select 2ⁿ locations. For 16 locations, n = 4."}, {"id": 6, "t": "PC", "d": "M", "q": "Which control signals do the following: put the PC address on the W bus, and make the PC count?", "c": "PC control signals", "ch": ["LM low puts the address on the W bus; Ep makes the PC count", "Cp high puts the address on the W bus; Ep high makes the PC count", "CLR puts the address on the W bus; Cp makes the PC count", "Ep high puts the address on the W bus; Cp high makes the PC count"], "why": ["LM loads the MAR. It does not drive the W bus.", "The roles are swapped.", "CLR resets the PC to 0000.", ""], "a": 3, "x": "Ep (enable PC) places the PC contents on the W bus. Cp (count PC) increments it on the next clock edge."}, {"id": 7, "t": "NS", "d": "E", "q": "Convert 101101₂ to decimal.", "c": "Binary → decimal", "ch": ["43", "54", "37", "45"], "why": ["43 is 101011₂. The 4s and 2s place weights were mixed up.", "54 is 110110₂. The bit weights were applied to the wrong positions.", "37 is 100101₂. The 8s place bit was left out.", ""], "a": 3, "x": "Place weights from the right are 1, 2, 4, 8, 16, 32.\n101101₂ = 1×32 + 0×16 + 1×8 + 1×4 + 0×2 + 1×1 = 32 + 8 + 4 + 1 = 45."}, {"id": 8, "t": "PC", "d": "M", "q": "Starting from reset, a program has fetched and executed three instructions. What does the PC hold?", "c": "Tracing the PC", "ch": ["0010", "0001", "0100", "0011"], "why": ["0010 is the address of the third instruction. The PC has moved on after fetching it.", "That would be after one fetch.", "That would be after four fetches.", ""], "a": 3, "x": "Reset: 0000. Each fetch adds 1: 0001, 0010, 0011. After three instructions PC = 0011."}, {"id": 9, "t": "ML", "d": "M", "q": "A machine word 2DH is fetched. Which assembly instruction is it?", "c": "Hex → assembly", "ch": ["SUB DH", "ADD DH", "SUB 2H", "LDA DH"], "why": ["", "ADD's hex opcode digit is 1.", "2 is the opcode digit, and D is the address.", "LDA's hex opcode digit is 0."], "a": 0, "x": "2H = 0010 = SUB. DH = 1101 = address D.\n2DH = SUB DH."}, {"id": 10, "t": "ML", "d": "E", "q": "What is the hexadecimal shorthand for the OUT instruction (X = don't care)?", "c": "OUT in hex", "ch": ["0XH", "FXH", "XEH", "EXH"], "why": ["0 is the LDA opcode.", "F is the HLT opcode.", "The opcode is the upper nibble, so E comes first.", ""], "a": 3, "x": "OUT opcode = 1110 = E. The operand nibble is a don't care, so the hex form is EXH."}, {"id": 11, "t": "COMP", "d": "M", "q": "A student says: 'The IR points to the next instruction, and the PC holds the instruction being executed.' Which correction is accurate?", "c": "PC vs IR", "ch": ["The PC holds the address of the next instruction; the IR holds the fetched instruction itself", "The IR holds an address and the PC holds data", "Both parts of the statement are right, since both are in the control unit", "The PC holds the instruction and the IR holds the data"], "why": ["", "The IR holds an instruction (opcode + operand). The PC holds an address.", "Being in the control unit does not swap their roles.", "The PC holds an address. Data lives in RAM and the accumulator."], "a": 0, "x": "PC = address of the next instruction (a pointer). IR = the instruction already fetched from RAM."}, {"id": 12, "t": "PC", "d": "M", "q": "While the execution cycle of an LDA instruction runs (T4 to T6), what happens to the program counter?", "c": "PC during execution", "ch": ["It is reset to 0000", "It increments at every T state", "It holds its value and is not incremented", "It is loaded with the operand address"], "why": ["It is reset only before a run.", "It increments only in T2.", "", "The operand address goes to the MAR."], "a": 2, "x": "The PC is only active during T1 (send address) and T2 (increment). During T3 to T6 it stays unchanged."}, {"id": 13, "t": "IC", "d": "E", "q": "A processor is described as CISC. What does the C stand for?", "c": "RISC vs CISC", "ch": ["Clocked", "Controlled", "Compact", "Complex"], "why": ["Clocking is not part of the name.", "Control is not part of the name.", "CISC means Complex Instruction Set Computer.", ""], "a": 3, "x": "CISC = Complex Instruction Set Computer. RISC = Reduced Instruction Set Computer."}, {"id": 14, "t": "NS", "d": "E", "q": "Which hexadecimal value represents 11110010₂?", "c": "Binary → hex (nibble grouping)", "ch": ["E2H", "F4H", "F2H", "2FH"], "why": ["1110 is E. The high nibble here is 1111, which is F.", "4 is 0100. The low nibble is 0010, which is 2.", "", "The nibbles are reversed. The high nibble 1111 is the first digit."], "a": 2, "x": "Split into nibbles: 1111 | 0010.\n1111 = 15 = F, 0010 = 2.\nSo 11110010₂ = F2H."}, {"id": 15, "t": "ML", "d": "M", "q": "Which 4-bit pattern is NOT one of the SAP-1 opcodes?", "c": "Opcode table", "ch": ["1110", "0011", "0001", "0010"], "why": ["1110 is OUT.", "", "0001 is ADD.", "0010 is SUB."], "a": 1, "x": "SAP-1 opcodes: LDA 0000, ADD 0001, SUB 0010, OUT 1110, HLT 1111. 0011 is not in the set."}, {"id": 16, "t": "IN", "d": "M", "q": "In PROG mode, what does a momentary push of the READ-WRITE (WRITE) switch do?", "c": "Write operation", "ch": ["Copies the MAR into the accumulator", "Increments the program counter to the next address", "Takes the RAM write-enable low so the data-switch word is stored at the addressed location", "Starts the computer run at address 0000"], "why": ["The accumulator is not involved in programming.", "The PC is not used in PROG mode.", "", "The run starts after the switch is set to RUN."], "a": 2, "x": "The push of WRITE pulses the write-enable of the RAM, loading the 8-bit word from the data switches into the location selected by the address switches."}, {"id": 17, "t": "NS", "d": "E", "q": "How many distinct memory addresses can a 4-bit address (0000 to 1111) select?", "c": "Address range", "ch": ["8", "16", "256", "15"], "why": ["8 values would need only 3 bits.", "", "256 values would need an 8-bit address.", "0000 is also an address. The range 0000 to 1111 has 16 values."], "a": 1, "x": "A 4-bit address has 2⁴ = 16 combinations, 0000 through 1111 (0H through FH)."}, {"id": 18, "t": "ML", "d": "M", "q": "For the machine word 0001 1010, which statement is correct?", "c": "Instruction format", "ch": ["Opcode 1010; address field 0001", "Opcode 0001; the whole byte is the address", "Opcode 0001 (SUB); address field 1010", "Opcode 0001 (ADD); address field 1010 (AH)"], "why": ["The opcode is the upper nibble.", "The address field is only the lower nibble.", "0001 is ADD. SUB is 0010.", ""], "a": 3, "x": "The four MSBs are the instruction field (0001 = ADD). The four LSBs are the address field (1010 = AH)."}, {"id": 19, "t": "ASM", "d": "D", "q": "Which SAP-1 program computes 5 + 4 − 6 when the data values 5, 4 and 6 are stored at DH, EH and FH?", "c": "Writing a program", "ch": ["LDA DH; SUB EH; ADD FH; OUT; HLT", "LDA 5H; ADD 4H; SUB 6H; OUT; HLT", "LDA DH; ADD EH; SUB FH; HLT; OUT", "LDA DH; ADD EH; SUB FH; OUT; HLT"], "why": ["The ADD and SUB are swapped, giving 5 − 4 + 6 = 7.", "The data values were used as addresses.", "HLT before OUT stops the computer before the answer is displayed.", ""], "a": 3, "x": "Load the first number, add the second, subtract the third, display, then halt.\nA = 05H → 05H + 04H = 09H → 09H − 06H = 03H → OUT shows 0000 0011.", "ctx": "Data:  DH = 05H,  EH = 04H,  FH = 06H"}, {"id": 20, "t": "ASM", "d": "D", "q": "A student expects the display to show 0000 0111 (3 + 4) but sees 0000 0011. What is wrong with this program?", "c": "Troubleshooting a program", "ch": ["RAM location 9H holds the wrong value", "OUT comes before ADD AH, so only the loaded value is displayed", "ADD AH needs an address inside OUT", "HLT executed before LDA"], "why": ["9H holds 03H, which is what was displayed.", "", "OUT takes no address.", "HLT is last, so it ran last."], "a": 1, "x": "Execution order: LDA 9H → A = 03H. OUT displays 0000 0011. ADD AH then makes A = 07H, but nothing displays it. Moving OUT after ADD AH fixes it.", "ctx": "0H  LDA 9H\n1H  OUT\n2H  ADD AH\n3H  HLT\n9H  data 03H\nAH  data 04H"}, {"id": 21, "t": "ML", "d": "M", "q": "Which pair of hex bytes represents ADD AH and ADD BH?", "c": "Assembly → hex", "ch": ["2AH, 2BH", "0AH, 0BH", "1AH, 1BH", "A1H, B1H"], "why": ["2 is the SUB opcode digit.", "0 is the LDA opcode digit.", "", "The digits are swapped. The opcode comes first."], "a": 2, "x": "ADD = 0001 = 1. AH = 1010 and BH = 1011, so the bytes are 1AH and 1BH."}, {"id": 22, "t": "ASM", "d": "E", "q": "Which mnemonic transfers the accumulator contents to the output register?", "c": "OUT mnemonic", "ch": ["OUT", "HLT", "SUB", "LDA"], "why": ["", "HLT stops processing.", "SUB subtracts a RAM word from the accumulator.", "LDA loads the accumulator from RAM."], "a": 0, "x": "OUT loads the accumulator into the output register so the answer appears on the binary display."}, {"id": 23, "t": "ASM", "d": "D", "q": "Trace the program. What does the binary display show after OUT (2's-complement result)?", "c": "Program trace with negative result", "ch": ["0000 1110", "0000 0100", "1111 1100", "1111 1011"], "why": ["That is 14, the sum 5 + 9. The instruction was SUB.", "That is only the magnitude of the difference. The result is negative.", "", "That is −5, the 1's complement of 4 (1111 1011). The +1 step was skipped."], "a": 2, "x": "LDA 7H: A = 05H.\nSUB 8H: 5 − 9 = −4.\n+4 = 0000 0100 → invert 1111 1011 → add 1 = 1111 1100 (FCH).\nDisplay = 1111 1100.", "ctx": "0H  LDA 7H\n1H  SUB 8H\n2H  OUT\n3H  HLT\n7H  data 05H\n8H  data 09H"}, {"id": 24, "t": "PC", "d": "E", "q": "Over which range of values does the SAP-1 program counter count?", "c": "PC range", "ch": ["0000 0000 to 1111 1111", "0000 to 0111", "0000 to 1111", "0001 to 10000"], "why": ["That would be an 8-bit counter. The PC is 4 bits.", "That is only 8 addresses.", "", "The PC starts at 0000 and has only 4 bits."], "a": 2, "x": "A 4-bit counter covers 0000 through 1111, the 16 RAM addresses 0H–FH."}, {"id": 25, "t": "ASM", "d": "E", "q": "To bring the contents of memory location 6H into the accumulator, which assembly instruction is used?", "c": "LDA mnemonic", "ch": ["LDA 6H", "SUB 6H", "OUT 6H", "ADD 6H"], "why": ["", "SUB subtracts the word from the accumulator.", "OUT sends the accumulator to the output and takes no address.", "ADD adds to the accumulator instead of replacing it."], "a": 0, "x": "LDA means load the accumulator. LDA 6H copies the word at address 6H into A."}, {"id": 26, "t": "COMP", "d": "M", "q": "Why is SAP-1 called a bus-organized computer?", "c": "Bus organization", "ch": ["Its registers exchange data through a common W bus", "Every register has its own dedicated wires to every other register", "It is built on a bus-shaped circuit board", "It has a 12-bit address bus"], "why": ["", "A bus avoids that. One shared set of wires is used.", "The term refers to shared signal lines, not board shape.", "SAP-1 addresses are 4 bits."], "a": 0, "x": "Registers connect to a single W bus. Control signals decide which register drives it and which register loads from it."}, {"id": 27, "t": "MEM", "d": "D", "q": "The IR holds 0001 1011. The accumulator holds 0000 0011 and RAM location BH holds 0000 0100. After the execution cycle, what do the MAR and the accumulator hold?", "c": "MAR and A during ADD", "ch": ["MAR = 1011; A = 0000 0100", "MAR = 1011; A = 0000 0111", "MAR = 0100; A = 0000 1011", "MAR = 0001; A = 0000 0111"], "why": ["The word was loaded instead of added. That is LDA's behaviour.", "", "The address and data values were swapped.", "0001 is the opcode. The MAR takes the address field 1011."], "a": 1, "x": "0001 1011 = ADD BH. T4: 1011 → MAR. T5: RAM[BH] = 0000 0100 → B. T6: A = 3 + 4 = 7 = 0000 0111."}, {"id": 28, "t": "ASM", "d": "M", "q": "Trace the program. What does the binary display show after OUT?", "c": "Repeated ADD of one data word", "ch": ["0001 0101", "0010 0001", "0000 1110", "0000 0111"], "why": ["", "That is 33. The address DH (13) was added instead of the data stored there.", "That is 14, after only one ADD.", "That is 7, the value after LDA only."], "a": 0, "x": "LDA DH: A = 07H.\nADD DH: 7 + 7 = 14.\nADD DH: 14 + 7 = 21 = 15H.\nDisplay = 0001 0101.", "ctx": "0H  LDA DH\n1H  ADD DH\n2H  ADD DH\n3H  OUT\n4H  HLT\nDH  data 07H"}, {"id": 29, "t": "ML", "d": "M", "q": "The word 0000 1001 is fetched into the instruction register. What does SAP-1 do with it?", "c": "Decoding a word", "ch": ["Loads the accumulator with the number 9", "Loads the accumulator with the word at address 0H", "Loads the accumulator with the word stored at address 9H", "Adds 9 to the accumulator"], "why": ["The lower nibble is an address, not the data.", "The address field is the lower nibble 1001 = 9H.", "", "The opcode 0000 is LDA, and 9H is an address."], "a": 2, "x": "0000 = LDA. 1001 = 9H. LDA 9H copies the word at address 9H into the accumulator."}, {"id": 30, "t": "IN", "d": "D", "q": "After loading the memory, an operator leaves the RUN-PROG switch in PROG and starts the run. What goes wrong?", "c": "Troubleshooting input", "ch": ["The multiplexer still passes the address-switch nibble, so RAM is not addressed by the MAR", "The data switch register overwrites the accumulator", "Nothing; the fetch works normally with RAM addressed by the MAR", "The PC cannot be cleared before the run"], "why": ["", "The data switches connect to RAM, not to the accumulator.", "In PROG, the multiplexer selects the switches, not the MAR.", "The PC is cleared by the CLR signal, not by this switch."], "a": 0, "x": "A 2-to-1 multiplexer chooses between the address switch register (PROG) and the MAR (RUN). With PROG selected, the PC/MAR addresses never reach the RAM, so instructions cannot be fetched properly."}, {"id": 31, "t": "IN", "d": "M", "q": "The address switches are set to DUDU (U = 1, D = 0). Which RAM address is selected?", "c": "Switch pattern → address", "ch": ["3H", "AH", "5H", "9H"], "why": ["3H is 0011 = DDUU.", "AH is 1010 = UDUD. D was read as 1.", "", "9H is 1001 = UDDU."], "a": 2, "x": "D U D U = 0 1 0 1 = 0101 = 5H."}, {"id": 32, "t": "ASM", "d": "E", "q": "Which pair of SAP-1 instructions are NOT memory-reference instructions?", "c": "Memory-reference instructions", "ch": ["OUT and HLT", "LDA and ADD", "LDA and OUT", "ADD and SUB"], "why": ["", "Both read a RAM word.", "LDA reads RAM. OUT does not.", "Both read a RAM word."], "a": 0, "x": "LDA, ADD and SUB use data from memory. OUT and HLT do not involve data in memory, so they need no address."}, {"id": 33, "t": "IN", "d": "D", "q": "An operator wants to store the data value 03H at address BH. Which settings are correct? (U = 1, D = 0)", "c": "Entering one data word", "ch": ["Address UDUU; data DDDD DDUU", "Address UDUD; data DDDD DDUU", "Address UDUU; data UUUU UUDD", "Address DUDD; data DDDD DDUU"], "why": ["", "UDUD is 1010 = AH.", "The data pattern is complemented (FCH).", "DUDD is 0100 = 4H."], "a": 0, "x": "BH = 1011 → U D U U.\n03H = 0000 0011 → D D D D D D U U."}, {"id": 34, "t": "IN", "d": "E", "q": "In SAP-1's input switches, what does a switch in the up (U) position store?", "c": "Switch convention", "ch": ["A high-impedance state", "A binary 0", "A don't-care bit", "A binary 1"], "why": ["The switches do not produce a high-impedance state.", "Down (D) stores 0.", "A switch always supplies a definite 1 or 0.", ""], "a": 3, "x": "By design, U gives a binary 1 and D gives a binary 0."}, {"id": 35, "t": "COMP", "d": "M", "q": "During LDA 9H, which path does the data word follow?", "c": "Data flow for LDA", "ch": ["Accumulator → W bus → RAM", "RAM → MAR → accumulator", "Instruction register → W bus → accumulator", "RAM → W bus → accumulator"], "why": ["That would store the accumulator in RAM. LDA loads from RAM.", "The MAR holds the address, not data, and has no path to the accumulator.", "The IR supplies the address 9H, not the data.", ""], "a": 3, "x": "The IR's address field sends 9H to the MAR. The MAR addresses RAM. The word stored at 9H goes on the W bus and the accumulator loads it."}, {"id": 36, "t": "NS", "d": "D", "q": "A data word FEH is read by SAP-1 as a 2's-complement number. What decimal value does it represent?", "c": "Interpreting 2's complement", "ch": ["−2", "−126", "254", "−1"], "why": ["", "That is the sign-magnitude reading (sign bit, then 1111110 = 126).", "That is the unsigned reading. In 2's complement the leading 1 marks a negative number.", "−1 is FFH, not FEH."], "a": 0, "x": "FEH = 1111 1110.\nThe MSB is 1, so the number is negative.\nInvert: 0000 0001, add 1: 0000 0010 = 2.\nSo FEH = −2 (also 254 − 256 = −2)."}, {"id": 37, "t": "ML", "d": "M", "q": "Which assembly instruction does the machine word 0010 0101 represent?", "c": "Binary → assembly", "ch": ["LDA 5H", "SUB 5H", "ADD 5H", "SUB AH"], "why": ["LDA's opcode is 0000.", "", "ADD's opcode is 0001.", "SUB is right, but the address 0101 is 5H. AH is 1010."], "a": 1, "x": "0010 = SUB, 0101 = 5H, so the word is SUB 5H."}, {"id": 38, "t": "IC", "d": "M", "q": "SAP-1's LDA, ADD, SUB, OUT and HLT instructions were chosen to be upward compatible with which microprocessors?", "c": "8080/8085 compatibility", "ch": ["The 8080 and 8085", "The 4004 and 8008", "The 8086 and 8088", "The Z80 and 6502"], "why": ["", "These earlier chips are not the compatibility targets.", "The SAP instructions are compatible with the 8080/8085 instruction set, not the 8086 family.", "These are other families, not the targets named for SAP."], "a": 0, "x": "The 8080 was the first widely used microprocessor and the 8085 is an enhanced version. SAP-1 instructions are 8080/8085 instructions."}, {"id": 39, "t": "MEM", "d": "D", "q": "LDA DH has just finished executing. What do the MAR and the accumulator hold?", "c": "MAR and A after LDA", "ch": ["MAR = 1101; A = 0001 0101", "MAR = 0001; A = 0001 0101", "MAR = 0000; A = 0001 0101", "MAR = 1101; A = 0000 1101"], "why": ["", "0001 is the PC after the first increment. The MAR holds DH during execution.", "0000 was the MAR during the fetch. T4 reloaded it with DH.", "The address DH was put in A. LDA loads the data stored at DH."], "a": 0, "x": "Fetch: MAR = 0000, PC → 0001.\nT4: IR address field 1101 → MAR.\nT5: RAM[DH] = 15H = 0001 0101 → A.", "ctx": "0H  LDA DH\n1H  ADD EH\n2H  OUT\n3H  HLT\nDH  data 15H\nEH  data 0FH"}, {"id": 40, "t": "COMP", "d": "E", "q": "After OUT executes, which blocks let you see the answer in binary form?", "c": "Output path", "ch": ["MAR", "Instruction register", "Output register driving the binary display", "B register"], "why": ["The MAR holds addresses.", "The IR holds the current instruction.", "", "The B register holds the second operand."], "a": 2, "x": "OUT loads the accumulator into the output register, and its eight LEDs show the value in binary."}, {"id": 41, "t": "MEM", "d": "M", "q": "A redesigned SAP-1 has a 6-bit MAR and still uses 8-bit words. How many words can its memory address?", "c": "Address width and capacity", "ch": ["128", "48", "36", "64"], "why": ["128 is 2⁷.", "48 is 6 × 8.", "36 is 6 × 6.", ""], "a": 3, "x": "6 address bits give 2⁶ = 64 locations."}, {"id": 42, "t": "MEM", "d": "M", "q": "At the end of the memory state (T3) of a fetch, where has the addressed RAM word been transferred?", "c": "Fetch memory state", "ch": ["The accumulator", "The instruction register", "The program counter", "The MAR"], "why": ["The accumulator is loaded during execution of LDA, not in the fetch.", "", "The PC holds an address.", "The MAR holds the address, not data."], "a": 1, "x": "T3: the RAM word at the MAR address goes on the W bus and the IR loads it."}, {"id": 43, "t": "ASM", "d": "E", "q": "A SAP-1 program starts at 0H with one instruction per address. The fifth instruction is HLT. At which address is HLT stored?", "c": "Program layout", "ch": ["3H", "FH", "5H", "4H"], "why": ["3H holds the fourth instruction.", "HLT sits right after the last instruction, not at the end of memory.", "5H would hold the sixth instruction.", ""], "a": 3, "x": "Addresses 0H, 1H, 2H, 3H, 4H hold instructions 1 to 5, so HLT is at 4H."}, {"id": 44, "t": "NS", "d": "M", "q": "SAP-1 subtracts by adding the 2's complement of B. If B = 0000 0011, what is the 2's complement of B?", "c": "2's complement", "ch": ["1111 1100", "0000 1101", "1111 1101", "1111 1110"], "why": ["That is only the 1's complement (every bit inverted). The +1 step was skipped.", "That is +13. It does not come from inverting the bits and adding 1.", "", "That is −2. It is one too large after adding 1 to the wrong value."], "a": 2, "x": "Step 1, invert every bit: 0000 0011 → 1111 1100.\nStep 2, add 1: 1111 1100 + 1 = 1111 1101.\n1111 1101 = FDH = −3, which matches the notes where −03H is entered as FDH."}, {"id": 45, "t": "COMP", "d": "M", "q": "While ADD 9H executes, where is the RAM word from location 9H loaded before the adder-subtracter forms the sum?", "c": "B register role", "ch": ["The B register", "The instruction register", "The MAR", "The output register"], "why": ["", "The IR is loaded only during the fetch cycle.", "The MAR holds the address 9H, not the data.", "The output register only receives the accumulator on OUT."], "a": 0, "x": "The addressed RAM word goes to the B register. The adder-subtracter adds A and B and the sum returns to the accumulator."}, {"id": 46, "t": "ML", "d": "E", "q": "Which opcode belongs to SUB?", "c": "Opcode table", "ch": ["0001", "0000", "1110", "0010"], "why": ["0001 is ADD.", "0000 is LDA.", "1110 is OUT.", ""], "a": 3, "x": "LDA 0000, ADD 0001, SUB 0010, OUT 1110, HLT 1111."}, {"id": 47, "t": "IN", "d": "M", "q": "With the RUN-PROG switch in PROG, which 4-bit address does the multiplexer send to the RAM?", "c": "Multiplexer selection", "ch": ["The address in the PC", "The lower nibble of the instruction register", "The address in the MAR", "The address from the address switch register"], "why": ["The PC goes to the MAR, not directly to the multiplexer.", "The IR address field goes to the MAR during execution.", "The MAR is selected in the RUN position.", ""], "a": 3, "x": "PROG selects the address switches so the operator can write RAM. RUN selects the MAR so the computer can read RAM."}, {"id": 48, "t": "MEM", "d": "D", "q": "While ADD 9H executes, what does the MAR hold and which RAM word is read?", "c": "MAR/RAM during ADD", "ch": ["MAR = 1000; RAM word 0BH", "MAR = 0001; RAM word 19H", "MAR = 1001; RAM word 07H", "MAR = 1001; RAM word 0BH"], "why": ["1000 is the operand address of LDA 8H.", "0001 and 19H belong to the instruction's own location.", "", "0BH is stored at location 8H, not 9H."], "a": 2, "x": "ADD 9H is stored at 1H as 19H. T4: address field 1001 → MAR. T5: RAM[9H] = 07H is loaded into B.", "ctx": "0H  LDA 8H\n1H  ADD 9H\n2H  OUT\n3H  HLT\n8H  data 0BH\n9H  data 07H"}, {"id": 49, "t": "NS", "d": "M", "q": "Example data for a SAP-1 program includes decimal 24. What hexadecimal value is stored in that RAM location?", "c": "Decimal → hex for data words", "ch": ["1CH", "14H", "24H", "18H"], "why": ["1CH is 28 decimal.", "14H is 20 decimal.", "24H is 36 decimal. Decimal digits were copied as if they were hex.", ""], "a": 3, "x": "24 ÷ 16 = 1 remainder 8, so the hex digits are 1 and 8.\n24 = 18H (check: 1×16 + 8 = 24)."}, {"id": 50, "t": "ML", "d": "E", "q": "Which machine-language word represents ADD CH?", "c": "Assembly → binary", "ch": ["0010 1100", "1100 0001", "0001 1000", "0001 1100"], "why": ["0010 is the SUB opcode.", "The nibbles are swapped.", "The address field must be CH = 1100, not 8H.", ""], "a": 3, "x": "ADD opcode = 0001. CH = 1100.\nInstruction = 0001 1100."}, {"id": 51, "t": "MEM", "d": "E", "q": "SAP-1's memory is described as a 16 × 8 RAM. What does that mean?", "c": "RAM organization", "ch": ["A memory with a 16-bit address bus", "16 bits in each of 8 locations", "16 locations, each holding 8 bits", "16 instructions and 8 data words"], "why": ["The address is 4 bits wide.", "The numbers are reversed.", "", "The size does not split into program and data this way."], "a": 2, "x": "16 × 8 = 16 words of 8 bits each. It needs 4 address bits (2⁴ = 16)."}, {"id": 52, "t": "ML", "d": "D", "q": "An operator wants to enter ADD EH but sets the data switches to 0001 0111. Which instruction will actually execute?", "c": "Entry error", "ch": ["LDA 7H", "ADD 7H", "ADD EH", "SUB 7H"], "why": ["The upper nibble 0001 is ADD, not LDA.", "", "EH would need the lower nibble 1110.", "SUB is 0010."], "a": 1, "x": "0001 0111 = ADD with address 0111 = 7H. The correct pattern for ADD EH is 0001 1110."}, {"id": 53, "t": "MEM", "d": "M", "q": "In PROG mode, which RAM location receives the data when WRITE is pushed?", "c": "Writing to RAM", "ch": ["The location held in the MAR", "The location selected by the address switches", "Location 0000 always", "The location held in the PC"], "why": ["The MAR is selected only in RUN mode.", "", "Any address can be selected with the address switches.", "The PC is not used for programming."], "a": 1, "x": "In PROG mode the multiplexer sends the address-switch nibble to the RAM, and the data-switch word is written there."}, {"id": 54, "t": "NS", "d": "E", "q": "Convert 7CH to binary.", "c": "Hex → binary", "ch": ["0110 1100", "1100 0111", "0111 1010", "0111 1100"], "why": ["0110 is 6. 7 is 0111.", "The nibbles are swapped.", "1010 is A. C is 12 = 1100.", ""], "a": 3, "x": "7 → 0111 and C (12) → 1100, so 7CH = 0111 1100."}, {"id": 55, "t": "PC", "d": "M", "q": "In the address state (T1) of the fetch cycle, which transfer occurs?", "c": "PC to MAR transfer", "ch": ["The PC contents go over the W bus into the MAR", "The RAM word goes into the instruction register", "The PC contents go directly to the RAM", "The MAR contents go into the PC"], "why": ["", "That happens in T3, the memory state.", "RAM is addressed through the MAR.", "The data flows from the PC to the MAR."], "a": 0, "x": "In the address state the PC places its address on the W bus (Ep active) and the MAR loads it (LM active) on the clock edge."}, {"id": 56, "t": "ML", "d": "M", "q": "What is the hexadecimal machine code for SUB 3H?", "c": "Assembly → hex", "ch": ["32H", "23H", "20H", "03H"], "why": ["The digits are swapped. The opcode digit comes first.", "", "The address 3 was left out.", "The SUB opcode (2) was left out; 03H is LDA 3H."], "a": 1, "x": "SUB opcode = 0010 = 2. Address 3H = 0011 = 3.\nSUB 3H = 0010 0011 = 23H."}, {"id": 57, "t": "PC", "d": "E", "q": "To what value is the program counter reset before each run?", "c": "PC reset", "ch": ["0001", "1111", "The address of the first data word", "0000"], "why": ["The program starts at 0000.", "1111 is the last address.", "The PC points to the first instruction.", ""], "a": 3, "x": "A CLR signal resets the PC to 0000, so the first instruction is fetched from address 0H."}, {"id": 58, "t": "ASM", "d": "M", "q": "The accumulator holds 0000 1001 and RAM location CH holds 0000 0101. What is in the accumulator after SUB CH?", "c": "SUB execution", "ch": ["0000 0100", "1111 1100", "0000 1110", "0000 0101"], "why": ["", "That is −4 (5 − 9). The subtraction is A − RC, not RC − A.", "That is 14, the result of adding instead of subtracting.", "That is just the loaded RAM word."], "a": 0, "x": "SUB CH computes A − RC = 9 − 5 = 4 = 0000 0100."}, {"id": 59, "t": "COMP", "d": "M", "q": "Why must every register output connected to the W bus be a three-state output?", "c": "Three-state bus outputs", "ch": ["To make the W bus wider than 8 bits", "So only one register drives the bus at a time and the transfers stay orderly", "To make register loading faster", "So each register can store three values at once"], "why": ["Bus width is fixed by the number of lines.", "", "The reason is to avoid several registers driving the same lines at once.", "Three-state refers to high, low and disconnected, not to storing three values."], "a": 1, "x": "Three-state outputs can be high, low or disconnected. A register that is not enabled disconnects, so exactly one register places data on the W bus."}, {"id": 60, "t": "NS", "d": "E", "q": "In an 8-bit word, what is the place value of the most significant bit (bit 7)?", "c": "Binary place values", "ch": ["128", "8", "256", "64"], "why": ["", "8 is bit 3.", "256 is 2⁸, which would be a ninth bit.", "64 is bit 6."], "a": 0, "x": "Bit n has the weight 2ⁿ. Bit 7 has the weight 2⁷ = 128."}, {"id": 61, "t": "PC", "d": "M", "q": "The PC contains 0011 and the instruction at that address is fetched. What does the PC contain afterward?", "c": "PC increment", "ch": ["0010", "0100", "0011", "0101"], "why": ["The PC counts up, not down.", "", "The PC is incremented during the fetch.", "It increments by 1 per fetch, not 2."], "a": 1, "x": "After the PC sends 0011 to the MAR it is incremented by 1: 0011 + 1 = 0100."}, {"id": 62, "t": "IC", "d": "M", "q": "Which list places these computer technologies in the order they appeared?", "c": "Order of technologies", "ch": ["Vacuum tubes → integrated circuits → transistors → microprocessors", "Vacuum tubes → transistors → microprocessors → integrated circuits", "Transistors → vacuum tubes → integrated circuits → microprocessors", "Vacuum tubes → transistors → integrated circuits → microprocessors"], "why": ["Transistors came before ICs. ICs pack many transistors on one chip.", "A microprocessor is itself an IC, so ICs came first.", "Vacuum tubes came before transistors.", ""], "a": 3, "x": "Each step shrank and sped up the previous one: tubes (1940–56), transistors (1956–63), ICs (1964–71), microprocessors (1971–)."}, {"id": 63, "t": "IC", "d": "D", "q": "A 74LS107 IC contains two JK flip-flops. How many 74LS107 chips are needed for the 4-bit program counter?", "c": "Counter chips", "ch": ["2", "8", "1", "4"], "why": ["", "Eight chips would give 16 flip-flops, far more than needed.", "One chip contains only two flip-flops, enough for 2 bits.", "Four chips would give 8 flip-flops."], "a": 0, "x": "A 4-bit counter needs 4 flip-flops. 4 ÷ 2 per chip = 2 chips (C1 and C2)."}, {"id": 64, "t": "MEM", "d": "D", "q": "A program ends with OUT at address 3H and has no HLT. Unused location 4H holds FFH. What happens when location 4H is fetched?", "c": "Reading an unused location", "ch": ["The PC jumps back to 0000 and restarts", "1111 1111 is loaded into the IR; the opcode 1111 is decoded as HLT and the computer stops", "1111 1111 is executed as LDA FH", "The accumulator is cleared and the run continues"], "why": ["The PC only counts up; it does not jump back.", "", "LDA's opcode is 0000. The upper nibble here is 1111.", "No instruction clears the accumulator."], "a": 1, "x": "The MAR addresses 4H, the word FFH goes to the IR, and the upper nibble 1111 is the HLT opcode. The lower nibble is ignored."}, {"id": 65, "t": "ASM", "d": "M", "q": "Which of the following is a correctly formed SAP-1 assembly instruction?", "c": "Instruction syntax", "ch": ["HLT 5H", "SUB CH", "LDA", "OUT FH"], "why": ["HLT is complete by itself and takes no address.", "", "LDA is a memory-reference instruction and needs an address.", "OUT does not involve memory, so it takes no address."], "a": 1, "x": "LDA, ADD and SUB are written mnemonic + address (for example SUB CH). OUT and HLT stand alone."}, {"id": 66, "t": "ASM", "d": "E", "q": "A listing reads LDA 9H / ADD AH / OUT / HLT. In what form is this program written?", "c": "Assembly vs machine language", "ch": ["Hexadecimal machine code", "Binary object code", "Machine language (an object program)", "Assembly language (a source program)"], "why": ["Mnemonics are not hex codes.", "Object code is written in 0s and 1s.", "Machine language uses strings of 0s and 1s.", ""], "a": 3, "x": "Programs written with mnemonics are in assembly language and are called source programs."}, {"id": 67, "t": "COMP", "d": "E", "q": "Which SAP-1 component stores both the program and its data?", "c": "Role of RAM", "ch": ["Instruction register", "RAM", "Program counter", "Accumulator"], "why": ["The IR holds one instruction at a time.", "", "The PC holds a 4-bit address.", "The accumulator holds one 8-bit working value."], "a": 1, "x": "The 16 × 8 RAM stores the program and the data before and during a run."}, {"id": 68, "t": "NS", "d": "D", "q": "The SAP-1 adder-subtracter forms the sum of A = 0010 1101 and B = 0001 1011. What is the 8-bit sum?", "c": "Binary addition with carries", "ch": ["0100 1100", "0100 0111", "0100 1000", "0011 1000"], "why": ["0100 1100 is 76. A carry was mishandled in bit 2.", "0100 0111 is 71. A carry out of bit 0 was dropped.", "", "0011 1000 is 56. The carries out of bits 1 to 3 were lost."], "a": 2, "x": "Decimal check: 0010 1101 = 45 and 0001 1011 = 27, so the sum is 72.\nBinary column addition (right to left, with carries):\nbit0: 1+1 = 0 c1, bit1: 0+1+1 = 0 c1, bit2: 1+0+1 = 0 c1, bit3: 1+1+1 = 1 c1,\nbit4: 0+1+1 = 0 c1, bit5: 1+0+1 = 0 c1, bit6: 0+0+1 = 1, bit7: 0.\nSum = 0100 1000₂ = 72."}, {"id": 69, "t": "ASM", "d": "D", "q": "The values 8, 4, 3, 5 and 2 are stored in that order at BH, CH, DH, EH and FH. Which program computes 8 + 4 − 3 + 5 − 2?", "c": "Writing a longer program", "ch": ["LDA BH; ADD CH; ADD DH; SUB EH; SUB FH; OUT; HLT", "LDA FH; SUB EH; ADD DH; SUB CH; ADD BH; OUT; HLT", "LDA BH; SUB CH; ADD DH; SUB EH; ADD FH; OUT; HLT", "LDA BH; ADD CH; SUB DH; ADD EH; SUB FH; OUT; HLT"], "why": ["This computes 8 + 4 + 3 − 5 − 2 = 8.", "This starts at the wrong end and computes 2 − 5 + 3 − 4 + 8 = 4.", "This computes 8 − 4 + 3 − 5 + 2 = 4.", ""], "a": 3, "x": "Follow the expression left to right.\nLDA BH → 8; ADD CH → 12; SUB DH → 9; ADD EH → 14; SUB FH → 12.\nOUT displays 0000 1100 (12), then HLT."}, {"id": 70, "t": "ML", "d": "M", "q": "Which assembly instruction does the machine word 0001 1011 represent?", "c": "Binary → assembly", "ch": ["ADD DH", "ADD BH", "SUB BH", "LDA BH"], "why": ["The address field 1011 is BH. DH would be 1101.", "", "SUB's opcode is 0010.", "LDA's opcode is 0000."], "a": 1, "x": "Upper nibble 0001 = ADD. Lower nibble 1011 = BH.\n0001 1011 = ADD BH."}, {"id": 71, "t": "NS", "d": "D", "q": "A SAP-1 program computes 16 + 20 + 24 − 32 (decimal values). What does the binary display show when the run ends?", "c": "Decimal arithmetic → binary output", "ch": ["0011 1100", "0001 1100", "0010 0000", "0001 1101"], "why": ["0011 1100 is 60. That is the result before subtracting 32.", "", "0010 0000 is 32, the number that was subtracted.", "0001 1101 is 29, which is one too large."], "a": 1, "x": "16 + 20 + 24 = 60, and 60 − 32 = 28.\n28 = 16 + 8 + 4 = 0001 1100₂ (1CH)."}, {"id": 72, "t": "IC", "d": "M", "q": "Each 74189 IC is a 16 × 4 static RAM. How many are needed to build SAP-1's 16 × 8 memory?", "c": "RAM chips in SAP-1", "ch": ["8", "4", "2", "1"], "why": ["Eight chips would be one per bit of the word.", "Four chips would give 16 bits per word.", "", "One chip gives only 4 bits per word."], "a": 2, "x": "The word width must double (4 → 8 bits) while the 16 locations stay the same.\n8 ÷ 4 = 2 chips, side by side (C6 and C7 in the schematic)."}, {"id": 73, "t": "IC", "d": "E", "q": "Which pair correctly completes this sentence: the fifth generation is associated with ____ and the next generation is expected to use ____?", "c": "Future generations", "ch": ["Microprocessors; artificial intelligence", "Quantum computers; transistors", "Artificial intelligence; quantum computers", "Integrated circuits; microprocessors"], "why": ["Microprocessors define the fourth generation.", "The order is reversed, and transistors are second generation.", "", "Both of these are earlier generations."], "a": 2, "x": "5th generation: Artificial Intelligence (present and beyond). Next generation: quantum computers."}, {"id": 74, "t": "NS", "d": "M", "q": "Convert decimal 200 to hexadecimal.", "c": "Decimal → hex (repeated division)", "ch": ["8CH", "C8H", "D8H", "C0H"], "why": ["The digits are reversed. 8CH = 8×16 + 12 = 140.", "", "D is 13. D8H = 13×16 + 8 = 216.", "C0H = 192. The remainder 8 was left out."], "a": 1, "x": "200 ÷ 16 = 12 remainder 8.\n12 = C, so the hex digits are C then 8.\n200 = C8H (check: 12×16 + 8 = 192 + 8 = 200)."}, {"id": 75, "t": "PC", "d": "D", "q": "The instruction at address 0010 has just been loaded into the instruction register (end of T3). What do the PC and the MAR hold?", "c": "PC vs MAR", "ch": ["PC = 0011, MAR = 0010", "PC = 0010, MAR = 0010", "PC = 0011, MAR = 0011", "PC = 0010, MAR = 0011"], "why": ["", "The PC was incremented in T2.", "The MAR still has the old address 0010.", "The PC is already incremented, and the MAR holds the address that was just read."], "a": 0, "x": "T1: PC (0010) → MAR. T2: PC increments to 0011. T3: RAM word at the MAR address (0010) → IR.\nThe MAR keeps 0010 while the PC already points at 0011."}, {"id": 76, "t": "MEM", "d": "E", "q": "Which statement about SAP-1's RAM is accurate?", "c": "RAM purpose", "ch": ["It is read-only memory that stores only the program", "It stores only data; instructions are wired into the CPU", "It stores only the results of the arithmetic", "It is read/write memory that stores both the program and the data"], "why": ["SAP-1's RAM can be written with the switches.", "Instructions are stored in RAM.", "It stores the program and data words.", ""], "a": 3, "x": "The RAM is a 16 × 8 static read/write memory that holds the program and the data needed for a run."}, {"id": 77, "t": "COMP", "d": "D", "q": "Which set of components takes part in fetching an instruction, before it is decoded?", "c": "Fetch participants", "ch": ["PC, MAR, RAM, accumulator", "MAR, adder-subtracter, instruction register, output register", "PC, B register, RAM, instruction register", "PC, MAR, RAM, instruction register"], "why": ["The fetched word goes to the IR, not the accumulator.", "The arithmetic and output blocks are not used in a fetch, and the PC is missing.", "The B register is only used for arithmetic.", ""], "a": 3, "x": "PC supplies the address, MAR applies it to RAM, RAM supplies the word, and the IR receives it."}, {"id": 78, "t": "NS", "d": "D", "q": "A programmer needs decimal 45 in RAM location 9H. What hexadecimal value should be written there?", "c": "Decimal → hex for stored data", "ch": ["2BH", "D2H", "2DH", "45H"], "why": ["2BH is 43.", "D2H has the digits reversed. It equals 210.", "", "45H is 69 decimal. The decimal digits were copied as hex."], "a": 2, "x": "45 ÷ 16 = 2 remainder 13. 13 = D, so 45 = 2DH.\nBinary: 0010 1101."}, {"id": 79, "t": "IN", "d": "M", "q": "Which data-switch setting stores ADD EH in RAM? (U = 1, D = 0)", "c": "Instruction → switch pattern", "ch": ["UUUD DDDU", "DDDU UUDU", "DDUD UUUD", "DDDU UUUD"], "why": ["This is the complement of the correct pattern (1110 0001).", "UUDU is 1101 = DH, not EH.", "DDUD is 0010, the SUB opcode.", ""], "a": 3, "x": "ADD EH = 0001 1110.\n0001 → D D D U, 1110 → U U U D.\nSwitches: DDDU UUUD."}, {"id": 80, "t": "PC", "d": "E", "q": "Why is the program counter sometimes called a pointer?", "c": "PC as pointer", "ch": ["It points to the data operand in RAM", "It points to the accumulator", "It points to the output device", "It points to the memory address of the next instruction"], "why": ["The operand address is held in the IR and MAR.", "The PC has nothing to do with the accumulator's address.", "Output is handled by the output register.", ""], "a": 3, "x": "The PC is like a finger pointing at a list of instructions, indicating which one to fetch next."}, {"id": 81, "t": "ASM", "d": "M", "q": "A five-instruction SAP-1 program occupies addresses 0H to 4H. Which address can safely hold its data?", "c": "Program and data placement", "ch": ["0H", "CH", "2H", "4H"], "why": ["Address 0H holds the first instruction.", "", "Address 2H is inside the program.", "Address 4H holds the last instruction."], "a": 1, "x": "The PC starts at 0000 and counts upward, so the program must sit in low memory. Data goes above it. CH is outside 0H–4H."}, {"id": 82, "t": "PC", "d": "D", "q": "An operator stores a four-instruction program at 3H to 6H and runs it right after clearing. What is wrong?", "c": "Where the PC starts", "ch": ["The MAR cannot hold the address 3H", "The PC resets to 0000, so the first fetch comes from 0H, not 3H", "RAM does not allow programs above address 2H", "The PC resets to 0011 automatically, which is the wrong value"], "why": ["The MAR holds any 4-bit address.", "", "RAM accepts a program anywhere, but the PC starts at 0000.", "The PC always resets to 0000."], "a": 1, "x": "The PC is cleared to 0000. It fetches from 0H, where there is no program, so the run produces nonsense. Programs belong in low memory starting at 0H."}, {"id": 83, "t": "ASM", "d": "M", "q": "In SAP-1, who translates the source program into an object program?", "c": "Source to object program", "ch": ["The operator, by hand, when setting the address and data switches", "The MAR, while latching addresses", "The controller-sequencer, automatically before the run", "The instruction register, as it loads each word"], "why": ["", "The MAR only holds a 4-bit address.", "The controller-sequencer decodes opcodes during the run. It does not translate mnemonics.", "The IR holds already-translated machine words."], "a": 0, "x": "The mnemonics are converted to 0s and 1s by the operator while programming the switches."}, {"id": 84, "t": "PC", "d": "E", "q": "During which state of the fetch cycle is the program counter incremented?", "c": "Increment state", "ch": ["T1, the address state", "T3, the memory state", "T4, the first execution state", "T2, the increment state"], "why": ["T1 transfers the PC address to the MAR. The count does not change.", "T3 moves the RAM word to the IR.", "The PC is inactive during the execution states.", ""], "a": 3, "x": "T1: PC → MAR. T2: Cp is active and the PC counts up by 1. T3: RAM word → IR."}, {"id": 85, "t": "NS", "d": "M", "q": "During an ADD step, the accumulator holds 1AH and the RAM word is 0FH. What does the accumulator hold afterward?", "c": "Hex addition", "ch": ["29H", "19H", "2AH", "39H"], "why": ["", "The carry out of A + F was forgotten. A + F = 25 = 19₁₆ (write 9, carry 1).", "That is 42. It is off by one.", "The carry was counted twice."], "a": 0, "x": "A + F = 10 + 15 = 25 = 16 + 9, so write 9 and carry 1.\nNext digit: 1 + 0 + 1 (carry) = 2.\nResult = 29H. Decimal check: 26 + 15 = 41 = 29H."}, {"id": 86, "t": "IN", "d": "D", "q": "Which data-switch setting loads decimal 25 into a RAM location? (U = 1, D = 0)", "c": "Decimal data → switch pattern", "ch": ["UUUD DUUD", "DDUD DUDU", "DDDU UDDU", "DDDU UDUD"], "why": ["That is the complement (1110 0110).", "That is 0010 0101 = 25H = 37 decimal. The decimal digits were copied as hex.", "", "That is 0001 1010 = 26."], "a": 2, "x": "25 = 16 + 8 + 1 = 0001 1001₂ (19H).\n0001 → D D D U, 1001 → U D D U.\nSwitches: DDDU UDDU."}, {"id": 87, "t": "MEM", "d": "M", "q": "Which statement about the MAR output is correct?", "c": "MAR connectivity", "ch": ["It drives only the RAM address (through the multiplexer); it is not connected to the W bus", "It drives the binary display", "It is placed on the W bus to feed the instruction register", "It feeds the program counter directly"], "why": ["", "The display is driven by the output register.", "The MAR's output does not reach the W bus.", "The PC loads only by counting and clearing."], "a": 0, "x": "The MAR uses a two-state output wired to the RAM address (via the 2-to-1 multiplexer)."}, {"id": 88, "t": "ML", "d": "M", "q": "Which byte could be fetched as a valid OUT instruction?", "c": "Recognising OUT", "ch": ["1111 1110", "0001 1110", "0000 1110", "1110 0101"], "why": ["That is HLT. The upper nibble is 1111.", "That is ADD EH.", "That is LDA EH. The opcode is in the upper nibble.", ""], "a": 3, "x": "OUT needs the opcode 1110 in the upper nibble. The lower nibble is ignored, so 1110 0101 works."}, {"id": 89, "t": "IC", "d": "E", "q": "A computer built in 1948 would most likely have used which switching technology?", "c": "Computer generations", "ch": ["Vacuum tubes", "Integrated circuits", "Transistors", "A microprocessor"], "why": ["", "ICs arrived from 1964.", "Transistor-based machines belong to the 1956–1963 generation.", "Microprocessors began in 1971."], "a": 0, "x": "1948 falls within the first generation (1940–1956), which used vacuum tubes."}, {"id": 90, "t": "IN", "d": "E", "q": "How many address bits and data bits can the SAP-1 input programming switches send to the RAM?", "c": "Address and data switch registers", "ch": ["4 address bits and 8 data bits", "4 address bits and 4 data bits", "8 address bits and 4 data bits", "8 address bits and 8 data bits"], "why": ["", "Each RAM word is 8 bits.", "The counts are reversed.", "RAM has only 16 locations, which need 4 address bits."], "a": 0, "x": "RAM has 16 locations (4 address bits) and 8-bit words (8 data bits). The address switch register has 4 switches and the data switch register has 8."}, {"id": 91, "t": "COMP", "d": "M", "q": "Which group of blocks makes up the SAP-1 control unit?", "c": "Control unit blocks", "ch": ["Program counter, instruction register, controller-sequencer", "Input switches, output port, binary display", "MAR and the 16 × 8 RAM", "Accumulator, adder-subtracter, B register"], "why": ["", "These form the I/O unit.", "These form the memory section.", "These blocks make up the ALU."], "a": 0, "x": "The control unit contains the PC, the IR and the controller-sequencer, which produces the control word, clear signals and clock signals."}, {"id": 92, "t": "NS", "d": "D", "q": "Convert 1100 1010₂ to decimal.", "c": "Binary → decimal (8 bits)", "ch": ["212", "202", "204", "198"], "why": ["212 is 1101 0100. The bits were placed in the wrong positions.", "", "204 is 1100 1100. The bit 1 position was misread.", "198 is 1100 0110. Bit 3 and bit 2 weights were confused."], "a": 1, "x": "1100 1010 = 128 + 64 + 8 + 2 = 202."}, {"id": 93, "t": "ML", "d": "D", "q": "The byte E3H is fetched into the instruction register. What does the control unit do?", "c": "Don't-care operand", "ch": ["Executes OUT 3H, sending the word at location 3H to the output", "Executes HLT", "Executes LDA 3H", "Executes OUT; the lower nibble 3 is ignored"], "why": ["OUT is not a memory-reference instruction, so the lower nibble is not used as an address.", "HLT's opcode is 1111, not 1110.", "LDA's opcode is 0000, not 1110.", ""], "a": 3, "x": "E3H = 1110 0011. The opcode 1110 is OUT. OUT does not use its operand nibble, so 0011 is ignored.\nThe accumulator is simply loaded into the output register."}, {"id": 94, "t": "COMP", "d": "M", "q": "What is the role of the 12-bit word that leaves the controller-sequencer?", "c": "Control word purpose", "ch": ["It carries data to the output register", "It tells the other blocks how to react on the next clock edge", "It stores the PC contents", "It is the address sent to the RAM"], "why": ["Data travels on the W bus.", "", "The PC is a separate register.", "RAM addresses are only 4 bits and come from the MAR."], "a": 1, "x": "The control word directs which registers load and which place data on the W bus."}, {"id": 95, "t": "PC", "d": "M", "q": "A program contains LDA, ADD, ADD, SUB, OUT and HLT. How many fetches (and PC increments) occur by the time HLT is in the instruction register?", "c": "Counting fetches", "ch": ["5", "4", "7", "6"], "why": ["HLT's own fetch also increments the PC.", "There are six instructions, each fetched once.", "Only six instructions are fetched.", ""], "a": 3, "x": "Each instruction is fetched once and each fetch increments the PC. Six instructions → six increments (final PC = 0110)."}, {"id": 96, "t": "NS", "d": "D", "q": "The accumulator holds 0DH and a SUB instruction uses the RAM word 0FH. What does the 8-bit accumulator hold afterward (2's complement)?", "c": "Subtraction giving a negative result", "ch": ["FFH", "02H", "0EH", "FEH"], "why": ["FFH is −1. The difference is −2.", "02H is only the magnitude of the difference. The result is negative.", "0EH is +14. 13 − 15 is negative.", ""], "a": 3, "x": "13 − 15 = −2.\n+2 = 0000 0010. Invert: 1111 1101. Add 1: 1111 1110 = FEH.\nThe same result comes from adding the 2's complement of 0FH (F1H) to 0DH: 0DH + F1H = FEH."}, {"id": 97, "t": "ASM", "d": "M", "q": "RAM location 8H holds 1111 0000. What is in the accumulator after LDA 8H?", "c": "Address vs data in LDA", "ch": ["1111 0000", "0000 1000", "0000 1111", "1000 0000"], "why": ["", "That is the address 8H placed in A. LDA loads the data stored at the address.", "That is the nibble-swapped and shifted pattern, not the stored word.", "That is not the stored word."], "a": 0, "x": "LDA 8H copies the word stored at address 8H. R8 = 1111 0000, so A = 1111 0000."}, {"id": 98, "t": "MEM", "d": "M", "q": "During the execution of LDA FH, what value is placed in the MAR, and where does it come from?", "c": "MAR in execution", "ch": ["1111, from the program counter", "0000, from the opcode in the instruction register", "1111, from the address field of the instruction register", "1111, from the accumulator"], "why": ["The PC holds the next instruction's address.", "0000 is the opcode. The address field is 1111.", "", "The accumulator is not in the address path."], "a": 2, "x": "T4: the IR places its lower nibble (1111 = FH) on the W bus and the MAR loads it. T5: RAM[FH] is loaded into the accumulator."}, {"id": 99, "t": "MEM", "d": "D", "q": "From reset, the fourth instruction of a program is about to be fetched. What does the MAR hold in the address state?", "c": "MAR during the fetch", "ch": ["0010", "0000", "0011", "0100"], "why": ["0010 is the address of the third instruction.", "0000 is the address of the first instruction.", "", "0100 would be the fifth instruction's address."], "a": 2, "x": "Instructions are at 0, 1, 2, 3, so the fourth instruction is at address 0011. The PC (0011) is copied into the MAR."}, {"id": 100, "t": "ASM", "d": "E", "q": "Trace the program. What does the binary display show after OUT?", "c": "Tracing a short program", "ch": ["0000 1010", "0000 1001", "0000 0101", "0000 1111"], "why": ["That is the accumulator after LDA only. The ADD was forgotten.", "That is the address 9H. LDA loads the data stored at 9H.", "0000 0101 is the word at AH. ADD adds it to A and does not replace A.", ""], "a": 3, "x": "LDA 9H: A = 0AH = 0000 1010.\nADD AH: A = 0AH + 05H = 0FH.\nOUT: display = 0000 1111.\nHLT stops.", "ctx": "0H  LDA 9H\n1H  ADD AH\n2H  OUT\n3H  HLT\n9H  data 0AH\nAH  data 05H"}, {"id": 101, "t": "IN", "d": "M", "q": "A program has 6 instructions and 4 data words. How many times must the WRITE switch be pushed to load it all?", "c": "Counting write operations", "ch": ["10", "12", "6", "4"], "why": ["", "Each word is written once. 12 is the number of switches for a single word.", "The data words need to be written as well.", "The instructions need to be written as well."], "a": 0, "x": "Each WRITE push stores one word. 6 instructions + 4 data words = 10 words = 10 pushes."}, {"id": 102, "t": "COMP", "d": "E", "q": "Which SAP-1 component holds the instruction that was just fetched from RAM?", "c": "Instruction register", "ch": ["Instruction register (IR)", "Accumulator", "Memory address register (MAR)", "Program counter (PC)"], "why": ["", "The accumulator holds intermediate arithmetic results.", "The MAR holds an address, not the instruction.", "The PC holds the address of the next instruction."], "a": 0, "x": "The IR receives the fetched instruction from RAM, then splits it into the opcode (upper nibble) and operand (lower nibble)."}, {"id": 103, "t": "ML", "d": "M", "q": "How many different memory locations can the 4-bit address field of a SAP-1 instruction select?", "c": "Address field size", "ch": ["16", "4", "256", "8"], "why": ["", "4 is the number of bits, not the number of locations.", "256 would need an 8-bit address.", "8 would need a 3-bit address field."], "a": 0, "x": "2⁴ = 16 locations, 0H through FH. The upper nibble is the opcode and the lower nibble is the address."}, {"id": 104, "t": "ML", "d": "M", "q": "In a machine-language listing, locations 6H to 8H show XXXX XXXX. What does this mean?", "c": "Don't-care entries", "ch": ["They hold the data value XXH to be loaded", "Those locations are unused; their contents do not matter", "They contain no-operation instructions", "They hold the HLT opcode"], "why": ["X means don't care, not a data value.", "", "SAP-1 has no such mnemonic in its instruction set.", "HLT is 1111 XXXX and sits at the end of the program."], "a": 1, "x": "X marks bits whose value does not affect the program. Locations 6H to 8H lie between the program and the data and are not used."}, {"id": 105, "t": "NS", "d": "E", "q": "What is the largest unsigned value that one 8-bit SAP-1 data word can hold?", "c": "8-bit range", "ch": ["127", "255 (FFH)", "15", "256"], "why": ["127 is the largest positive value in 2's complement, not the unsigned maximum.", "", "15 (FH) is the largest value of a single nibble.", "256 needs nine bits (1 0000 0000)."], "a": 1, "x": "8 bits can hold 2⁸ = 256 patterns, 0 to 255.\n1111 1111₂ = FFH = 255."}, {"id": 106, "t": "ML", "d": "E", "q": "Which machine-language word represents LDA 7H?", "c": "Assembly → binary", "ch": ["0001 0111", "0000 0100", "0111 0000", "0000 0111"], "why": ["0001 is the ADD opcode.", "The address field must be 7H = 0111, not 4H.", "The nibbles are swapped. The opcode is the upper nibble.", ""], "a": 3, "x": "LDA opcode = 0000. Address 7H = 0111.\nInstruction = opcode | address = 0000 0111."}, {"id": 107, "t": "COMP", "d": "M", "q": "The MAR belongs to which section of SAP-1?", "c": "MAR placement", "ch": ["The control unit", "The I/O unit", "The memory section (with the RAM)", "The ALU"], "why": ["The control unit is the PC, IR and controller-sequencer.", "The I/O unit is the input switches, output port and binary display.", "", "The ALU is the accumulator, adder-subtracter and B register."], "a": 2, "x": "The SAP-1 memory consists of the MAR and the 16 × 8 RAM."}, {"id": 108, "t": "PC", "d": "M", "q": "The HLT instruction is stored at address 5H. When it has been fetched into the instruction register, what does the PC hold?", "c": "PC after fetch", "ch": ["1111", "0110", "0101", "0000"], "why": ["1111 is the opcode of HLT, not an address.", "", "0101 is the address of HLT. The PC has already been incremented.", "The PC is not reset when HLT is fetched."], "a": 1, "x": "The fetch of the instruction at 5H (0101) increments the PC: 0101 + 1 = 0110 (6H)."}, {"id": 109, "t": "ML", "d": "D", "q": "The hex bytes 08H, 19H, 2AH, EXH, FXH are stored at addresses 0H to 4H. Which assembly program do they represent?", "c": "Hex machine code → assembly", "ch": ["ADD 8H; SUB 9H; LDA AH; OUT; HLT", "LDA 80H; ADD 90H; SUB A0H; OUT; HLT", "LDA 8H; ADD 9H; SUB AH; OUT; HLT", "LDA 8H; SUB 9H; ADD AH; OUT; HLT"], "why": ["The first digits are 0, 1, 2 = LDA, ADD, SUB in that order.", "The address is only the lower nibble.", "", "1 is ADD and 2 is SUB, so these opcodes are swapped."], "a": 2, "x": "08H = 0000 1000 → LDA 8H.\n19H = 0001 1001 → ADD 9H.\n2AH = 0010 1010 → SUB AH.\nEXH → OUT. FXH → HLT."}, {"id": 110, "t": "IC", "d": "E", "q": "Which technology defines the third generation of computers (1964–1971)?", "c": "Computer generations", "ch": ["Discrete transistors", "Microprocessors", "Integrated circuits", "Vacuum tubes"], "why": ["Transistors belong to the second generation (1956–1963).", "Microprocessors begin the fourth generation (1971 onward).", "", "Vacuum tubes belong to the first generation (1940–1956)."], "a": 2, "x": "Generations: 1st vacuum tubes, 2nd transistors, 3rd integrated circuits (1964–1971), 4th microprocessors (1971–present)."}, {"id": 111, "t": "PC", "d": "M", "q": "A program is stored at addresses 0H to 4H. When the PC contains 0010, which instruction is fetched next?", "c": "PC and memory", "ch": ["SUB BH", "OUT", "LDA 9H", "ADD AH"], "why": ["", "OUT is at address 3H.", "LDA 9H is at address 0H.", "ADD AH is at address 1H."], "a": 0, "x": "PC = 0010 = 2H. The instruction stored at 2H is SUB BH.", "ctx": "0H  LDA 9H\n1H  ADD AH\n2H  SUB BH\n3H  OUT\n4H  HLT"}, {"id": 112, "t": "PC", "d": "D", "q": "An LDA 9H instruction stored at address 0H has just finished executing. What does the PC hold?", "c": "PC vs operand address", "ch": ["1001", "0001", "0010", "0000"], "why": ["1001 is the operand address 9H, which was sent to the MAR.", "", "Only one fetch has occurred.", "The PC was incremented during the fetch."], "a": 1, "x": "The PC only tracks instruction addresses. The fetch at 0H made it 0001. The operand 9H went to the MAR and did not change the PC."}, {"id": 113, "t": "COMP", "d": "D", "q": "Which sequence correctly describes the register transfers that fetch an instruction?", "c": "Fetch data flow", "ch": ["MAR → PC; PC increments; IR → RAM", "PC → MAR (via W bus); PC increments; addressed RAM word → IR", "PC → IR; IR → MAR; MAR → RAM", "RAM word → IR; PC → MAR; PC increments"], "why": ["The address flows from the PC to the MAR, and the instruction flows from RAM to the IR.", "", "The PC does not feed the IR directly. The fetched word goes into the IR from RAM.", "The RAM cannot be read before the address is in the MAR."], "a": 1, "x": "1. Address state: PC → W bus → MAR.\n2. Increment state: PC counts up by 1.\n3. Memory state: RAM word at the MAR address → W bus → IR."}, {"id": 114, "t": "MEM", "d": "E", "q": "During a read operation, what does the RAM put on the W bus?", "c": "Reading RAM", "ch": ["The value of the accumulator", "The address held in the MAR", "The word stored at the address held in the MAR", "The next value of the PC"], "why": ["The accumulator is a separate register.", "The address goes to the RAM, not back out.", "", "The PC is not involved in the read."], "a": 2, "x": "The MAR applies its address to the RAM and the addressed word is placed on the W bus."}, {"id": 115, "t": "COMP", "d": "M", "q": "Which group of blocks makes up the SAP-1 arithmetic logic unit (ALU)?", "c": "ALU blocks", "ch": ["Input switches, output port, binary display", "Program counter, instruction register, controller-sequencer", "Accumulator, adder-subtracter, B register", "MAR and the 16 × 8 RAM"], "why": ["These form the I/O unit.", "These make up the control unit.", "", "These form the memory section."], "a": 2, "x": "The ALU is the accumulator, the adder-subtracter and the B register."}, {"id": 116, "t": "IN", "d": "M", "q": "Which procedure correctly loads a program and data into SAP-1 before a run?", "c": "Programming procedure", "ch": ["Set RUN-PROG to PROG, set address switches, set data switches, push WRITE, repeat for each word, then switch to RUN", "Set the data switches only; the PC supplies the addresses", "Push WRITE first, then set the address and data switches", "Set RUN-PROG to RUN, set the switches, push WRITE, repeat for each word"], "why": ["", "In PROG mode the address comes from the address switches.", "The switches must hold the word before WRITE is pushed.", "Writing to RAM needs the PROG position."], "a": 0, "x": "In PROG mode the address switches drive the RAM. Set an address and a data word, then press the momentary WRITE switch. After all words are in, set RUN-PROG to RUN so the MAR drives RAM."}, {"id": 117, "t": "ML", "d": "D", "q": "A student writes the machine code for SUB 5H as 0101 0010. What does this pattern actually represent?", "c": "Reversed conversion", "ch": ["ADD 2H", "Nothing valid; 0101 is not a SAP-1 opcode", "SUB 5H", "LDA 2H"], "why": ["ADD's opcode is 0001.", "", "SUB 5H is 0010 0101. The nibbles are reversed here.", "LDA's opcode is 0000."], "a": 1, "x": "SUB = 0010 and 5H = 0101, so the correct word is 0010 0101. The student reversed the nibbles, producing the unassigned opcode 0101."}, {"id": 118, "t": "ML", "d": "D", "q": "SAP-1 is loaded with the machine code and data shown. What does the binary display show when the run ends?", "c": "Running machine code", "ch": ["0000 0110", "0000 1110", "0001 0001", "0001 0100"], "why": ["That is 6 (10 − 7 + 3). The ADD and SUB opcodes were mixed up.", "", "That is 17, the value before the SUB FH step.", "That is 20, the sum of all three words. The SUB step was treated as ADD."], "a": 1, "x": "0DH = LDA DH → A = 0AH (10).\n1EH = ADD EH → 10 + 7 = 17.\n2FH = SUB FH → 17 − 3 = 14.\nEXH = OUT → display = 0000 1110. FXH = HLT.", "ctx": "0H  0DH\n1H  1EH\n2H  2FH\n3H  EXH\n4H  FXH\nDH  0AH\nEH  07H\nFH  03H"}, {"id": 119, "t": "ASM", "d": "E", "q": "What does the instruction ADD 9H do?", "c": "Meaning of ADD", "ch": ["Adds the number 9 to the accumulator", "Adds the contents of memory location 9H to the accumulator and puts the sum in the accumulator", "Adds 9H to the program counter", "Stores the accumulator at address 9H"], "why": ["9H is an address, not the number to add.", "", "ADD operates on the accumulator, not the PC.", "SAP-1 uses no store instruction. ADD reads memory."], "a": 1, "x": "ADD 9H adds R9 (the word stored at 9H) to the accumulator. The sum replaces the old contents of A."}, {"id": 120, "t": "PC", "d": "D", "q": "A 4-bit PC contains 1111 and is incremented once. What does it contain next?", "c": "PC rollover", "ch": ["0001", "10000", "0000", "1111"], "why": ["The count after 1111 rolls over to 0000, not 0001.", "A 4-bit counter cannot hold five bits.", "", "An increment changes the count."], "a": 2, "x": "1111 + 1 = 1 0000. Only four bits are kept, so the PC reads 0000."}, {"id": 121, "t": "NS", "d": "E", "q": "Which of the following is NOT a valid hexadecimal number?", "c": "Hex digits", "ch": ["B0H", "3GH", "1AH", "7FH"], "why": ["Valid. It uses the digits B and 0.", "", "Valid. It uses the digits 1 and A.", "Valid. It uses the digits 7 and F."], "a": 1, "x": "Hex digits are 0–9 and A–F only. G is not a hex digit, so 3GH is invalid."}, {"id": 122, "t": "MEM", "d": "M", "q": "The MAR contains 0CH and RAM location CH contains 7AH. What does this mean?", "c": "Address vs data", "ch": ["RAM location 7AH is selected and holds 0CH", "RAM location CH is selected, and reading it puts the data 7AH on the W bus", "The address 7AH has been loaded into the MAR", "The data 0CH is stored in the MAR"], "why": ["The MAR value is the address and the stored word is the data.", "", "7AH is the stored data. The MAR holds only the address 0CH.", "The MAR stores an address, not data."], "a": 1, "x": "The MAR content is the address (CH). The RAM word stored at CH is the data (7AH). A read puts 7AH on the W bus."}, {"id": 123, "t": "MEM", "d": "E", "q": "What is the highest address the MAR can specify in SAP-1?", "c": "Address range", "ch": ["FH (1111)", "FFH", "10H", "8H"], "why": ["", "FFH is 8 bits; the MAR is 4 bits.", "10H needs five bits.", "8H is the middle of the range."], "a": 0, "x": "A 4-bit MAR covers 0000 to 1111, that is 0H to FH."}, {"id": 124, "t": "COMP", "d": "E", "q": "How many bits wide is the W bus that carries data between SAP-1 registers?", "c": "W bus width", "ch": ["12", "4", "16", "8"], "why": ["12 is the width of the control word.", "4 bits is the width of the address lines, not the W bus.", "SAP-1 has no 16-bit path.", ""], "a": 3, "x": "The W bus is 8 bits wide, matching the 8-bit RAM word. Only 4 lines are used for an address."}, {"id": 125, "t": "ML", "d": "D", "q": "Which assembly instruction does the machine word 0000 1110 represent?", "c": "Opcode vs operand", "ch": ["LDA 0H", "OUT", "LDA EH", "ADD EH"], "why": ["The address field is 1110 = EH, not 0H.", "1110 is the OUT opcode only in the upper nibble. Here it is the address field.", "", "ADD's opcode is 0001."], "a": 2, "x": "The upper nibble 0000 is the opcode for LDA. The lower nibble 1110 is the address EH.\nThe pattern 1110 only means OUT when it is in the upper nibble."}, {"id": 126, "t": "COMP", "d": "E", "q": "The PC holds the address 0011. By which path does this address reach the MAR?", "c": "PC to MAR data flow", "ch": ["Directly from the PC to the RAM, bypassing the MAR", "Through the accumulator", "Over the W bus (PC enabled, MAR loading)", "Through the instruction register"], "why": ["The RAM is addressed through the MAR.", "The accumulator is not in the address path.", "", "The IR holds instructions, not addresses from the PC."], "a": 2, "x": "During the address state the PC places its 4-bit address on the W bus and the MAR latches it on the clock edge."}, {"id": 127, "t": "COMP", "d": "M", "q": "At the end of a fetch, the IR holds 0001 1011. Where does each nibble go?", "c": "IR nibble routing", "ch": ["0001 goes to the controller-sequencer; 1011 is placed on the W bus when needed", "1011 goes to the controller-sequencer; 0001 is placed on the W bus when needed", "All eight bits go to the controller-sequencer", "0001 goes to the MAR; 1011 goes to the controller-sequencer"], "why": ["", "The nibbles are reversed. The upper nibble is the opcode.", "Only the upper nibble goes to the controller-sequencer.", "The MAR needs the address field, which is the lower nibble."], "a": 0, "x": "The IR is split in two. The upper nibble (0001 = ADD opcode) goes straight to the controller-sequencer for decoding. The lower nibble (1011 = BH) has a three-state output to the W bus, so it can be loaded into the MAR."}, {"id": 128, "t": "ASM", "d": "D", "q": "Trace the program. What does the binary display show after OUT?", "c": "Multi-step program trace", "ch": ["0001 1110", "0001 1011", "0010 1000", "0010 0000"], "why": ["", "That is 27, the value before ADD BH.", "That is 40. SUB was treated as ADD.", "That is 32, the value before SUB AH and ADD BH."], "a": 0,
