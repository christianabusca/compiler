<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control Systems — Interactive 150-Item Exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f0e8;--panel:#fffdf8;--ink:#1c2330;--mute:#667085;--line:#d8d2c3;--acc:#1f4e8c;--accbg:#e4edf9;--ok:#1b7a45;--okbg:#e0f2e7;--bad:#b3261e;--badbg:#fae5e3;--warn:#8a5a00;--warnbg:#fbf0d5;
--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181f;--panel:#1b212b;--ink:#e6e9ef;--mute:#9aa4b5;--line:#2f3846;--acc:#7fb0f0;--accbg:#1f2e45;--ok:#5fd08e;--okbg:#17301f;--bad:#ff8a80;--badbg:#3a1d1b;--warn:#f0c15a;--warnbg:#3a2f12}}
:root[data-theme="dark"]{--bg:#14181f;--panel:#1b212b;--ink:#e6e9ef;--mute:#9aa4b5;--line:#2f3846;--acc:#7fb0f0;--accbg:#1f2e45;--ok:#5fd08e;--okbg:#17301f;--bad:#ff8a80;--badbg:#3a1d1b;--warn:#f0c15a;--warnbg:#3a2f12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans)}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0 14px;border-bottom:2px solid var(--ink);margin-bottom:16px}
header.top h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.01em;flex:1;min-width:200px}
header.top h1 small{display:block;font:400 12px var(--mono);color:var(--mute);letter-spacing:0}
.pill{font:500 13px var(--mono);border:1px solid var(--line);background:var(--panel);padding:4px 10px;border-radius:3px}
.btn{border:1px solid var(--ink);background:var(--panel);padding:8px 14px;border-radius:3px;font-weight:500}
.btn:hover{background:var(--accbg)}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.pri:hover{opacity:.88}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:20px}
.grid{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}.nav{order:2}}
.nav h3{font:500 12px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:0 0 10px}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px}
.nums button{height:32px;border:1px solid var(--line);background:var(--bg);border-radius:3px;font:500 12px var(--mono);position:relative;padding:0}
.nums button.ans{background:var(--accbg);border-color:var(--acc)}
.nums button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.nums button.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.nums button.cur{outline:2px solid var(--ink);outline-offset:1px}
.nums button.fl::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;background:var(--warn);border-radius:50%}
.legend{font-size:12px;color:var(--mute);margin-top:12px;line-height:1.8}
.qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.qno{font:500 13px var(--mono);background:var(--ink);color:var(--bg);padding:3px 9px;border-radius:2px}
.badge{font:500 12px var(--mono);padding:2px 8px;border-radius:2px;border:1px solid var(--line)}
.badge.Easy{color:var(--ok)}.badge.Moderate{color:var(--warn)}.badge.Difficult{color:var(--bad)}
.qtext{font-size:18px;margin:0 0 18px;font-weight:500}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--bg);padding:11px 14px;border-radius:3px}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--accbg)}
.opt .L{font:500 14px var(--mono);min-width:22px;height:22px;border:1px solid var(--ink);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-top:1px;flex:none}
.opt.sel{border-color:var(--acc);background:var(--accbg)}
.opt.sel .L{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .L{background:var(--ok);color:var(--bg);border-color:var(--ok)}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.opt.no .L{background:var(--bad);color:var(--bg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.expl{margin-top:16px;border-left:4px solid var(--acc);background:var(--accbg);padding:12px 16px;border-radius:0 3px 3px 0}
.expl b{font-family:var(--mono);font-size:13px}
.verdict{font:600 14px var(--mono);margin:16px 0 0}
.verdict.ok{color:var(--ok)}.verdict.no{color:var(--bad)}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;align-items:center}
.ctrl .sp{flex:1}
.warn{background:var(--warnbg);border:1px solid var(--warn);padding:12px 14px;border-radius:3px;margin-top:14px}
.warn .ctrl{margin-top:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.chip{border:1px solid var(--line);background:var(--bg);padding:6px 12px;border-radius:3px;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
label.f{display:block;font:500 12px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin-top:18px}
select{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:7px 10px;border-radius:3px}
.score{font:600 52px/1 var(--mono)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:16px 0}
.stat{border:1px solid var(--line);padding:10px 12px;border-radius:3px;background:var(--bg)}
.stat span{display:block;font:500 12px var(--mono);color:var(--mute);text-transform:uppercase}
.stat b{font:600 20px var(--mono)}
.bar{height:8px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc)}
p.note{color:var(--mute);font-size:14px;margin:6px 0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const Q = [{"n": 1, "q": "A toaster runs for a preset time and does not measure the color of the toast. How is it best classified?", "c": {"A": "Closed-loop, because it has both an input and an output", "B": "Closed-loop, because it contains a controller", "C": "Open-loop, because the output is neither measured nor fed back", "D": "Multi-variable, because it regulates both time and heat"}, "a": "C", "d": "Easy", "e": "Open-loop, because the output is neither measured nor fed back. A toaster uses a preset time and never senses toast color, so it cannot correct for bread type or thickness. Having an input, output, or controller (A, B) does not make a system closed-loop. It controls only one variable, so it is not multi-variable (D)."}, {"n": 2, "q": "In a feedback system, which component measures the output response and converts it into the form used by the controller?", "c": {"A": "Output transducer (sensor)", "B": "Input transducer", "C": "Summing junction", "D": "Compensator"}, "a": "A", "d": "Easy", "e": "Output transducer (sensor). The sensor measures the output and converts it to the controller's signal form. The input transducer (B) converts the reference, the summing junction (C) compares signals, and a compensator (D) shapes the controller response."}, {"n": 3, "q": "Wind pushes a commanded antenna away from its azimuth angle. Which statement about a closed-loop antenna controller is correct?", "c": {"A": "Nothing is needed, because the input command alone restores the angle", "B": "The system cannot respond, because disturbances enter after the controller", "C": "The operator must change the input command to compensate", "D": "Feedback measures the shift, and the error signal drives the motor back"}, "a": "D", "d": "Moderate", "e": "Feedback measures the shift, and the error signal drives the motor back. In a closed loop the output is measured, so any displacement caused by wind appears in the error. A is wrong because the input alone cannot sense the disturbance. B is wrong because a feedback loop still sees the output after the disturbance. C is wrong because the system itself, not the operator, makes the correction."}, {"n": 4, "q": "Which of the following is NOT one of the four primary reasons for building a control system?", "c": {"A": "Power amplification", "B": "Reducing hardware cost", "C": "Convenience of input form", "D": "Compensation for disturbances"}, "a": "B", "d": "Easy", "e": "Reducing hardware cost. The four reasons are power amplification, remote control, convenience of input form, and compensation for disturbances. Control systems usually add cost and complexity."}, {"n": 5, "q": "A radar antenna is positioned by turning a low-power knob, yet the antenna itself needs a large amount of power to rotate. Which primary purpose of control systems does this illustrate?", "c": {"A": "Remote control", "B": "Power amplification", "C": "Convenience of input form", "D": "Compensation for disturbances"}, "a": "B", "d": "Easy", "e": "Power amplification. A low-power knob input produces a high-power output rotation, which is power gain."}, {"n": 6, "q": "The difference between the input and the output after the transients have effectively disappeared is called the:", "c": {"A": "Transient response", "B": "Natural response", "C": "Overshoot", "D": "Steady-state error"}, "a": "D", "d": "Easy", "e": "Steady-state error. This is the input minus the output after the transients have disappeared. The transient response (A) is the portion before that, the natural response (B) is a mathematical component, and overshoot (C) occurs during the transient."}, {"n": 7, "q": "An elevator overshoots the fourth floor and oscillates for several seconds before settling exactly level with the floor. Which performance measure is unsatisfactory?", "c": {"A": "Transient response", "B": "Steady-state error", "C": "Stability", "D": "Power gain"}, "a": "A", "d": "Moderate", "e": "Transient response. Excessive oscillation before settling is a transient problem. The cab ends up level, so the steady-state error (B) is acceptable, and since the oscillation dies out the system is stable (C)."}, {"n": 8, "q": "The natural response of a system contains the term e^(2t). What can be concluded?", "c": {"A": "The system is stable, because the forced response will eventually dominate", "B": "The system is marginally stable, because the term is exponential", "C": "The system is unstable, because the natural response grows without bound", "D": "The system is stable, because the term is smooth"}, "a": "C", "d": "Difficult", "e": "Unstable, because the natural response grows without bound. e^(2t) increases forever, so it overwhelms the forced response. A and D confuse a smooth exponential with decay, and B is wrong because the response is not oscillatory."}, {"n": 9, "q": "Which test waveform is infinite at t = 0, zero elsewhere, and has a unit area?", "c": {"A": "Impulse", "B": "Step", "C": "Ramp", "D": "Parabola"}, "a": "A", "d": "Easy", "e": "Impulse. δ(t) is infinite at t = 0, zero elsewhere, and has unit area. A step is constant for t > 0, a ramp grows linearly, and a parabola grows quadratically."}, {"n": 10, "q": "To evaluate how well a position control system tracks a satellite crossing the sky at constant speed, which test input is most appropriate?", "c": {"A": "Impulse", "B": "Step", "C": "Sinusoid", "D": "Ramp"}, "a": "D", "d": "Moderate", "e": "Ramp. A constant-speed target gives a linearly increasing position command. A step is a constant position, an impulse injects initial energy, and a sinusoid is oscillatory."}, {"n": 11, "q": "A disc-player spindle has speed as its output. What does a step input represent for this system?", "c": {"A": "A linearly increasing speed", "B": "A constant desired speed", "C": "An instantaneous injection of energy", "D": "A constant acceleration"}, "a": "B", "d": "Moderate", "e": "A constant desired speed. The step input has the same form as the output, so for speed it is a constant commanded speed. A ramp (A) would be a linearly increasing speed, and a constant acceleration (D) is a parabola in position."}, {"n": 12, "q": "The amplifier gain of a closed-loop position control system is raised from low to high. Which result is most likely?", "c": {"A": "The final steady-state value always exceeds the input", "B": "The transient response is unaffected", "C": "The motor moves faster and the output may overshoot with damped oscillations", "D": "The system automatically becomes open-loop"}, "a": "C", "d": "Difficult", "e": "The motor moves faster, and the output may overshoot with damped oscillations. A higher gain drives the motor harder, so the transient is faster but may be oscillatory. The steady-state value still settles at the input (A), the transient clearly changes (B), and the loop stays closed (D)."}, {"n": 13, "q": "In the six-step design process, which step comes immediately after drawing the functional block diagram?", "c": {"A": "Reduce the block diagram", "B": "Obtain the mathematical model", "C": "Analyze and test the design", "D": "Transform the physical system into a schematic"}, "a": "D", "d": "Easy", "e": "Transform the physical system into a schematic. The order is: requirements → functional block diagram → schematic → mathematical model → reduction → analysis."}, {"n": 14, "q": "In the antenna schematic, the potentiometers are drawn without friction or inertia. What does this assumption imply?", "c": {"A": "The potentiometer voltage changes instantaneously with shaft angle", "B": "The potentiometer voltage lags the angle by the motor time constant", "C": "The potentiometer adds a second-order dynamic to the loop", "D": "The potentiometer gain is zero at steady state"}, "a": "A", "d": "Moderate", "e": "The potentiometer voltage changes instantaneously with shaft angle. Neglecting friction and inertia removes any potentiometer dynamics, so the voltage follows the angle immediately. The other choices add dynamics, which the assumption removes."}, {"n": 15, "q": "Why can the differential and power amplifiers in the antenna loop be modeled as a pure gain K?", "c": {"A": "Amplifiers do not consume power", "B": "Amplifier gain is always unity", "C": "Their dynamics are rapid compared with the motor response", "D": "Their inductance cancels the viscous damping"}, "a": "C", "d": "Moderate", "e": "Their dynamics are rapid compared with the motor response. Because they respond so much faster than the motor, the amplifiers are treated as a pure gain K."}, {"n": 16, "q": "What is the purpose of block diagram reduction in the design process?", "c": {"A": "To draw the physical layout of the system", "B": "To obtain a single mathematical description from system input to output", "C": "To select the motor and sensors", "D": "To measure the system parameters on hardware"}, "a": "B", "d": "Easy", "e": "To obtain a single mathematical description from system input to output. Reduction collapses the interconnected blocks into one equivalent block."}, {"n": 17, "q": "Which modeling approach converts an nth-order differential equation into n simultaneous first-order equations and can also handle systems that linear differential equations cannot describe?", "c": {"A": "Transfer function", "B": "Impulse response", "C": "Laplace transform", "D": "State-space representation"}, "a": "D", "d": "Moderate", "e": "State-space representation. It turns an nth-order equation into n first-order equations and also handles systems that linear differential equations cannot describe. A transfer function applies only to linear systems."}, {"n": 18, "q": "A transfer function is the ratio of the output to the input in the s-domain, assuming:", "c": {"A": "All initial conditions equal one", "B": "All initial conditions are zero", "C": "The input is a unit step", "D": "The output is initially zero only"}, "a": "B", "d": "Easy", "e": "All initial conditions are zero. This is the definition of G(s) = C(s)/R(s)."}, {"n": 19, "q": "A transfer function can be defined only for which kind of system?", "c": {"A": "Linear, time-invariant systems", "B": "Any nonlinear system", "C": "Time-varying systems only", "D": "Open-loop systems only"}, "a": "A", "d": "Moderate", "e": "Linear, time-invariant systems. Transfer functions require linearity and time invariance, and they can be applied to open- or closed-loop systems."}, {"n": 20, "q": "What is the main advantage of using the Laplace transform when modeling a linear system?", "c": {"A": "It makes a nonlinear system linear", "B": "It removes the need for initial conditions", "C": "It converts differential equations into algebraic equations in s", "D": "It replaces every input signal with a constant"}, "a": "C", "d": "Moderate", "e": "It converts differential equations into algebraic equations in s. It does not linearize a nonlinear system (A), and initial conditions are still needed (B)."}, {"n": 21, "q": "What is the Laplace transform of the unit step u(t)?", "c": {"A": "s", "B": "1/s²", "C": "1/s", "D": "1"}, "a": "C", "d": "Easy", "e": "1/s. L{u(t)} = 1/s."}, {"n": 22, "q": "What is the Laplace transform of the unit impulse δ(t)?", "c": {"A": "1/s", "B": "s", "C": "0", "D": "1"}, "a": "D", "d": "Easy", "e": "1. L{δ(t)} = 1, since the integral of the impulse is 1."}, {"n": 23, "q": "What is the Laplace transform of 5e^(−4t)u(t)?", "c": {"A": "5/(s − 4)", "B": "5/(s + 4)", "C": "4/(s + 5)", "D": "5/s + 4"}, "a": "B", "d": "Moderate", "e": "5/(s + 4). L{e^(−at)} = 1/(s + a), multiplied by 5. A uses the wrong sign, and C and D are incorrect forms."}, {"n": 24, "q": "What is the Laplace transform of 3t·u(t)?", "c": {"A": "3/s²", "B": "3/s", "C": "1/(3s²)", "D": "3s²"}, "a": "A", "d": "Easy", "e": "3/s². L{t} = 1/s², so L{3t} = 3/s²."}, {"n": 25, "q": "What is the Laplace transform of t·e^(−2t)u(t)?", "c": {"A": "1/(s + 2)²", "B": "1/(s − 2)²", "C": "1/(s² + 2)", "D": "2/s²"}, "a": "A", "d": "Moderate", "e": "1/(s + 2)². Frequency shifting replaces s by s + 2 in L{t} = 1/s²."}, {"n": 26, "q": "What is the Laplace transform of sin 3t·u(t)?", "c": {"A": "s/(s² + 9)", "B": "3/(s² − 9)", "C": "3/(s² + 9)", "D": "1/(s² + 9)"}, "a": "C", "d": "Moderate", "e": "3/(s² + 9). L{sin ωt} = ω/(s² + ω²), with ω = 3."}, {"n": 27, "q": "What is the Laplace transform of e^(−2t)cos 3t·u(t)?", "c": {"A": "(s − 2)/[(s − 2)² + 9]", "B": "3/[(s + 2)² + 9]", "C": "s/[(s + 2)² + 9]", "D": "(s + 2)/[(s + 2)² + 9]"}, "a": "D", "d": "Difficult", "e": "(s + 2)/[(s + 2)² + 9]. L{cos ωt} = s/(s² + ω²), and frequency shifting replaces s by s + 2."}, {"n": 28, "q": "What is the inverse Laplace transform of F(s) = 6/(s + 3)²?", "c": {"A": "6e^(−3t)", "B": "6t·e^(−3t)", "C": "3t²·e^(−3t)", "D": "6t·e^(3t)"}, "a": "B", "d": "Moderate", "e": "6t·e^(−3t). L⁻¹{1/(s + a)²} = t·e^(−at), multiplied by 6."}, {"n": 29, "q": "What is the inverse Laplace transform of F(s) = 10/[s(s + 5)]?", "c": {"A": "2e^(−5t)", "B": "10(1 − e^(−5t))", "C": "2(1 + e^(−5t))", "D": "2(1 − e^(−5t))"}, "a": "D", "d": "Difficult", "e": "2(1 − e^(−5t)). Partial fractions: 10/[s(s + 5)] = 2/s − 2/(s + 5), so f(t) = 2 − 2e^(−5t)."}, {"n": 30, "q": "Using Laplace transforms, solve dx/dt + 4x = 8u(t) with x(0) = 0. What is x(0.5)?", "c": {"A": "1.72933", "B": "6.91731", "C": "0.27067", "D": "0.86466"}, "a": "A", "d": "Difficult", "e": "1.72933. sX + 4X = 8/s, so X = 8/[s(s + 4)] = 2/s − 2/(s + 4), and x(t) = 2(1 − e^(−4t)). At t = 0.5: 2(1 − e^(−2)) = 2(1 − 0.13534) = 1.72933. B forgets to divide by 4, C is 2e^(−2), and D is 1 − e^(−2)."}, {"n": 31, "q": "If x(0) = 2 and x′(0) = −3, the Laplace transform of d²x/dt² is:", "c": {"A": "s²X(s) − 2s − 3", "B": "s²X(s) − 2s + 3", "C": "s²X(s) + 2s − 3", "D": "s²X(s) − 3s + 2"}, "a": "B", "d": "Moderate", "e": "s²X(s) − 2s + 3. L{x″} = s²X − s·x(0) − x′(0) = s²X − 2s − (−3) = s²X − 2s + 3."}, {"n": 32, "q": "Solve d²x/dt² + 5 dx/dt + 6x = 0 with x(0) = 1 and x′(0) = 0. What is x(t)?", "c": {"A": "2e^(−2t) − e^(−3t)", "B": "3e^(−3t) − 2e^(−2t)", "C": "3e^(−2t) − 2e^(−3t)", "D": "3e^(−2t) + 2e^(−3t)"}, "a": "C", "d": "Difficult", "e": "3e^(−2t) − 2e^(−3t). s²X − s + 5(sX − 1) + 6X = 0, so X = (s + 5)/[(s + 2)(s + 3)] = 3/(s + 2) − 2/(s + 3). Check: x(0) = 1 and x′(0) = −6 + 6 = 0."}, {"n": 33, "q": "A system obeys d²y/dt² + 7 dy/dt + 10y = 3 dx/dt + 2x. What is Y(s)/X(s) with zero initial conditions?", "c": {"A": "(s² + 7s + 10)/(3s + 2)", "B": "(3s + 2)/(s² + 7s + 10)", "C": "(3s² + 2)/(s² + 7s + 10)", "D": "(3s + 2)/(s² + 7s − 10)"}, "a": "B", "d": "Moderate", "e": "(3s + 2)/(s² + 7s + 10). With zero initial conditions, (s² + 7s + 10)Y = (3s + 2)X. A inverts the ratio, and C and D change coefficients."}, {"n": 34, "q": "A system has C(s)/R(s) = 4/(s² + 6s + 9). Which differential equation corresponds to it?", "c": {"A": "c″ + 6c′ + 9c = 4r", "B": "c″ + 6c′ + 9c = 4r′", "C": "4c″ + 6c′ + 9c = r", "D": "c″ − 6c′ + 9c = 4r"}, "a": "A", "d": "Moderate", "e": "c″ + 6c′ + 9c = 4r. Cross-multiplying gives (s² + 6s + 9)C = 4R, and each power of s becomes a derivative."}, {"n": 35, "q": "A system with G(s) = 8/[(s + 2)(s + 4)] receives a unit step input. What is the output c(t) with zero initial conditions?", "c": {"A": "1 + 2e^(−2t) + e^(−4t)", "B": "1 − e^(−2t) − e^(−4t)", "C": "1 − 2e^(−2t) − e^(−4t)", "D": "1 − 2e^(−2t) + e^(−4t)"}, "a": "D", "d": "Difficult", "e": "1 − 2e^(−2t) + e^(−4t). C(s) = 8/[s(s + 2)(s + 4)] = 1/s − 2/(s + 2) + 1/(s + 4). Check: c(0) = 1 − 2 + 1 = 0."}, {"n": 36, "q": "A system has the transfer function (s + 1)/(s³ + 4s² + 5s + 2). What is the order of the system?", "c": {"A": "1", "B": "2", "C": "3", "D": "4"}, "a": "C", "d": "Easy", "e": "3. The order is the highest power of s in the denominator, which is s³."}, {"n": 37, "q": "What is the s-domain impedance of an ideal capacitor C?", "c": {"A": "Cs", "B": "Ls", "C": "R", "D": "1/(Cs)"}, "a": "D", "d": "Easy", "e": "1/(Cs). A capacitor's impedance is V/I = 1/(Cs). Cs is its admittance, and Ls is the inductor's impedance."}, {"n": 38, "q": "What is the s-domain impedance of an ideal inductor L?", "c": {"A": "1/(Ls)", "B": "R", "C": "Ls", "D": "L/s"}, "a": "C", "d": "Easy", "e": "Ls. The inductor's impedance is V/I = Ls."}, {"n": 39, "q": "A series RC circuit has R = 10 kΩ and C = 10 µF, with the output taken across the capacitor. What is Vo(s)/Vi(s)?", "c": {"A": "10/(s + 10)", "B": "0.1/(s + 0.1)", "C": "10s/(s + 10)", "D": "1/(s + 10)"}, "a": "A", "d": "Moderate", "e": "10/(s + 10). Vo/Vi = 1/(RCs + 1), with RC = 10,000 × 10×10⁻⁶ = 0.1 s. So the result is 1/(0.1s + 1) = 10/(s + 10)."}, {"n": 40, "q": "A series RL circuit with R = 2 Ω and L = 0.5 H has its output taken across the resistor. What is Vo(s)/Vi(s)?", "c": {"A": "2/(s + 4)", "B": "4/(s + 4)", "C": "4s/(s + 4)", "D": "1/(s + 4)"}, "a": "B", "d": "Moderate", "e": "4/(s + 4). Vo/Vi = R/(R + Ls) = 2/(2 + 0.5s) = 4/(s + 4)."}, {"n": 41, "q": "A series RLC circuit has L = 1 H, R = 4 Ω, and C = 0.25 F, with the output taken across the capacitor. What is Vo(s)/Vi(s)?", "c": {"A": "4/(s² + 4s + 4)", "B": "1/(s² + 4s + 4)", "C": "4/(s² + s + 4)", "D": "4s/(s² + 4s + 4)"}, "a": "A", "d": "Difficult", "e": "4/(s² + 4s + 4). Vo/Vi = 1/(LCs² + RCs + 1) = 1/(0.25s² + s + 1). Multiplying the numerator and denominator by 4 gives 4/(s² + 4s + 4)."}, {"n": 42, "q": "A 2 Ω resistor is in series with the input. The output is taken across a parallel combination of a 1 H inductor and a 2 Ω resistor. What is Vo(s)/Vi(s)?", "c": {"A": "s/(s + 1)", "B": "s/(2s + 2)", "C": "2s/(s + 2)", "D": "1/(2s + 2)"}, "a": "B", "d": "Difficult", "e": "s/(2s + 2). Zp = 2s/(s + 2). Then Vo/Vi = Zp/(2 + Zp) = 2s/[2(s + 2) + 2s] = 2s/(4s + 4) = s/(2s + 2)."}, {"n": 43, "q": "An ideal inverting op-amp has an input resistor of 10 kΩ and a feedback resistor of 47 kΩ. What is its voltage gain?", "c": {"A": "+4.7", "B": "−0.21277", "C": "−4.7", "D": "+5.7"}, "a": "C", "d": "Easy", "e": "−4.7. Inverting gain = −Rf/Rin = −47/10 = −4.7. The sign is negative for an inverting configuration."}, {"n": 44, "q": "An ideal non-inverting op-amp has Z1 = 10 kΩ to ground and Z2 = 90 kΩ in the feedback path. What is its voltage gain?", "c": {"A": "−9", "B": "9", "C": "−10", "D": "10"}, "a": "D", "d": "Moderate", "e": "10. Non-inverting gain = (Z1 + Z2)/Z1 = (10 + 90)/10 = 10."}, {"n": 45, "q": "An inverting op-amp has a 100 kΩ resistor as the input impedance and a 1 µF capacitor as the feedback impedance. What is Vo(s)/Vi(s)?", "c": {"A": "−0.1s", "B": "10/s", "C": "−10/s", "D": "−s/10"}, "a": "C", "d": "Difficult", "e": "−10/s. G = −Zf/Z1 = −[1/(Cs)]/R = −1/(RCs) = −1/(0.1s) = −10/s, an inverting integrator."}, {"n": 46, "q": "An inverting op-amp has a 2 µF capacitor as the input impedance and a 250 kΩ resistor as the feedback impedance. What is Vo(s)/Vi(s)?", "c": {"A": "−0.5s", "B": "−2s", "C": "−2/s", "D": "0.5s"}, "a": "A", "d": "Difficult", "e": "−0.5s. G = −Zf/Z1 = −R·Cs = −(250,000 × 2×10⁻⁶)s = −0.5s, an inverting differentiator."}, {"n": 47, "q": "An inverting op-amp has Z1 = 200 kΩ. The feedback impedance is a 100 kΩ resistor in series with a 1 µF capacitor. What is Vo(s)/Vi(s)?", "c": {"A": "−(s + 5)/s", "B": "−(0.5s + 10)/s", "C": "(0.5s + 5)/s", "D": "−(0.5s + 5)/s"}, "a": "D", "d": "Difficult", "e": "−(0.5s + 5)/s. G = −(Rf + 1/(Cs))/R1 = −(0.5 + 5/s) = −(0.5s + 5)/s."}, {"n": 48, "q": "In an ideal inverting op-amp circuit, why is the inverting input approximately at 0 V when the non-inverting input is grounded?", "c": {"A": "The input impedance is very low", "B": "The very high gain keeps the differential input near zero", "C": "The output impedance is very high", "D": "The feedback supplies the current"}, "a": "B", "d": "Moderate", "e": "The very high gain keeps the differential input near zero. A finite output divided by a very large gain makes the input difference nearly zero. The input impedance is high, not low, so A is wrong."}, {"n": 49, "q": "What does the high input impedance of an op-amp imply?", "c": {"A": "It draws a large current from the source", "B": "It has no gain", "C": "It cannot be used with feedback", "D": "It draws negligible current from the source"}, "a": "D", "d": "Easy", "e": "It draws negligible current from the source. A high input impedance means very little input current."}, {"n": 50, "q": "Mesh analysis of an electrical network is based on which law?", "c": {"A": "Kirchhoff's current law", "B": "Kirchhoff's voltage law", "C": "Ohm's law only", "D": "Newton's second law"}, "a": "B", "d": "Easy", "e": "Kirchhoff's voltage law. Mesh analysis sums the voltages around each loop to zero. Nodal analysis uses the current law."}, {"n": 51, "q": "A unity-feedback system has a forward path G(s) = 10/[s(s + 2)]. What is the closed-loop transfer function?", "c": {"A": "10/(s² + 2s)", "B": "10/(s² + 2s − 10)", "C": "10/(s² + 2s + 10)", "D": "1/(s² + 2s + 10)"}, "a": "C", "d": "Moderate", "e": "10/(s² + 2s + 10). T = G/(1 + G) = 10/[s(s + 2) + 10]. A omits the feedback term, and B has the wrong sign."}, {"n": 52, "q": "A unity-feedback loop has the forward path K/π × 100/(s + 100) × 0.2083/[s(s + 1.71)]. Its characteristic polynomial has the form s³ + a·s² + b·s + c·K. What are a and b?", "c": {"A": "a = 101.71, b = 171", "B": "a = 100, b = 1.71", "C": "a = 101.71, b = 1.71", "D": "a = 171, b = 101.71"}, "a": "A", "d": "Difficult", "e": "a = 101.71, b = 171. The loop contains s(s + 1.71)(s + 100) = s(s² + 101.71s + 171) = s³ + 101.71s² + 171s. The gain terms appear only in the constant term, c·K, where c = 100 × 0.2083/π = 6.63040."}, {"n": 53, "q": "A rotary potentiometer has 50 V across its ends. The wiper travels from one end to the other in 15 turns. What is the constant gain from shaft angle (rad) to output voltage?", "c": {"A": "1.66667 V/rad", "B": "0.53052 V/rad", "C": "3.33333 V/rad", "D": "0.26526 V/rad"}, "a": "B", "d": "Difficult", "e": "0.53052 V/rad. The wiper travels 15 turns × 2π = 94.24778 rad across 50 V, so the gain is 50/94.24778 = 0.53052 V/rad. A uses 30 rad (turns × 2), C uses 15 rad, and D uses only 25 V."}, {"n": 54, "q": "A company makes millions of low-cost appliances, and disturbances are small. Which justification best supports an open-loop design?", "c": {"A": "Open-loop systems automatically correct small errors", "B": "Open-loop systems are less sensitive to parameter changes", "C": "Open-loop systems provide feedback for stability", "D": "It is cheaper and simpler, and accurate enough when disturbances are small"}, "a": "D", "d": "Moderate", "e": "It is cheaper and simpler, and accurate enough when disturbances are small. This is the usual open-loop trade-off. Open-loop systems do not correct errors, are more sensitive, and have no feedback."}, {"n": 55, "q": "In a block diagram, a circle with a plus sign and a minus sign at its inputs represents a:", "c": {"A": "Summing junction", "B": "Plant", "C": "Sensor", "D": "Compensator"}, "a": "A", "d": "Easy", "e": "Summing junction. A circle with + and − inputs performs an algebraic sum of signals."}, {"n": 56, "q": "Additive noise enters an open-loop system at the controller output, before the plant. What is the result?", "c": {"A": "The input transducer filters it out", "B": "The plant dynamics cancel it", "C": "It corrupts the output, and the system cannot correct it", "D": "The feedback path attenuates it"}, "a": "C", "d": "Moderate", "e": "It corrupts the output, and the system cannot correct it. There is no measurement of the output in an open-loop system, so nothing counteracts the noise."}, {"n": 57, "q": "In a closed-loop thermostat system, the sensor reading rises above the setpoint. What happens to the error signal and the heater?", "c": {"A": "Positive error; heater drive increases", "B": "Zero error; heater unchanged", "C": "Negative error; heater drive is reduced", "D": "Positive error; heater switched off"}, "a": "C", "d": "Moderate", "e": "Negative error; heater drive is reduced. Error = reference − measured, so a reading above the setpoint gives a negative error and less heat."}, {"n": 58, "q": "In a closed-loop system the input transducer gain is 0.5 V/unit and the output transducer gain is 0.2 V/unit. Is the actuating signal equal to the actual difference between input and output?", "c": {"A": "Yes, always", "B": "No, because the transducer gains are not unity", "C": "Yes, if the controller gain is high", "D": "Yes, but only in steady state"}, "a": "B", "d": "Moderate", "e": "No, because the transducer gains are not unity. The actuating signal equals the true error only when both transducers have unity gain."}, {"n": 59, "q": "A closed-loop system has a reference of 10 units and an input transducer of 0.5 V/unit. The output is 8 units, and the output transducer is 0.2 V/unit. What is the actuating signal at the summing junction?", "c": {"A": "3.4 V", "B": "2.0 V", "C": "1.6 V", "D": "5.0 V"}, "a": "A", "d": "Difficult", "e": "3.4 V. The input is 10 × 0.5 = 5.0 V and the feedback is 8 × 0.2 = 1.6 V. The actuating signal is 5.0 − 1.6 = 3.4 V. The actual difference (2 units, B) is not the actuating signal here."}, {"n": 60, "q": "A position loop meets its steady-state accuracy only when the gain is so high that the response oscillates badly. What remedy is most appropriate?", "c": {"A": "Convert it to an open-loop system", "B": "Remove the sensor", "C": "Remove the input transducer", "D": "Add a compensator with dynamic response"}, "a": "D", "d": "Difficult", "e": "Add a compensator with dynamic response. When gain alone forces a trade-off between transient response and steady-state accuracy, a compensator removes it. Removing the sensor or the feedback loop destroys the correction."}, {"n": 61, "q": "In a furnace temperature control system, the furnace itself is the:", "c": {"A": "Controller", "B": "Sensor", "C": "Reference", "D": "Plant"}, "a": "D", "d": "Easy", "e": "Plant. The furnace is the process whose output (temperature) is controlled."}, {"n": 62, "q": "A water heater controls water temperature by varying the opening of a fuel valve. Which pair is correct?", "c": {"A": "Controlled variable: water temperature; manipulated variable: valve opening", "B": "Controlled variable: valve opening; manipulated variable: water temperature", "C": "Both are the water temperature", "D": "Both are the valve opening"}, "a": "A", "d": "Moderate", "e": "Controlled variable: water temperature; manipulated variable: valve opening. The controller varies the valve to keep the temperature at the desired value."}, {"n": 63, "q": "Another name for the input of a control system, which represents the desired output, is the:", "c": {"A": "Disturbance", "B": "Reference", "C": "Error", "D": "Feedback"}, "a": "B", "d": "Easy", "e": "Reference. The input represents the desired output and is also called the reference."}, {"n": 64, "q": "A system has an inner loop (sensor 1 feeding controller 1) nested inside an outer loop (sensor 2 feeding controller 2). How is it classified?", "c": {"A": "Multi-variable", "B": "Open-loop", "C": "Multi-loop", "D": "Single-loop"}, "a": "C", "d": "Difficult", "e": "Multi-loop. Nested loops with their own sensors define a multi-loop system. Multi-variable (A) refers to several inputs and outputs."}, {"n": 65, "q": "A system receives three desired outputs and regulates three actual outputs at once through a common comparison block. How is it classified?", "c": {"A": "Multi-loop", "B": "Multi-variable", "C": "Open-loop with disturbance", "D": "Single-loop"}, "a": "B", "d": "Moderate", "e": "Multi-variable. It has several desired outputs and several actual outputs handled at once."}, {"n": 66, "q": "What is an advantage of using a digital computer as the controller?", "c": {"A": "It removes the need for sensors", "B": "It guarantees stability", "C": "Compensator changes can be made in software, and many loops can share one computer", "D": "It eliminates all noise"}, "a": "C", "d": "Moderate", "e": "Compensator changes can be made in software, and many loops can share one computer. The computer does not remove sensors, noise, or the need for stability analysis."}, {"n": 67, "q": "The theory of automatic ship steering developed by Nicholas Minorsky led to which controller type?", "c": {"A": "Lead compensator", "B": "State feedback", "C": "On-off control", "D": "PID (three-mode)"}, "a": "D", "d": "Easy", "e": "PID (three-mode). Minorsky's ship-steering work led to proportional-plus-integral-plus-derivative controllers."}, {"n": 68, "q": "James Watt's flyball governor was designed to regulate the:", "c": {"A": "Speed of a steam engine", "B": "Water level of a tank", "C": "Temperature of an incubator", "D": "Pressure of a boiler"}, "a": "A", "d": "Easy", "e": "Speed of a steam engine. The flyball governor regulates steam engine speed."}, {"n": 69, "q": "Why is the float valve of a flush tank considered a feedback system?", "c": {"A": "The float senses the water level and closes the inlet when the set height is reached", "B": "The valve is opened by the user", "C": "The tank is filled at a constant rate", "D": "The overflow tube removes extra water"}, "a": "A", "d": "Moderate", "e": "The float senses the water level and closes the inlet when the set height is reached. The measured output (level) directly adjusts the inlet valve."}, {"n": 70, "q": "The work of H. W. Bode and H. Nyquist at Bell Laboratories evolved into techniques based on:", "c": {"A": "Time-domain step responses", "B": "State variables", "C": "Root loci", "D": "Sinusoidal frequency response"}, "a": "D", "d": "Easy", "e": "Sinusoidal frequency response. Bode and Nyquist analyzed feedback amplifiers, which evolved into sinusoidal frequency-response methods."}, {"n": 71, "q": "In a steel finishing mill, X-rays measure the plate thickness and compare it with the desired thickness. The X-ray gauge functions as the:", "c": {"A": "Actuator", "B": "Controller", "C": "Sensor (output transducer)", "D": "Reference"}, "a": "C", "d": "Easy", "e": "Sensor (output transducer). It measures the actual thickness for comparison with the desired thickness."}, {"n": 72, "q": "In a temperature control system whose controller works on electrical signals, which device can serve as the output transducer?", "c": {"A": "Potentiometer", "B": "Thermistor", "C": "Strain gage", "D": "Tachometer"}, "a": "B", "d": "Easy", "e": "Thermistor. Its resistance changes with temperature, converting temperature to a voltage. A potentiometer is typically used on the input side."}, {"n": 73, "q": "In a dynamometer loop regulating force against a tire, a strain gage load cell produces a voltage proportional to force. What is its role?", "c": {"A": "Actuator", "B": "Output transducer (sensor)", "C": "Controller", "D": "Input transducer"}, "a": "B", "d": "Moderate", "e": "Output transducer (sensor). The load cell measures the controlled force and feeds a voltage back."}, {"n": 74, "q": "In the eye's light–pupil control system, which element acts as the actuator?", "c": {"A": "Retina", "B": "Brain", "C": "Optic nerve", "D": "Muscles that change the pupil diameter"}, "a": "D", "d": "Easy", "e": "Muscles that change the pupil diameter. The retina and optic nerve sense and transmit the signal, the brain is the controller, and the muscles act on the pupil."}, {"n": 75, "q": "A narrow light beam, smaller than the pupil diameter, enters the eye. What is the effect on the pupil's feedback loop?", "c": {"A": "Retinal intensity no longer depends on pupil size, so the loop is effectively broken", "B": "The loop gain increases", "C": "The loop becomes faster", "D": "The sensor saturates"}, "a": "A", "d": "Difficult", "e": "Retinal intensity no longer depends on pupil size, so the loop is effectively broken. Changing the pupil diameter cannot change the light reaching the retina, so feedback has no effect."}, {"n": 76, "q": "A feedback system has a pure time delay in its loop. Compared with the same system without delay, what is most likely?", "c": {"A": "It responds more quickly to disturbances", "B": "Its steady-state error becomes infinite", "C": "Corrections arrive late, which increases the tendency to oscillate", "D": "Its input transducer gain doubles"}, "a": "C", "d": "Moderate", "e": "Corrections arrive late, which increases the tendency to oscillate. A delay does not speed up the response (A)."}, {"n": 77, "q": "A Segway-type vehicle stays upright while climbing a slope. The slope is best classified as a(n):", "c": {"A": "External disturbance acting on the plant", "B": "Reference input", "C": "Controller output", "D": "Sensor noise"}, "a": "A", "d": "Moderate", "e": "External disturbance acting on the plant. The slope is an unwanted outside influence that the loop must reject."}, {"n": 78, "q": "In an astronaut circadian-rhythm system, a computer model of ideal body temperature is compared with the measured temperature. What role does the model serve?", "c": {"A": "Disturbance", "B": "Actuator", "C": "Reference input", "D": "Plant"}, "a": "C", "d": "Moderate", "e": "Reference input. The model supplies the desired temperature pattern against which the measurement is compared."}, {"n": 79, "q": "In a vision-based tactile feedback suit, which block produces the error between the teacher's and the student's joint positions?", "c": {"A": "Vibrotactile actuators", "B": "The computer comparing the joint positions", "C": "The student's muscles", "D": "The camera optics"}, "a": "B", "d": "Moderate", "e": "The computer comparing the joint positions. The computer finds the differences and generates the feedback."}, {"n": 80, "q": "A moored platform is positioned with thrusters against waves and wind, and there is no command input. Which statement is correct?", "c": {"A": "The thruster force is the reference", "B": "The wave force is the controller output", "C": "The outputs must follow a sinusoidal reference", "D": "The goal is to keep the outputs near zero despite disturbances"}, "a": "D", "d": "Difficult", "e": "The goal is to keep the outputs near zero despite disturbances. This is a disturbance attenuation problem with no command input."}, {"n": 81, "q": "In a solar-battery system, the bidirectional dc/dc converter charges the battery when it is not full. In which mode does it then operate?", "c": {"A": "Step-up (boost)", "B": "Inverter", "C": "Step-down (buck)", "D": "Rectifier"}, "a": "C", "d": "Moderate", "e": "Step-down (buck). Charging the battery uses the step-down converter mode, while boost is used for discharging."}, {"n": 82, "q": "In a feedback system for controlling HIV, the drug amounts of RTIs and PIs are the plant inputs. What is the controlled variable?", "c": {"A": "RTI dose", "B": "Amount of HIV viruses", "C": "PI dose", "D": "Controller output"}, "a": "B", "d": "Easy", "e": "Amount of HIV viruses. The plant output being regulated is the viral load, and the drug doses are the manipulated inputs."}, {"n": 83, "q": "In a serial hybrid vehicle cruise control, how is the running resistive force (aerodynamic drag, rolling resistance, climbing) best classified?", "c": {"A": "Command to the inverter", "B": "Control command from the ECU", "C": "Sensor output", "D": "Disturbance acting on the vehicle dynamics"}, "a": "D", "d": "Moderate", "e": "Disturbance acting on the vehicle dynamics. Drag, rolling resistance, and climbing resistance oppose the motive force and are not commanded."}, {"n": 84, "q": "A parabolic trough system holds the fluid temperature constant using a circulating pump. Which is the manipulated variable?", "c": {"A": "Fluid flow rate, set by the pump speed", "B": "Solar irradiance", "C": "Fluid temperature", "D": "Cloud cover"}, "a": "A", "d": "Moderate", "e": "Fluid flow rate, set by the pump speed. The controller adjusts the pump speed to vary the flow and hold the temperature."}, {"n": 85, "q": "In a drill-pressure loop, e(t) = Vr(t) − Vb(t), and Vb is produced from the measured pressure. If the pressure rises above the commanded value, what happens to the error?", "c": {"A": "It is positive and increases the drill speed command", "B": "It is zero", "C": "It is positive but is ignored", "D": "It is negative and lowers the desired drill speed"}, "a": "D", "d": "Moderate", "e": "It is negative and lowers the desired drill speed. Vb > Vr gives e = Vr − Vb < 0, so the controller reduces the commanded drill speed."}, {"n": 86, "q": "A series RL circuit with R = 2 Ω and L = 1 H has a 1 V unit step input and no initial energy. What is the current at t = 0.5 s?", "c": {"A": "0.31606 A", "B": "0.63212 A", "C": "0.18394 A", "D": "0.50000 A"}, "a": "A", "d": "Difficult", "e": "0.31606 A. L di/dt + Ri = 1 gives i(t) = (1/R)(1 − e^(−Rt/L)) = 0.5(1 − e^(−1)) = 0.5 × 0.63212 = 0.31606 A. B forgets the 1/R factor, C is 0.5e^(−1), and D is the final value."}, {"n": 87, "q": "What is the time constant of a series RL circuit with R = 20 Ω and L = 4 H?", "c": {"A": "5 s", "B": "80 s", "C": "0.2 s", "D": "0.05 s"}, "a": "C", "d": "Easy", "e": "0.2 s. τ = L/R = 4/20 = 0.2 s."}, {"n": 88, "q": "A series RLC circuit has R = 1 Ω, L = 0.5 H, and 1/(LC) = 16 (s⁻²). What is the damped oscillation frequency of its natural response?", "c": {"A": "4.00000 rad/s", "B": "3.87298 rad/s", "C": "3.46410 rad/s", "D": "4.12311 rad/s"}, "a": "B", "d": "Difficult", "e": "3.87298 rad/s. The characteristic polynomial is s² + (R/L)s + 1/(LC) = s² + 2s + 16, so the roots are −1 ± j√15. The damped frequency is √15 = 3.87298 rad/s. A is the undamped frequency (4), C subtracts the damping term incorrectly (√12), and D is √17."}, {"n": 89, "q": "For the circuit of Item 88 with a 1 V unit step input and no initial energy, what is i(t)?", "c": {"A": "0.51640e^(−t)cos(3.87298t)", "B": "0.51640e^(−t)sin(3.87298t)", "C": "2e^(−t)sin(3.87298t)", "D": "0.51640e^(−t)sin(4t)"}, "a": "B", "d": "Difficult", "e": "0.51640e^(−t)sin(3.87298t). I(s) = 2/(s² + 2s + 16) = 2/[(s + 1)² + 15], so i(t) = (2/√15)e^(−t)sin(√15 t) = 0.51640e^(−t)sin(3.87298t). The current must start at zero (inductor), which rules out the cosine form in A."}, {"n": 90, "q": "What is a major advantage of solving a linear ODE with Laplace transforms instead of the classical method?", "c": {"A": "It works only for zero initial conditions", "B": "It eliminates the need for partial fractions", "C": "Initial conditions are included automatically in an algebraic solution", "D": "It gives only the steady-state solution"}, "a": "C", "d": "Easy", "e": "Initial conditions are included automatically in an algebraic solution. Laplace methods handle initial conditions directly and give the total response."}, {"n": 91, "q": "A stable system is driven by a step input. After a long time, what part of the total response remains?", "c": {"A": "The forced response", "B": "The natural response", "C": "The impulse response", "D": "The homogeneous response"}, "a": "A", "d": "Moderate", "e": "The forced response. The natural response of a stable system decays, leaving only the forced response."}, {"n": 92, "q": "An antenna commanded to a target oscillates about it with growing amplitude until the amplifiers saturate. What is the condition called?", "c": {"A": "Overdamped response", "B": "Steady-state error", "C": "Critical damping", "D": "Instability"}, "a": "D", "d": "Easy", "e": "Instability. A growing oscillation means the natural response grows without bound."}, {"n": 93, "q": "What does the form of a linear system's natural response depend on?", "c": {"A": "The input only", "B": "The input and the time of observation", "C": "The measuring instrument", "D": "The system's own structure and parameters"}, "a": "D", "d": "Moderate", "e": "The system's own structure and parameters. The form of the natural response depends on the system, while the forced response depends on the input."}, {"n": 94, "q": "A designer wants a system whose performance changes very little when component values drift with temperature. Which design objective is this?", "c": {"A": "Faster transient response", "B": "Low sensitivity (robust design)", "C": "Higher open-loop gain", "D": "Higher system order"}, "a": "B", "d": "Moderate", "e": "Low sensitivity (robust design). A robust design keeps performance nearly unchanged when parameters vary."}, {"n": 95, "q": "A target's commanded position follows ½at² (constant acceleration). Which standard test input represents it?", "c": {"A": "Impulse", "B": "Ramp", "C": "Parabola", "D": "Sinusoid"}, "a": "C", "d": "Moderate", "e": "Parabola. ½t²u(t) has a constant second derivative, which is a constant acceleration."}, {"n": 96, "q": "What is the typical effect of increasing the forward-path gain of a stable position control system?", "c": {"A": "Steady-state error typically decreases, but overshoot may increase", "B": "Steady-state error increases, and overshoot decreases", "C": "Both steady-state error and overshoot decrease", "D": "Both steady-state error and overshoot increase"}, "a": "A", "d": "Moderate", "e": "Steady-state error typically decreases, but overshoot may increase. Higher gain improves accuracy but can make the transient more oscillatory."}, {"n": 97, "q": "A disk drive cannot read or write until the head stops over the new track. Which specification most directly affects data access speed?", "c": {"A": "Steady-state accuracy", "B": "Sensitivity", "C": "Transient response", "D": "Computer cost"}, "a": "C", "d": "Moderate", "e": "Transient response. The head must settle on the track before reading starts, so the transient time governs access speed."}, {"n": 98, "q": "An elevator consistently stops 5 cm below the floor level. Which performance measure is deficient?", "c": {"A": "Steady-state error", "B": "Transient response", "C": "Stability", "D": "Sensitivity"}, "a": "A", "d": "Easy", "e": "Steady-state error. A persistent offset after settling is steady-state error."}, {"n": 99, "q": "A simulation of the antenna system shows oscillations that the model did not predict, and the model had neglected the armature inductance. What is the best next step?", "c": {"A": "Remove the sensor", "B": "Conclude that the hardware is faulty", "C": "Increase the gain", "D": "Revise the schematic to include the neglected effect"}, "a": "D", "d": "Difficult", "e": "Revise the schematic to include the neglected effect. If the model cannot explain the observed behavior, the neglected phenomenon is added back."}, {"n": 100, "q": "Why does the antenna schematic show only the armature resistance of the dc motor?", "c": {"A": "The motor has no inductance", "B": "It assumes the effect of armature inductance is negligible", "C": "The resistor is larger than the amplifier", "D": "The inductance cancels the viscous damping"}, "a": "B", "d": "Moderate", "e": "It assumes the effect of armature inductance is negligible. Only the resistance is kept as a simplifying assumption for a dc motor."}, {"n": 101, "q": "A load modeled with viscous damping has a resistive torque that:", "c": {"A": "Increases with speed", "B": "Is proportional to angle", "C": "Is constant regardless of speed", "D": "Is proportional to acceleration"}, "a": "A", "d": "Easy", "e": "Increases with speed. Viscous damping torque is proportional to angular velocity, like an automobile shock absorber."}, {"n": 102, "q": "Moving the term Ma to the left side so that the sum of forces equals zero gives a mechanical analogy with which electrical law?", "c": {"A": "Kirchhoff's current law", "B": "Ohm's law", "C": "Faraday's law", "D": "Kirchhoff's voltage law"}, "a": "D", "d": "Easy", "e": "Kirchhoff's voltage law. With Ma moved to the left, the sum of forces equals zero, which parallels the sum of voltages equaling zero."}, {"n": 103, "q": "A translational system has a mass of 2 kg, a viscous damper of 6 N·s/m, and a spring of 8 N/m, driven by force F. What is X(s)/F(s)?", "c": {"A": "1/(s² + 6s + 8)", "B": "1/(2s² + 6s + 8)", "C": "2/(s² + 6s + 8)", "D": "1/(2s² − 6s + 8)"}, "a": "B", "d": "Moderate", "e": "1/(2s² + 6s + 8). (Ms² + fv·s + K)X = F, so X/F = 1/(2s² + 6s + 8). A drops the mass coefficient, C is wrong, and D has a sign error."}, {"n": 104, "q": "For the system of Item 103, what are the natural frequency and damping ratio?", "c": {"A": "ωn = 4.00000 rad/s, ζ = 0.37500", "B": "ωn = 2.00000 rad/s, ζ = 1.50000", "C": "ωn = 2.00000 rad/s, ζ = 0.75000", "D": "ωn = 2.82843 rad/s, ζ = 1.06066"}, "a": "C", "d": "Difficult", "e": "ωn = 2.00000 rad/s, ζ = 0.75000. ωn = √(K/M) = √(8/2) = 2.00000 rad/s, and ζ = fv/(2√(KM)) = 6/(2 × 4) = 0.75000. The other choices come from using √K, K·M, or wrong denominators."}, {"n": 105, "q": "What is the s-domain impedance of a mass M in a translational mechanical system?", "c": {"A": "Ms", "B": "Ms²", "C": "M/s", "D": "M/s²"}, "a": "B", "d": "Easy", "e": "Ms². Impedance is force over displacement, which is Ms² for a mass, fv·s for a damper, and K for a spring."}, {"n": 106, "q": "A motor gear with 20 teeth drives a load gear with 80 teeth. The load inertia is 16 kg·m². What is the equivalent inertia referred to the motor shaft?", "c": {"A": "4.00000 kg·m²", "B": "256.00000 kg·m²", "C": "1.00000 kg·m²", "D": "0.25000 kg·m²"}, "a": "C", "d": "Difficult", "e": "1.00000 kg·m². Referred to the motor shaft, J = 16 × (20/80)² = 16 × 0.0625 = 1.00000. B inverts the ratio (16 × 16), and A uses the ratio unsquared."}, {"n": 107, "q": "An ideal gear train reduces the motor speed by a factor of 4 at the load. How does the load torque compare with the motor torque?", "c": {"A": "It is 4 times larger", "B": "It is 4 times smaller", "C": "It is the same", "D": "It is 16 times larger"}, "a": "A", "d": "Moderate", "e": "It is 4 times larger. An ideal gear reduction trades speed for torque, so torque increases by the same factor that speed decreases. Power is conserved."}, {"n": 108, "q": "Gear 1 has 30 teeth and gear 2 has 90 teeth. If gear 1 turns through 12 rad, how far does gear 2 turn?", "c": {"A": "36.00000 rad", "B": "12.00000 rad", "C": "0.33333 rad", "D": "4.00000 rad"}, "a": "D", "d": "Moderate", "e": "4.00000 rad. θ2/θ1 = N1/N2 = 30/90, so θ2 = 12/3 = 4.00000 rad. A multiplies by the inverse ratio."}, {"n": 109, "q": "The motor-and-load transfer function θo(s)/Ea(s) = 0.2083/[s(s + 1.71)] contains the factor s in the denominator. What does it indicate?", "c": {"A": "The motor has no friction", "B": "The system has no steady state", "C": "Output position is the integral of the motor speed", "D": "The input is a ramp"}, "a": "C", "d": "Moderate", "e": "Output position is the integral of the motor speed. The factor s in the denominator is an integration from speed to position."}, {"n": 110, "q": "A rotating inertia J = 2 kg·m² has viscous friction D = 4 N·m·s/rad and no spring. What is θ(s)/T(s)?", "c": {"A": "1/(2s² + 4s)", "B": "1/(2s + 4)", "C": "1/(2s² + 4)", "D": "2/(s² + 4s)"}, "a": "A", "d": "Moderate", "e": "1/(2s² + 4s). (Js² + Ds)θ = T, so θ/T = 1/(2s² + 4s). B is the transfer function of the angular velocity, not the angle."}, {"n": 111, "q": "A rotational system has J = 2, D = 4, and K = 6 (SI units). A constant torque of 12 N·m is applied and the transients die out. What is the steady-state angle?", "c": {"A": "6.00000 rad", "B": "0.50000 rad", "C": "3.00000 rad", "D": "2.00000 rad"}, "a": "D", "d": "Difficult", "e": "2.00000 rad. With the transients gone, the spring balances the torque: θ = T/K = 12/6 = 2.00000 rad. The damper and inertia carry no load at steady state."}, {"n": 112, "q": "Two blocks, 4/(s + 2) and 3/(s + 6), are connected in cascade. What is the overall transfer function?", "c": {"A": "7/(s + 8)", "B": "12/[(s + 2)(s + 6)]", "C": "12/(s + 8)", "D": "4/(s + 2) + 3/(s + 6)"}, "a": "B", "d": "Moderate", "e": "12/[(s + 2)(s + 6)]. Blocks in cascade multiply. Adding (D) is for parallel paths."}, {"n": 113, "q": "A negative feedback loop has G(s) = 20/(s + 4) in the forward path and H(s) = 0.5 in the feedback path. What is the closed-loop transfer function?", "c": {"A": "20/(s + 14)", "B": "20/(s + 24)", "C": "10/(s + 14)", "D": "20/(s − 6)"}, "a": "A", "d": "Difficult", "e": "20/(s + 14). T = G/(1 + GH) = [20/(s + 4)]/[1 + 10/(s + 4)] = 20/(s + 14). B ignores H, and D uses positive feedback."}, {"n": 114, "q": "Two blocks, 2/(s + 1) and 3/(s + 4), are connected in parallel with their outputs added. What is the equivalent transfer function?", "c": {"A": "6/[(s + 1)(s + 4)]", "B": "5/(s + 5)", "C": "(5s + 11)/[(s + 1)(s + 4)]", "D": "(5s + 6)/[(s + 1)(s + 4)]"}, "a": "C", "d": "Difficult", "e": "(5s + 11)/[(s + 1)(s + 4)]. Parallel blocks add: [2(s + 4) + 3(s + 1)]/[(s + 1)(s + 4)] = (5s + 11)/[(s + 1)(s + 4)]. A is the product."}, {"n": 115, "q": "In a unity negative feedback system, R = 10 and C = 7.5. What is the error E?", "c": {"A": "17.5", "B": "7.5", "C": "10", "D": "2.5"}, "a": "D", "d": "Easy", "e": "2.5. For negative unity feedback, E = R − C = 10 − 7.5 = 2.5."}, {"n": 116, "q": "What is the inverse Laplace transform of F(s) = (3s + 7)/[(s + 1)(s + 3)]?", "c": {"A": "e^(−t) + 2e^(−3t)", "B": "2e^(−t) + e^(−3t)", "C": "2e^(−t) − e^(−3t)", "D": "3e^(−t) + 7e^(−3t)"}, "a": "B", "d": "Difficult", "e": "2e^(−t) + e^(−3t). A = (3(−1) + 7)/(−1 + 3) = 2, and B = (3(−3) + 7)/(−3 + 1) = 1. So f(t) = 2e^(−t) + e^(−3t)."}, {"n": 117, "q": "What is the transfer function of an ideal integrator?", "c": {"A": "s", "B": "1/s", "C": "1/s²", "D": "1"}, "a": "B", "d": "Easy", "e": "1/s. Integration in time corresponds to division by s."}, {"n": 118, "q": "With zero initial conditions, what is the Laplace transform of 4·d²x/dt²?", "c": {"A": "4s²X(s)", "B": "4sX(s)", "C": "4X(s)/s²", "D": "s²X(s)/4"}, "a": "A", "d": "Moderate", "e": "4s²X(s). With zero initial conditions, each derivative multiplies by s, and the constant 4 stays."}, {"n": 119, "q": "Solve dx/dt + 2x = 6e^(−t) with x(0) = 0. What is x(1)?", "c": {"A": "2.20728", "B": "0.81201", "C": "1.39526", "D": "0.23254"}, "a": "C", "d": "Difficult", "e": "1.39526. X = 6/[(s + 1)(s + 2)] = 6/(s + 1) − 6/(s + 2), so x(t) = 6(e^(−t) − e^(−2t)). At t = 1: 6(0.36788 − 0.13534) = 6(0.23254) = 1.39526. A is 6e^(−1), and B is 6e^(−2)."}, {"n": 120, "q": "Two ideal inverting op-amp stages with gains −5 and −2 are cascaded. What is the overall gain?", "c": {"A": "−10", "B": "−7", "C": "+7", "D": "+10"}, "a": "D", "d": "Moderate", "e": "+10. Cascaded gains multiply: (−5)(−2) = +10."}, {"n": 121, "q": "A series RC circuit has R = 1 kΩ and C = 1 mF, and the output is taken across the resistor. What is Vo(s)/Vi(s)?", "c": {"A": "1/(s + 1)", "B": "1/[s(s + 1)]", "C": "s/(s + 1)", "D": "(s + 1)/s"}, "a": "C", "d": "Moderate", "e": "s/(s + 1). Vo/Vi = R/(R + 1/(Cs)) = RCs/(RCs + 1), with RC = 1 s, giving s/(s + 1). A is the output across the capacitor."}, {"n": 122, "q": "A source drives a 3 kΩ resistor in series with a 1 kΩ resistor, and the output is taken across the 1 kΩ resistor. What is the voltage gain?", "c": {"A": "0.75000", "B": "3.00000", "C": "0.33333", "D": "0.25000"}, "a": "D", "d": "Easy", "e": "0.25000. This is a voltage divider: 1/(3 + 1) = 0.25000."}, {"n": 123, "q": "A two-stage RC ladder has R1 = R2 = 1 Ω and C1 = C2 = 1 F, and the second stage loads the first. What is Vo(s)/Vi(s)?", "c": {"A": "1/(s² + 3s + 1)", "B": "1/(s² + 2s + 1)", "C": "1/(s² + s + 1)", "D": "1/(s² + 4s + 1)"}, "a": "A", "d": "Difficult", "e": "1/(s² + 3s + 1). Vo/Vi = 1/[R1R2C1C2·s² + (R1C1 + R2C2 + R1C2)s + 1] = 1/(s² + 3s + 1). B ignores the loading of the second stage (1/(s + 1)²)."}, {"n": 124, "q": "A series loop contains R = 2 Ω, L = 1 H, and C = 0.25 F, driven by Vi(s). What is I(s)/Vi(s)?", "c": {"A": "(s² + 2s + 4)/s", "B": "s/(s² + 2s + 4)", "C": "1/(s² + 2s + 4)", "D": "4s/(s² + 2s + 4)"}, "a": "B", "d": "Difficult", "e": "s/(s² + 2s + 4). Z = R + Ls + 1/(Cs) = 2 + s + 4/s = (s² + 2s + 4)/s, and I/Vi = 1/Z. A is Z itself."}, {"n": 125, "q": "Nodal analysis of a network is based on which law?", "c": {"A": "Ohm's law only", "B": "Kirchhoff's voltage law", "C": "Newton's third law", "D": "Kirchhoff's current law"}, "a": "D", "d": "Easy", "e": "Kirchhoff's current law. Nodal analysis sums the currents at each node to zero."}, {"n": 126, "q": "What is the s-domain admittance of a 0.5 Ω resistor in parallel with a 2 F capacitor?", "c": {"A": "0.5 + 2s", "B": "2 + 2s", "C": "2 + 1/(2s)", "D": "0.5 + 0.5s"}, "a": "B", "d": "Moderate", "e": "2 + 2s. Admittances in parallel add: 1/R = 2 and Cs = 2s."}, {"n": 127, "q": "A non-inverting op-amp has Z1 = 10 kΩ to ground and Z2 = a 1 µF capacitor in the feedback path. What is Vo(s)/Vi(s)?", "c": {"A": "100/s", "B": "−(s + 100)/s", "C": "(s + 100)/s", "D": "(s + 0.01)/s"}, "a": "C", "d": "Difficult", "e": "(s + 100)/s. G = (Z1 + Z2)/Z1 = 1 + Z2/Z1 = 1 + [1/(10⁻⁶ s)]/10⁴ = 1 + 100/s = (s + 100)/s. A forgets the 1, and B has the inverting sign."}, {"n": 128, "q": "An inverting op-amp has Z1 = a 100 kΩ resistor in parallel with a 1 µF capacitor, and Zf = a 200 kΩ resistor. What is Vo(s)/Vi(s)?", "c": {"A": "−(0.2s + 2)", "B": "−2/(0.1s + 1)", "C": "−(0.1s + 1)/2", "D": "(0.2s + 2)"}, "a": "A", "d": "Difficult", "e": "−(0.2s + 2). Z1 = R/(1 + RCs) = 100k/(1 + 0.1s), so G = −Zf/Z1 = −200k(1 + 0.1s)/100k = −(2 + 0.2s). B inverts the roles of Z1 and Zf."}, {"n": 129, "q": "An ideal inverting op-amp has R1 = 1 kΩ and R2 = 5 kΩ (feedback). If the input is +2 V, what is the output?", "c": {"A": "−10 V", "B": "+10 V", "C": "−0.4 V", "D": "+0.4 V"}, "a": "A", "d": "Easy", "e": "−10 V. Vo = −(R2/R1)Vi = −5 × 2 = −10 V."}, {"n": 130, "q": "Which op-amp characteristic lets it drive a following stage without being loaded down?", "c": {"A": "High input impedance", "B": "Differential input", "C": "Low output impedance", "D": "Constant gain"}, "a": "C", "d": "Easy", "e": "Low output impedance. A low output impedance lets the stage drive a load with little drop in voltage."}, {"n": 131, "q": "A two-tank process has two valves as inputs and two interacting liquid levels as outputs. Which modeling approach is most suitable?", "c": {"A": "A single scalar transfer function", "B": "State-space equations (multi-input, multi-output)", "C": "A single first-order differential equation", "D": "A step-response table only"}, "a": "B", "d": "Moderate", "e": "State-space equations (multi-input, multi-output). A single transfer function handles only one input and one output."}, {"n": 132, "q": "A fourth-order system is represented in state space. How many simultaneous first-order equations are needed?", "c": {"A": "1", "B": "2", "C": "8", "D": "4"}, "a": "D", "d": "Easy", "e": "4. An nth-order system needs n first-order equations."}, {"n": 133, "q": "Why is differentiating the input signal avoided in physical implementations of a model?", "c": {"A": "It raises the cost of the plant", "B": "Differentiation amplifies noise", "C": "It violates Kirchhoff's laws", "D": "It makes the system nonlinear"}, "a": "B", "d": "Moderate", "e": "Differentiation amplifies noise. Differentiating an input in a physical system magnifies high-frequency noise."}, {"n": 134, "q": "A 4-floor command produces a fast, smooth step response that settles at floor 3.8 and stays there. Which diagnosis is correct?", "c": {"A": "The system is unstable", "B": "The transient is poor, but the steady-state error is zero", "C": "The system is operating open-loop by definition", "D": "The transient is good, but a steady-state error of 0.2 floor must be corrected"}, "a": "D", "d": "Difficult", "e": "The transient is good, but a steady-state error of 0.2 floor must be corrected. The response is fast and smooth and does not diverge, but it does not reach the command."}, {"n": 135, "q": "In a home heating system, the bimetallic strip in the thermostat serves as the:", "c": {"A": "Sensor and switching element", "B": "Furnace", "C": "Output transducer for the burner", "D": "Plant"}, "a": "A", "d": "Moderate", "e": "Sensor and switching element. The bimetal senses the temperature and moves the mercury switch to turn the heater on or off."}, {"n": 136, "q": "A closed-loop toaster oven measures tress", "D": "Transient response only matters for open-loop systems"}, "a": "A", "d": "Easy", "e": "A very fast response can stress the structure, while a very slow one frustrates users. The transient response must balance speed against comfort, safety, and mechanical stress."}, {"n": 142, "q": "Why does a designer start with a reasonably simplified model?", "c": {"A": "Complex models can never be tested", "B": "Simplified models are always exact", "C": "It keeps the model manageable, and the assumptions are checked later", "D": "It removes the need for simulation"}, "a": "C", "d": "Moderate", "e": "It keeps the model manageable, and the assumptions are checked later. Simple models give insight first and are refined if the assumptions fail."}, {"n": 143, "q": "In a simulation of a closed-loop position system, you raise the controller gain. What do you most likely observe?", "c": {"A": "A slower rise with less overshoot", "B": "No change in the response", "C": "A faster rise with no change in the error", "D": "A faster rise, more overshoot, and a smaller steady-state error"}, "a": "D", "d": "Moderate", "e": "A faster rise, more overshoot, and a smaller steady-state error. This is the standard effect of raising the loop gain."}, {"n": 144, "q": "A technician raises the amplifier gain to reduce steady-state error. The antenna now overshoots heavily and rings for a long time before settling on target. Which analysis is most appropriate?", "c": {"A": "The system is unstable because it rings", "B": "Gain trades transient response against accuracy, so a compensator may be needed", "C": "The sensor has failed", "D": "The natural response has become the forced response"}, "a": "B", "d": "Difficult", "e": "Gain trades transient response against accuracy, so a compensator may be needed. The antenna still settles, so the system is stable (A), and a compensator can improve both objectives."}, {"n": 145, "q": "Lyapunov extended the stability work of Routh to which kind of system?", "c": {"A": "Digital systems", "B": "Ship steering systems", "C": "Nonlinear systems", "D": "Multi-loop systems"}, "a": "C", "d": "Easy", "e": "Nonlinear systems. Lyapunov extended Routh's stability work to nonlinear systems in his doctoral thesis."}, {"n": 146, "q": "The water clock of Ktesibios and the oil lamp of Philon are early examples of which type of control?", "c": {"A": "Speed control", "B": "Liquid-level control", "C": "Temperature control", "D": "Pressure control"}, "a": "B", "d": "Easy", "e": "Liquid-level control. Both devices keep a liquid level constant."}, {"n": 147, "q": "Why were the reaction control system jets used in the exoatmosphere on the space shuttle?", "c": {"A": "Aerosurfaces are ineffective there", "B": "The jets are cheaper than aerosurfaces", "C": "They need no computers", "D": "There are no disturbances in space"}, "a": "A", "d": "Moderate", "e": "Aerosurfaces are ineffective there. In the exoatmosphere there is no air for the aerosurfaces to act on, so jets are used until the orbiter descends."}, {"n": 148, "q": "Wind rotates a shuttle's elevon away from its commanded position. How is the position restored?", "c": {"A": "By a larger input command", "B": "By removing the sensor", "C": "By turning off the computer", "D": "By a feedback control system that senses and corrects the position"}, "a": "D", "d": "Moderate", "e": "By a feedback control system that senses and corrects the position. The elevon's position loop measures the actual angle and drives it back to the commanded value."}, {"n": 149, "q": "What is the Laplace transform of cos 5t·u(t)?", "c": {"A": "5/(s² + 25)", "B": "s/(s² − 25)", "C": "1/(s² + 25)", "D": "s/(s² + 25)"}, "a": "D", "d": "Easy", "e": "s/(s² + 25). L{cos ωt} = s/(s² + ω²), with ω = 5. A is the sine transform form."}, {"n": 150, "q": "Solve x″ + 4x′ + 3x = 6u(t) with zero initial conditions. What is x(1)?", "c": {"A": "0.94615", "B": "1.10364", "C": "0.89636", "D": "1.94615"}, "a": "A", "d": "Difficult", "e": "0.94615. X = 6/[s(s + 1)(s + 3)] = 2/s − 3/(s + 1) + 1/(s + 3), so x(t) = 2 − 3e^(−t) + e^(−3t). At t = 1: 2 − 1.10364 + 0.04979 = 0.94615. B is the 3e^(−1) term alone, C leaves out e^(−3), and D adds instead of subtracting."}];
const KEY = 'cs-exam-v1';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byN = {}; Q.forEach(q => byN[q.n] = q);
let S = null, UI = {diff:'All', count:'All', mode:'practice', shuffle:false};
try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e) { S = null; }
if (S && !S.order) S = null;
let timerId = null;

function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function elapsed(){ return S ? Math.floor((S.acc || 0) + (S.done || !S.t0 ? 0 : (Date.now() - S.t0)/1000)) : 0; }
function fmt(t){ const h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60; return (h?h+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
function list(){ if(!S.done || !S.rev || S.rev==='all') return S.order;
  return S.order.filter(n => S.rev==='wrong' ? S.ans[n]!==byN[n].a : S.rev==='flag' ? S.flag[n] : true); }
function graded(n){ return S.done || (S.mode==='practice' && S.ans[n]); }
function startSession(order, mode){
  S = {mode, order, ans:{}, flag:{}, pos:0, done:false, acc:0, t0:Date.now(), rev:'all', confirm:false}; save(); render(); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function render(){
  clearInterval(timerId);
  if(!S) return renderStart();
  renderQuiz();
  if(!S.done) timerId = setInterval(() => { const t=$('#timer'); if(t) t.textContent = fmt(elapsed()); }, 1000);
}

function renderStart(){
  const diffs = ['All','Easy','Moderate','Difficult'];
  const pool = UI.diff==='All' ? Q : Q.filter(q => q.d===UI.diff);
  const counts = ['All', 100, 50, 25, 10].filter(c => c==='All' || c < pool.length);
  if(!counts.includes(UI.count)) UI.count='All';
  $('#app').innerHTML = `
  <header class="top"><h1>Control Systems<small>150-item multiple-choice examination</small></h1></header>
  <div class="card" style="max-width:720px">
    ${S && !S.done ? '' : ''}
    <p style="margin-top:0">Questions cover feedback control fundamentals, Laplace transforms, transfer functions, electrical networks, op-amps, and basic mechanical modeling. Difficulty is mixed across the exam.</p>
    <label class="f">Mode</label>
    <div class="row">
      <button class="chip ${UI.mode==='practice'?'on':''}" data-mode="practice">Practice — feedback after each answer</button>
      <button class="chip ${UI.mode==='exam'?'on':''}" data-mode="exam">Exam — answers revealed at the end</button>
    </div>
    <label class="f">Difficulty</label>
    <div class="row">${diffs.map(d=>`<button class="chip ${UI.diff===d?'on':''}" data-diff="${d}">${d}</button>`).join('')}</div>
    <label class="f">Number of questions</label>
    <div class="row"><select id="cnt">${counts.map(c=>`<option value="${c}" ${String(UI.count)===String(c)?'selected':''}>${c==='All'?'All ('+pool.length+')':c}</option>`).join('')}</select>
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="shf" ${UI.shuffle?'checked':''}> Shuffle question order</label></div>
    <div class="ctrl"><button class="btn pri" id="go">Start</button></div>
  </div>`;
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { UI.mode=b.dataset.mode; renderStart(); });
  document.querySelectorAll('[data-diff]').forEach(b => b.onclick = () => { UI.diff=b.dataset.diff; renderStart(); });
  $('#cnt').onchange = e => { UI.count=e.target.value; };
  $('#shf').onchange = e => { UI.shuffle=e.target.checked; };
  $('#go').onclick = () => {
    let ns = pool.map(q => q.n);
    const want = UI.count==='All' ? ns.length : parseInt(UI.count,10);
    if(UI.shuffle || want < ns.length){ shuffle(ns); ns = ns.slice(0,want); if(!UI.shuffle) ns.sort((a,b)=>a-b); }
    startSession(ns, UI.mode);
  };
}

function stats(){
  let ok=0, wrong=0, skip=0; const by={Easy:[0,0],Moderate:[0,0],Difficult:[0,0]};
  S.order.forEach(n => { const q=byN[n]; by[q.d][1]++;
    if(!S.ans[n]) skip++; else if(S.ans[n]===q.a){ ok++; by[q.d][0]++; } else wrong++; });
  return {ok, wrong, skip, by, total:S.order.length};
}

function renderQuiz(){
  const L = list();
  if(!L.length){ S.rev='all'; save(); return render(); }
  if(S.pos >= L.length) S.pos = L.length-1;
  const n = L[S.pos], q = byN[n], g = graded(n), sel = S.ans[n];
  const st = stats(); const answered = st.ok+st.wrong;
  const nav = L.map((m,i) => {
    let c=[]; if(i===S.pos) c.push('cur'); if(S.flag[m]) c.push('fl');
    if(graded(m)) c.push(S.ans[m]===byN[m].a ? 'ok' : (S.ans[m] ? 'no' : '')); else if(S.ans[m]) c.push('ans');
    return `<button class="${c.join(' ')}" data-i="${i}" title="Question ${m}">${m}</button>`; }).join('');
  const head = S.done
    ? `<span class="pill">Review</span><button class="btn sm" id="toRes">Results</button>`
    : `<span class="pill" id="timer">${fmt(elapsed())}</span><span class="pill">${answered}/${st.total} answered</span>`;
  $('#app').innerHTML = `
  <header class="top"><h1>Control Systems<small>${S.mode==='exam'?'Exam mode':'Practice mode'}</small></h1>${head}
    <button class="btn sm" id="quit">${S.done?'New attempt':'Quit'}</button></header>
  <div class="grid">
    <aside class="card nav"><h3>Questions</h3><div class="nums">${nav}</div>
      <div class="legend">Dot = flagged${S.mode==='exam'&&!S.done?' · Blue = answered':' · Green/red = correct/incorrect'}</div></aside>
    <main class="card">
      <div class="qhead"><span class="qno">Q${q.n}</span>${g?`<span class="badge ${q.d}">${q.d}</span>`:''}
        <span class="pill" style="margin-left:auto">${S.pos+1} of ${L.length}</span></div>
      <p class="qtext">${esc(q.q)}</p>
      <div class="opts">${['A','B','C','D'].map(k => {
        let c='opt'; if(g){ if(k===q.a) c+=' ok'; else if(k===sel) c+=' no'; } else if(k===sel) c+=' sel';
        return `<button class="${c}" data-k="${k}" ${g?'disabled':''}><span class="L">${k}</span><span>${esc(q.c[k])}</span></button>`; }).join('')}</div>
      ${g ? `<p class="verdict ${sel===q.a?'ok':'no'}">${!sel?'Not answered — correct answer: '+q.a:sel===q.a?'Correct':'Incorrect — you chose '+sel+', correct answer is '+q.a}</p>
        <div class="expl"><b>Answer ${q.a}</b> — ${esc(q.e)}</div>` : ''}
      <div class="ctrl">
        <button class="btn" id="prev" ${S.pos===0?'disabled':''}>← Prev</button>
        <button class="btn" id="next" ${S.pos===L.length-1?'disabled':''}>Next →</button>
        ${S.done?'':`<button class="btn" id="flag">${S.flag[n]?'Unflag':'Flag'}</button>`}
        <span class="sp"></span>
        ${S.done?'':`<button class="btn pri" id="fin">Finish</button>`}
      </div>
      ${S.confirm && !S.done ? `<div class="warn">${st.skip>0?`You have <b>${st.skip}</b> unanswered question${st.skip>1?'s':''}. `:''}Submit the ${S.mode} now?
        <div class="ctrl"><button class="btn pri sm" id="yes">Submit</button><button class="btn sm" id="no">Keep going</button></div></div>`:''}
    </main>
  </div>`;
  document.querySelectorAll('.nums button').forEach(b => b.onclick = () => { S.pos=+b.dataset.i; S.confirm=false; save(); renderQuiz(); });
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(n, b.dataset.k));
  $('#prev').onclick = () => go(-1); $('#next').onclick = () => go(1);
  if($('#flag')) $('#flag').onclick = () => { S.flag[n] ? delete S.flag[n] : S.flag[n]=1; save(); renderQuiz(); };
  if($('#fin')) $('#fin').onclick = () => { S.confirm=true; renderQuiz(); };
  if($('#yes')) $('#yes').onclick = finish;
  if($('#no')) $('#no').onclick = () => { S.confirm=false; renderQuiz(); };
  if($('#toRes')) $('#toRes').onclick = renderResults;
  $('#quit').onclick = () => { if(S.done){ S=null; try{localStorage.removeItem(KEY)}catch(e){} render(); } else { S.confirm=true; renderQuiz(); } };
}
function choose(n,k){ if(graded(n)) return; S.ans[n]=k; save(); renderQuiz(); }
function go(d){ const L=list(); S.pos=Math.max(0,Math.min(L.length-1,S.pos+d)); S.confirm=false; save(); renderQuiz(); window.scrollTo(0,0); }
function finish(){ S.acc = elapsed(); S.done=true; S.confirm=false; S.rev='all'; S.pos=0; save(); clearInterval(timerId); renderResults(); }

function renderResults(){
  clearInterval(timerId);
  const st = stats(), pct = (st.ok/st.total*100);
  const wrongNs = S.order.filter(n => S.ans[n] && S.ans[n]!==byN[n].a);
  const missed = S.order.filter(n => S.ans[n]!==byN[n].a);
  $('#app').innerHTML = `
  <header class="top"><h1>Control Systems<small>Results</small></h1><span class="pill">Time ${fmt(S.acc)}</span></header>
  <div class="card">
    <div class="score">${st.ok}/${st.total}</div>
    <p class="note" style="font-size:16px">${pct.toFixed(5).replace(/0+$/,'').replace(/\.$/,'')}% correct</p>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="stats">
      <div class="stat"><span>Correct</span><b>${st.ok}</b></div>
      <div class="stat"><span>Incorrect</span><b>${st.wrong}</b></div>
      <div class="stat"><span>Unanswered</span><b>${st.skip}</b></div>
      ${['Easy','Moderate','Difficult'].filter(d=>st.by[d][1]).map(d=>`<div class="stat"><span>${d}</span><b>${st.by[d][0]}/${st.by[d][1]}</b></div>`).join('')}
    </div>
    <div class="ctrl" style="margin-top:6px">
      <button class="btn pri" id="rall">Review all</button>
      <button class="btn" id="rwrong" ${missed.length?'':'disabled'}>Review missed (${missed.length})</button>
      <button class="btn" id="rflag" ${Object.keys(S.flag).length?'':'disabled'}>Review flagged</button>
      <button class="btn" id="retake" ${missed.length?'':'disabled'}>Retake missed</button>
      <button class="btn" id="again">New attempt</button>
    </div>
  </div>`;
  const rev = f => () => { S.rev=f; S.pos=0; save(); renderQuiz(); };
  $('#rall').onclick = rev('all'); $('#rwrong').onclick = rev('wrong'); $('#rflag').onclick = rev('flag');
  $('#retake').onclick = () => startSession(missed.slice(), S.mode);
  $('#again').onclick = () => { S=null; try{localStorage.removeItem(KEY)}catch(e){} render(); };
}

document.addEventListener('keydown', e => {
  if(!S || e.target.tagName==='SELECT' || e.ctrlKey || e.metaKey) return;
  const k = e.key.toUpperCase();
  if(!$('.opts')) return;
  if(['A','B','C','D'].includes(k)){ const L=list(); choose(L[S.pos], k); }
  else if(e.key==='ArrowRight') go(1); else if(e.key==='ArrowLeft') go(-1);
});
if(S && S.done) renderResults(); else { if(S) S.t0=Date.now(); render(); }
</script>
</body>
</html>
