tes' famous principle, translated as \"I think, therefore I am.\"","acceptableAnswers":["COGITO ERGO SUM","COGITO, ERGO SUM"],"explanation":"This became foundational to the Enlightenment's belief that people could understand the world through reason rather than tradition or religious authority."},{"id":"d_id18","prompt":"John Locke's principle that a government's authority is only legitimate if the people being governed agree to be ruled by it.","acceptableAnswers":["CONSENT OF THE GOVERNED"],"explanation":"Locke argued political power originates from the people, not divine right — the philosophical foundation of democratic legitimacy."},{"id":"d_id19","prompt":"Adam Smith's idea that individuals pursuing self-interest in a free market unintentionally benefit society, making state control unnecessary.","acceptableAnswers":["INVISIBLE HAND","THE INVISIBLE HAND"],"explanation":"This became the intellectual backbone of classical liberalism, directly challenging mercantilism's state-controlled trade."},{"id":"d_id20","prompt":"Max Weber's concept describing how modern society's obsession with efficiency and bureaucratic rules traps individuals in rigid, inescapable systems.","acceptableAnswers":["IRON CAGE","THE IRON CAGE"],"explanation":"Weber originally used it to explain how the Protestant work ethic became an end in itself, stripped of its original spiritual meaning."},{"id":"d_id21","prompt":"George Ritzer's concept describing how fast-food principles have spread into more and more sectors of modern life.","acceptableAnswers":["MCDONALDIZATION","MCDONALDIZATION OF SOCIETY"],"explanation":"Ritzer calls the downside the 'irrationality of rationality' — efficient systems that can still feel dehumanizing."},{"id":"d_id22","prompt":"Marshall McLuhan's concept describing how mass media makes the world feel like one connected community sharing similar values.","acceptableAnswers":["GLOBAL VILLAGE","THE GLOBAL VILLAGE"],"explanation":"McLuhan argued television (and later other media) would create this shared global culture, often Western in character."},{"id":"d_id23","prompt":"The global spread of South Korean pop culture, particularly K-pop music and K-dramas.","acceptableAnswers":["KOREAN WAVE","K-WAVE","THE KOREAN WAVE"],"explanation":"It's used as a case study on whether media results in cultural homogenization, showing a non-Western culture successfully exporting its own values."},{"id":"d_id24","prompt":"A social and economic pattern where acquiring and consuming goods and services becomes a central driver of identity, status, and lifestyle.","acceptableAnswers":["CONSUMERISM"],"explanation":"Driven by media/advertising and globalized production, enabled by a constant stream of cheap, desirable products."},{"id":"d_id25","prompt":"The UN body with 15 members, five of which are permanent and hold veto power, primarily responsible for maintaining international peace and security.","acceptableAnswers":["UNITED NATIONS SECURITY COUNCIL","UN SECURITY COUNCIL","SECURITY COUNCIL"],"explanation":"Its five permanent members (US, UK, France, Russia, China) can each block a resolution with a single veto."}],"mcq":[{"id":"d_mcq1","prompt":"Which best explains why hunting-gathering societies were largely egalitarian, with no formal rulers?","options":["They had access to abundant private land ownership","Food was perishable, so no one could accumulate enough wealth to dominate others","They were protected by a central government","Hunting alone provided enough food to keep everyone equally fed"],"correctIndex":1,"explanation":"Since food couldn't be stored or accumulated, no one could build lasting wealth or power — decisions were made collectively instead."},{"id":"d_mcq2","prompt":"A classmate says: 'Feudalism and mercantilism are basically the same thing because both involve trade.' What is wrong with this statement?","options":["Nothing is wrong with the statement","Feudalism is a land-based system of lords and peasants, while mercantilism is a trade-based system of maximizing exports over imports — related, but distinct","Feudalism is actually the trade system, not mercantilism","Mercantilism has nothing to do with the economy at all"],"correctIndex":1,"explanation":"Feudalism organizes society around land ownership and tenancy; mercantilism organizes international trade around a nation maximizing exports over imports. They coincided historically but describe different things."},{"id":"d_mcq3","prompt":"Why are secularization and the Scientific Revolution both considered part of the 'rationalization of society'?","options":["Both completely eliminated religion from society","Both reflect a shift toward explaining and governing the world through reason and evidence rather than religious tradition","They are unrelated processes that happened in completely different centuries","Both were caused directly by the invention of the steam engine"],"correctIndex":1,"explanation":"Secularization reduced religion's influence on government, while the Scientific Revolution favored observation and experimentation — together, they describe society becoming more reason-based."},{"id":"d_mcq4","prompt":"A scholar argues that Europe's Enlightenment and Industrial Revolution were partly funded by wealth and labor extracted from its colonies. Whose argument does this best reflect?","options":["Adam Smith","Walter Mignolo","John Locke","Marshall McLuhan"],"correctIndex":1,"explanation":"Mignolo argues colonialism was the 'pivoting point' of European modernity, not separate from it — mainstream narratives often leave this out."},{"id":"d_mcq5","prompt":"Which pair correctly matches a concept with the thinker who proposed it?","options":["Consent of the Governed — John Locke","Invisible Hand — Max Weber","Iron Cage — Adam Smith","Cogito, ergo sum — John Locke"],"correctIndex":0,"explanation":"Locke proposed Consent of the Governed. (Invisible Hand is Adam Smith's; Iron Cage is Max Weber's; Cogito, ergo sum is Descartes'.)"},{"id":"d_mcq6","prompt":"Why is the Treaty of Westphalia (1648) considered foundational to the modern nation-state system?","options":["It eliminated the concept of nationhood entirely","It created the United Nations","It formally recognized states' sovereignty over their own domestic affairs","It established mercantilism as the dominant global economic system"],"correctIndex":2,"explanation":"Westphalia made the state 'prime' over the nation by recognizing each state's control over its own internal affairs — the foundation of today's nation-state system."},{"id":"d_mcq7","prompt":"A developing country, after receiving a World Bank loan under a Structural Adjustment Program, is required to cut public spending, sell off state-owned industries, and open its markets to foreign trade. This is an example of:","options":["Keynesianism","Mercantilism","Neoliberal austerity policy","Socialist internationalism"],"correctIndex":2,"explanation":"SAPs are a neoliberal tool, pushing privatization, deregulation, and spending cuts — the core of the Washington Consensus."},{"id":"d_mcq8","prompt":"Which of the following is an example of socialist internationalism rather than liberal internationalism?","options":["The League of Nations","The United Nations","The Communist International (ComIntern)","The World Trade Organization"],"correctIndex":2,"explanation":"The ComIntern (1919–1943) promoted a classless, stateless global society — the historical example of socialist internationalism, unlike the cooperative-nation-state model of the League of Nations, UN, and WTO."},{"id":"d_mcq9","prompt":"A food delivery app standardizes every order into a fast, predictable, trackable process, minimizing human judgment in favor of speed and consistency. This illustrates:","options":["McDonaldization","The Iron Cage","Secularization","The Invisible Hand"],"correctIndex":0,"explanation":"McDonaldization describes exactly this spread of fast-food-style efficiency, predictability, and control into more areas of modern life."},{"id":"d_mcq10","prompt":"Which best illustrates the 'Global Village' concept in the contemporary world?","options":["A remote village with no access to electricity or media","Global pop culture trends like K-pop spreading instantly across borders and shaping tastes worldwide","A country that has completely banned foreign media","Two isolated communities with no means of communication"],"correctIndex":1,"explanation":"McLuhan argued mass media would make the world feel like one connected 'village' — exactly what global trends like K-pop demonstrate today."}],"recollection":[{"id":"d_rec1","prompt":"Name Henslin's Social Revolutions, in order (name at least 4 of the 5, including the proposed one).","acceptableAnswers":["domestication","agricultural","industrial","information","biotech"],"minHits":4,"explanation":"Domestication → Agricultural (plow) → Industrial (steam engine) → Information (microchip) → proposed Biotech (genome decoding)."},{"id":"d_rec2","prompt":"Name the three 'sui generis' powers of international organizations.","acceptableAnswers":["classification","definition","norm diffusion"],"minHits":3,"explanation":"The power of classification, the power of definition, and the power of norm diffusion — e.g. the WHO declaring pandemics, setting health standards, and spreading vaccination guidelines."},{"id":"d_rec3","prompt":"Name the three zones in Wallerstein's World Systems Theory.","acceptableAnswers":["core","semi-periphery","periphery"],"minHits":3,"explanation":"Core (rich, industrialized), semi-periphery (partly industrialized, both exploits and is exploited), and periphery (non-industrialized, supplies cheap labor/raw materials)."},{"id":"d_rec4","prompt":"Name at least 3 of the 'Great Powers' that formed the Concert of Europe after Napoleon's defeat.","acceptableAnswers":["united kingdom","austria","russia","prussia"],"minHits":3,"explanation":"The UK, Austria, Russia, and Prussia formed the Concert of Europe (1815–1914) to restore the pre-Revolution monarchy and feudal order."},{"id":"d_rec5","prompt":"Name the two broad categories of internationalism discussed in class.","acceptableAnswers":["liberal internationalism","socialist internationalism"],"minHits":2,"explanation":"Liberal internationalism (cooperative nation-states, e.g. League of Nations) and socialist internationalism (classless/stateless society, e.g. ComIntern)."}]}};
const CARDS=[{"module":"Module I — Social Transformation","term":"Domestication Social Revolution","explanation":"The first big shift where people learned to tame animals or grow plants instead of only foraging.","details":["Dry regions → pastoral societies (herding, stayed nomadic)","Fertile regions → horticultural societies (farming, could finally settle down)","Henslin's First Social Revolution"]},{"module":"Module I — Social Transformation","term":"Agricultural Revolution","explanation":"The invention of the plow (~5,000–6,000 years ago), which massively increased food and time surplus.","details":["Henslin's Second Social Revolution","Called the 'Dawn of Civilization'","Surplus → cities, writing, math, calendar, specialists"]},{"module":"Module I — Social Transformation","term":"Industrial Revolution","explanation":"Began in Great Britain in 1765 with the steam engine, shifting production from farms to factories.","details":["Steam engine didn't need human/animal power","Feudalism collapsed; peasants moved to cities","Eventually led to capitalism and democracy"]},{"module":"Module I — Social Transformation","term":"Feudalism","explanation":"A land-based system where lords owned land and peasants/serfs farmed it for protection or a share of the harvest.","details":["Started once private land ownership began","Made social inequality structural","Philippine example: the hacienda system"]},{"module":"Module I — Social Transformation","term":"Age of Information","explanation":"Today's economy runs mainly on information, not raw materials or factory goods.","details":["Teachers, lawyers, doctors provide knowledge as a service","Triggered by the microchip","Henslin's Fourth Social Revolution"]},{"module":"Module I — Social Transformation","term":"Gemeinschaft & Gesellschaft","explanation":"Ferdinand Tönnies's terms describing the shift from traditional rural community to impersonal urban society.","details":["Gemeinschaft = rural, close-knit, traditional","Gesellschaft = urban, individualistic, impersonal","Part of the Traditional-Modern Model"]},{"module":"Module I — Social Transformation","term":"Cartesian \"I\" (Cogito, ergo sum)","explanation":"Descartes' idea that the one thing you can be sure of is your own thinking mind.","details":["\"I think, therefore I am\"","Made individual reason the basis of knowledge","Foundation of the Enlightenment"]},{"module":"Module I — Social Transformation","term":"Consent of the Governed","explanation":"John Locke's idea that government is only legitimate if the people agree to be ruled by it.","details":["Power comes from the people, not kings","Foundation of democratic legitimacy","Fueled the shift from monarchy to democracy"]},{"module":"Module I — Social Transformation","term":"Invisible Hand","explanation":"Adam Smith's idea that self-interest in a free market ends up benefiting society as a whole.","details":["Markets regulate themselves without state control","Foundation of classical liberalism / laissez-faire","Directly opposed mercantilism"]},{"module":"Module I — Social Transformation","term":"French Revolution (1789)","explanation":"A major driver of modernity alongside the Enlightenment and Industrial Revolution.","details":["\"Liberty, Equality, Fraternity\"","Overturned the monarchy and feudal order","Spread via the Napoleonic Wars/Code"]},{"module":"Module I — Social Transformation","term":"Democratization of the Public Sphere","explanation":"Political power shifted from the elite/landowners to ordinary people during the Industrial Revolution.","details":["Driven by feudalism's collapse + rise of industrial wealth","Included workers' and women's rights movements","Led to expanded voting rights, jury trials"]},{"module":"Module I — Social Transformation","term":"Urbanization","explanation":"Work shifted from farms to city factories, pulling displaced peasants into cities for wage labor.","details":["Matches the course's 'thick internal migration'","Direct effect of the Industrial Revolution","Packed more people into cities than ever before"]},{"module":"Module I — Social Transformation","term":"Iron Cage","explanation":"Max Weber's idea that modern society's rules and efficiency trap people in rigid systems.","details":["Came from how the Protestant work ethic became an end in itself","Example: strict schedules/paperwork we must follow","A critique of over-rationalized modern life"]},{"module":"Module I — Social Transformation","term":"Secularization","explanation":"Religion has less influence over government decisions and public life.","details":["Half of the 'rationalization of society'","Driven by the Enlightenment's focus on reason","Paired with the Scientific Revolution"]},{"module":"Module I — Social Transformation","term":"Scientific Revolution","explanation":"Explaining the natural world through observation and experiments instead of tradition or religion.","details":["Other half of 'rationalization of society'","Made inventions like the steam engine possible","A precondition for industrialization"]},{"module":"Module I — Social Transformation","term":"Material vs. Discursive Forces","explanation":"Material forces are real, physical structures; discursive forces are ideas and beliefs that shape behavior.","details":["Material = economy, government, production","Discursive = ideas, ideologies, culture, beliefs","Example: food (material) vs. a religious image (discursive)"]},{"module":"Module I — Social Transformation","term":"Colonialism & Modernity (Mignolo)","explanation":"Scholar Walter Mignolo argues colonialism was central to — not separate from — European modernization.","details":["Colonial wealth/labor helped fund the Enlightenment and Industrial Revolution","Mainstream history often leaves this out","Important for a global south perspective on modernity"]},{"module":"Module I — Social Transformation","term":"McDonaldization of Society","explanation":"George Ritzer's concept: fast-food principles (efficiency, predictability, control) spreading across modern life.","details":["Example: food delivery apps, automated systems","Downside: the 'irrationality of rationality'","Can feel efficient but impersonal"]},{"module":"Module II — Political Economy","term":"Barter System","explanation":"Early trade where goods/services were exchanged directly, without money.","details":["Started in agricultural society from division of labor","Example: the Silk Road (~130 BCE)","Direct exchange, no currency"]},{"module":"Module II — Political Economy","term":"Mercantilism","explanation":"16th–18th century system where European countries tried to export more than they imported.","details":["High tariffs, controlled colonial trade","Coincided with feudalism/colonial expansion","Example: the Galleon Trade (1565–1815)"]},{"module":"Module II — Political Economy","term":"Classical Liberalism (Laissez-faire)","explanation":"Argued markets work best free of government interference.","details":["Came from French Revolution + Enlightenment ideas","Directly challenged mercantilism","Adam Smith's 'Invisible Hand'"]},{"module":"Module II — Political Economy","term":"Keynesianism","explanation":"Government should actively regulate the economy during downturns.","details":["Based on John Maynard Keynes","Established via 1944 Bretton Woods Conference → World Bank + IMF","Dominant mid-1940s to early 1970s"]},{"module":"Module II — Political Economy","term":"Keynesianism's Downfall → Neoliberalism","explanation":"1970s oil embargo caused stagflation, which Keynesian policy couldn't fix, leading to neoliberalism.","details":["Neoliberalism: government intervention disrupts self-regulation","Gave rise to the Washington Consensus","Privatization, deregulation, austerity"]},{"module":"Module II — Political Economy","term":"Nation vs. State","explanation":"A nation is a shared-identity 'imagined community'; a state is a political entity with territory and sovereignty.","details":["Nation examples: Bangsamoro, Kurdish, Basque","State examples: Philippines, Singapore, Switzerland","The two don't always align"]},{"module":"Module II — Political Economy","term":"Treaty of Westphalia (1648)","explanation":"Formally established sovereign states that recognize each other's control over domestic affairs.","details":["Ended the Thirty Years' War","Made the state 'prime' over the nation","Foundation of the modern nation-state system"]},{"module":"Module II — Political Economy","term":"Napoleonic Wars & Concert of Europe","explanation":"Napoleon spread French Revolution ideals; after his defeat, the Great Powers restored the old order.","details":["Napoleonic Code exported revolutionary ideals","Concert of Europe (1815–1914), aka the Metternich System","Reactionary, but an early precursor to internationalism"]},{"module":"Module II — Political Economy","term":"Liberal vs. Socialist Internationalism","explanation":"Two broad types of internationalism with opposite ideological bases.","details":["Liberal: cooperative nation-states; example: League of Nations","Socialist: classless/stateless society; example: ComIntern (1919–1943)","Both about global interconnectedness"]},{"module":"Module II — Political Economy","term":"World Systems Theory (Wallerstein)","explanation":"Divides the world into core, periphery, and semi-periphery to explain global inequality.","details":["Core = rich, industrialized, sells high-profit goods","Periphery = supplies cheap labor/raw materials","Semi-periphery = exploits and is exploited; rooted in colonial history"]},{"module":"Module II — Political Economy","term":"The New World Order","explanation":"Post-WWII international system built on multilateralism and liberal internationalism.","details":["Cooperative institutions: UN, World Bank, IMF","Alternative to old balance-of-power politics","Facing challenges today (e.g. US pulling back)"]},{"module":"Module II — Political Economy","term":"Sui Generis Powers of IOs","explanation":"International organizations act in their own right through three powers.","details":["Classification (e.g. WHO declaring a pandemic)","Definition (setting standards)","Norm diffusion (spreading guidelines like vaccine rules)"]},{"module":"Module II — Political Economy","term":"Structural Adjustment Programs (SAPs)","explanation":"Austerity-based loan conditions from the World Bank/IMF.","details":["Requires spending cuts, privatization, deregulation","Emerged post-1970s as neoliberalism took over","Criticized for deepening inequality"]},{"module":"Module II — Political Economy","term":"Transnational Corporations (TNCs)","explanation":"Large companies operating across many countries; benefit from SAP-driven privatization.","details":["Have the capital to buy newly privatized industries","Dominate markets opened up by deregulation","Direct beneficiaries of SAP conditions"]},{"module":"Module II — Political Economy","term":"Three Elements of Neoliberalism","explanation":"Market liberalization, deregulation, and privatization.","details":["PH example: foreign universities entering the market (liberalization)","Private colleges with loose oversight (deregulation)","Tuition-dependent schools vs. limited state funding (privatization)"]},{"module":"Module II — Political Economy","term":"UN Security Council","explanation":"15-member UN body responsible for international peace and security.","details":["5 permanent members with veto: US, UK, France, Russia, China","10 non-permanent members, 2-year terms","Veto power can block action (e.g. Iraq, Gaza)"]},{"module":"Module III — Modernization of Ideas","term":"Media Evolution","explanation":"Ideas spread to the masses through evolving media technology.","details":["Oral → Script → Print → Electronic → Digital","Each stage increased speed and reach of ideas","Key to how globalization itself is possible"]},{"module":"Module III — Modernization of Ideas","term":"Print Media & Revolutions","explanation":"The printing press let radical ideas spread to the masses quickly const $app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().replace(/[’']/g,'').replace(/&/g,' and ').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
const sing=w=>w.length>3&&w.endsWith('s')&&!w.endsWith('ss')?w.slice(0,-1):w;
const nz=s=>norm(s).split(' ').map(sing).join(' ');
const stripThe=s=>s.replace(/^(the|a|an)\s+/,'');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function hasPhrase(hay,needle){return (' '+hay+' ').includes(' '+needle+' ')}
function matchIdent(input,answers){
  const u=stripThe(nz(input)); if(!u) return false;
  return answers.some(a=>{
    const t=stripThe(nz(a)); if(!t) return false;
    if(u===t) return true;
    if(t.length>3 && hasPhrase(u,t)) return true;           // typed extra words around the answer
    if(u.length>3 && t.length>3 && hasPhrase(t,u) && u.length>=t.length*0.5) return true; // reasonable partial
    return false;
  });
}
function recollHits(input,answers){
  const u=nz(input);
  return answers.filter(a=>hasPhrase(u,nz(a)));
}
function mmMatch(a,b){return nz(a)===nz(b)}

/* ---------- exam ---------- */
function startExam(name){
  const S=SETS[name];
  const mmTerms=shuffle(S.mixmatch.map(q=>q.answerTerm));
  const qs=[];
  S.mixmatch.forEach(q=>qs.push({...q,type:'mm',part:'Part I — Mix & Match',pts:1,terms:mmTerms}));
  S.identification.forEach(q=>qs.push({...q,type:'id',part:'Part II — Identification',pts:1}));
  S.mcq.forEach(q=>{const order=shuffle(q.options.map((t,i)=>i));qs.push({...q,type:'mcq',part:'Part III — Multiple Choice',pts:1,order})});
  S.recollection.forEach(q=>qs.push({...q,type:'rec',part:'Part IV — Recollection',pts:1}));
  exam={name,qs,i:0,res:{} ,draft:{}};
  go('exam');
}
function gradeQ(q,val){
  if(q.type==='mm'){const ok=mmMatch(val,q.answerTerm);return{ok,show:q.answerTerm}}
  if(q.type==='id'){const ok=matchIdent(val,q.acceptableAnswers);return{ok,show:q.acceptableAnswers[0]+(q.acceptableAnswers.length>1?'  (also accepted: '+q.acceptableAnswers.slice(1).join(', ')+')':'')}}
  if(q.type==='mcq'){const ok=Number(val)===q.correctIndex;return{ok,show:q.options[q.correctIndex]}}
  if(q.type==='rec'){const hits=recollHits(val,q.acceptableAnswers);const ok=hits.length>=q.minHits;return{ok,hits,show:q.acceptableAnswers.join(', '),need:q.minHits}}
}
function fbHTML(q,r){
  let h=`<div class="fb ${r.ok?'ok':'bad'}"><b class="t">${r.ok?'✓ Correct!':'✗ Incorrect'}</b>`;
  if(q.type==='rec'){
    h+=`<div class="ans">You covered <b>${r.hits.length}</b> of the required <b>${r.need}</b>${r.hits.length?': '+esc(r.hits.join(', ')):''}.</div>`;
    if(!r.ok)h+=`<div class="ans">Expected answers: <b>${esc(r.show)}</b> (at least ${r.need})</div>`;
  } else if(!r.ok) h+=`<div class="ans">Correct answer: <b>${esc(r.show)}</b></div>`;
  else if(q.type==='id'&&q.acceptableAnswers.length>1) h+=`<div class="ans">Accepted: ${esc(q.acceptableAnswers.join(' / '))}</div>`;
  if(q.explanation)h+=`<div class="ex">${esc(q.explanation)}</div>`;
  return h+'</div>';
}
function examView(){
  const q=exam.qs[exam.i], r=exam.res[exam.i];
  const score=Object.values(exam.res).filter(x=>x.ok).length, done=Object.keys(exam.res).length;
  const dots=exam.qs.map((_,i)=>{const x=exam.res[i];return `<button class="dot ${x?(x.ok?'ok':'bad'):''} ${i===exam.i?'cur':''}" data-j="${i}">${i+1}</button>`}).join('');
  let input='';
  const dis=r?'disabled':'';
  const cur=r?r.val:(exam.draft[exam.i]??'');
  if(q.type==='mm') input=`<select id="inp" ${dis}><option value="">— choose the matching term —</option>${q.terms.map(t=>`<option value="${esc(t)}" ${cur===t?'selected':''}>${esc(t)}</option>`).join('')}</select>`;
  else if(q.type==='id') input=`<input type="text" id="inp" ${dis} autocomplete="off" placeholder="Type your answer" value="${esc(cur)}">`;
  else if(q.type==='rec') input=`<textarea id="inp" rows="5" ${dis} placeholder="Type your answer…">${esc(cur)}</textarea>`;
  else input=q.order.map((oi,k)=>{let c='opt';if(r){if(oi===q.correctIndex)c+=' right';else if(String(oi)===String(r.val))c+=' wrong'}else if(String(oi)===String(cur))c+=' sel';return `<button class="${c}" data-o="${oi}" ${dis}><b>${'ABCD'[k]}.</b> ${esc(q.options[oi])}</button>`}).join('');
  $app.innerHTML=`
  <div class="row" style="justify-content:space-between;margin-bottom:12px"><div><span class="stamp">Set ${exam.name}</span></div>
  <div class="row"><span class="mono">Score ${score}/${done} checked</span><button class="btn alt" id="exit">Exit</button></div></div>
  <div class="layout"><aside class="side card"><div class="mono" style="margin-bottom:8px">Progress ${done}/${exam.qs.length}</div><div class="bar" style="margin-bottom:12px"><i style="width:${done/exam.qs.length*100}%"></i></div><div class="dots">${dots}</div></aside>
  <main class="card"><div class="mono">${q.part} · Q${exam.i+1} of ${exam.qs.length}</div>
  <h3 style="margin:10px 0 14px;font-size:20px">${esc(q.prompt)}</h3>${input}
  <div class="row" style="margin-top:14px">${r?'':'<button class="btn" id="check">Check answer</button>'}</div>
  <div id="fb">${r?fbHTML(q,r.g):''}</div>
  <div class="row" style="justify-content:space-between;margin-top:18px">
  <button class="btn alt" id="prev" ${exam.i===0?'disabled':''}>← Previous</button>
  ${exam.i<exam.qs.length-1?'<button class="btn" id="next">Next →</button>':'<button class="btn pine" id="fin">Finish & see results</button>'}</div></main></div>`;
  document.getElementById('exit').onclick=()=>{if(confirm('Exit this exam? Progress will be lost.'))go('home')};
  document.querySelectorAll('.dot').forEach(b=>b.onclick=()=>{saveDraft();exam.i=+b.dataset.j;examView()});
  document.getElementById('prev').onclick=()=>{saveDraft();exam.i--;examView()};
  const n=document.getElementById('next');if(n)n.onclick=()=>{saveDraft();exam.i++;examView()};
  const f=document.getElementById('fin');if(f)f.onclick=()=>{const un=exam.qs.length-Object.keys(exam.res).length;if(!un||confirm(un+' question(s) not checked yet — they will count as wrong. Finish anyway?'))go('results')};
  const chk=document.getElementById('check');
  if(q.type==='mcq'&&!r)document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{exam.draft[exam.i]=b.dataset.o;examView()});
  if(chk)chk.onclick=submitExam;
  const inp=document.getElementById('inp');
  if(inp&&!r){if(q.type==='id')inp.addEventListener('keydown',e=>{if(e.key==='Enter')submitExam()});if(q.type!=='mcq')inp.focus()}
  if(r){const nb=document.getElementById('next')||document.getElementById('fin');}
}
function saveDraft(){const inp=document.getElementById('inp');if(inp&&!exam.res[exam.i])exam.draft[exam.i]=inp.value}
function submitExam(){
  const q=exam.qs[exam.i];if(exam.res[exam.i])return;
  const inp=document.getElementById('inp');
  const val=q.type==='mcq'?exam.draft[exam.i]:inp.value;
  if(val===undefined||String(val).trim()===''){alert('Enter or choose an answer first.');return}
  exam.res[exam.i]={val,g:gradeQ(q,val),ok:gradeQ(q,val).ok};
  examView();
  document.getElementById('fb').scrollIntoView({block:'nearest',behavior:'smooth'});
}

/* ---------- results ---------- */
function results(){
  const parts={};
  exam.qs.forEach((q,i)=>{const p=parts[q.part]??={ok:0,n:0};p.n++;if(exam.res[i]?.ok)p.ok++});
  const total=Object.values(parts).reduce((a,p)=>a+p.ok,0),max=exam.qs.length;
  $app.innerHTML=`<div class="card"><span class="stamp">Set ${exam.name} · results</span><div class="big" style="margin:14px 0">${total}<span style="font-size:28px;color:var(--muted)">/${max}</span></div>
  <div class="mono">${Math.round(total/max*100)}%</div>
  <div style="margin-top:14px">${Object.entries(parts).map(([k,p])=>`<div class="row" style="justify-content:space-between;border-bottom:1px dashed var(--line);padding:6px 0"><span>${k}</span><b>${p.ok}/${p.n}</b></div>`).join('')}</div>
  <div class="row" style="margin-top:16px"><button class="btn" id="home">Home</button><button class="btn alt" id="again">Retake Set ${exam.name}</button></div></div>
  <div class="row" style="margin-bottom:10px"><b>Review:</b>
  <button class="btn alt" data-f="all">All</button><button class="btn alt" data-f="bad">Wrong / unanswered</button><button class="btn alt" data-f="ok">Correct</button></div><div id="rv"></div>`;
  document.getElementById('home').onclick=()=>go('home');
  document.getElementById('again').onclick=()=>startExam(exam.name);
  const draw=f=>{
    document.getElementById('rv').innerHTML=exam.qs.map((q,i)=>{const r=exam.res[i];const ok=r?.ok;
      if(f==='ok'&&!ok)return'';if(f==='bad'&&ok)return'';
      const g=r?r.g:gradeQ(q,q.type==='mcq'?-1:'');
      const yours=r?(q.type==='mcq'?q.options[r.val]:r.val):'(not answered)';
      return `<div class="card"><div class="mono">${q.part} · Q${i+1}</div><div style="margin:6px 0"><b>${esc(q.prompt)}</b></div>
      <div>Your answer: <b style="color:${ok?'var(--pine)':'var(--red)'}">${esc(yours)}</b> ${ok?'✓':'✗'}</div>${ok?'':`<div>Correct: <b>${esc(g.show)}</b></div>`}<div class="ex" style="color:var(--muted);font-size:14px;margin-top:4px">${esc(q.explanation||'')}</div></div>`}).join('')};
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>draw(b.dataset.f));draw('all');
}

function drillSetup(){
  $app.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:12px"><h1>150 Identification Drill</h1><button class="btn alt" id="back">← Home</button></div>

  <div class="row" style="margin-bottom:10px"><label>Module&nbsp;
  <select id="dm" style="width:auto"><option value="0">All modules (${DRILL.length})</option>${[1,2,3].map(m=>`<option value="${m}">${MODS[m]} (${DRILL.filter(q=>q.module===m).length})</option>`).join('')}</select></label></div>
  <label class="chk"><input type="checkbox" id="dsh" checked> Shuffle order</label><br>
  <button class="btn pine" id="go">Start</button></div>`;
  document.getElementById('back').onclick=()=>go('home');
  document.getElementById('go').onclick=()=>{startDrill(DRILL.filter(q=>+document.getElementById('dm').value===0||q.module===+document.getElementById('dm').value),document.getElementById('dsh').checked)};
}
function startDrill(list,sh){drill={qs:sh?shuffle(list):list.slice(),i:0,res:[]};go('drill')}
function drillView(){
  const q=drill.qs[drill.i],r=drill.res[drill.i];
  const done=drill.res.filter(Boolean).length,ok=drill.res.filter(x=>x&&x.ok).length;
  $app.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="stamp">Drill</span>
  <div class="row"><span class="mono">✓ ${ok} · ✗ ${done-ok} · ${drill.qs.length-done} left</span><button class="btn alt" id="end">End & summary</button></div></div>
  <div class="bar" style="margin-bottom:14px"><i style="width:${done/drill.qs.length*100}%"></i></div>
  <div class="card"><div class="mono">${esc(MODS[q.module])} · Q${drill.i+1} of ${drill.qs.length}</div>
  <h3 style="margin:10px 0 14px;font-size:21px">${esc(q.prompt)}</h3>
  <div class="row" style="flex-wrap:nowrap"><input type="text" id="inp" autocomplete="off" placeholder="Type your answer" ${r?'disabled':''} value="${r?esc(r.val):''}">${r?'':'<button class="btn" id="sub">Submit</button>'}</div>
  <div id="fb">${r?drillFb(q,r):''}</div>
  <div class="row" style="justify-content:space-between;margin-top:18px"><button class="btn alt" id="prev" ${drill.i===0?'disabled':''}>← Previous</button>
  ${drill.i<drill.qs.length-1?`<button class="btn ${r?'':'alt'}" id="next">${r?'Next question →':'Skip →'}</button>`:'<button class="btn pine" id="fin">Finish</button>'}</div></div>`;
  document.getElementById('end').onclick=()=>go('drillresults');
  document.getElementById('prev').onclick=()=>{drill.i--;drillView()};
  const n=document.getElementById('next');if(n)n.onclick=()=>{drill.i++;drillView()};
  const f=document.getElementById('fin');if(f)f.onclick=()=>go('drillresults');
  const inp=document.getElementById('inp');
  if(!r){inp.focus();const s=()=>{if(!inp.value.trim()){return}const ok=matchIdent(inp.value,q.answers);drill.res[drill.i]={val:inp.value,ok};drillView();setTimeout(()=>{const nx=document.getElementById('next')||document.getElementById('fin');if(nx)nx.focus()},200)};
    document.getElementById('sub').onclick=s;inp.addEventListener('keydown',e=>{if(e.key==='Enter')s()})}
}
function drillFb(q,r){
  return `<div class="fb ${r.ok?'ok':'bad'}"><b class="t">${r.ok?'✓ Correct!':'✗ Incorrect'}</b>${r.ok?(q.answers.length>1?`<div class="ans">Accepted: ${esc(q.answers.join(' / '))}</div>`:''):`<div class="ans">Correct answer: <b>${esc(q.answers[0])}</b>${q.answers.length>1?` <span style="color:var(--muted)">(also accepted: ${esc(q.answers.slice(1).join(', '))})</span>`:''}</div>`}<div class="ex">${esc(q.explanation)}</div></div>`;
}
function drillResults(){
  const done=drill.res.filter(Boolean).length,ok=drill.res.filter(x=>x&&x.ok).length;
  const missed=drill.qs.filter((q,i)=>drill.res[i]&&!drill.res[i].ok);
  $app.innerHTML=`<div class="card"><span class="stamp">Drill summary</span><div class="big" style="margin:14px 0">${ok}<span style="font-size:28px;color:var(--muted)">/${drill.qs.length}</span></div>
  <div class="mono">Answered ${done} · Correct ${ok} · Wrong ${done-ok} · Skipped ${drill.qs.length-done}</div>
  <div class="row" style="margin-top:16px"><button class="btn" id="home">Home</button><button class="btn pine" id="retry" ${missed.length?'':'disabled'}>Retry ${missed.length} missed</button><button class="btn alt" id="new">New drill</button></div></div>
  ${missed.length?'<h3 style="margin:16px 0 8px">Missed questions</h3>':''}${drill.qs.map((q,i)=>{const r=drill.res[i];if(!r||r.ok)return'';return `<div class="card"><div class="mono">${esc(MODS[q.module])}</div><b>${esc(q.prompt)}</b><div>Your answer: <b style="color:var(--red)">${esc(r.val)}</b></div><div>Correct: <b>${esc(q.answers[0])}</b></div><div style="color:var(--muted);font-size:14px">${esc(q.explanation)}</div></div>`}).join('')}`;
  document.getElementById('home').onclick=()=>go('home');
  document.getElementById('new').onclick=()=>go('drillsetup');
  document.getElementById('retry').onclick=()=>startDrill(missed,true);
}

["K","Consumerism","Buying and owning things becomes central to identity and status, driven by ads and cheap global products."],
["K","Korean Wave (K-Wave)","Worldwide spread of K-pop and K-dramas; a non-Western culture spreading its own values globally."]
];
const MQH=[
["Who proposed the Invisible Hand and free-market thinking?","Adam Smith","John Smith","John Locke","Max Weber"],
["Which is NOT a characteristic of McDonaldization?","Efficacy","Efficiency","Calculability","Predictability"],
["Which framework does your class use, instead of CHED's suggested 'Globalization'?","Modernity","Nationalism","Colonialism","Mercantilism"],
["How many active organs does the UN have?","Five","Four","Six","Seven"],
["Why was the steam engine revolutionary?","It no longer depended on human or animal power","It depended entirely on animal power","It replaced the plow","It required water wheels to run"],
["Which type of society is NOT nomadic?","Feudal","Hunting-Gathering","Pastoral","Early Horticultural"],
["Who introduced the idea of the Iron Cage?","Max Weber","George Ritzer","Ferdinand Tönnies","René Descartes"],
["Who proposed McDonaldization?","George Ritzer","Max Weber","Marshall McLuhan","Immanuel Wallerstein"],
["Who coined the term 'Global Village'?","Marshall McLuhan","George Ritzer","Adam Smith","John Locke"],
["Who developed World Systems Theory?","Immanuel Wallerstein","Walter Mignolo","Max Weber","Ferdinand Tönnies"],
["Who proposed the Consent of the Governed?","John Locke","Adam Smith","René Descartes","Max Weber"],
["Who said 'Cogito, ergo sum'?","René Descartes","John Locke","Adam Smith","Max Weber"],
["In what year was the Treaty of Westphalia signed?","1648","1789","1765","1944"],
["In what year was the Bretton Woods Conference held?","1944","1648","1815","1765"],
["The Industrial Revolution began in 1765 in which country?","Great Britain","France","Prussia","Austria"],
["In what year did the French Revolution begin?","1789","1648","1765","1815"],
["How many permanent members with veto power does the UN Security Council have?","5","3","10","15"],
["The Galleon Trade connected which two ports?","Acapulco and Manila","Cebu and Madrid","Manila and Beijing","Lisbon and Manila"]
];

/* ---------- 150 Multiple Choice Quiz ---------- */
const MQ_HMOD=[1,1,1,2,1,1,1,1,3,2,1,1,2,2,1,1,2,2];
function mqBuild(){
  const kIdx={};let kc=0;
  const tm=(g,t)=>g==='S'?1:g==='E'?2:g==='D'?3:(kIdx[t]??=kc++)<21?1:(kIdx[t])<46?2:3;
  const Q=[];
  MQD.forEach(([g,t,d])=>{
    const m=tm(g,t),pool=MQD.filter(x=>x[0]===g&&x[1]!==t);
    const a=shuffle(pool).slice(0,3),b=shuffle(pool).slice(0,3);
    Q.push({module:m,prompt:'Which term matches this description? '+d,correct:t,options:shuffle([t,...a.map(x=>x[1])]),explanation:t+' — '+d});
    Q.push({module:m,prompt:'What is “'+t+'”?',correct:d,options:shuffle([d,...b.map(x=>x[2])]),explanation:t+' — '+d});
  });
  MQH.forEach((h,i)=>Q.push({module:MQ_HMOD[i],prompt:h[0],correct:h[1],options:shuffle(h.slice(1)),explanation:''}));
  return shuffle(Q).slice(0,150);
}
let mq=null;
function mcqSetup(){
  const all=mqBuild();window._mqAll=all;
  const cnt=m=>all.filter(q=>q.module===m).length;
  $app.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:12px"><h1>150 Multiple Choice Quiz</h1><button class="btn alt" id="back">← Home</button></div>
  <div class="card"><p>${all.length} multiple-choice questions built from the reviewer. Tap an option → instant verdict, and the correct answer if you were wrong.</p>
  <div class="row" style="margin-bottom:10px"><label>Module&nbsp;<select id="mm" style="width:auto"><option value="0">All modules (${all.length})</option>${[1,2,3].map(m=>`<option value="${m}">${MODS[m]} (${cnt(m)})</option>`).join('')}</select></label></div>
  <label class="chk"><input type="checkbox" id="msh" checked> Shuffle order</label><br>
  <button class="btn pine" id="go">Start</button></div>`;
  document.getElementById('back').onclick=()=>go('home');
  document.getElementById('go').onclick=()=>{const m=+document.getElementById('mm').value;startMcq(all.filter(q=>!m||q.module===m),document.getElementById('msh').checked)};
}
function startMcq(list,sh){mq={qs:sh?shuffle(list):list.slice(),i:0,res:[]};go('mcq')}
function mcqView(){
  const q=mq.qs[mq.i],r=mq.res[mq.i];
  const done=mq.res.filter(Boolean).length,ok=mq.res.filter(x=>x&&x.ok).length;
  const opts=q.options.map((o,k)=>{let c='opt';if(r){if(o===q.correct)c+=' right';else if(o===r.val)c+=' wrong'}return `<button class="${c}" data-k="${k}" ${r?'disabled':''}>${esc(o)}</button>`}).join('');
  const fb=r?`<div class="fb ${r.ok?'ok':'bad'}"><b class="t">${r.ok?'✓ Correct!':'✗ Incorrect'}</b>${r.ok?'':`<div class="ans">Correct answer: <b>${esc(q.correct)}</b></div>`}${q.explanation?`<div class="ex">${esc(q.explanation)}</div>`:''}</div>`:'';
  $app.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="stamp">MCQ Quiz</span>
  <div class="row"><span class="mono">✓ ${ok} · ✗ ${done-ok} · ${mq.qs.length-done} left</span><button class="btn alt" id="end">End & summary</button></div></div>
  <div class="bar" style="margin-bottom:14px"><i style="width:${done/mq.qs.length*100}%"></i></div>
  <div class="card"><div class="mono">${esc(MODS[q.module])} · Q${mq.i+1} of ${mq.qs.length}</div>
  <h3 style="margin:10px 0 14px;font-size:21px">${esc(q.prompt)}</h3>${opts}<div id="fb">${fb}</div>
  <div class="row" style="justify-content:space-between;margin-top:18px"><button class="btn alt" id="prev" ${mq.i===0?'disabled':''}>← Previous</button>
  ${mq.i<mq.qs.length-1?`<button class="btn ${r?'':'alt'}" id="next">${r?'Next question →':'Skip →'}</button>`:'<button class="btn pine" id="fin">Finish</button>'}</div></div>`;
  document.getElementById('end').onclick=()=>go('mcqresults');
  document.getElementById('prev').onclick=()=>{mq.i--;mcqView()};
  const n=document.getElementById('next');if(n)n.onclick=()=>{mq.i++;mcqView()};
  const f=document.getElementById('fin');if(f)f.onclick=()=>go('mcqresults');
  if(!r)document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const val=q.options[+b.dataset.k];mq.res[mq.i]={val,ok:val===q.correct};mcqView();const nx=document.getElementById('next')||document.getElementById('fin');if(nx)nx.focus()});
}
function mcqResults(){
  const done=mq.res.filter(Boolean).length,ok=mq.res.filter(x=>x&&x.ok).length;
  const missed=mq.qs.filter((q,i)=>mq.res[i]&&!mq.res[i].ok);
  $app.innerHTML=`<div class="card"><span class="stamp">MCQ summary</span><div class="big" style="margin:14px 0">${ok}<span style="font-size:28px;color:var(--muted)">/${mq.qs.length}</span></div>
  <div class="mono">Answered ${done} · Correct ${ok} · Wrong ${done-ok} · Skipped ${mq.qs.length-done}</div>
  <div class="row" style="margin-top:16px"><button class="btn" id="home">Home</button><button class="btn pine" id="retry" ${missed.length?'':'disabled'}>Retry ${missed.length} missed</button><button class="btn alt" id="new">New quiz</button></div></div>
  ${missed.length?'<h3 style="margin:16px 0 8px">Missed questions</h3>':''}${mq.qs.map((q,i)=>{const r=mq.res[i];if(!r||r.ok)return'';return `<div class="card"><div class="mono">${esc(MODS[q.module])}</div><b>${esc(q.prompt)}</b><div>Your answer: <b style="color:var(--red)">${esc(r.val)}</b></div><div>Correct: <b>${esc(q.correct)}</b></div></div>`}).join('')}`;
  document.getElementById('home').onclick=()=>go('home');
  document.getElementById('new').onclick=()=>go('mcqsetup');
  document.getElementById('retry').onclick=()=>startMcq(missed.map(q=>({...q,options:shuffle(q.options)})),true);
}

render();
</script></body></html>
