<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GEED 003 — Mock Exam (Instant Feedback)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:hsl(42 38% 95%);--card:hsl(42 40% 98%);--ink:hsl(220 25% 15%);--muted:hsl(220 10% 42%);--red:hsl(358 65% 42%);--pine:hsl(152 30% 26%);--brass:hsl(38 55% 45%);--line:hsl(35 20% 82%);--okbg:hsl(152 40% 90%);--badbg:hsl(358 60% 94%)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;line-height:1.5;background-image:repeating-linear-gradient(transparent 0,transparent calc(2rem - 1px),hsl(210 40% 85% / .5) calc(2rem - 1px),hsl(210 40% 85% / .5) 2rem)}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;margin:0}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
.mono{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px;box-shadow:2px 3px 0 hsl(35 20% 80%);margin-bottom:16px}
button{font:inherit;cursor:pointer}
.btn{background:var(--ink);color:#fff;border:0;border-radius:4px;padding:10px 18px;font-weight:600}
.btn:hover{opacity:.9}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.pine{background:var(--pine)}.btn.red{background:var(--red)}
input[type=text],textarea,select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink)}
input:disabled,textarea:disabled,select:disabled{background:hsl(42 20% 92%)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.stamp{display:inline-block;border:2px solid var(--red);color:var(--red);padding:2px 10px;font-family:'IBM Plex Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:.1em;transform:rotate(-2deg);border-radius:3px}
.layout{display:grid;grid-template-columns:200px 1fr;gap:16px}
@media(max-width:760px){.layout{grid-template-columns:1fr}}
.side .dots{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.dot{aspect-ratio:1;border:1px solid var(--line);background:#fff;border-radius:4px;font-size:12px;display:flex;align-items:center;justify-content:center}
.dot.cur{outline:2px solid var(--ink)}.dot.ok{background:var(--pine);color:#fff;border-color:var(--pine)}.dot.bad{background:var(--red);color:#fff;border-color:var(--red)}
.opt{display:block;width:100%;text-align:left;padding:10px 12px;margin:6px 0;border:1px solid var(--line);background:#fff;border-radius:4px}
.opt.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.right{background:var(--okbg);border-color:var(--pine)}.opt.wrong{background:var(--badbg);border-color:var(--red)}
.fb{margin-top:14px;padding:12px 14px;border-radius:4px;border-left:5px solid}
.fb.ok{background:var(--okbg);border-color:var(--pine)}.fb.bad{background:var(--badbg);border-color:var(--red)}
.fb b.t{font-family:'Fraunces',serif;font-size:18px}
.fb .ans{margin-top:4px}.fb .ex{margin-top:6px;color:var(--muted);font-size:14px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--pine)}
.tag{font-size:11px;padding:1px 8px;border:1px solid var(--brass);color:var(--brass);border-radius:10px}
.hidden{display:none}
details summary{cursor:pointer}
.big{font-family:'Fraunces',serif;font-size:56px;line-height:1}
label.chk{display:flex;gap:6px;align-items:center}
</style></head><body>
<div class="wrap" id="app"></div>
<script>
const SETS={"A":{"mixmatch":[{"id":"mm1","prompt":"An early form of trade economy where goods and services were exchanged directly, without money.","answerTerm":"BARTER SYSTEM","explanation":"The barter system emerged in agricultural society once division of labor meant people specialized in making different goods and needed a way to exchange them."},{"id":"mm2","prompt":"16th–18th century economic system where European powers tried to export more than they imported to grow national wealth, using colonies to supply raw materials.","answerTerm":"MERCANTILISM","explanation":"Mercantilism treated trade as a zero-sum competition between nations and coincided with feudalism and colonial expansion, e.g. the Galleon Trade."},{"id":"mm3","prompt":"Economic philosophy, also called laissez-faire economics, arguing markets regulate themselves best without government interference.","answerTerm":"CLASSICAL LIBERALISM","explanation":"Built on Adam Smith's 'Invisible Hand' idea, it directly challenged mercantilism's state-controlled trade and helped pave the way for the Industrial Revolution."},{"id":"mm4","prompt":"Economic philosophy holding that governments must actively intervene during downturns; formalized at the 1944 Bretton Woods Conference.","answerTerm":"KEYNESIANISM","explanation":"Based on John Maynard Keynes's ideas, this approach dominated global policy from the mid-1940s to the early 1970s before stagflation discredited it."},{"id":"mm5","prompt":"The oldest known trade route network connecting Ancient China to the Middle East and Europe, dating to around 130 BCE.","answerTerm":"THE SILK ROAD","explanation":"A classic example of the barter/early trade economy, linking distant civilizations centuries before modern globalization."},{"id":"mm6","prompt":"A mercantilist trade route connecting Acapulco and Manila that operated from 1565 to 1815.","answerTerm":"THE GALLEON TRADE","explanation":"A direct Philippine example of mercantilism, run by Spain to extract wealth from its colonies."},{"id":"mm7","prompt":"The 1648 agreement, ending the Thirty Years' War, that formally established sovereign states with authority over their own domestic affairs.","answerTerm":"TREATY OF WESTPHALIA","explanation":"This made the state 'prime' over the nation by recognizing each state's sovereignty, laying the groundwork for the modern nation-state system."},{"id":"mm8","prompt":"The alliance of European 'Great Powers' (UK, Austria, Russia, Prussia) formed after Napoleon's defeat to restore the pre-Revolution monarchy and feudal order.","answerTerm":"THE CONCERT OF EUROPE","explanation":"Also known as the Metternich System (1815–1914), it was reactionary in purpose but is still seen as an early precursor to internationalism."},{"id":"mm9","prompt":"The type of internationalism that treats cooperative, sovereign nation-states as the basis of international relations, exemplified by the League of Nations.","answerTerm":"LIBERAL INTERNATIONALISM","explanation":"Nationalism/self-determination comes first, then cooperation between independent states — the tradition continued today by the UN."},{"id":"mm10","prompt":"The characteristic of international organizations where they function on their own power, not simply as the sum of their member states' interests.","answerTerm":"SUI GENERIS","explanation":"This 'in a class of its own' power shows up as the power of classification, definition, and norm diffusion — e.g. the WHO declaring a pandemic."}],"identification":[{"id":"id1","prompt":"The World Bank was previously known by this name before its current one.","acceptableAnswers":["INTERNATIONAL BANK FOR RECONSTRUCTION AND DEVELOPMENT","IBRD"],"explanation":"The IBRD was created at the 1944 Bretton Woods Conference, alongside the IMF, to help rebuild postwar economies."},{"id":"id2","prompt":"This Bretton Woods institution helps stabilize currencies and provides loans to member countries facing balance-of-payment problems.","acceptableAnswers":["INTERNATIONAL MONETARY FUND","IMF"],"explanation":"Created in 1944 alongside the World Bank, the IMF became central to enforcing Structural Adjustment Programs later in the neoliberal era."},{"id":"id3","prompt":"The sense of nationhood among Medieval European Christian kingdoms, organized loosely around shared religion rather than a modern nation-state.","acceptableAnswers":["CHRISTENDOM"],"explanation":"Under feudalism, political power revolved around land, so a shared Christian identity substituted for unified nationhood."},{"id":"id4","prompt":"The type of internationalism, grounded in Marxist ideas, that argues national allegiances disrupt the unification of the global working class.","acceptableAnswers":["SOCIALIST INTERNATIONALISM"],"explanation":"Historical example: the Communist International (ComIntern), active 1919–1943 — the opposite approach from liberal internationalism."},{"id":"id5","prompt":"Austerity-based economic policy conditions, imposed by the World Bank/IMF on developing countries in exchange for loans.","acceptableAnswers":["STRUCTURAL ADJUSTMENT PROGRAMS","STRUCTURAL ADJUSTMENT PROGRAM","SAP","SAPS"],"explanation":"SAPs typically require spending cuts, privatization, and deregulation — rooted in neoliberal philosophy and the Washington Consensus."},{"id":"id6","prompt":"Adam Smith's idea that individuals pursuing self-interest in a free market unintentionally benefit society as a whole, making state control unnecessary.","acceptableAnswers":["INVISIBLE HAND","THE INVISIBLE HAND"],"explanation":"This became the intellectual backbone of classical liberalism, directly challenging mercantilism's state-controlled trade."},{"id":"id7","prompt":"The historical event, roughly 5,000–6,000 years ago, marked by the invention of the plow, which created a massive food and time surplus.","acceptableAnswers":["AGRICULTURAL REVOLUTION","THE AGRICULTURAL REVOLUTION"],"explanation":"This is Henslin's Second Social Revolution, often called the 'Dawn of Civilization' because the surplus it created enabled cities, writing, and culture."},{"id":"id8","prompt":"Henslin's First Social Revolution, where hunting-gathering groups discovered they could tame animals or cultivate plants instead of foraging.","acceptableAnswers":["DOMESTICATION","DOMESTICATION SOCIAL REVOLUTION"],"explanation":"This single shift branched society into pastoral (herding, nomadic) and horticultural (farming, settled) societies."},{"id":"id9","prompt":"A political and economic system where landowning lords controlled land and peasants or serfs tilled it in exchange for protection or a share of production.","acceptableAnswers":["FEUDALISM"],"explanation":"It emerged once private land property became possible, making social inequality a structural feature of society. The Philippine hacienda system is a direct example."},{"id":"id10","prompt":"The German sociologist who coined the concepts of Gemeinschaft and Gesellschaft.","acceptableAnswers":["FERDINAND TONNIES","FERDINAND TÖNNIES","TONNIES","TÖNNIES"],"explanation":"Tönnies used these terms to describe the shift from tight-knit rural community life to impersonal, individualistic urban life as societies modernized."},{"id":"id11","prompt":"Tönnies's term for a rural, tight-knit traditional community connected by kinship, place, and custom.","acceptableAnswers":["GEMEINSCHAFT"],"explanation":"The opposite of Gesellschaft — part of the Traditional-Modern Model describing the shift toward 'modern' society."},{"id":"id12","prompt":"Tönnies's term for an urban, individualistic society defined by impersonal, contractual relationships.","acceptableAnswers":["GESELLSCHAFT"],"explanation":"This describes city life as societies modernize — people relate more as individuals pursuing their own interests."},{"id":"id13","prompt":"Max Weber's concept describing how modern society's obsession with efficiency and bureaucratic rules traps individuals in rigid, inescapable systems.","acceptableAnswers":["IRON CAGE","THE IRON CAGE"],"explanation":"Weber originally used it to explain how the Protestant work ethic became an end in itself, stripped of its original spiritual meaning."},{"id":"id14","prompt":"George Ritzer's concept describing how fast-food principles (efficiency, calculability, predictability, control) have spread into more sectors of modern life.","acceptableAnswers":["MCDONALDIZATION","MCDONALDIZATION OF SOCIETY"],"explanation":"Ritzer calls the downside the 'irrationality of rationality' — efficient systems that can still feel dehumanizing."},{"id":"id15","prompt":"Descartes' famous principle, translated as 'I think, therefore I am,' which placed individual reason at the center of certain knowledge.","acceptableAnswers":["COGITO ERGO SUM","COGITO, ERGO SUM"],"explanation":"This became foundational to the Enlightenment's belief that people could understand the world through reason rather than tradition or religious authority."},{"id":"id16","prompt":"The Enlightenment thinker who proposed the principle of 'consent of the governed.'","acceptableAnswers":["JOHN LOCKE","LOCKE"],"explanation":"Locke argued political power originates from the people, not divine right — the philosophical foundation of democratic legitimacy."},{"id":"id17","prompt":"Immanuel Wallerstein's theory that divides the world economy into core, periphery, and semi-periphery countries to explain global inequality.","acceptableAnswers":["WORLD SYSTEMS THEORY","WORLD-SYSTEMS THEORY"],"explanation":"The theory frames global inequality as structural, not accidental, rooted historically in colonialism."},{"id":"id18","prompt":"According to World Systems Theory, countries that never industrialized and instead supply cheap labor and raw materials to richer nations.","acceptableAnswers":["PERIPHERY","PERIPHERY COUNTRIES"],"explanation":"Periphery countries are economically dependent on core countries, which buy their raw materials and labor at low cost."},{"id":"id19","prompt":"A large company that operates production, sales, or services across multiple countries rather than being confined to one national economy.","acceptableAnswers":["TRANSNATIONAL CORPORATION","TNC"],"explanation":"TNCs are described as the direct beneficiaries of WB-IMF austerity SAPs, since they have the capital to buy up newly privatized industries."},{"id":"id20","prompt":"The economic philosophy that replaced Keynesianism after the 1970s stagflation crisis, arguing government intervention disrupts the market's self-regulation.","acceptableAnswers":["NEOLIBERALISM"],"explanation":"Neoliberalism gave rise to the Washington Consensus — policies promoting privatization, deregulation, and austerity."},{"id":"id21","prompt":"A set of policy recommendations, arising after Keynesianism's failure, promoting privatization, deregulation, and austerity.","acceptableAnswers":["WASHINGTON CONSENSUS"],"explanation":"This set of neoliberal policies became the basis for World Bank/IMF Structural Adjustment Programs."},{"id":"id22","prompt":"Marshall McLuhan's concept describing how mass media makes the world feel like one connected community sharing similar values.","acceptableAnswers":["GLOBAL VILLAGE","THE GLOBAL VILLAGE"],"explanation":"McLuhan argued television (and later other media) would create this shared global culture, often Western in character."},{"id":"id23","prompt":"A global cultural 'fad' involving the worldwide spread of South Korean pop culture, particularly K-pop music and K-dramas.","acceptableAnswers":["KOREAN WAVE","K-WAVE","THE KOREAN WAVE"],"explanation":"It's used as a case study on whether media results in cultural homogenization, showing a non-Western culture successfully exporting its own values."},{"id":"id24","prompt":"The UN body with 15 members, five of which are permanent and hold veto power, primarily responsible for maintaining international peace and security.","acceptableAnswers":["UNITED NATIONS SECURITY COUNCIL","UN SECURITY COUNCIL","SECURITY COUNCIL"],"explanation":"Its five permanent members (US, UK, France, Russia, China) can each block a resolution with a single veto."},{"id":"id25","prompt":"The 1944 conference that created the World Bank and the International Monetary Fund to manage the postwar global economy.","acceptableAnswers":["BRETTON WOODS CONFERENCE","BRETTON WOODS"],"explanation":"This conference formally established Keynesianism as global economic policy from the mid-1940s to the early 1970s."}],"mcq":[{"id":"mcq1","prompt":"Which of the following correctly orders Henslin's Social Revolutions from earliest to most recent?","options":["Agricultural → Domestication → Industrial → Information","Domestication → Agricultural → Industrial → Information","Industrial → Domestication → Agricultural → Information","Domestication → Industrial → Agricultural → Information"],"correctIndex":1,"explanation":"Domestication (taming/cultivating) came first, followed by the plow-driven Agricultural Revolution, then the steam-engine-driven Industrial Revolution, then the microchip-driven Information age."},{"id":"mcq2","prompt":"A classmate says: 'Mercantilism and classical liberalism both agree that governments should tightly control trade to protect national wealth.' What is wrong with this statement?","options":["Nothing — both systems support state control of trade","Classical liberalism actually argues for free markets with minimal state interference, the opposite of mercantilism","Mercantilism actually supports free trade, not classical liberalism","Both systems reject the idea of trade entirely"],"correctIndex":1,"explanation":"Classical liberalism (laissez-faire) emerged specifically to challenge mercantilism's state-controlled trade, arguing markets regulate themselves via Adam Smith's 'Invisible Hand.'"},{"id":"mcq3","prompt":"Which best explains why the Industrial Revolution led to rapid urbanization?","options":["Factories required workers to live near universities","Displaced peasants moved to cities because that's where the new factory jobs were located","Urbanization happened before industrialization even started","Monarchs forced peasants to relocate to cities by law"],"correctIndex":1,"explanation":"As feudal society collapsed and farmland was lost, production shifted to urban factories, pulling peasants into cities in search of wage labor — matching the course's 'thick internal migration' concept."},{"id":"mcq4","prompt":"A country has never industrialized and mainly exports raw materials and cheap labor to richer nations. According to Wallerstein's World Systems Theory, this country is best classified as:","options":["Core","Semi-periphery","Periphery","Hegemon"],"correctIndex":2,"explanation":"Periphery countries never industrialized and supply cheap labor/raw materials to core countries, remaining economically dependent on them."},{"id":"mcq5","prompt":"Which pair correctly matches a concept with the thinker who proposed it?","options":["Invisible Hand — John Locke","Consent of the Governed — Adam Smith","Cogito, ergo sum — René Descartes","Iron Cage — Ferdinand Tönnies"],"correctIndex":2,"explanation":"Descartes proposed 'Cogito, ergo sum.' (Invisible Hand is Adam Smith's; Consent of the Governed is John Locke's; Iron Cage is Max Weber's.)"},{"id":"mcq6","prompt":"What is the main difference between a 'nation' and a 'state'?","options":["A nation always has its own government, while a state does not","A nation is based on shared identity and culture, while a state is a political entity with territory and sovereignty","A state is defined only by religion, while a nation is defined by law","There is no meaningful difference between the two terms"],"correctIndex":1,"explanation":"A nation (e.g. the Kurdish people) is an 'imagined community' of shared identity; a state (e.g. the Philippines) is a political entity with authority, territory, government, and sovereignty. The two don't always align."},{"id":"mcq7","prompt":"Why did Keynesianism lose its dominance as global economic policy in the 1970s?","options":["The Bretton Woods Conference was officially cancelled","World War II ended, making its policies unnecessary","An oil embargo triggered 'stagflation,' a problem Keynesian policy struggled to fix","The United Nations banned government intervention in markets"],"correctIndex":2,"explanation":"The early-1970s OAPEC oil embargo caused stagnant growth plus high inflation at the same time (stagflation) — a combination Keynesian theory couldn't resolve, opening the door to neoliberalism."},{"id":"mcq8","prompt":"Which scenario best illustrates 'McDonaldization' as Ritzer described it?","options":["A family farm selling produce at a weekly local market","A food delivery app that turns every order into a fast, predictable, trackable process","A handwritten letter mailed between two friends","A community potluck where everyone brings a different homemade dish"],"correctIndex":1,"explanation":"McDonaldization is about efficiency, calculability, predictability, and control spreading across society — a standardized, automated delivery app is a textbook modern example."},{"id":"mcq9","prompt":"Which of the following is an example of liberal internationalism rather than socialist internationalism?","options":["The Communist International (ComIntern)","The League of Nations","A vision of a classless, stateless global society","Marxist calls for global worker solidarity beyond national borders"],"correctIndex":1,"explanation":"The League of Nations, advocated by Woodrow Wilson, is the classic liberal internationalist example — cooperative, sovereign nation-states, unlike the Marxist-based ComIntern."},{"id":"mcq10","prompt":"A developing country privatizes its state-owned industries and removes trade regulations after receiving a World Bank loan under a Structural Adjustment Program. Who is most likely to benefit from this situation?","options":["Local small businesses, since regulations are reduced","Transnational Corporations, since they have the capital to acquire the newly privatized industries","The country's government, since it keeps full ownership of the industries","Neighboring periphery countries, since trade barriers disappear equally for everyone"],"correctIndex":1,"explanation":"SAPs are criticized precisely because privatization and deregulation tend to open markets that large foreign TNCs — not local businesses — have the capital to dominate."}],"recollection":[{"id":"rec1","prompt":"Name Henslin's Social Revolutions, in order (name at least 4 of the 5, including the proposed one).","acceptableAnswers":["domestication","agricultural","industrial","information","biotech"],"minHits":4,"explanation":"Domestication → Agricultural (plow) → Industrial (steam engine) → Information (microchip) → proposed Biotech (genome decoding)."},{"id":"rec2","prompt":"Name the five permanent member-states of the UN Security Council.","acceptableAnswers":["united states","united kingdom","france","russia","china"],"minHits":4,"explanation":"The US, UK, France, Russia, and China each hold veto power on the Security Council."},{"id":"rec3","prompt":"Name the three elements of neoliberalism (as demonstrated through the Philippines' higher education system in class).","acceptableAnswers":["market liberalization","deregulation","privatization"],"minHits":3,"explanation":"Market liberalization, deregulation, and privatization — seen in PH higher ed through foreign universities entering the market, loosely-regulated private colleges, and tuition-dependent institutions."},{"id":"rec4","prompt":"Name the three 'sui generis' powers of international organizations.","acceptableAnswers":["classification","definition","norm diffusion"],"minHits":3,"explanation":"The power of classification, the power of definition, and the power of norm diffusion — e.g. the WHO declaring pandemics, setting health standards, and spreading vaccination guidelines."},{"id":"rec5","prompt":"Name the three zones in Wallerstein's World Systems Theory.","acceptableAnswers":["core","semi-periphery","periphery"],"minHits":3,"explanation":"Core (rich, industrialized), semi-periphery (partly industrialized, both exploits and is exploited), and periphery (non-industrialized, supplies cheap labor/raw materials)."}]},"B":{"mixmatch":[{"id":"b_mm1","prompt":"The German sociologist who described the shift from close-knit traditional communities to impersonal urban society as societies modernized.","answerTerm":"FERDINAND TONNIES","explanation":"Tönnies coined Gemeinschaft (traditional/rural) and Gesellschaft (modern/urban) to describe this shift as part of the Traditional-Modern Model."},{"id":"b_mm2","prompt":"Max Weber's concept describing how modern society's obsession with rules and efficiency traps individuals in rigid, inescapable systems.","answerTerm":"IRON CAGE","explanation":"It originated from how the Protestant work ethic became an end in itself, stripped of its original spiritual meaning."},{"id":"b_mm3","prompt":"The 1789 event that tore down the French monarchy and feudal order under the banner of \"Liberty, Equality, Fraternity.\"","answerTerm":"FRENCH REVOLUTION","explanation":"A key material force behind modernity, alongside the Enlightenment and Industrial Revolution; its ideals spread across Europe through the Napoleonic Wars."},{"id":"b_mm4","prompt":"The invention that powered the Industrial Revolution, which began in Great Britain in 1765 and no longer depended on human or animal power.","answerTerm":"STEAM ENGINE","explanation":"This invention let production shift from agriculture to industry, creating a surplus of goods far beyond what agricultural society could manage."},{"id":"b_mm5","prompt":"John Locke's principle that a government's authority is only legitimate if the people being governed agree to be ruled by it.","answerTerm":"CONSENT OF THE GOVERNED","explanation":"This became the philosophical foundation of democratic legitimacy, fueling the shift from monarchy to democratic systems."},{"id":"b_mm6","prompt":"The post-WWII international relations system built on multilateralism and cooperative institutions like the UN, World Bank, and IMF.","answerTerm":"THE NEW WORLD ORDER","explanation":"It reflects the postwar push to avoid another global conflict through shared rules rather than old balance-of-power politics."},{"id":"b_mm7","prompt":"Immanuel Wallerstein's theory dividing the world economy into core, periphery, and semi-periphery countries to explain global inequality.","answerTerm":"WORLD SYSTEMS THEORY","explanation":"The theory frames inequality as a structural system, not an accident, with roots in colonial history."},{"id":"b_mm8","prompt":"Marshall McLuhan's concept describing how mass media makes the world feel like one connected community sharing similar values.","answerTerm":"GLOBAL VILLAGE","explanation":"Originally tied to the global spread of television, now also discussed through social media trends and phenomena like the Korean Wave."},{"id":"b_mm9","prompt":"George Ritzer's concept describing how fast-food principles — efficiency, calculability, predictability, control — have spread across modern society.","answerTerm":"MCDONALDIZATION","explanation":"Ritzer calls the downside the 'irrationality of rationality' — efficient systems that can still feel impersonal."},{"id":"b_mm10","prompt":"The organization, active from 1919 to 1943, that promoted socialist internationalism and global working-class solidarity beyond national borders.","answerTerm":"COMMUNIST INTERNATIONAL","explanation":"Also known as the ComIntern, it's the historical example of socialist internationalism, in contrast to the liberal internationalist League of Nations."}],"identification":[{"id":"b_id1","prompt":"Descartes' famous principle, \"I think, therefore I am,\" which placed individual reason at the center of certain knowledge.","acceptableAnswers":["COGITO ERGO SUM","COGITO, ERGO SUM","CARTESIAN I"],"explanation":"This became foundational to the Enlightenment's belief that people could understand the world through reason rather than tradition or religious authority."},{"id":"b_id2","prompt":"Adam Smith's idea that individuals pursuing self-interest in a free market unintentionally benefit society, making state control unnecessary.","acceptableAnswers":["INVISIBLE HAND","THE INVISIBLE HAND"],"explanation":"This became the intellectual backbone of classical liberalism, directly challenging mercantilism's state-controlled trade."},{"id":"b_id3","prompt":"The historical event, roughly 5,000–6,000 years ago, marked by the invention of the plow, credited as the \"Dawn of Civilization.\"","acceptableAnswers":["AGRICULTURAL REVOLUTION","THE AGRICULTURAL REVOLUTION"],"explanation":"The surplus it created freed people's time for the first time, enabling cities, writing, math, and the calendar."},{"id":"b_id4","prompt":"Henslin's First Social Revolution, where hunting-gathering groups discovered they could tame animals or cultivate plants.","acceptableAnswers":["DOMESTICATION","DOMESTICATION SOCIAL REVOLUTION"],"explanation":"This single shift branched society into pastoral (herding, nomadic) and horticultural (farming, settled) societies."},{"id":"b_id5","prompt":"The era where the hallmark of the economy is information itself, rather than raw materials or manufacturing.","acceptableAnswers":["AGE OF INFORMATION","THE AGE OF INFORMATION","INFORMATION AGE"],"explanation":"Tied to Henslin's Fourth Social Revolution, triggered by the invention of the microchip."},{"id":"b_id6","prompt":"Tönnies's term for a rural, tight-knit traditional community connected by kinship, place, and custom.","acceptableAnswers":["GEMEINSCHAFT"],"explanation":"The opposite of Gesellschaft — part of the Traditional-Modern Model describing the shift toward 'modern' society."},{"id":"b_id7","prompt":"Tönnies's term for an urban, individualistic society defined by impersonal, contractual relationships.","acceptableAnswers":["GESELLSCHAFT"],"explanation":"This describes city life as societies modernize — people relate more as individuals pursuing their own interests."},{"id":"b_id8","prompt":"This modern process refers to the diminishing influence of religious institutions over state decisions and public life.","acceptableAnswers":["SECULARIZATION"],"explanation":"One half of the 'rationalization of society' during the Industrial Revolution, driven by the Enlightenment's focus on reason."},{"id":"b_id9","prompt":"This modern process refers to explaining the natural world through observation and experimentation rather than tradition or religion.","acceptableAnswers":["SCIENTIFIC REVOLUTION","THE SCIENTIFIC REVOLUTION"],"explanation":"The other half of the 'rationalization of society,' and a precondition for the technological innovation that powered industrialization."},{"id":"b_id10","prompt":"Tangible social structures like the economy, political institutions, or physical production — as opposed to discursive forces.","acceptableAnswers":["MATERIAL FORCES","MATERIAL SOCIAL FORCES"],"explanation":"Discursive (intellectual) forces are ideas and beliefs; material forces are real, physical structures and systems."},{"id":"b_id11","prompt":"Napoleon's legal system, exported to the European territories he conquered during the Napoleonic Wars.","acceptableAnswers":["NAPOLEONIC CODE"],"explanation":"Napoleon's core motivation was to spread the French Revolution's ideals by establishing this legal order beyond France's borders."},{"id":"b_id12","prompt":"The alliance of the UK, Austria, Russia, and Prussia, formed after Napoleon's defeat to restore the pre-Revolution monarchy and feudal order.","acceptableAnswers":["CONCERT OF EUROPE","THE CONCERT OF EUROPE"],"explanation":"Also called the Metternich System (1815–1914) — reactionary in purpose, but an early precursor to internationalism."},{"id":"b_id13","prompt":"A group of people who feel connected through shared culture, language, and history, even without ever meeting each other personally.","acceptableAnswers":["NATION"],"explanation":"Following Anderson's definition, a nation is an 'imagined community' — examples include the Bangsamoro, Kurdish, and Basque peoples."},{"id":"b_id14","prompt":"A political entity defined by authority over a population, governance over territory, a government structure, and sovereignty.","acceptableAnswers":["STATE"],"explanation":"Examples include the Philippines, Singapore, and Switzerland — which may contain multiple cultural 'nations' within their borders."},{"id":"b_id15","prompt":"According to Wallerstein's World Systems Theory, rich, industrialized nations that sell high-profit goods, services, and knowledge.","acceptableAnswers":["CORE","CORE COUNTRIES"],"explanation":"Core countries sit at the top of the global economic hierarchy, benefiting from trade with periphery and semi-periphery nations."},{"id":"b_id16","prompt":"According to Wallerstein, countries that are partly industrialized — they exploit periphery countries while still depending on core countries.","acceptableAnswers":["SEMI-PERIPHERY","SEMI PERIPHERY","SEMI-PERIPHERY COUNTRIES"],"explanation":"They occupy the middle position in the world economic hierarchy between rich core countries and dependent periphery countries."},{"id":"b_id17","prompt":"The 1944 conference that created the World Bank and the International Monetary Fund to help manage the postwar global economy.","acceptableAnswers":["BRETTON WOODS CONFERENCE","BRETTON WOODS"],"explanation":"This conference formally established Keynesianism as global economic policy from the mid-1940s to the early 1970s."},{"id":"b_id18","prompt":"A large company that operates production, sales, or services across many countries rather than being confined to one national economy.","acceptableAnswers":["TRANSNATIONAL CORPORATION","TNC"],"explanation":"TNCs are described as direct beneficiaries of WB-IMF austerity SAPs, since they have the capital to buy newly privatized industries."},{"id":"b_id19","prompt":"The idea that the contemporary world is defined by mutual understanding among countries through international agreements and laws.","acceptableAnswers":["MULTILATERALISM"],"explanation":"This is a defining aspect of the New World Order, reflected in institutions like the UN, World Bank, and IMF."},{"id":"b_id20","prompt":"The earliest form of human communication — spoken language, first used to help early humans survive as they traveled into unknown territory.","acceptableAnswers":["ORAL MEDIA","ORAL"],"explanation":"Henslin notes language itself enabled Homo sapiens to successfully travel and habituate the world."},{"id":"b_id21","prompt":"The form of media that emerged once people settled down and needed to record harvests, land boundaries, and trade.","acceptableAnswers":["SCRIPT MEDIA","SCRIPT"],"explanation":"An early example is the Laguna Copper Plate, showing writing's practical and administrative purposes in early societies."},{"id":"b_id22","prompt":"The media technology that let radical ideas spread quickly to the masses, enabling the Protestant Reformation and the French Revolution.","acceptableAnswers":["PRINT MEDIA","PRINT"],"explanation":"The printing press was the first mass media technology able to spread ideas widely and fast enough to spark large-scale change."},{"id":"b_id23","prompt":"A social and economic pattern where acquiring and consuming goods and services becomes a central driver of identity, status, and lifestyle.","acceptableAnswers":["CONSUMERISM"],"explanation":"Driven by media/advertising and globalized production, enabled by a constant stream of cheap, desirable products."},{"id":"b_id24","prompt":"The global spread of South Korean pop culture, particularly K-pop music and K-dramas, used as a case study on cultural homogenization.","acceptableAnswers":["KOREAN WAVE","K-WAVE","THE KOREAN WAVE"],"explanation":"It shows a non-Western culture successfully exporting its own values and aesthetics, complicating McLuhan's originally Western-centric 'global village.'"},{"id":"b_id25","prompt":"The UN body with 15 members, five of which are permanent and hold veto power, primarily responsible for international peace and security.","acceptableAnswers":["UNITED NATIONS SECURITY COUNCIL","UN SECURITY COUNCIL","SECURITY COUNCIL"],"explanation":"Its five permanent members (US, UK, France, Russia, China) can each block a resolution with a single veto."}],"mcq":[{"id":"b_mcq1","prompt":"Which best describes the relationship between the Scientific Revolution and the Industrial Revolution?","options":["They were unrelated historical coincidences","The Scientific Revolution's emphasis on observation and experimentation made inventions like the steam engine possible","The Industrial Revolution came first and inspired the Scientific Revolution","Both only happened after secularization was fully complete"],"correctIndex":1,"explanation":"The Scientific Revolution's way of understanding the world through research and reason was a precondition for the technological innovation that powered industrialization."},{"id":"b_mcq2","prompt":"A classmate says: 'Gemeinschaft describes modern city life, while Gesellschaft describes traditional rural communities.' What is wrong with this statement?","options":["Nothing is wrong with the statement","The terms are swapped — Gemeinschaft is the traditional/rural community, Gesellschaft is the modern/urban society","Tönnies never used these terms to describe community types","Both terms describe the exact same type of community"],"correctIndex":1,"explanation":"Gemeinschaft = rural, close-knit, traditional community. Gesellschaft = urban, individualistic, impersonal society. The classmate has them backwards."},{"id":"b_mcq3","prompt":"Which scenario best illustrates the 'Iron Cage' as Max Weber described it?","options":["A farmer deciding what crops to plant based on the weather","An employee following rigid, standardized office procedures even when they don't really serve any purpose","A family choosing to attend a religious gathering together","A group of friends planning a spontaneous weekend trip"],"correctIndex":1,"explanation":"The Iron Cage describes how modern rationalization and bureaucracy trap individuals in rigid systems they must comply with regardless of personal goals."},{"id":"b_mcq4","prompt":"Why is the Treaty of Westphalia (1648) significant to the modern nation-state system?","options":["It created the United Nations","It formally recognized state sovereignty over domestic affairs, making the state 'prime' over the nation","It ended all future wars in Europe permanently","It established mercantilism as Europe's dominant economic system"],"correctIndex":1,"explanation":"Westphalia established the modern idea of sovereign states recognizing each other's control over their own internal affairs, laying the groundwork for today's nation-state system."},{"id":"b_mcq5","prompt":"A country is partly industrialized — it exploits periphery countries for cheap resources but still economically depends on core countries. According to Wallerstein, this country is a:","options":["Core country","Periphery country","Semi-periphery country","Hegemon"],"correctIndex":2,"explanation":"Semi-periphery countries occupy the middle position: exploiting periphery nations while still being dependent on core nations."},{"id":"b_mcq6","prompt":"Which of the following is the best example of liberal internationalism?","options":["The Communist International (ComIntern)","The League of Nations, based on cooperative, sovereign nation-states","A vision of a classless, borderless global working class","The Concert of Europe's restoration of monarchy"],"correctIndex":1,"explanation":"The League of Nations, advocated by Woodrow Wilson, treats independent, cooperative nation-states as the basis of international relations — the classic liberal internationalist example."},{"id":"b_mcq7","prompt":"Why did print media have a bigger social impact than script media?","options":["Print media could mass-produce copies quickly, spreading ideas to the masses rather than a small literate elite","Script media was actually invented after print media","Print media could only be read by religious authorities","Script media had no real effect on society at all"],"correctIndex":0,"explanation":"The printing press dramatically sped up copying compared to hand-written script, letting radical ideas reach ordinary people fast enough to spark events like the French Revolution."},{"id":"b_mcq8","prompt":"A food delivery app standardizes every order into a fast, trackable, predictable process. Which concept does this best illustrate?","options":["The Iron Cage","McDonaldization","Consent of the Governed","The Invisible Hand"],"correctIndex":1,"explanation":"McDonaldization describes exactly this spread of fast-food-style efficiency, predictability, and control into more areas of modern life."},{"id":"b_mcq9","prompt":"Which best explains why Transnational Corporations (TNCs) are said to benefit from Structural Adjustment Programs (SAPs)?","options":["SAPs ban foreign companies from operating in developing countries","Privatization and deregulation under SAPs open up markets that TNCs, with their capital, can dominate","SAPs only apply to companies based in the same country as the loan recipient","TNCs are legally exempt from all SAP conditions"],"correctIndex":1,"explanation":"When SAPs force governments to privatize and deregulate, large foreign TNCs usually have the capital to buy up newly available industries — not local businesses."},{"id":"b_mcq10","prompt":"According to McLuhan's 'Global Village' concept, what role does media play in the contemporary world?","options":["It isolates cultures from each other entirely","It connects the world into a shared community with increasingly similar (often Western) values","It has no real effect on how people view other cultures","It only spreads culture within a single country's own borders"],"correctIndex":1,"explanation":"McLuhan argued that mass media, starting with television, would make the world feel like one connected 'village' sharing similar values and aspirations."}],"recollection":[{"id":"b_rec1","prompt":"Name the forms of media evolution discussed in class, in order (name at least 3).","acceptableAnswers":["oral","script","print","electronic","digital"],"minHits":3,"explanation":"Oral → Script → Print → Electronic → Digital — each stage increased the speed and reach of how ideas spread to the masses."},{"id":"b_rec2","prompt":"Name the two broad categories of internationalism discussed in class.","acceptableAnswers":["liberal internationalism","socialist internationalism"],"minHits":2,"explanation":"Liberal internationalism (cooperative nation-states, e.g. League of Nations) and socialist internationalism (classless/stateless society, e.g. ComIntern)."},{"id":"b_rec3","prompt":"Besides the United Kingdom, name the other 'Great Powers' that formed the Concert of Europe after Napoleon's defeat (name at least 2).","acceptableAnswers":["austria","russia","prussia"],"minHits":2,"explanation":"The Concert of Europe (1815–1914) was formed by the UK, Austria, Russia, and Prussia to restore the pre-Revolution monarchy and feudal order."},{"id":"b_rec4","prompt":"Name the two Bretton Woods institutions created in 1944.","acceptableAnswers":["world bank","international bank for reconstruction and development","international monetary fund"],"minHits":2,"explanation":"The World Bank (originally the IBRD) and the International Monetary Fund (IMF) were both created at the 1944 Bretton Woods Conference."},{"id":"b_rec5","prompt":"Name at least two examples of 'nations' (as opposed to states) discussed in class.","acceptableAnswers":["bangsamoro","kurdish","basque"],"minHits":2,"explanation":"The Bangsamoro, Kurdish, and Basque peoples are all examples of 'imagined communities' (nations) that don't neatly map onto a single sovereign state."}]},"C":{"mixmatch":[{"id":"c_mm1","prompt":"A land-based political and economic system where lords controlled land and peasants or serfs tilled it in exchange for protection or a share of production.","answerTerm":"FEUDALISM","explanation":"It emerged once private land property became possible, making social inequality a structural feature of society. The Philippine hacienda system is a direct example."},{"id":"c_mm2","prompt":"Henslin's First Social Revolution — the shift from foraging to taming animals or growing plants.","answerTerm":"DOMESTICATION","explanation":"This single shift branched society into pastoral (herding, nomadic) and horticultural (farming, settled) societies."},{"id":"c_mm3","prompt":"Ferdinand Tönnies's term for a rural, tight-knit, traditional community connected by kinship, place, and custom.","answerTerm":"GEMEINSCHAFT","explanation":"The opposite of Gesellschaft — part of the Traditional-Modern Model describing the shift toward 'modern' society."},{"id":"c_mm4","prompt":"Tönnies's term for an impersonal, individualistic, urban society defined by contractual relationships.","answerTerm":"GESELLSCHAFT","explanation":"This describes city life as societies modernize — people relate more as individuals pursuing their own interests."},{"id":"c_mm5","prompt":"Descartes' principle, translated as \"I think, therefore I am,\" placing individual reason at the center of certain knowledge.","answerTerm":"COGITO ERGO SUM","explanation":"This became foundational to the Enlightenment's belief that people could understand the world through reason rather than tradition or religious authority."},{"id":"c_mm6","prompt":"Adam Smith's idea that individuals pursuing self-interest in a free market unintentionally benefit society, making state control unnecessary.","answerTerm":"INVISIBLE HAND","explanation":"This became the intellectual backbone of classical liberalism, directly challenging mercantilism's state-controlled trade."},{"id":"c_mm7","prompt":"The economic philosophy that ":"c_id3","prompt":"The earliest form of human communication — spoken language, first used to help early humans survive as they traveled into unknown territory.","acceptableAnswers":["ORAL MEDIA","ORAL"],"explanation":"Henslin notes language itself enabled Homo sapiens to successfully travel and habituate the world."},{"id":"c_id4","prompt":"This form of media — the telegraph, telephone, radio, television, and film — was enabled by electricity and rail travel.","acceptableAnswers":["ELECTRONIC MEDIA","ELECTRONIC"],"explanation":"It collapsed distance and time in communication, setting the stage for the kind of global cultural integration we call the 'global village.'"},{"id":"c_id5","prompt":"A social and economic pattern where acquiring and consuming goods and services becomes a central driver of identity, status, and lifestyle.","acceptableAnswers":["CONSUMERISM"],"explanation":"Driven by media/advertising and globalized production, enabled by a constant stream of cheap, desirable products."},{"id":"c_id6","prompt":"Marshall McLuhan's concept describing how mass media makes the world feel like one connected community sharing similar values.","acceptableAnswers":["GLOBAL VILLAGE","THE GLOBAL VILLAGE"],"explanation":"McLuhan argued television (and later other media) would create this shared global culture, often Western in character."},{"id":"c_id7","prompt":"According to Wallerstein's World Systems Theory, rich, industrialized countries that sell high-profit goods, services, and knowledge.","acceptableAnswers":["CORE","CORE COUNTRIES"],"explanation":"Core countries sit at the top of the global economic hierarchy, benefiting from trade with periphery and semi-periphery nations."},{"id":"c_id8","prompt":"According to Wallerstein, countries that never industrialized and instead supply cheap labor and raw materials to richer nations.","acceptableAnswers":["PERIPHERY","PERIPHERY COUNTRIES"],"explanation":"Periphery countries are economically dependent on core countries, which buy their raw materials and labor at low cost."},{"id":"c_id9","prompt":"According to Wallerstein, countries that are partly industrialized — they exploit periphery countries while still depending on core countries.","acceptableAnswers":["SEMI-PERIPHERY","SEMI PERIPHERY","SEMI-PERIPHERY COUNTRIES"],"explanation":"They occupy the middle position in the world economic hierarchy between rich core countries and dependent periphery countries."},{"id":"c_id10","prompt":"Austerity-based economic policy conditions, imposed by the World Bank/IMF on developing countries in exchange for loans.","acceptableAnswers":["STRUCTURAL ADJUSTMENT PROGRAMS","STRUCTURAL ADJUSTMENT PROGRAM","SAP","SAPS"],"explanation":"SAPs typically require spending cuts, privatization, and deregulation — rooted in neoliberal philosophy and the Washington Consensus."},{"id":"c_id11","prompt":"A set of policy recommendations, arising after Keynesianism's failure, promoting privatization, deregulation, and austerity.","acceptableAnswers":["WASHINGTON CONSENSUS"],"explanation":"This set of neoliberal policies became the basis for World Bank/IMF Structural Adjustment Programs."},{"id":"c_id12","prompt":"The idea that the contemporary world is described by mutual understanding among countries through international agreements and laws.","acceptableAnswers":["MULTILATERALISM"],"explanation":"This is a defining aspect of the New World Order, reflected in institutions like the UN, World Bank, and IMF."},{"id":"c_id13","prompt":"A group of people who feel connected through shared culture, language, and history, even without ever meeting each other personally.","acceptableAnswers":["NATION"],"explanation":"Following Anderson's definition, a nation is an 'imagined community' — examples include the Bangsamoro, Kurdish, and Basque peoples."},{"id":"c_id14","prompt":"A political entity defined by authority over a population, governance over territory, a government structure, and sovereignty.","acceptableAnswers":["STATE"],"explanation":"Examples include the Philippines, Singapore, and Switzerland — which may contain multiple cultural 'nations' within their borders."},{"id":"c_id15","prompt":"The 1648 agreement, ending the Thirty Years' War, that formally established sovereign states with authority over their own domestic affairs.","acceptableAnswers":["TREATY OF WESTPHALIA"],"explanation":"This made the state 'prime' over the nation, laying the groundwork for the modern nation-state system."},{"id":"c_id16","prompt":"Napoleon's legal system, exported to the European territories he conquered during the Napoleonic Wars.","acceptableAnswers":["NAPOLEONIC CODE"],"explanation":"Napoleon's core motivation was to spread the French Revolution's ideals by establishing this legal order beyond France's borders."},{"id":"c_id17","prompt":"The type of internationalism, grounded in Marxist ideas, that envisions a classless, stateless global society beyond national borders.","acceptableAnswers":["SOCIALIST INTERNATIONALISM"],"explanation":"Historical example: the Communist International (ComIntern), active 1919–1943 — the opposite approach from liberal internationalism."},{"id":"c_id18","prompt":"The type of internationalism built on cooperative, sovereign nation-states, exemplified by the League of Nations.","acceptableAnswers":["LIBERAL INTERNATIONALISM"],"explanation":"Nationalism/self-determination comes first, then cooperation between independent states — the tradition continued today by the UN."},{"id":"c_id19","prompt":"The 1944 conference that created the World Bank and the International Monetary Fund to manage the postwar global economy.","acceptableAnswers":["BRETTON WOODS CONFERENCE","BRETTON WOODS"],"explanation":"This conference formally established Keynesianism as global economic policy from the mid-1940s to the early 1970s."},{"id":"c_id20","prompt":"Max Weber's concept describing how modern society's obsession with efficiency and bureaucratic rules traps individuals in rigid, inescapable systems.","acceptableAnswers":["IRON CAGE","THE IRON CAGE"],"explanation":"Weber originally used it to explain how the Protestant work ethic became an end in itself, stripped of its original spiritual meaning."},{"id":"c_id21","prompt":"George Ritzer's concept describing how fast-food principles have spread into more and more sectors of modern life.","acceptableAnswers":["MCDONALDIZATION","MCDONALDIZATION OF SOCIETY"],"explanation":"Ritzer calls the downside the 'irrationality of rationality' — efficient systems that can still feel dehumanizing."},{"id":"c_id22","prompt":"The sense of nationhood among Medieval European Christian kingdoms, organized loosely around shared religion rather than a modern nation-state.","acceptableAnswers":["CHRISTENDOM"],"explanation":"Under feudalism, political power revolved around land, so a shared Christian identity substituted for unified nationhood."},{"id":"c_id23","prompt":"The characteristic of international organizations where they function on their own power, not simply as the sum of their member states' interests.","acceptableAnswers":["SUI GENERIS"],"explanation":"This 'in a class of its own' power shows up as the power of classification, definition, and norm diffusion — e.g. the WHO declaring a pandemic."},{"id":"c_id24","prompt":"The oldest known trade route network connecting Ancient China to the Middle East and Europe, dating to around 130 BCE.","acceptableAnswers":["THE SILK ROAD","SILK ROAD"],"explanation":"A classic example of the barter/early trade economy, linking distant civilizations centuries before modern globalization."},{"id":"c_id25","prompt":"A mercantilist trade route connecting Acapulco and Manila that operated from 1565 to 1815.","acceptableAnswers":["THE GALLEON TRADE","GALLEON TRADE"],"explanation":"A direct Philippine example of mercantilism, run by Spain to extract wealth from its colonies."}],"mcq":[{"id":"c_mcq1","prompt":"Which best explains why horticultural societies, unlike nomadic hunting-gathering groups, could build permanent settlements?","options":["They domesticated large herd animals for transportation","Growing crops with hand tools meant they didn't need to abandon used-up land the way foragers did","They had access to steam-powered machinery","Their land was protected by a feudal lord"],"correctIndex":1,"explanation":"Unlike foraging, cultivating crops with hand tools let horticultural groups stay in one place instead of moving on once an area was exhausted."},{"id":"c_mcq2","prompt":"A classmate claims: 'Pastoral and horticultural societies both emerged directly from the Agricultural Revolution.' What is wrong with this statement?","options":["Nothing is wrong with the statement","Both actually emerged from the earlier Domestication Revolution, not the Agricultural Revolution","Pastoral societies actually emerged from the Industrial Revolution instead","Horticultural societies came before hunting-gathering societies"],"correctIndex":1,"explanation":"Domestication (taming animals or cultivating plants) came first and branched into pastoral and horticultural societies. The Agricultural Revolution (the plow) came later."},{"id":"c_mcq3","prompt":"Why does Henslin describe the Agricultural Revolution as the 'Dawn of Civilization'?","options":["It was the first time humans used any tools at all","It created both a food surplus and a time surplus, freeing people to become specialists who built cities, writing, and math","It ended all forms of social inequality","It happened at the same time as the Industrial Revolution"],"correctIndex":1,"explanation":"The plow's surplus freed people's time from constant food-gathering for the first time, enabling cities, writing, mathematics, and the calendar."},{"id":"c_mcq4","prompt":"A government argues that actively intervening in the economy during a recession is necessary for recovery, citing the approach used from the 1940s to the early 1970s. Which economic philosophy are they drawing from?","options":["Mercantilism","Classical liberalism","Keynesianism","Neoliberalism"],"correctIndex":2,"explanation":"Keynesianism, based on John Maynard Keynes's ideas and formalized at Bretton Woods, held that governments should actively regulate the economy during downturns."},{"id":"c_mcq5","prompt":"Which pair correctly matches a concept with the thinker who proposed it?","options":["Consent of the Governed — Adam Smith","Invisible Hand — John Locke","Iron Cage — Max Weber","Cogito, ergo sum — Ferdinand Tönnies"],"correctIndex":2,"explanation":"Weber proposed the Iron Cage. (Consent of the Governed is Locke's; Invisible Hand is Adam Smith's; Cogito, ergo sum is Descartes'.)"},{"id":"c_mcq6","prompt":"A country that was once a periphery nation industrializes partially — it still depends on core countries but now also exploits remaining periphery nations for resources. According to Wallerstein, it has become a:","options":["Core country","Semi-periphery country","Hegemon","Still a periphery country"],"correctIndex":1,"explanation":"Semi-periphery countries occupy exactly this middle position: exploiting periphery nations while still being economically dependent on core nations."},{"id":"c_mcq7","prompt":"Which best distinguishes liberal internationalism from socialist internationalism?","options":["Liberal internationalism rejects all forms of international cooperation","Liberal internationalism is based on cooperative sovereign nation-states, while socialist internationalism envisions a classless, stateless global society","Socialist internationalism was founded by Woodrow Wilson","There is no real difference between the two"],"correctIndex":1,"explanation":"Liberal internationalism (e.g. the League of Nations) treats independent, cooperating nation-states as the basis of international relations; socialist internationalism (e.g. the ComIntern) argues national borders disrupt global worker solidarity."},{"id":"c_mcq8","prompt":"A food delivery app turns every order into a fast, predictable, trackable process. Which concept does this best illustrate?","options":["McDonaldization","The Invisible Hand","Consent of the Governed","Secularization"],"correctIndex":0,"explanation":"McDonaldization describes exactly this spread of fast-food-style efficiency, predictability, and control into more areas of modern life."},{"id":"c_mcq9","prompt":"Why are Transnational Corporations (TNCs) described as the main beneficiaries of Structural Adjustment Programs (SAPs)?","options":["SAPs require governments to subsidize only local businesses","SAPs legally forbid foreign companies from investing in developing countries","Privatization and deregulation under SAPs open up markets that only large, capital-rich TNCs can afford to dominate","TNCs are given free land by the government under SAP rules"],"correctIndex":2,"explanation":"When SAPs force governments to privatize and deregulate, large foreign TNCs usually have the capital to buy up newly available industries — not local businesses."},{"id":"c_mcq10","prompt":"Which of the following best illustrates McLuhan's 'Global Village' concept in today's world?","options":["A small town where no one uses the internet","Social media trends and K-pop spreading instantly across borders and shaping tastes worldwide","A country that has banned all foreign media","Two neighboring countries that have never interacted"],"correctIndex":1,"explanation":"McLuhan argued mass media would make the world feel like one connected 'village' — exactly what global trends like K-pop demonstrate today."}],"recollection":[{"id":"c_rec1","prompt":"List the types of societies discussed in class, from earliest to most recent (name at least 4).","acceptableAnswers":["hunting-gathering","horticultural","pastoral","agricultural","industrial","postindustrial"],"minHits":4,"explanation":"Hunting-gathering → horticultural/pastoral (from Domestication) → agricultural (the plow) → industrial (the steam engine) → postindustrial (information)."},{"id":"c_rec2","prompt":"Name the three core elements of neoliberalism.","acceptableAnswers":["market liberalization","deregulation","privatization"],"minHits":3,"explanation":"Market liberalization, deregulation, and privatization — seen in PH higher ed through foreign universities entering the market, loosely-regulated private colleges, and tuition-dependent institutions."},{"id":"c_rec3","prompt":"Name at least 4 of the 5 permanent member-states of the UN Security Council.","acceptableAnswers":["united states","united kingdom","france","russia","china"],"minHits":4,"explanation":"The US, UK, France, Russia, and China each hold veto power on the Security Council."},{"id":"c_rec4","prompt":"Name the two institutions created at the 1944 Bretton Woods Conference.","acceptableAnswers":["world bank","international monetary fund"],"minHits":2,"explanation":"The World Bank (originally the IBRD) and the International Monetary Fund (IMF) were both created at Bretton Woods to manage the postwar global economy."},{"id":"c_rec5","prompt":"Name at least 3 of the media forms discussed in class, in the order they developed.","acceptableAnswers":["oral","script","print","electronic","digital"],"minHits":3,"explanation":"Oral → Script → Print → Electronic → Digital — each stage increased the speed and reach of how ideas spread to the masses."}]},"D":{"mixmatch":[{"id":"d_mm1","prompt":"This modern process occurred during the Industrial Revolution, where political power and economic activity became more accessible to the public.","answerTerm":"DEMOCRATIZATION","explanation":"As feudal land-based power broke down and wealth shifted to industry, movements pushed for broader political inclusion — eventually expanding rights like voting and jury trial."},{"id":"d_mm2","prompt":"This modern process refers to the diminishing influence of religious institutions over state decisions.","answerTerm":"SECULARIZATION","explanation":"One half of the 'rationalization of society' during cient China to the Middle East and Europe, dating to around 130 BCE.","answerTerm":"THE SILK ROAD","explanation":"A classic example of the barter/early trade economy, linking distant civilizations centuries before modern globalization."},{"id":"d_mm10","prompt":"The 1944 conference that created the World Bank and the International Monetary Fund to manage the postwar global economy.","answerTerm":"BRETTON WOODS CONFERENCE","explanation":"This conference formally established Keynesianism as global economic policy from the mid-1940s to the early 1970s."}],"identification":[{"id":"d_id1","prompt":"A mercantilist trade route connecting Acapulco and Manila that operated from 1565 to 1815.","acceptableAnswers":["THE GALLEON TRADE","GALLEON TRADE"],"explanation":"A direct Philippine example of mercantilism, run by Spain to extract wealth from its colonies."},{"id":"d_id2","prompt":"An early trade economy based on directly exchanging goods and services, without using money.","acceptableAnswers":["BARTER SYSTEM","THE BARTER SYSTEM"],"explanation":"It emerged in agricultural society once division of labor meant people needed to exchange what they specialized in making."},{"id":"d_id3","prompt":"The 16th–18th century economic system where European powers tried to export more than they imported to grow national wealth.","acceptableAnswers":["MERCANTILISM"],"explanation":"Mercantilism treated trade as a zero-sum competition between nations and coincided with feudalism and colonial expansion."},{"id":"d_id4","prompt":"An economic philosophy, also called laissez-faire economics, arguing markets regulate themselves best without government interference.","acceptableAnswers":["CLASSICAL LIBERALISM"],"explanation":"Built on Adam Smith's 'Invisible Hand' idea, it directly challenged mercantilism's state-controlled trade."},{"id":"d_id5","prompt":"The economic philosophy holding that governments must actively intervene during downturns, formalized at the 1944 Bretton Woods Conference.","acceptableAnswers":["KEYNESIANISM"],"explanation":"Based on John Maynard Keynes's ideas, this approach dominated global policy from the mid-1940s to the early 1970s."},{"id":"d_id6","prompt":"The economic philosophy that replaced Keynesianism after the 1970s stagflation crisis, arguing government intervention disrupts the market's self-regulation.","acceptableAnswers":["NEOLIBERALISM"],"explanation":"Neoliberalism gave rise to the Washington Consensus — policies promoting privatization, deregulation, and austerity."},{"id":"d_id7","prompt":"A set of policy recommendations, arising after Keynesianism's failure, promoting privatization, deregulation, and austerity.","acceptableAnswers":["WASHINGTON CONSENSUS"],"explanation":"This set of neoliberal policies became the basis for World Bank/IMF Structural Adjustment Programs."},{"id":"d_id8","prompt":"Austerity-based economic policy conditions, imposed by the World Bank/IMF on developing countries in exchange for loans.","acceptableAnswers":["STRUCTURAL ADJUSTMENT PROGRAMS","STRUCTURAL ADJUSTMENT PROGRAM","SAP","SAPS"],"explanation":"SAPs typically require spending cuts, privatization, and deregulation — rooted in neoliberal philosophy."},{"id":"d_id9","prompt":"A large company that operates production, sales, or services across multiple countries rather than being confined to one national economy.","acceptableAnswers":["TRANSNATIONAL CORPORATION","TNC"],"explanation":"TNCs are described as direct beneficiaries of WB-IMF austerity SAPs, since they have the capital to buy up newly privatized industries."},{"id":"d_id10","prompt":"The 1648 agreement, ending the Thirty Years' War, that formally established sovereign states with authority over their own domestic affairs.","acceptableAnswers":["TREATY OF WESTPHALIA"],"explanation":"This made the state 'prime' over the nation, laying the groundwork for the modern nation-state system."},{"id":"d_id11","prompt":"The alliance of the UK, Austria, Russia, and Prussia, formed after
