<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cybersecurity Essentials Practice Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --paper: #eef2f4;
  --card: #ffffff;
  --ink: #14232d;
  --muted: #566a76;
  --line: #cbd6dc;
  --accent: #1b5fa8;
  --accent-ink: #ffffff;
  --accent-soft: #e2edf8;
  --ok: #1b7a4d;
  --ok-bg: #e2f3ea;
  --bad: #b2322a;
  --bad-bg: #fbe6e3;
  --cell: #d6dfe4;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display: "Bitter", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1a21; --card: #17262f; --ink: #e6eef2; --muted: #9db0bb; --line: #2b3d48;
    --accent: #6fb0f2; --accent-ink: #0b1720; --accent-soft: #1c3347;
    --ok: #62d09b; --ok-bg: #153427; --bad: #ff8d84; --bad-bg: #3a1c1a; --cell: #2b3d48;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1a21; --card: #17262f; --ink: #e6eef2; --muted: #9db0bb; --line: #2b3d48;
  --accent: #6fb0f2; --accent-ink: #0b1720; --accent-soft: #1c3347;
  --ok: #62d09b; --ok-bg: #153427; --bad: #ff8d84; --bad-bg: #3a1c1a; --cell: #2b3d48;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 1.0625rem; line-height: 1.5; }
.wrap { max-width: 44rem; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.2; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.home-title { font-size: 1.75rem; margin: 1rem 0 0.4rem; }
.home-sub { color: var(--muted); margin: 0 0 1.5rem; max-width: 34rem; }
.modlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.75rem; }
.mod { width: 100%; text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 0.25rem 1rem; align-items: center; background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 0.9rem 1rem; }
.mod:hover { border-color: var(--accent); }
.mod .num { color: var(--accent); font-weight: 700; }
.mod .name { font-family: var(--display); font-weight: 500; font-size: 1.1rem; grid-column: 1; }
.mod .meta { grid-column: 1; color: var(--muted); font-size: 0.95rem; }
.mod .score { grid-row: 1 / span 3; grid-column: 2; font-family: var(--display); font-weight: 700; font-size: 1.3rem; text-align: right; }
.mod .score small { display: block; font-family: var(--body); font-weight: 400; font-size: 0.8rem; color: var(--muted); }
.note { color: var(--muted); font-size: 0.95rem; margin-top: 1.5rem; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.9rem; }
.link { background: none; border: none; padding: 0.35rem 0.25rem; color: var(--accent); font-weight: 700; }
.modname { font-family: var(--display); font-weight: 500; font-size: 1rem; text-align: center; flex: 1; }
.tally { color: var(--muted); font-size: 0.95rem; white-space: nowrap; }

.cells { display: grid; grid-template-columns: repeat(25, 1fr); gap: 3px; margin-bottom: 1rem; }
.cell { height: 12px; padding: 0; border: none; border-radius: 2px; background: var(--cell); }
.cell.ok { background: var(--ok); }
.cell.bad { background: var(--bad); }
.cell.cur { outline: 2px solid var(--ink); outline-offset: 1px; }

.qcard { background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 1.1rem 1rem 1.2rem; }
.qcount { color: var(--muted); font-size: 0.95rem; margin: 0 0 0.5rem; }
.qtext { font-family: var(--display); font-weight: 500; font-size: 1.2rem; line-height: 1.4; margin: 0 0 1rem; }
.opts { display: grid; gap: 0.6rem; }
.opt { display: grid; grid-template-columns: 2rem 1fr; gap: 0.75rem; align-items: start; width: 100%; text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 9px; padding: 0.7rem 0.8rem; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt .ltr { display: grid; place-items: center; width: 2rem; height: 2rem; border-radius: 50%; border: 1.5px solid var(--line); font-weight: 700; font-size: 0.95rem; }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt.right .ltr { background: var(--ok); border-color: var(--ok); color: var(--card); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .ltr { background: var(--bad); border-color: var(--bad); color: var(--card); }
.opt.dim { opacity: 0.7; }

.fb { margin-top: 1rem; border-left: 5px solid var(--line); padding: 0.7rem 0.9rem; border-radius: 0 8px 8px 0; background: var(--paper); }
.fb.ok { border-left-color: var(--ok); background: var(--ok-bg); }
.fb.bad { border-left-color: var(--bad); background: var(--bad-bg); }
.fb h3 { font-size: 1.05rem; margin-bottom: 0.3rem; }
.fb p { margin: 0.3rem 0 0; }

.nav { display: flex; justify-content: space-between; gap: 0.75rem; margin-top: 1rem; }
.btn { background: var(--accent); color: var(--accent-ink); border: 1.5px solid var(--accent); border-radius: 9px; padding: 0.65rem 1.1rem; font-weight: 700; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: 0.4; cursor: default; }

.result h2 { font-size: 1.6rem; margin: 0.5rem 0 0.25rem; }
.big { font-family: var(--display); font-weight: 700; font-size: 3rem; line-height: 1; margin: 0.5rem 0; }
.big span { font-size: 1.3rem; color: var(--muted); font-weight: 500; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin: 1rem 0 1.5rem; }
.miss { background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 0.9rem 1rem; margin-bottom: 0.75rem; }
.miss .mq { font-family: var(--display); font-weight: 500; margin: 0 0 0.5rem; }
.miss .you { color: var(--bad); margin: 0.2rem 0; }
.miss .ans { color: var(--ok); margin: 0.2rem 0; font-weight: 700; }
.miss .why { color: var(--muted); margin: 0.4rem 0 0; font-size: 0.97rem; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (prefers-reduced-motion: no-preference) {
  .opt, .mod, .btn { transition: border-color 0.12s, background-color 0.12s; }
}
@media (max-width: 420px) { .cells { grid-template-columns: repeat(25, 1fr); } .qtext { font-size: 1.12rem; } }

.grp { font-size: 1.3rem; margin: 2rem 0 0.2rem; }
.grp:first-of-type { margin-top: 0.5rem; }
.grpsub { color: var(--muted); margin: 0 0 0.8rem; font-size: 0.97rem; }
.hint { color: var(--muted); margin: -0.2rem 0 0.8rem; font-size: 0.97rem; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .ltr { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.checkrow { margin-top: 0.9rem; }
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
const MODULES = [{"id": 1, "label": "Module 1", "title": "Cybersecurity Threats, Vulnerabilities, and Attacks", "qs": [{"q": "What is a threat domain?", "o": ["An area of control, authority, or protection that attackers can exploit to gain access to a system", "A list of malware signatures maintained by a security vendor", "A DNS zone owned by a single organization", "A group of users who share one set of credentials"], "a": 0, "e": "A threat domain is an area of control, authority or protection that attackers can exploit. It is not a signature list, a DNS zone or a group of users."}, {"q": "An authorized user compromises an organization's primary database. Which threat category fits best?", "o": ["Software error", "Human error", "Sabotage", "Hardware failure"], "a": 2, "e": "Deliberate harm by an authorized user is sabotage. Human error would be an accidental mistake such as a data-entry slip."}, {"q": "Water damage after a sprinkler system fails is an example of which category?", "o": ["Software attack", "Theft", "Natural disaster", "Utility interruption"], "a": 3, "e": "The module groups power outages and sprinkler water damage under utility interruption. Natural disasters are events like hurricanes, floods and fires."}, {"q": "Which scenario is an INTERNAL threat?", "o": ["A contract partner connects an infected USB drive to a corporate server", "A hacktivist group launches a DDoS attack", "A skilled attacker exploits a vulnerability from the Internet", "A state-sponsored group probes the network from another country"], "a": 0, "e": "Internal threats come from current or former employees and contract partners, whether accidental or intentional. The other scenarios start outside the organization."}, {"q": "Which group is described as the weakest link in information security systems?", "o": ["Users", "Routers", "Firewalls", "Encryption algorithms"], "a": 0, "e": "The user domain is the weakest link because users can ignore policy, be tricked, or misuse systems, which threatens confidentiality, integrity and availability."}, {"q": "Which is listed as a threat to devices?", "o": ["Rogue users on the guest wireless network", "Inserting unauthorized USB drives, CDs or DVDs into networking devices", "Server downtime during maintenance periods", "Remote users downloading sensitive data from a private cloud"], "a": 1, "e": "Unauthorized removable media on networking devices is a device-domain threat. Server downtime is an application threat and remote downloads are a private-cloud threat."}, {"q": "Which public cloud model provides virtual computing resources such as servers, storage and networking hardware?", "o": ["Platform as a Service (PaaS)", "Infrastructure as a Service (IaaS)", "Private cloud", "Software as a Service (SaaS)"], "a": 1, "e": "IaaS supplies virtual infrastructure. SaaS supplies finished software and PaaS supplies a platform for building and running applications."}, {"q": "Which is described as a continuous attack that uses elaborate espionage tactics, multiple actors and sophisticated malware?", "o": ["Logic bomb", "Grayware", "Advanced persistent threat (APT)", "Smishing"], "a": 2, "e": "An APT is a long-running, coordinated espionage-style attack. The other options are single techniques, not sustained campaigns."}, {"q": "A program that runs on a user's machine and installs a backdoor to give administrative control is called a?", "o": ["Remote administrative tool (RAT)", "Logic bomb", "Packet sniffer", "Keylogger"], "a": 0, "e": "A RAT installs a backdoor that provides administrative control over the target computer."}, {"q": "Which malware modifies the operating system to create a backdoor and often uses privilege escalation?", "o": ["Ransomware", "Grayware", "Worm", "Rootkit"], "a": 3, "e": "Rootkits alter the OS to create a backdoor and most use software vulnerabilities to escalate privileges and modify system files."}, {"q": "An indicator of compromise (IOC) is best described as?", "o": ["A firewall rule that blocks ICMP traffic", "Evidence of a security breach and details about it, such as a malware signature or a domain name", "A vendor patch that fixes a known vulnerability", "A description of an attacker's motivation and intended strategy"], "a": 1, "e": "IOCs provide evidence of a breach. Motivation and strategy belong to indicators of attack, which are covered in Module 2."}, {"q": "Which pair of standardized languages does CISA's Automated Indicator Sharing (AIS) use?", "o": ["SQL and XML", "SMTP and IMAP", "STIX and TAXII", "WEP and WPA"], "a": 2, "e": "AIS exchanges threat indicators in real time using STIX and TAXII."}, {"q": "Social engineering is best described as?", "o": ["A technique for overflowing memory buffers", "A non-technical strategy that manipulates people into performing actions or divulging confidential information", "A hardware device that records keystrokes", "A method of decrypting captured network traffic"], "a": 1, "e": "Social engineering targets people rather than technology."}, {"q": "An attacker lies to gain access to confidential data. Which social engineering type is this?", "o": ["Shoulder surfing", "Pretexting", "Identity fraud", "Something for something (quid pro quo)"], "a": 1, "e": "Pretexting means lying to gain access. Quid pro quo trades a gift for information, and identity fraud uses a stolen identity."}, {"q": "A caller claims to be a senior executive and demands an urgent password reset. Which tactics is the caller relying on?", "o": ["Scarcity and consensus", "Familiarity and trust only", "Intimidation and scarcity only", "Authority and urgency"], "a": 3, "e": "Claiming a senior role is authority, and demanding immediate action is urgency. Both appear in the module's list of social engineering tactics."}, {"q": "Watching someone enter a PIN with binoculars or a security camera is an example of?", "o": ["Pharming", "Shoulder surfing", "Impersonation", "Dumpster diving"], "a": 1, "e": "Shoulder surfing does not require being close to the victim; binoculars or cameras can be used."}, {"q": "A mantrap (two sets of doors) is mainly used to prevent?", "o": ["RF jamming", "SQL injection", "DNS spoofing", "Piggybacking and tailgating"], "a": 3, "e": "In a mantrap, people enter through an outer door that must close before the inner door opens, stopping unauthorized people from following an authorized person in."}, {"q": "Which is listed as another method of deception?", "o": ["Watering hole attack", "Smurf attack", "Bluesnarfing", "MAC flooding"], "a": 0, "e": "The module's list includes invoice scam, watering hole attack, typosquatting, prepending and influence campaigns."}, {"q": "Which behavior best defends against deception?", "o": ["Never disclosing credentials to unknown parties by email, chat, text, phone or in person", "Clicking enticing links to check whether they are real", "Giving in to pressure when the requester sounds convincing", "Accepting automatic downloads so software stays current"], "a": 0, "e": "The module advises refusing to share credentials with unknown parties, resisting enticing links, being wary of uninitiated downloads, and not yielding to pressure."}, {"q": "Which malware replicates by independently exploiting vulnerabilities in networks?", "o": ["Trojan horse", "Worm", "Virus", "Logic bomb"], "a": 1, "e": "A worm spreads on its own through network vulnerabilities. A virus must attach itself to another file or program."}, {"q": "Which malware carries out malicious operations while appearing to be legitimate software?", "o": ["Ransomware", "Worm", "Virus", "Trojan horse"], "a": 3, "e": "A Trojan horse masks its true intent and looks legitimate."}, {"q": "A malicious program stays inactive until a trigger such as a specific date or database entry. What is it?", "o": ["Ransomware", "Logic bomb", "Worm", "Keylogger"], "a": 1, "e": "A logic bomb waits for a trigger event before running its malicious code."}, {"q": "What are the two main types of DoS attacks described in the module?", "o": ["An overwhelming quantity of traffic and maliciously formatted packets", "DNS spoofing and ARP spoofing", "XSS and SQL injection", "MitM and MitMO"], "a": 0, "e": "DoS either floods the target with more data than it can handle or sends a malformed packet that the receiver cannot process."}, {"q": "Which describes DNS cache poisoning (DNS spoofing)?", "o": ["An attacker sends bulk email through an open relay", "An attacker floods a switch with fake MAC addresses", "False data is introduced into a DNS resolver's cache so traffic for a domain is redirected to the attacker's computer", "An attacker takes control of a domain registration to change DNS settings"], "a": 2, "e": "Cache poisoning corrupts the resolver's temporary database. Taking over a domain's DNS information is domain hijacking."}, {"q": "What does a MAC flooding attack do?", "o": ["Jams radio signals", "Redirects users to a fake website", "Records every key pressed on a keyboard", "Floods the network with fake MAC addresses to compromise the security of the network switch"], "a": 3, "e": "MAC flooding is a Layer 2 attack that overwhelms the switch with fake MAC addresses."}, {"q": "What is a MitMO (Man-in-the-Mobile) attack?", "o": ["A DoS attack aimed at mobile apps", "A man-in-the-middle variation that takes control of a mobile device so it sends sensitive information to the attackers", "An attack that jams cellular towers", "An attack that clones SIM cards only"], "a": 1, "e": "MitMO is a MitM variation in which an infected mobile device exfiltrates user-sensitive information to the attacker."}, {"q": "Why is a zero-day attack especially dangerous?", "o": ["It only affects devices that are turned off", "It always destroys hardware", "It can only be launched after a patch is released", "The network is highly vulnerable between discovery of the exploit and the vendor's release of a patch"], "a": 3, "e": "Zero-day attacks exploit flaws before they are known or fixed, leaving a window (illustrated as Day 0 to Day 16) before a patch is deployed."}, {"q": "Which defense helps reduce DoS and DDoS attacks by limiting error and control messages from outside the network?", "o": ["Blocking external ICMP packets at the firewall", "Allowing all inbound ICMP traffic", "Concentrating all workload on a single server", "Disabling security patches"], "a": 0, "e": "Firewalls can block external ICMP packets to prevent DoS and DDoS attacks, and distributing workload across servers also helps."}, {"q": "What is grayware?", "o": ["Malware that encrypts files for ransom", "An unwanted application that behaves in an annoying or undesirable way and may track location or deliver unwanted ads", "A wireless jamming device", "A firewall misconfiguration"], "a": 1, "e": "Grayware may not carry recognizable malware but can still pose a risk to the user."}, {"q": "What is SMiShing?", "o": ["Copying contacts over Bluetooth", "Phishing by phone call", "Fake text messages that lure users to a malicious website or fraudulent phone number", "Sending shocking images via Bluetooth"], "a": 2, "e": "SMiShing is short message service phishing. Phone-call phishing is vishing."}, {"q": "An attacker sets up an access point that looks like a better connection than the real one so clients connect to it. What is this called?", "o": ["Evil twin", "Smishing", "Grayware", "Bluejacking"], "a": 0, "e": "An evil twin imitates a legitimate AP so the attacker can analyze traffic and run MitM attacks."}, {"q": "To successfully jam a wireless signal, what must the jammer match?", "o": ["The IP address of the gateway", "The SSID and password of the network", "The MAC address of the access point", "The frequency, modulation and power of the target device"], "a": 3, "e": "Effective RF jamming requires equal frequency, modulation and power."}, {"q": "Which attack copies information such as emails and contact lists from a device over Bluetooth?", "o": ["Jamming", "Bluejacking", "Smishing", "Bluesnarfing"], "a": 3, "e": "Bluesnarfing copies data. Bluejacking only sends unauthorized messages or images."}, {"q": "Why is WPA2 considered stronger than WEP?", "o": ["WPA2 uses a static key that never changes", "An attacker cannot recover WPA2's encryption key by observing network traffic", "WPA2 only works on wired networks", "WPA2 uses no encryption and is therefore faster"], "a": 1, "e": "WEP had no key management, exposing a lot of traffic data. WPA2 prevents key recovery from observed traffic."}, {"q": "How does cross-site scripting (XSS) work?", "o": ["An attacker alters DNS records for a website", "An attacker floods a switch with fake MAC addresses", "A script injected into a web page runs in the victim's browser and can send cookies or session tokens to the attacker", "An attacker sends too much data to a server's memory buffer"], "a": 2, "e": "XSS exploits web page vulnerabilities so the victim's browser executes the attacker's script, which can steal cookies or session tokens."}, {"q": "Why does a SQL injection attack succeed?", "o": ["The server has too little disk space", "The database is encrypted", "The application does not correctly filter the data a user enters into a SQL statement", "The user chose a long password"], "a": 2, "e": "SQL injection takes advantage of inadequate input filtering."}, {"q": "What happens in a buffer overflow?", "o": ["A router drops packets because its queue is empty", "Data is written beyond the limits of a buffer, letting the application access memory allocated to other processes", "A hard drive runs out of space", "A web page loads too slowly"], "a": 1, "e": "Writing past a buffer's boundary can crash the system, compromise data, or give attackers privilege escalation or control."}, {"q": "What does a cross-site request forgery (CSRF) attack do?", "o": ["Submits unauthorized commands from a user's browser to a trusted web application", "Overwhelms a server's hardware resources", "Injects a malicious DLL into a process", "Repeats a captured transmission"], "a": 0, "e": "CSRF abuses the trust a web application has in the user's browser."}, {"q": "What is a race condition (time of check / time of use) attack?", "o": ["A system is flooded with ICMP echo requests", "A site is cloned for phishing", "A system designed to perform tasks in sequence is forced to perform two or more operations simultaneously", "An attacker guesses passwords at high speed"], "a": 2, "e": "A race condition attack exploits timing in operations that were meant to occur in order."}, {"q": "What does a directory traversal attack let an attacker do?", "o": ["Read files on the web server outside of the website's directory, such as configuration files", "Redirect users to a fake website", "Record keystrokes", "Change MAC addresses on a switch"], "a": 0, "e": "Directory traversal can expose server configuration files and even lead to control of the server."}, {"q": "What is a replay attack?", "o": ["A worm copies itself to every host", "A site is overloaded with DNS queries", "An attacker repeatedly guesses a password", "A valid data transmission is maliciously or fraudulently repeated or delayed"], "a": 3, "e": "In a replay attack the attacker intercepts, amends and resubmits data to make the receiver act on it."}, {"q": "How does a resource exhaustion attack differ from a typical DoS attack?", "o": ["It overwhelms the hardware resources of the target server rather than network bandwidth", "It encrypts the victim's files", "It only affects wireless networks", "It requires physical access to the server"], "a": 0, "e": "Resource exhaustion crashes or hangs a program or system by consuming the target server's hardware resources, not network bandwidth."}, {"q": "Which indicator is typical of spam?", "o": ["The email comes from a known colleague and has a clear subject", "The email contains short, familiar links", "The email asks you to open an attachment, often urgently", "The email is digitally signed by your organization"], "a": 2, "e": "Indicators include no subject line, requests to update account details, misspellings, long cryptic links, and urgent attachment requests."}, {"q": "What makes spear phishing different from ordinary phishing?", "o": ["It is sent only by text message", "It targets only senior executives", "It uses voice calls", "The emails are customized for a specific person using information the attacker knows about them"], "a": 3, "e": "Spear phishing is highly targeted. Targeting senior executives is whaling."}, {"q": "Which scam uses voice communication technology to get victims to give up information such as credit card details?", "o": ["Vishing", "Pharming", "Whaling", "Smishing"], "a": 0, "e": "Vishing is voice phishing. Pharming redirects users to a fake site and whaling targets high-profile people."}, {"q": "Which attack deliberately misdirects users to a fake version of an official website?", "o": ["Pretexting", "Whaling", "Pharming", "Vishing"], "a": 2, "e": "Pharming sends users to a fraudulent copy of a legitimate site."}, {"q": "Which phishing attack targets high-profile individuals such as senior executives, politicians and celebrities?", "o": ["Smishing", "Pharming", "Whaling", "Vishing"], "a": 2, "e": "Whaling aims at high-value targets."}, {"q": "Which organization is described as an international association of companies working to eliminate identity theft and fraud from phishing and email spoofing?", "o": ["Cisco Talos", "US-CERT", "National Cyber Security Alliance (NCSA)", "Anti-Phishing Working Group (APWG)"], "a": 3, "e": "The module recommends becoming a member of the APWG."}, {"q": "How can adversarial artificial intelligence attacks harm a machine learning system?", "o": ["By flooding the network with ICMP echo requests", "By physically destroying the server", "By feeding it tainted data that corrupts the model's predictions", "By jamming Wi-Fi signals"], "a": 2, "e": "Machine learning models depend on their input data, so tainted data can negatively affect predicted outcomes."}, {"q": "Which is an example of a supply chain attack?", "o": ["A router is left with default passwords", "An attacker intercepts components or software an organization buys from a third party", "A user clicks a phishing link", "An employee shoulder surfs a coworker"], "a": 1, "e": "Supply chain attacks target the third-party components and software that organizations depend on."}], "group": "practice"}, {"id": 2, "label": "Module 2", "title": "Securing Networks", "qs": [{"q": "Which organization maintains the interactive Cyberthreat Real-Time Map referenced in the module?", "o": ["NCSA", "Cisco", "Kaspersky", "CISA"], "a": 2, "e": "The module names Kaspersky as the maintainer, using attack data submitted from its network security products worldwide."}, {"q": "Network security relates most directly to which organizational concern?", "o": ["Marketing budgets", "Office space planning", "Employee payroll cycles", "Business continuity"], "a": 3, "e": "Breaches can disrupt e-commerce, cause data loss and compromise integrity, so network security is tied to business continuity."}, {"q": "Which is a possible consequence of a network security breach?", "o": ["A guaranteed increase in network speed", "Automatic insurance payouts for every company", "Only cosmetic changes to a website", "Lost revenue, theft of intellectual property, lawsuits, and even threats to public safety"], "a": 3, "e": "The module lists lost revenue, intellectual property theft, lawsuits and threats to public safety."}, {"q": "What is the Cisco Talos Intelligence Group used for in this module?", "o": ["A type of wireless authentication", "A DoS attack tool", "A resource that helps network administrators adapt, develop and implement threat mitigation techniques", "A government awareness campaign"], "a": 2, "e": "Talos and Cisco PSIRT are given as examples of tools that help administrators with threat mitigation."}, {"q": "What does PSIRT stand for in the module?", "o": ["Product Security Incident Response Team", "Public Security Internet Review Task", "Packet Security Inspection and Routing Table", "Protected Server Intrusion Reporting Tool"], "a": 0, "e": "Cisco PSIRT is the Product Security Incident Response Team."}, {"q": "What does the \"Defense in Depth\" approach emphasize?", "o": ["Trusting all internal users", "Using multiple layers of defense", "Relying on one strong firewall", "Disabling logging to save resources"], "a": 1, "e": "Defense in Depth is the layered approach presented by Cisco Security Architect Matt Carling in the video."}, {"q": "What is an attack vector?", "o": ["A type of encryption key", "A firewall rule set", "A list of known vulnerabilities", "A path by which a threat actor can gain access to a server, host or network"], "a": 3, "e": "An attack vector is the path used to reach the target, and it can originate inside or outside the network."}, {"q": "According to the module, which type of threat has the potential to cause more significant damage?", "o": ["Internal threats", "Natural disasters only", "Threats from script kiddies only", "External threats"], "a": 0, "e": "Internal users already have access and knowledge, so internal threats can be more damaging than external ones."}, {"q": "Which action by an internal user is given as an example of an attack vector?", "o": ["Attending a security awareness class", "Connecting an infected USB drive to a corporate computer", "Updating antivirus signatures", "Replacing a switch under warranty"], "a": 1, "e": "Connecting infected removable media is an internal attack vector, whether accidental or intentional."}, {"q": "Which data loss vector is described as the most common?", "o": ["Hard copy documents", "Removable media", "Cloud storage", "Email and social networking, including instant messaging"], "a": 3, "e": "Instant messaging software and social media sites are the most common vector, and intercepted messages can reveal confidential information."}, {"q": "Why are unencrypted devices a data loss risk?", "o": ["They cannot connect to Wi-Fi", "They cannot be backed up", "A stolen laptop can let the thief retrieve valuable personal data if it is not encrypted", "They run slower than encrypted devices"], "a": 2, "e": "If data is not stored with an encryption algorithm, anyone who steals the device can read it."}, {"q": "How can cloud storage lead to data loss?", "o": ["Cloud providers always delete old files", "Sensitive data can be lost if access to the cloud is compromised through weak security settings", "Cloud storage prevents encryption", "Cloud storage is never accessible from the Internet"], "a": 1, "e": "The module notes the benefits of cloud storage but warns that weak security settings can expose data."}, {"q": "What is a data loss risk associated with removable media?", "o": ["An employee could make an unauthorized transfer to a USB drive, or the drive could be lost", "It cannot be formatted", "The media cannot store large files", "The media always contains malware"], "a": 0, "e": "Both unauthorized copying and losing a USB drive holding corporate data are risks."}, {"q": "Why should hard copy corporate data be shredded when no longer needed?", "o": ["Paper cannot be recycled", "A thief could retrieve discarded reports and gain valuable information", "Printers require it", "It reduces storage costs"], "a": 1, "e": "Discarded printouts can be collected by thieves, so they should be disposed of thoroughly."}, {"q": "Which is described as the first line of defense in preventing improper access?", "o": ["Passwords", "Hard copies", "Network cables", "Screensavers"], "a": 0, "e": "Stolen passwords or weak passwords give attackers easy access to corporate data."}, {"q": "Which term describes a potential danger to an asset such as data or the network itself?", "o": ["Threat", "Risk", "Exploit", "Vulnerability"], "a": 0, "e": "A threat is a potential danger. A vulnerability is a weakness, an exploit is the mechanism used against it, and risk is the likelihood and consequence."}, {"q": "Which term describes a weakness in a system or its design that a threat could exploit?", "o": ["Threat", "Risk", "Vulnerability", "Attack surface"], "a": 2, "e": "A vulnerability is the weakness. The attack surface is the total of all such weaknesses accessible to an attacker."}, {"q": "What is an attack surface?", "o": ["A single vulnerable application", "The number of users in an organization", "The physical size of a data center", "The total sum of vulnerabilities in a system that are accessible to an attacker"], "a": 3, "e": "The attack surface covers the different points where an attacker could get into a system and get data out."}, {"q": "What characterizes a remote exploit?", "o": ["It requires physical access to the machine", "It works over the network without the attacker needing an account on the target system", "It only works against wireless networks", "It requires administrative access to the end system"], "a": 1, "e": "A remote exploit needs no prior access to the target system. A local exploit requires some user, administrative or physical access."}, {"q": "What characterizes a local exploit?", "o": ["The threat actor has some user or administrative access to the end system", "It can only be launched from another country", "The attacker needs no access of any kind", "It only affects cloud services"], "a": 0, "e": "A local exploit requires some level of access to the system, though not necessarily an account on it if the attacker has physical access."}, {"q": "What is risk?", "o": ["A weakness in system design", "The likelihood that a threat will exploit a specific vulnerability of an asset and cause an undesirable consequence", "The mechanism used to compromise an asset", "A list of all possible attackers"], "a": 1, "e": "Risk combines likelihood and consequence, linking threat and vulnerability."}, {"q": "Which risk management strategy is used when the cost of managing the risk outweighs the cost of the risk itself?", "o": ["Risk reduction", "Risk acceptance", "Risk transfer", "Risk avoidance"], "a": 1, "e": "Under risk acceptance the risk is accepted and no action is taken because mitigation costs more than the risk."}, {"q": "Which strategy removes exposure by eliminating the activity or device that presents the danger, even though its benefits are lost?", "o": ["Risk acceptance", "Risk transfer", "Risk avoidance", "Risk reduction"], "a": 2, "e": "Avoidance eliminates the activity, and any possible benefits from it are lost as well."}, {"q": "Which risk management strategy is the most commonly used?", "o": ["Risk transfer", "Risk avoidance", "Risk acceptance", "Risk reduction"], "a": 3, "e": "Risk reduction decreases exposure or impact through action, and requires evaluating the costs of loss, the strategy and the benefits."}, {"q": "A company buys cyber insurance to cover losses from a breach. Which strategy is this?", "o": ["Risk transfer", "Risk reduction", "Risk avoidance", "Risk acceptance"], "a": 0, "e": "Transferring some or all of the risk to a willing third party, such as an insurer, is risk transfer."}, {"q": "A company decides to stop offering a service entirely because it cannot be secured, losing the revenue from it. Which strategy is this?", "o": ["Risk acceptance", "Risk transfer", "Risk avoidance", "Risk reduction"], "a": 2, "e": "Removing the activity to eliminate exposure is risk avoidance, and its benefits are lost."}, {"q": "Which description matches a white hat hacker?", "o": ["A criminal who attacks networks for personal gain", "An ethical hacker who uses programming skills for good, legal purposes, such as penetration testing", "Someone who discloses a vulnerability publicly after compromising a network without permission", "A teenager running existing scripts"], "a": 1, "e": "White hats are ethical hackers who may perform penetration tests to find vulnerabilities."}, {"q": "Which is an example of a grey hat hacker?", "o": ["An employee hired to run penetration tests", "A criminal who steals card numbers", "A government employee gathering intelligence", "Someone who compromises a network without permission and then discloses the vulnerability publicly"], "a": 3, "e": "Grey hats commit arguably unethical acts but not for personal gain or to cause damage."}, {"q": "Which description matches a black hat hacker?", "o": ["A network professional who protects networks", "A hacker who posts protest videos", "An ethical penetration tester", "An unethical criminal who violates systems for personal gain or malicious reasons"], "a": 3, "e": "Black hats exploit vulnerabilities to compromise systems for personal gain or to cause harm."}, {"q": "Which threat actors emerged in the 1990s and are typically teenagers or inexperienced people running existing scripts and tools to cause harm?", "o": ["Cybercriminals", "Vulnerability brokers", "Script kiddies", "State-sponsored hackers"], "a": 2, "e": "Script kiddies use existing tools and usually do not act for profit."}, {"q": "Which threat actors typically discover exploits and report them to vendors, sometimes for prizes or rewards?", "o": ["Hacktivists", "Script kiddies", "Cybercriminals", "Vulnerability brokers"], "a": 3, "e": "Vulnerability brokers are typically grey hats who find and report exploits."}, {"q": "Which threat actors rally and protest against political and social ideas by leaking information and performing DDoS attacks?", "o": ["Hacktivists", "Vulnerability brokers", "Cybercriminals", "Script kiddies"], "a": 0, "e": "Hacktivists are grey hat hackers who protest publicly against organizations or governments."}, {"q": "What primarily motivates cybercriminals?", "o": ["Political protest", "Making money by any means necessary", "Curiosity about scripts", "Winning bug bounty prizes"], "a": 1, "e": "Cybercriminals are black hat actors, often financed by criminal organizations, who steal billions of dollars a year."}, {"q": "What do state-sponsored hackers do?", "o": ["Protest by defacing websites", "Run existing scripts for fun", "Steal government secrets, gather intelligence and sabotage the networks of foreign governments, terrorist groups and corporations", "Report bugs to vendors for rewards"], "a": 2, "e": "State-sponsored hackers act for a government and may be viewed as white or black hats depending on perspective."}, {"q": "Which statement about the cybercriminal underground economy is true?", "o": ["It is run by government agencies", "It does not involve stolen data", "It only trades legal software", "Cybercriminals buy, sell and trade exploits, tools, and stolen personal information and intellectual property"], "a": 3, "e": "The module describes an underground market for exploits and stolen data."}, {"q": "Which statement about cybersecurity responsibility is correct?", "o": ["Only large corporations need it", "Cybersecurity is a shared responsibility that all users must practice", "Only vendors are responsible", "Only the IT department is responsible"], "a": 1, "e": "The module stresses that cybersecurity is a shared responsibility and that threat actors target home users, small businesses and large organizations alike."}, {"q": "Which item appears on the cybersecurity checklist shown in the module?", "o": ["Use default passwords", "Disable all backups", "Two-factor authentication", "Share Wi-Fi passwords publicly"], "a": 2, "e": "The checklist includes a trustworthy IT vendor, up-to-date security software, penetration tests, backups, periodic Wi-Fi password changes, up-to-date policy, strong passwords and two-factor authentication."}, {"q": "Which of the following is an example of an indicator of compromise (IOC)?", "o": ["The motivation of the attacker", "A scheduled maintenance window", "The IP address of a server used in an attack", "A new employee handbook"], "a": 2, "e": "IOCs include features that identify malware files, IP addresses of attack servers, filenames, and characteristic changes made to end systems."}, {"q": "What do indicators of attack (IOA) focus on?", "o": ["The cost of the attack", "The motivation behind an attack and the potential means to gain access to assets", "Only the IP addresses used", "Only the malware file names"], "a": 1, "e": "IOAs concern the attacker's strategy, helping security teams be proactive rather than reacting to a single threat."}, {"q": "Why are IOAs useful for a proactive approach?", "o": ["They list every possible malware file", "Defending against a strategy can prevent future attacks that use the same or a similar strategy", "They only work after a breach", "They remove the need for firewalls"], "a": 1, "e": "Because IOAs describe strategy, defenses built on them can stop later attacks that reuse the same approach."}, {"q": "What does CISA's Automated Indicator Sharing (AIS) do?", "o": ["Shares attack indicators between the US government and the private sector as soon as threats are verified", "Blocks all external traffic", "Encrypts all email", "Provides antivirus software"], "a": 0, "e": "AIS enables real-time sharing of verified indicators at no cost."}, {"q": "Which organizations run National Cybersecurity Awareness Month?", "o": ["APWG and US-CERT", "IEEE and ISO", "CISA and the National Cyber Security Alliance (NCSA)", "Cisco and Kaspersky"], "a": 2, "e": "CISA and NCSA promote cybersecurity through the annual campaign."}, {"q": "In which month is National Cybersecurity Awareness Month held?", "o": ["October", "December", "June", "January"], "a": 0, "e": "The campaign is held every October."}, {"q": "Which topic is listed among the NCASM campaign materials?", "o": ["Highway safety", "Fire safety", "Cooking safety", "Wi-Fi safety"], "a": 3, "e": "Topics include social media safety, privacy settings, device app security, updating software, safe online shopping, Wi-Fi safety and protecting customer data."}, {"q": "Which is listed in the module as a type of threat actor?", "o": ["Auditors", "Help desk staff", "Cable installers", "Hacktivists"], "a": 3, "e": "Threat actors in the summary include script kiddies, vulnerability brokers, hacktivists, cybercriminals and state-sponsored hackers."}, {"q": "Which statement best defines risk management?", "o": ["Eliminating every possible vulnerability", "Reporting breaches to the public", "The process of balancing the operational costs of protective measures against the gains achieved by protecting the asset", "Installing antivirus on every device"], "a": 2, "e": "Risk management weighs the cost of protection against the value of what is being protected."}, {"q": "Which statement about the term \"hacker\" is correct according to the module?", "o": ["It has several meanings, including a clever programmer, a network professional, and someone who gains unauthorized access", "It only refers to a government employee", "It only refers to script kiddies", "It always refers to a criminal"], "a": 0, "e": "The module notes that \"hacker\" has a variety of meanings, which is why \"threat actor\" is used for those who attack."}, {"q": "Which scenario shows an internal user acting as an attack vector that causes an outage?", "o": ["An employee disconnects a critical network connection", "A vendor releases a patch", "A hurricane floods a data center", "A script kiddie runs a downloaded tool from home"], "a": 0, "e": "Internal users can accidentally or intentionally disconnect critical connections and cause network outages."}, {"q": "Which targets do cybercriminals attack?", "o": ["Only schools", "Small businesses, consumers, and large enterprises and industries", "Only government agencies", "Only banks"], "a": 1, "e": "Because cybercriminals are money-driven, they target a wide range of victims, from individuals to large industries."}, {"q": "Why is sharing information about indicators of compromise valuable?", "o": ["Many network attacks can be prevented when organizations share that information", "It makes firewalls unnecessary", "It is required to buy antivirus", "It removes all vulnerabilities"], "a": 0, "e": "The module's summary says many network attacks can be prevented by sharing IOC information, which is why governments promote sharing through CISA and NCSA."}], "group": "practice"}, {"id": 3, "label": "Module 3", "title": "Attacking the Foundation", "qs": [{"q": "IP is described as which type of protocol?", "o": ["A Layer 2 reliable protocol", "A Layer 3 connectionless protocol", "A Layer 4 connection-oriented protocol", "A Layer 7 application protocol"], "a": 1, "e": "IP delivers packets host to destination without tracking or managing their flow. Tracking, when needed, is done mainly by TCP at Layer 4."}, {"q": "What does IP NOT do that makes spoofing possible?", "o": ["It does not validate whether a packet really came from the source address it claims", "It does not use addresses", "It encrypts every packet", "It requires authentication for every packet"], "a": 0, "e": "Because IP does not verify the source, threat actors can send packets with a spoofed source address."}, {"q": "Which 4-bit value in the Version field identifies an IPv4 packet?", "o": ["0100", "1000", "0110", "0010"], "a": 0, "e": "IPv4 uses binary 0100 and IPv6 uses 0110."}, {"q": "Which 4-bit value in the Version field identifies an IPv6 packet?", "o": ["0100", "0110", "0001", "1010"], "a": 1, "e": "The IPv6 version field is set to 0110."}, {"q": "What is the minimum length of an IPv4 header?", "o": ["20 bytes", "60 bytes", "40 bytes", "8 bytes"], "a": 0, "e": "The Internet Header Length field is 4 bits, and the minimum header length is 20 bytes. (IPv6's fixed header is 40 bytes and UDP's header is 8 bytes.)"}, {"q": "Which part of the IPv4 Differentiated Services (DS) field is the DSCP?", "o": ["All eight bits are ECN", "The six most significant bits", "The first bit only", "The last two bits"], "a": 1, "e": "The DS field is 8 bits. The six most significant bits are the DSCP, and the last two are Explicit Congestion Notification (ECN) bits."}, {"q": "The IPv4 Total Length field is 2 bytes. What is the theoretical maximum packet size?", "o": ["65,535 bytes", "4,096 bytes", "255 bytes", "1,500 bytes"], "a": 0, "e": "Two bytes allow up to 65,535 bytes, though packets are much smaller in practice."}, {"q": "Which IPv4 header fields work together to fragment and reassemble packets?", "o": ["Version, Protocol, and TTL", "Identification, Flag, and Fragment Offset", "Source and Destination Address", "Header Checksum and Options"], "a": 1, "e": "When a packet must cross a route that cannot handle its size, these three fields allow it to be divided and reassembled."}, {"q": "What is the purpose of the IPv4 Time-to-Live (TTL) field?", "o": ["To limit the lifetime of a packet by decrementing at each router", "To encrypt the payload", "To identify the upper-layer protocol", "To store the sender's MAC address"], "a": 0, "e": "Each router decrements TTL by one. At zero the packet is discarded and an ICMP Time Exceeded message is sent to the source."}, {"q": "What happens when a router decrements an IPv4 TTL to zero?", "o": ["The router forwards it with a new TTL", "The router converts it to IPv6", "The router discards the packet and sends an ICMP Time Exceeded message to the source", "The router encrypts it"], "a": 2, "e": "Zero TTL means the packet has exceeded its lifetime and is dropped with a notification to the sender."}, {"q": "Which IPv4 field identifies the type of payload (upper-layer protocol) the packet carries?", "o": ["Header Checksum", "Options", "Version", "Protocol"], "a": 3, "e": "The 8-bit Protocol field lets the network layer pass data to the appropriate upper-layer protocol."}, {"q": "What is the IPv4 Header Checksum used for?", "o": ["Detecting errors introduced during transmission of the header", "Prioritizing traffic", "Encrypting the header", "Fragmenting packets"], "a": 0, "e": "The checksum is calculated from the IP header contents to detect transmission errors."}, {"q": "What kind of address is always found in the Source IPv4 Address field?", "o": ["A loopback address only", "A unicast address", "A multicast address", "A broadcast address"], "a": 1, "e": "The source IPv4 address of a packet is always a unicast address."}, {"q": "The IPv4 Options and Padding field is padded so its length is a multiple of how many bits?", "o": ["8", "16", "32", "64"], "a": 2, "e": "Options vary from 0 to a multiple of 32 bits, and zeros are added as padding when needed."}, {"q": "The IPv6 Traffic Class field is equivalent to which IPv4 field?", "o": ["TTL", "Identification", "Protocol", "Differentiated Services (DS)"], "a": 3, "e": "Traffic Class is the 8-bit counterpart of the IPv4 DS field."}, {"q": "How large is the IPv6 Flow Label field, and what does it suggest?", "o": ["20 bits; packets with the same label should receive the same handling", "128 bits; the source address", "16 bits; the payload length", "8 bits; the packet's lifetime"], "a": 0, "e": "The 20-bit flow label suggests that all packets with the same label get the same type of handling by routers."}, {"q": "What does the IPv6 Payload Length field indicate?", "o": ["The size of the source address", "The number of hops allowed", "The length of the data portion of the IPv6 packet", "The length of the whole IPv6 header"], "a": 2, "e": "It is a 16-bit field that gives the length of the payload."}, {"q": "The IPv6 Next Header field is equivalent to which IPv4 field?", "o": ["Options", "Total Length", "Protocol", "Version"], "a": 2, "e": "Next Header is 8 bits and indicates the data payload type so the packet can be passed to the appropriate upper-layer protocol."}, {"q": "Which IPv6 field replaces the IPv4 TTL field?", "o": ["Flow Label", "Hop Limit", "Next Header", "Traffic Class"], "a": 1, "e": "Hop Limit is an 8-bit field decremented by 1 at each router. When it reaches 0 the packet is discarded and an ICMPv6 Time Exceeded message is sent."}, {"q": "How many bits are in an IPv6 source or destination address field?", "o": ["64", "48", "32", "128"], "a": 3, "e": "IPv6 addresses are 128 bits. IPv4 addresses are 32 bits."}, {"q": "Which is listed as an attack that targets IP?", "o": ["Layer 1 cable tapping", "SQL injection", "Bluesnarfing", "ICMP attacks"], "a": 3, "e": "The IP attacks listed are ICMP, DoS, DDoS, address spoofing, MiTM and session hijacking."}, {"q": "How does a DDoS attack differ from a DoS attack?", "o": ["It is a simultaneous, coordinated attack from multiple source machines", "It only uses ICMP", "It targets only wireless networks", "It steals data without disruption"], "a": 0, "e": "DDoS has the same goal as DoS, but the traffic comes from many sources at once."}, {"q": "What does a session hijacking attack require, according to the table of IP vulnerabilities?", "o": ["Installing a keylogger on a server", "Flooding a DNS server", "Cracking a Wi-Fi password only", "Gaining access to the physical network, then using a MiTM attack to hijack a session"], "a": 3, "e": "Threat actors gain access to the physical network and then use MiTM to hijack a session."}, {"q": "In an IP man-in-the-middle attack, what can the threat actor do?", "o": ["Only delete logs", "Monitor, capture and control the communication, or alter packets before forwarding them", "Only change DNS records", "Only block the connection"], "a": 1, "e": "MiTM actors can eavesdrop passively or modify packets and forward them to the original destination."}, {"q": "Threat actors use ICMP echo requests (pings) mainly for what kind of activity?", "o": ["Authenticating users", "Reconnaissance and scanning, and DoS floods", "Encrypting data", "Assigning IP addresses"], "a": 1, "e": "ICMP lets attackers map topology, find active hosts, and create floods."}, {"q": "Which ICMP message type is abused for network reconnaissance and scanning attacks?", "o": ["ICMP router discovery", "ICMP mask reply", "ICMP redirects", "ICMP unreachable"], "a": 3, "e": "In the module's table, unreachable messages are used for reconnaissance and scanning."}, {"q": "What does an attacker use ICMP mask reply messages for?", "o": ["Lure traffic through a compromised device", "Mapping an internal IP network", "Injecting routes", "Starting DoS floods"], "a": 1, "e": "ICMP mask reply is listed as a way to map an internal IP network."}, {"q": "How are ICMP redirects abused?", "o": ["To map an internal network", "To lure a target host into sending all traffic through a compromised device to create a MiTM attack", "To scan ports", "To verify host availability"], "a": 1, "e": "A redirect tells the host to use another path, which the attacker abuses to place themselves in the traffic path."}, {"q": "How is ICMP router discovery abused?", "o": ["To test connectivity", "To identify the OS", "To flood a server", "To inject bogus route entries into the routing table of a target host"], "a": 3, "e": "Attackers use fake router advertisements to corrupt the target's routing table."}, {"q": "What is OS fingerprinting in the context of ICMP reconnaissance?", "o": ["Removing the OS", "Copying the OS to another host", "Identifying the operating system of a host", "Encrypting the OS"], "a": 2, "e": "Besides mapping topology and finding active hosts, ICMP can help identify the host operating system and the state of a firewall."}, {"q": "Which attack is described as an amplification and reflection technique that overwhelms a target host?", "o": ["DNS tunneling", "Session hijacking", "SYN flood", "Smurf attack"], "a": 3, "e": "In a Smurf attack the actor sends ICMP echo requests with the victim's IP as the source to many hosts."}, {"q": "In an amplification and reflection attack, which source IP address does the attacker place in the ICMP echo request?", "o": ["A broadcast address as the destination only", "The attacker's real IP address", "The router's MAC address", "The victim's IP address"], "a": 3, "e": "The replies from many hosts go to the spoofed source, which is the victim, overwhelming it."}, {"q": "What describes non-blind spoofing?", "o": ["The actor only spoofs MAC addresses", "The actor sends encrypted traffic", "The threat actor can see the traffic between the host and target and inspects the target's reply", "The actor cannot see any traffic"], "a": 2, "e": "Non-blind spoofing is used, for example, to hijack a session."}, {"q": "Blind spoofing is typically used in which type of attack?", "o": ["Session hijacking only", "Password cracking", "Phishing", "DoS attacks"], "a": 3, "e": "In blind spoofing the actor cannot see the traffic, so it is used in DoS attacks."}, {"q": "What happens in MAC address spoofing on a switch?", "o": ["The switch sends a DHCP offer", "The switch shuts down", "The switch overwrites its CAM table entry and assigns the MAC address to the attacker's port", "The attacker's MAC is blocked"], "a": 2, "e": "After the attacker's host copies a target MAC address, the switch associates that MAC with the attacker's port and forwards frames there."}, {"q": "Which TCP service lets a sender retransmit data when an acknowledgment is not received?", "o": ["Reliable delivery", "Fragmentation", "Flow control", "Stateful communication"], "a": 0, "e": "TCP uses acknowledgments to guarantee delivery, and a missing timely ACK triggers retransmission."}, {"q": "What does TCP flow control do?", "o": ["Removes retransmission", "Limits ports", "Encrypts segments", "Allows multiple segments to be acknowledged at once instead of one at a time"], "a": 3, "e": "Flow control reduces the delay of waiting for acknowledgment of each segment."}, {"q": "TCP stateful communication is established during which process?", "o": ["ARP resolution", "The three-way handshake", "DHCP discovery", "The four-way handshake only"], "a": 1, "e": "Before data is transferred, a three-way handshake opens the TCP connection."}, {"q": "What is the correct order of the TCP three-way handshake?", "o": ["FIN, ACK, FIN", "ACK, SYN, SYN-ACK", "SYN, SYN-ACK, ACK", "SYN-ACK, SYN, ACK"], "a": 2, "e": "The client sends SYN, the server replies SYN-ACK, and the client confirms with ACK."}, {"q": "In the module's handshake example the client sends SEQ=100. What acknowledgment number does the server's SYN-ACK carry?", "o": ["301", "300", "101", "100"], "a": 2, "e": "The server acknowledges the next expected sequence number, 100 + 1 = 101. (The client's final ACK then carries 301 for the server's SEQ=300.)"}, {"q": "How does a TCP SYN flood attack work?", "o": ["The actor sends many SYN requests with spoofed source IPs so the target is left with half-open connections waiting for ACKs that never arrive", "The actor steals the sequence number only", "The actor repeats captured data", "The actor sends FIN segments to close sessions"], "a": 0, "e": "Half-open connections exhaust the target, which then denies legitimate users."}, {"q": "Which TCP control bit tears down a connection immediately in a TCP reset attack?", "o": ["FIN", "SYN", "ACK", "RST"], "a": 3, "e": "A segment with the RST bit set abruptly terminates the connection and tells the receiver to stop using it. FIN is used for the normal four-way close."}, {"q": "Which flags are exchanged in the normal four-way termination of a TCP session?", "o": ["FIN and ACK from each endpoint", "PSH and URG", "SYN and RST", "SYN and ACK only"], "a": 0, "e": "Each side sends a FIN and receives an ACK to close its direction of the connection."}, {"q": "What must a threat actor do to carry out TCP session hijacking?", "o": ["Change the UDP checksum", "Spoof one host's IP address, predict the next sequence number, and send an ACK to the other host", "Send RST packets only", "Flood the network with SYN packets"], "a": 1, "e": "Hijacking an already-authenticated session requires spoofing and sequence number prediction."}, {"q": "After a successful TCP session hijack, what can the threat actor do?", "o": ["Receive but not send", "Encrypt the session", "Send data to the target device but not receive data from it", "Neither send nor receive"], "a": 2, "e": "The module states the actor could send, but not receive, data from the target device."}, {"q": "Which statement about UDP is correct?", "o": ["It provides sequencing and flow control", "It is a connectionless transport protocol used by services such as DNS, DHCP and SNMP", "It guarantees delivery", "It performs a three-way handshake"], "a": 1, "e": "UDP has low overhead and does not offer retransmission, sequencing or flow control."}, {"q": "How large is a UDP segment header?", "o": ["8 bytes", "60 bytes", "40 bytes", "20 bytes"], "a": 0, "e": "The UDP header contains source port, destination port, length and checksum, 8 bytes in total. TCP's header is at least 20 bytes."}, {"q": "What does it mean that UDP is \"unreliable\"?", "o": ["UDP cannot be used for DNS", "UDP always loses data", "The transport protocol does not provide reliability functions, so they must be implemented elsewhere if required", "UDP applications are always inferior"], "a": 2, "e": "Unreliable only means those functions are not provided by UDP itself."}, {"q": "Why does an attack on UDP checksums succeed?", "o": ["The actor can recompute a valid checksum for altered data so the destination does not notice the change", "The checksum is 128 bits", "UDP encrypts the checksum", "UDP always disables the checksum"], "a": 0, "e": "Because the checksum is optional and unencrypted, an altered payload with a new checksum still matches. This attack is not widely used."}, {"q": "How does a UDP flood attack create a DoS situation?", "o": ["It poisons ARP caches", "It steals sequence numbers", "The tool sweeps through known UDP ports, and the server replies with ICMP port unreachable messages for the many closed ports, consuming bandwidth", "It repeats captured TCP packets"], "a": 2, "e": "Tools like UDP Unicorn and Low Orbit Ion Cannon send floods of UDP packets, often from a spoofed host."}], "group": "practice"}, {"id": 4, "label": "Module 4", "title": "Attacking What We Do", "qs": [{"q": "What is a gratuitous ARP?", "o": ["A DNS response sent without a query", "An unsolicited ARP Reply that any client can send", "An ARP Request sent to the default gateway only", "A DHCP offer sent by a rogue server"], "a": 1, "e": "Hosts that receive a gratuitous ARP store the MAC/IP pair in their ARP tables, which is why it can be abused."}, {"q": "What is the goal of ARP cache poisoning aimed at hosts on a LAN?", "o": ["To change DNS records", "To close TCP sessions", "To associate the threat actor's MAC address with the default gateway's IP address in hosts' ARP caches", "To overload the DHCP server"], "a": 2, "e": "This puts the actor between the victims and everything outside the local subnet."}, {"q": "What is the difference between passive and active ARP poisoning?", "o": ["Passive is legal and active is illegal", "Passive actors steal confidential information, while active actors modify data in transit or inject malicious data", "Passive uses ARP and active uses DHCP", "Passive floods the network and active listens"], "a": 1, "e": "Passive ARP poisoning only observes traffic. Active poisoning alters or injects data."}, {"q": "What is a DNS open resolver?", "o": ["A DHCP relay", "A DNS server that blocks all queries", "A resolver that answers queries from clients outside its administrative domain", "A resolver that only answers local clients"], "a": 2, "e": "Because it answers anyone, an open resolver is vulnerable to several malicious activities."}, {"q": "Which DNS resolver vulnerability involves spoofed, falsified resource record information that redirects users to malicious sites?", "o": ["DNS cache poisoning", "DNS resource utilization", "DNS tunneling", "DNS amplification and reflection"], "a": 0, "e": "Cache poisoning inserts false records into the resolver's cache."}, {"q": "In a DNS amplification and reflection attack, which IP address do threat actors use as the source of the DNS messages sent to open resolvers?", "o": ["The authoritative server's IP address", "The open resolver's IP address", "The target's IP address", "The attacker's real IP address"], "a": 2, "e": "The resolver answers anyone who asks, so replies flood the victim and hide the true source."}, {"q": "What is the effect of a DNS resource utilization attack?", "o": ["It hides command and control servers", "It redirects users to fake sites", "It steals email", "A DoS that consumes the resolver's resources and may require a reboot or restart of services"], "a": 3, "e": "The attack negatively affects the operation of the DNS open resolver."}, {"q": "Which DNS stealth technique hides phishing and malware delivery sites behind a quickly changing network of compromised hosts?", "o": ["Fast Flux", "DNS tunneling", "Domain shadowing", "Domain Generation Algorithm"], "a": 0, "e": "Fast Flux changes the IP addresses of compromised DNS hosts within minutes, and botnets often use it."}, {"q": "Which technique rapidly changes hostname-to-IP mappings and also changes the authoritative name server?", "o": ["Fast Flux", "Domain hijacking", "Domain shadowing", "Double IP Flux"], "a": 3, "e": "Double IP Flux makes the source of the attack even harder to identify."}, {"q": "What do Domain Generation Algorithms (DGA) do?", "o": ["Block spam", "Assign IP addresses", "Encrypt DNS traffic", "Let malware randomly generate domain names to use as rendezvous points with command and control servers"], "a": 3, "e": "DGAs make it hard to block C&C domains because the names keep changing."}, {"q": "What is DNS domain shadowing?", "o": ["The attacker uses stolen domain account credentials to silently create subdomains that point to malicious servers", "The attacker overloads a resolver", "The attacker modifies TCP sequence numbers", "The attacker copies a website's design"], "a": 0, "e": "The parent domain's owner is not alerted while the attacker adds subdomains for attacks."}, {"q": "In a DNS tunneling attack, where is the attacker's data hidden?", "o": ["In the DHCP lease time", "In TCP flags", "In ARP replies", "In encoded chunks placed in the domain name labels of DNS queries"], "a": 3, "e": "Data is split into encoded chunks that are put into lower-level domain labels of DNS queries."}, {"q": "Which DNS tunneling defense does the module recommend?", "o": ["Disable all firewalls", "Trust Dynamic DNS domains", "Allow all outbound DNS", "Inspect DNS traffic and look for queries longer than average or with suspicious domain names"], "a": 3, "e": "Analysts should filter DNS traffic and treat domains tied to Dynamic DNS services as highly suspect. Cisco Umbrella is an example of a solution."}, {"q": "What is the correct order of the normal DHCP exchange?", "o": ["Discover, Request, Offer, Acknowledge", "Offer, Discover, Acknowledge, Request", "Discover, Offer, Request, Acknowledge", "Request, Offer, Discover, Acknowledge"], "a": 2, "e": "The client broadcasts DHCPDISCOVER, the server unicasts DHCPOFFER, the client broadcasts DHCPREQUEST, and the server unicasts DHCPACK."}, {"q": "What is a rogue DHCP server?", "o": ["A DNS resolver", "A router that translates addresses", "A server connected to the network that gives legitimate clients false IP configuration parameters", "A server that blocks DHCP"], "a": 2, "e": "Rogue DHCP servers are used in DHCP spoofing attacks."}, {"q": "A rogue DHCP server gives clients its own IP address as the default gateway. What attack does this enable?", "o": ["SQL injection", "Man-in-the-middle", "SYN flood", "Buffer overflow"], "a": 1, "e": "Traffic passes through the attacker, who can intercept data, and this may go undetected."}, {"q": "What happens when a rogue DHCP server supplies a wrong DNS server address?", "o": ["The client's MAC is changed", "The client's lease never expires", "Users are pointed to a malicious website", "The client's TCP connections reset"], "a": 2, "e": "An incorrect DNS server can resolve names to malicious sites."}, {"q": "What results from a rogue DHCP server supplying an invalid IP address or invalid default gateway?", "o": ["A DoS against the DHCP client", "Automatic encryption", "A successful backup", "Faster routing"], "a": 0, "e": "Invalid addressing leaves the client unable to communicate."}, {"q": "In a DHCP spoofing attack, why does the client usually end up using the rogue server's parameters?", "o": ["The client accepts the first offer it receives, which came from the rogue server", "The rogue server is always faster in hardware", "The legitimate server is offline", "DHCP requires the rogue server"], "a": 0, "e": "Both servers respond to the discover message and the client replies to the first offer received."}, {"q": "Which is the final step of a DHCP spoofing attack?", "o": ["The rogue server shuts down", "The legitimate server acknowledges first", "Only the rogue server unicasts an acknowledgment to the client", "The client sends a SYN"], "a": 2, "e": "The legitimate server stops communicating because the request has already been acknowledged."}, {"q": "Which is the first stage of a typical web attack described in the module?", "o": ["The final malware package runs", "The victim unknowingly visits a web page compromised by malware", "The exploit kit downloads a payload", "The user installs an antivirus"], "a": 1, "e": "The sequence begins with a compromised page and ends with the final malware package running on the victim's computer."}, {"q": "What does an exploit kit do?", "o": ["Encrypts DNS queries", "Scans the victim's software, such as the OS, Java or Flash, for an exploitable vulnerability", "Resets TCP sessions", "Floods the network"], "a": 1, "e": "After finding a vulnerable package, the kit contacts its server to download code that exploits the flaw."}, {"q": "Which HTTP status code class indicates a successful request?", "o": ["2xx", "1xx", "3xx", "5xx"], "a": 0, "e": "2xx means the request was received, understood and accepted."}, {"q": "Which HTTP status code class indicates redirection?", "o": ["2xx", "4xx", "3xx", "1xx"], "a": 2, "e": "3xx means further action is needed by the client to fulfill the request, and clients should detect infinite redirect loops."}, {"q": "Which HTTP status code class indicates a client error?", "o": ["3xx", "4xx", "2xx", "5xx"], "a": 1, "e": "4xx is used when the client seems to have erred. 5xx is a server error."}, {"q": "What is a malicious iFrame?", "o": ["An HTML element, added to a compromised page, that loads another page from a malicious source to deliver exploits", "A DNS record", "A firewall rule", "A DHCP option"], "a": 0, "e": "Threat actors modify web pages by adding HTML for the iFrame, which can deliver spam, an exploit kit or malware."}, {"q": "What is HTTP 302 cushioning?", "o": ["Blocking HTTP requests", "Using the 302 Found status code to redirect the browser to a new, possibly malicious location, sometimes multiple times", "Encrypting HTTP traffic", "Caching web pages"], "a": 1, "e": "The browser trusts the URL in the header, and the redirects are hard to detect because legitimate redirects are common."}, {"q": "In the typical attack sequence with domain shadowing, what comes immediately after HTTP 302 cushioning?", "o": ["Domain shadowing directs the browser to a compromised server", "The exploit kit landing page is accessed", "The website is compromised", "Malware downloads"], "a": 0, "e": "The order is: compromised site, 302 cushioning, domain shadowing, exploit kit landing page, malware download."}, {"q": "Which email threat uses text characters that look very similar or identical to legitimate characters?", "o": ["Attachment-based attacks", "Email spoofing", "Open mail relay", "Homoglyphs"], "a": 3, "e": "Homoglyphs trick users into trusting a lookalike address or link."}, {"q": "What is an open mail relay server in the context of email threats?", "o": ["A user's mailbox", "A misconfigured enterprise server that attackers use to send large volumes of spam or malware", "A server that encrypts all mail", "A server that blocks spam"], "a": 1, "e": "Open relays let threat actors send mass email through someone else's server."}, {"q": "What is email spoofing?", "o": ["Hiding malware in a business file", "Creating messages with a forged sender address to fool the recipient into giving money or sensitive information", "Sending bulk advertising only", "Using similar characters in a URL"], "a": 1, "e": "Spoofing forges the sender. Attachment-based attacks embed malicious content in files."}, {"q": "Which measure helps protect SMTP servers and email users?", "o": ["Turn off logging", "Leave SMTP unpatched", "Open all attachments", "Keep SMTP software patched and use an email security appliance such as the Cisco Email Security Appliance"], "a": 3, "e": "Patching and email security appliances detect and block phishing, spam and malware, and users must be trained."}, {"q": "Which relational database attack lets threat actors run malicious SQL queries to obtain sensitive data?", "o": ["ARP poisoning", "Domain shadowing", "DNS tunneling", "SQL injection"], "a": 3, "e": "SQL injection is one of the most common database attacks."}, {"q": "What should analysts determine after a successful SQL injection login?", "o": ["Nothing, since the attack is over", "Only the web server model", "Which user ID the threat actor used and what information or further access they gained", "Only the time of day"], "a": 2, "e": "Analysts should recognize suspicious SQL queries and trace the login and any further access."}, {"q": "What is stored (persistent) XSS?", "o": ["The malicious script is permanently stored on the infected server and received by all visitors to the page", "The script only runs on the attacker's machine", "The script is stored in DHCP", "The script is in a link that visitors must click"], "a": 0, "e": "Stored XSS affects every visitor, unlike reflected XSS."}, {"q": "What is reflected (non-persistent) XSS?", "o": ["The malicious script is in a link, and visitors are infected only when they click it", "The script runs in the firewall", "The script is in a database", "The script is stored on the server permanently"], "a": 0, "e": "Reflected XSS requires the victim to click the infected link."}, {"q": "Which is a way to prevent or reduce XSS attacks?", "o": ["Disable all input validation", "Remove firewalls", "Allow all scripts", "Make web developers aware of XSS and use an IPS to detect and prevent malicious scripts"], "a": 3, "e": "Other measures include a web proxy, a service such as Cisco Umbrella, and training users to spot phishing."}, {"q": "Which is listed among best practices for defending the network?", "o": ["Develop a written security policy for the company", "Skip backups", "Keep unnecessary ports open", "Allow default passwords"], "a": 0, "e": "The module's best practices include a written security policy, employee education, physical access control, strong passwords, encryption, security devices, tested backups, shutting down unnecessary services and ports, patching and audits."}, {"q": "What do antivirus programs NOT do, according to the module?", "o": ["Help stop infected hosts from spreading malicious code", "Prevent viruses from entering the network", "Detect viruses", "Eliminate viruses"], "a": 1, "e": "Antivirus helps detect and eliminate viruses but does not prevent them from entering, so professionals must track the major viruses and updates."}, {"q": "What is the correct order of the four phases of worm mitigation?", "o": ["Inoculation, containment, treatment, quarantine", "Containment, inoculation, quarantine, treatment", "Quarantine, treatment, inoculation, containment", "Treatment, quarantine, containment, inoculation"], "a": 1, "e": "The phases are numbered containment, inoculation, quarantine, treatment (inoculation can also run in parallel with containment)."}, {"q": "During which worm mitigation phase are uninfected systems patched with the vendor patch?", "o": ["Inoculation", "Quarantine", "Containment", "Treatment"], "a": 0, "e": "Inoculation patches uninfected systems, depriving the worm of targets."}, {"q": "During which worm mitigation phase are infected machines tracked down, identified and disconnected, blocked or removed?", "o": ["Treatment", "Containment", "Quarantine", "Inoculation"], "a": 2, "e": "Quarantine isolates infected machines inside the contained areas for treatment."}, {"q": "Which worm mitigation phase involves disinfecting systems, removing modified files and patching the exploited vulnerability?", "o": ["Containment", "Treatment", "Quarantine", "Inoculation"], "a": 1, "e": "Treatment actively disinfects, and in severe cases the system may need to be reinstalled."}, {"q": "Which measure helps reduce reconnaissance attacks such as packet sniffing?", "o": ["Encryption, so captured data is not readable", "Using hubs instead of switches", "Disabling authentication", "Opening all ports"], "a": 0, "e": "Encryption makes sniffers of little use. Other measures include authentication, anti-sniffer tools, a switched infrastructure, and a firewall and IPS."}, {"q": "Why can ping sweeps be stopped only at a cost?", "o": ["It breaks DNS", "Ping uses TCP", "Turning off ICMP echo and echo-reply on edge routers also removes network diagnostic data", "Ping sweeps cannot be detected"], "a": 2, "e": "Disabling those ICMP services stops sweeps but loses diagnostic data, and port scans can still run without ping sweeps, only more slowly."}, {"q": "Which is a recommended defense against access attacks such as password guessing?", "o": ["Share passwords", "Allow unlimited login attempts", "Use short passwords", "Enforce strong passwords and disable accounts after a specified number of unsuccessful logins"], "a": 3, "e": "Strong password policies and account lockout help prevent continuous password attempts."}, {"q": "What does the principle of minimum trust mean?", "o": ["Everyone is trusted equally", "Passwords should never be used", "Users should have admin rights", "Systems should not use one another unnecessarily"], "a": 3, "e": "Networks should be designed so that systems do not rely on each other unless required."}, {"q": "Which anti-spoofing technologies are mentioned for mitigating DoS attacks on Cisco devices?", "o": ["CSMA/CA and RTS/CTS", "Port security, DHCP snooping, IP Source Guard, Dynamic ARP Inspection and ACLs", "WEP and TKIP", "STIX and TAXII"], "a": 1, "e": "Cisco routers and switches support these anti-spoofing technologies to help stop DoS attacks that come from spoofed addresses."}, {"q": "Which defense helps mitigate DNS tunneling by blocking much of the traffic through identification of suspicious domains?", "o": ["Using only default DNS settings", "Disabling all patches", "A DNS security solution such as Cisco Umbrella", "Allowing any outbound DNS"], "a": 2, "e": "The module cites Cisco Umbrella as a DNS security solution that blocks much DNS tunneling traffic."}, {"q": "Which Cisco devices does the module mention as providing intrusion prevention to help mitigate reconnaissance attacks?", "o": ["Cisco wireless headsets", "Cisco power cables", "Cisco IP phones", "Cisco ASA and Cisco Integrated Services Routers (ISR) with additional software"], "a": 3, "e": "Cisco ASA provides intrusion prevention in a standalone device, and enterprise routers such as the ISR support network-based IPS with additional software."}], "group": "practice"}, {"id": 5, "label": "Module 5", "title": "Wireless Network Communication", "qs": [{"q": "Which access method do 802.11 wireless LANs use, compared with 802.3 wired Ethernet?", "o": ["Collision avoidance", "Polling", "Collision detection", "Token passing"], "a": 0, "e": "802.11 uses collision avoidance (CSMA/CA), while 802.3 Ethernet uses collision detection."}, {"q": "Which characteristic is TRUE of wireless LANs compared with wired LANs?", "o": ["The IEEE standard dictates a single regulation worldwide", "They have minimal signal interference", "Signal interference is a concern, and regulations differ by country", "They require a physical cable connection"], "a": 2, "e": "Wired LANs have minimal interference and follow IEEE standards. Wireless LANs are prone to interference and regulated differently by country."}, {"q": "Which 802.11 frame field usually holds the MAC address of the receiving wireless device or AP?", "o": ["Address1", "Address2", "Address4", "Address3"], "a": 0, "e": "Address1 is the receiver, Address2 is the transmitter, Address3 is sometimes the destination such as the default gateway, and Address4 is used only in ad hoc mode."}, {"q": "Which 802.11 frame field usually holds the MAC address of the transmitting wireless device or AP?", "o": ["Address1", "Address2", "Address3", "Address4"], "a": 1, "e": "Address2 is the transmitting device."}, {"q": "Which 802.11 address field is usually missing because it is used only in ad hoc mode?", "o": ["Address2", "Address1", "Address3", "Address4"], "a": 3, "e": "Address4 is rarely present because it applies only to ad hoc mode."}, {"q": "Which 802.11 frame field contains subfields such as protocol version, frame type, address type, power management and security settings?", "o": ["Frame Control", "Duration", "Sequence Control", "FCS"], "a": 0, "e": "Frame Control identifies the type of wireless frame and carries these subfields."}, {"q": "What is the purpose of the FCS field in an 802.11 frame?", "o": ["Carrying the payload", "Layer 2 error control", "Indicating remaining transmission time", "Sequencing fragmented frames"], "a": 1, "e": "The Frame Check Sequence is used for Layer 2 error control. Duration indicates remaining time, and Sequence Control handles sequencing."}, {"q": "Why can't a wireless client detect collisions the way a wired Ethernet device can?", "o": ["WLANs have no MAC addresses", "WLANs use full-duplex cables", "WLANs are half-duplex shared media, and a client cannot hear while it is sending", "WLANs do not use frames"], "a":
