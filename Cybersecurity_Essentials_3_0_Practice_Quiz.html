2, "e": "Since a sending client cannot hear the channel, WLANs rely on collision avoidance (CSMA/CA)."}, {"q": "In CSMA/CA, what does the client send to request dedicated access to the network?", "o": ["A probe response", "A ready to send (RTS) message to the AP", "A clear to send (CTS) message", "A beacon frame"], "a": 1, "e": "The client sends RTS, and the AP grants access by sending CTS."}, {"q": "In CSMA/CA, what does the client do if it does not receive a CTS message?", "o": ["Sends a beacon", "Switches off Wi-Fi", "Waits a random amount of time and restarts the process", "Sends data anyway"], "a": 2, "e": "Without CTS, the client waits a random time before trying again."}, {"q": "In CSMA/CA, how does a client know a collision probably occurred?", "o": ["It detects a signal spike", "It does not receive an acknowledgment for its transmission", "It sees a beacon", "It receives a CTS"], "a": 1, "e": "All transmissions are acknowledged, so a missing acknowledgment means the client restarts the process."}, {"q": "Which is the correct order of CSMA/CA actions by the client?", "o": ["Receive CTS, send RTS, listen, transmit", "Transmit data, send RTS, receive CTS, listen to the channel", "Send beacon, receive probe, transmit, listen", "Listen for an idle channel, send RTS, receive CTS, transmit data, wait for acknowledgment"], "a": 3, "e": "The client first listens for an idle channel, then requests access with RTS, waits for CTS, transmits, and expects an acknowledgment."}, {"q": "What are the three stages a wireless device completes to communicate over a WLAN?", "o": ["Beacon, probe, reply", "Discover a wireless AP, authenticate with the AP, associate with the AP", "Associate, discover, disconnect", "Authenticate, encrypt, transmit"], "a": 1, "e": "Discovery, authentication and association are the three stages of connecting a client to an AP."}, {"q": "Which parameter appears in the list of available wireless networks on a client?", "o": ["Channel setting", "Security mode", "Network mode", "SSID"], "a": 3, "e": "The SSID is the network name shown to the client."}, {"q": "Which parameter refers to the 802.11a/b/g/n/ac/ad standards?", "o": ["Network mode", "SSID", "Security mode", "Channel settings"], "a": 0, "e": "Network mode describes which WLAN standards are used."}, {"q": "Which parameter refers to settings such as WEP, WPA or WPA2?", "o": ["Security mode", "Network mode", "Channel settings", "Password"], "a": 0, "e": "Security mode defines the security parameter settings, such as which protocol is used."}, {"q": "Which parameter refers to the frequency bands used to transmit wireless data?", "o": ["Password", "Channel settings", "SSID", "Security mode"], "a": 1, "e": "Channel settings define the frequency bands used for transmission."}, {"q": "In passive discovery mode, how does the AP advertise its service?", "o": ["By unicasting authentication frames", "By periodically broadcasting beacon frames containing the SSID, supported standards and security settings", "By sending RTS messages", "By waiting for a probe request"], "a": 1, "e": "In passive mode the AP openly announces itself, and the client just listens."}, {"q": "What triggers the AP's probe response in active discovery mode?", "o": ["A CTS message", "A beacon from another AP", "A DHCP request", "A probe request frame broadcast by a client that knows the SSID"], "a": 3, "e": "Active mode requires the client to know the SSID and send probe requests on multiple channels. APs with that SSID answer."}, {"q": "What does a Wireless LAN Controller (WLC) allow?", "o": ["Only wired connections", "Disabling encryption", "Centralized control and management of all the APs on a network", "Only guest access"], "a": 2, "e": "Centralizing AP functions in a WLC simplifies configuration and monitoring of numerous access points."}, {"q": "What is a lightweight AP (LWAP)?", "o": ["A wired switch", "An AP that works alone without a controller", "A rogue AP", "An AP that, under a WLC, only forwards data between the wireless LAN and the WLC instead of acting autonomously"], "a": 3, "e": "With a WLC, APs no longer act autonomously and instead act as LWAPs."}, {"q": "Which device integrates the functions of a router, switch and access point in home and small business networks?", "o": ["A WLC", "A wireless router", "A lightweight AP", "A RADIUS server"], "a": 1, "e": "Home and small business wireless routers combine all three functions in one device."}, {"q": "Which threat refers to unauthorized users attempting to access network resources and can be deterred by effective authentication?", "o": ["Rogue APs", "DoS attacks", "Interception of data", "Wireless intruders"], "a": 3, "e": "Wireless intruders are deterred by authentication. Interception of data is handled by encryption."}, {"q": "How should wireless data be protected from eavesdroppers?", "o": ["By using more channels", "By hiding the router", "By encrypting it", "By sending it more slowly"], "a": 2, "e": "The module says wireless data should be encrypted to prevent it from being read by eavesdroppers."}, {"q": "Which are possible causes of wireless DoS attacks?", "o": ["Improperly configured devices, malicious interference and accidental interference", "Only rogue APs", "Only malicious users", "Only weak passwords"], "a": 0, "e": "The module lists configuration errors, intentional interference and accidental interference from other wireless devices."}, {"q": "Which wireless band is more prone to interference from devices such as microwave ovens, cordless phones and baby monitors?", "o": ["Both are equally prone", "Neither", "2.4 GHz", "5 GHz"], "a": 2, "e": "The 2.4 GHz band is more prone to interference than the 5 GHz band."}, {"q": "Which practice helps reduce the risk of wireless DoS attacks due to misconfiguration?", "o": ["Use default passwords", "Make changes during peak hours", "Disable backups", "Make configuration changes off-hours, harden devices, keep passwords secure and create backups"], "a": 3, "e": "The module recommends hardening devices, secure passwords, backups and off-hour configuration changes."}, {"q": "What is a rogue access point?", "o": ["A guest network", "An AP or wireless router connected to a corporate network without explicit authorization and against corporate policy", "A lightweight AP controlled by a WLC", "A RADIUS server"], "a": 1, "e": "A rogue AP is not authorized, and anyone with premises access can install one cheaply."}, {"q": "How might an attacker use a rogue AP?", "o": ["Only to speed up the network", "To capture MAC addresses and data packets, gain access to network resources, or launch a MiTM attack", "Only to block devices", "Only to extend Wi-Fi range"], "a": 1, "e": "A connected rogue AP gives an attacker several capabilities."}, {"q": "Which is a way organizations can prevent rogue APs?", "o": ["Allow employees to install any router", "Use open authentication", "Configure WLCs with rogue AP policies and use monitoring software to watch the radio spectrum for unauthorized APs", "Disable SSIDs only"], "a": 2, "e": "Policies and active monitoring help detect and stop unauthorized APs."}, {"q": "Which could also be used as a rogue AP?", "o": ["A personal network hotspot", "A UPS", "A rack mount", "A wired Ethernet cable"], "a": 0, "e": "A personal hotspot can provide unauthorized access and so counts as a rogue AP."}, {"q": "In an evil twin AP attack, what does the attacker configure on the rogue AP?", "o": ["A RADIUS server", "A different SSID and no signal", "A WPA3 password", "The same SSID as a legitimate AP"], "a": 3, "e": "Clients near the rogue AP see a stronger signal and likely associate with it."}, {"q": "In an evil twin MitM attack, what happens to user traffic after clients associate with the rogue AP?", "o": ["It is captured by the rogue AP and forwarded to the legitimate AP, and return traffic is captured and sent back to the user", "It is encrypted and returned", "It goes straight to the Internet unobserved", "It is dropped"], "a": 0, "e": "The rogue AP sits in the middle and reads or modifies the traffic in both directions."}, {"q": "What is SSID cloaking?", "o": ["Encrypting the SSID", "Disabling the SSID beacon frame so clients must manually configure the SSID to connect", "Using the MAC address as the SSID", "Changing the SSID every hour"], "a": 1, "e": "APs and some wireless routers allow the SSID beacon to be disabled."}, {"q": "What does MAC address filtering do?", "o": ["Lets an administrator permit or deny clients based on their physical MAC hardware address", "Assigns IP addresses", "Encrypts the MAC address", "Hides the SSID"], "a": 0, "e": "An administrator can manually allow or block wireless access by MAC address."}, {"q": "Why are SSID cloaking and MAC filtering not strong protections by themselves?", "o": ["They require expensive hardware", "They disable encryption", "SSIDs are easily discovered even if APs do not broadcast them, and MAC addresses can be spoofed", "They are not supported on routers"], "a": 2, "e": "The best way to secure a wireless network is with authentication and encryption systems."}, {"q": "Which of the original 802.11 authentication methods lets any wireless client easily connect and should be used only when security is of no concern?", "o": ["Shared key authentication", "WPA3", "Open system authentication", "RADIUS"], "a": 2, "e": "Open authentication needs no password and is typically used for free Internet access in public areas."}, {"q": "Which authentication method provides mechanisms such as WEP, WPA, WPA2 and WPA3 to authenticate and encrypt data between a client and AP?", "o": ["SSID cloaking", "Open system authentication", "MAC filtering", "Shared key authentication"], "a": 3, "e": "Shared key authentication covers WEP, WPA, WPA2 and WPA3."}, {"q": "Which encryption method does WEP use?", "o": ["TKIP", "Protected Management Frames", "Rivest Cipher 4 (RC4) with a static key", "AES with CCMP"], "a": 2, "e": "WEP used RC4 with a static key that never changes, making it easy to hack and no longer recommended."}, {"q": "How does WPA improve on WEP?", "o": ["It uses a static key", "It removes encryption", "It uses no authentication", "It uses TKIP, which changes the key for each packet"], "a": 3, "e": "TKIP makes WPA much harder to hack than WEP."}, {"q": "Which encryption protocol does WPA2 use, and why is it preferred?", "o": ["AES, currently considered the strongest encryption protocol", "TKIP, which is stronger than AES", "None; WPA2 is unencrypted", "RC4, which uses a static key"], "a": 0, "e": "WPA2 uses the Advanced Encryption Standard, the preferred method because it is far stronger."}, {"q": "What does CCMP allow destination hosts to do?", "o": ["Hide the SSID", "Assign IP addresses", "Recognize whether the encrypted and non-encrypted bits have been altered", "Disable encryption"], "a": 2, "e": "CCMP (Counter Cipher Mode with Block Chaining Message Authentication Code Protocol) is used with AES."}, {"q": "What requirement does WPA3 add that WPA2 does not?", "o": ["Use of Protected Management Frames (PMF) and disallowing outdated legacy protocols", "Use of WEP", "Static keys", "Open authentication only"], "a": 0, "e": "WPA3 uses the latest security methods and requires PMF."}, {"q": "Which is NOT one of the four WPA3 features listed in the module?", "o": ["WPA3-Personal", "WEP Compatibility Mode", "WPA3-Enterprise", "Internet of Things (IoT) Onboarding"], "a": 1, "e": "The four listed features are WPA3-Personal, WPA3-Enterprise, Open Networks and IoT Onboarding."}, {"q": "Which WPA2 mode is intended for home or small office networks and uses a pre-shared key (PSK)?", "o": ["Enterprise", "Ad hoc", "Personal", "Open"], "a": 2, "e": "Personal mode uses a pre-shared password, while Enterprise requires a RADIUS server."}, {"q": "Which WPA2 mode requires a RADIUS authentication server and 802.1X with EAP?", "o": ["Enterprise", "Cloaked", "Open", "Personal"], "a": 0, "e": "In Enterprise mode the device is authenticated by the RADIUS server and users authenticate using 802.1X EAP."}, {"q": "Which UDP ports are officially assigned to RADIUS authentication and RADIUS accounting?", "o": ["22 and 23", "53 and 67", "80 and 443", "1812 and 1813"], "a": 3, "e": "RADIUS authentication uses 1812 and accounting uses 1813, though 1645 and 1646 can also be used."}, {"q": "What is the shared key used for in enterprise WLAN authentication settings?", "o": ["To authenticate the client to the Internet", "To encrypt the SSID", "To assign an IP address", "To authenticate the AP with the RADIUS server"], "a": 3, "e": "The RADIUS shared key authenticates the AP to the RADIUS server."}, {"q": "Which shared key authentication method does the module say should never be used?", "o": ["WEP", "WPA2", "WPA", "WPA3"], "a": 0, "e": "WEP relies on a static RC4 key that never changes, so it is easy to hack and no longer recommended."}, {"q": "Which four shared key authentication techniques does the module list?", "o": ["PAP, CHAP, EAP and RADIUS", "WEP, WPA, WPA2 and WPA3", "Open, Personal, Enterprise and PSK", "WEP, TKIP, AES and CCMP"], "a": 1, "e": "Until WPA3 devices are ubiquitous, networks should use WPA2."}], "group": "practice"}, {"id": 6, "label": "Module 6", "title": "Network Security Infrastructure", "qs": [{"q": "What is a firewall?", "o": ["A sensor that copies traffic to a monitoring port for analysis", "A server that issues and verifies digital certificates", "A protocol that keeps device clocks synchronized", "A system, or group of systems, that enforces an access control policy between networks"], "a": 3, "e": "A firewall is a system or group of systems that enforces an access control policy between networks. Port mirroring, certificate servers and NTP serve other purposes."}, {"q": "Which is a common firewall property?", "o": ["It is the only transit point between internal corporate networks and external networks, because all traffic flows through it", "It is designed to be bypassed by traffic from trusted internal hosts", "It inspects only the traffic that arrives from the private network", "It is one of several equal paths to the Internet, so traffic can avoid it"], "a": 0, "e": "Firewalls are resistant to network attacks, are the only transit point between internal and external networks, and enforce the access control policy."}, {"q": "Which is a benefit of using a firewall?", "o": ["It speeds up the network by caching every packet it inspects", "It lets users reach blocked material without exposing the network", "It sanitizes protocol flow, which prevents the exploitation of protocol flaws", "It removes the need to protect servers and clients from malicious data"], "a": 2, "e": "Firewalls prevent exposure of sensitive hosts to untrusted users, sanitize protocol flow, block malicious data from servers and clients, and reduce management complexity by off-loading access control to a few firewalls."}, {"q": "Which is a listed firewall limitation?", "o": ["It cannot enforce an access control policy between networks", "A misconfigured firewall can have serious consequences, such as becoming a single point of failure", "It always improves network performance, so no tuning is needed", "It stops all unauthorized traffic, including traffic tunneled as legitimate traffic"], "a": 1, "e": "Other limitations on the slide: some applications cannot pass over firewalls securely, users may look for ways around the firewall, network performance can slow down, and unauthorized traffic can be tunneled or hidden as legitimate traffic."}, {"q": "In a two-interface private and public firewall design, how is traffic that originates from the public network and travels to the private network treated?", "o": ["It is generally blocked", "It is permitted without inspection", "It is permitted if it uses a well-known port", "It is copied to a monitoring port and then forwarded"], "a": 0, "e": "Traffic from the private network is permitted and inspected on its way out, and inspected return traffic is permitted. Traffic that originates from the public network toward the private network is generally blocked."}, {"q": "A firewall design has one inside interface connected to the private network, one outside interface connected to the public network, and one more interface. What is this design called?", "o": ["Demilitarized zone (DMZ)", "Private and public design", "Packet filtering design", "Transparent firewall design"], "a": 0, "e": "A DMZ design adds a third interface for the DMZ alongside the inside and outside interfaces. The private and public design uses only two interfaces."}, {"q": "In a zone-based policy firewall (ZPF), what is a zone?", "o": ["A group of one or more interfaces that have similar functions or features", "A single IP subnet assigned to one VLAN", "A set of signatures used to detect malicious activity", "A level in the hierarchical NTP time system"], "a": 0, "e": "Zones specify where a Cisco IOS firewall rule or policy should be applied, and a zone is a group of one or more interfaces with similar functions or features."}, {"q": "How is traffic between two interfaces in the same ZPF zone handled?", "o": ["It is blocked until a policy permits it", "It is inspected only by the router self-zone", "It is dropped unless it belongs to an established TCP session", "It is not subject to any policy and passes freely"], "a": 3, "e": "Traffic between interfaces in the same zone passes freely. It is zone-to-zone traffic that is blocked by default."}, {"q": "What is the default treatment of zone-to-zone traffic in a ZPF?", "o": ["All of it is permitted until a deny policy is configured", "It is permitted only in the direction from the private zone", "All of it is blocked, and a policy allowing or inspecting traffic must be configured to permit it", "It is permitted for HTTP and DNS and blocked otherwise"], "a": 2, "e": "ZPF uses a default deny-any policy between zones. To permit traffic between zones, a policy allowing or inspecting that traffic must be configured."}, {"q": "Which is the only exception to the default deny-any policy in a ZPF?", "o": ["Traffic going to the DMZ zone", "Traffic coming from the Internet zone", "The router self-zone", "Traffic that uses HTTP"], "a": 2, "e": "The router self-zone is the only exception to the default deny-any policy."}, {"q": "Which firewall type is usually part of a router firewall and permits or denies traffic based on Layer 3 and Layer 4 information?", "o": ["Stateful firewall", "Packet filtering (stateless) firewall", "Application gateway firewall", "Next-generation firewall"], "a": 1, "e": "Packet filtering firewalls are stateless and use Layer 3 and Layer 4 information. Stateful firewalls add a state table, and application gateways work up to Layer 7."}, {"q": "Which firewall type keeps connection information in a state table and analyzes traffic at OSI Layers 3 through 5?", "o": ["Stateful firewall", "Packet filtering (stateless) firewall", "Application gateway firewall", "Transparent firewall"], "a": 0, "e": "Stateful firewalls provide stateful packet filtering using connection information maintained in a state table, covering OSI Layers 3 through 5."}, {"q": "Which firewall type filters information at Layers 3, 4, 5 and 7, with most of the filtering done in software?", "o": ["Packet filtering (stateless) firewall", "Application gateway (proxy) firewall", "Stateful firewall", "Host-based firewall"], "a": 1, "e": "An application gateway, also called a proxy firewall, filters at Layers 3, 4, 5 and 7. Most of its control and filtering is done in software."}, {"q": "Which firewall goes beyond stateful inspection by providing integrated intrusion prevention and application awareness and control?", "o": ["Packet filtering (stateless) firewall", "Application gateway firewall", "Hybrid firewall", "Next-generation firewall (NGFW)"], "a": 3, "e": "NGFWs go beyond stateful firewalls with integrated intrusion prevention, application awareness and control, upgrade paths for future information feeds, and techniques to address evolving threats."}, {"q": "Which is a way that IDS and IPS sensors can be deployed?", "o": ["A DNS server configured with signatures", "An NTP stratum 1 server", "A router configured with Cisco IOS IPS software", "A RADIUS server with an IPS module"], "a": 2, "e": "Sensors can be a router running Cisco IOS IPS software, a device designed for dedicated IDS or IPS services, or a network module installed in an ASA, switch or router."}, {"q": "What is a signature in the context of an IDS or IPS?", "o": ["A set of rules used to detect malicious activity", "A hash that proves a log message was not altered", "A key pair used to authenticate a VPN peer", "A record of the connections kept in a state table"], "a": 0, "e": "Both IDS and IPS use signatures to detect patterns of misuse in network traffic. A signature is a set of rules that the IDS or IPS uses to detect malicious activity."}, {"q": "How do atomic and composite patterns differ?", "o": ["Atomic patterns involve multiple packets, while composite patterns involve a single packet", "Atomic patterns are detected only by an IPS, while composite patterns are detected only by an IDS", "Atomic patterns apply to hosts, while composite patterns apply to networks", "Atomic patterns involve a single packet, while composite patterns involve multiple packets"], "a": 3, "e": "Both IDS and IPS can detect atomic patterns (single-packet) and composite patterns (multi-packet)."}, {"q": "Which is a disadvantage of an IDS compared with an IPS?", "o": ["A sensor failure can affect network traffic", "It adds some latency and jitter to the network", "Its response action cannot stop the trigger packets", "Sensor overloading impacts the network"], "a": 2, "e": "An IDS cannot stop trigger packets and is more vulnerable to evasion. The other three are IPS disadvantages, because an IPS sits in the traffic path."}, {"q": "Which is an advantage of an IPS compared with an IDS?", "o": ["It has no impact on network latency or jitter", "It can stop trigger packets and can use stream normalization techniques", "A sensor failure has no impact on the network", "It is not affected by sensor overload"], "a": 1, "e": "An IPS can stop trigger packets and use stream normalization. The other options are IDS advantages, because an IDS is not in the traffic path."}, {"q": "Which are disadvantages of a host-based IPS (HIPS)?", "o": ["It cannot protect a host at the operating system level", "It cannot see traffic after it has been decrypted", "It is operating system dependent and must be installed on all hosts", "It can only be deployed on routers and switches"], "a": 2, "e": "HIPS is software that must be installed on every host it protects, and it depends on the host operating system."}, {"q": "Which is an advantage of a host-based IPS (HIPS)?", "o": ["One installation protects hosts running any operating system", "No software needs to be installed on the hosts", "It monitors network devices but not application activity", "It protects the host after the message is decrypted"], "a": 3, "e": "HIPS provides protection specific to a host operating system, operating system and application-level protection, and protection after the message is decrypted."}, {"q": "Which Cisco appliance provides advanced malware analysis and protection before, during and after an attack?", "o": ["Cisco Web Security Appliance (WSA)", "Cisco Advanced Malware Protection (AMP)", "Cisco Email Security Appliance (ESA)", "Cisco Adaptive Security Appliance (ASA)"], "a": 1, "e": "AMP is an enterprise-class malware analysis and protection solution that covers the full attack timeline. It uses the intelligence of the Cisco Talos Security Intelligence and Research Group."}, {"q": "Which Cisco appliance is a secure web gateway that blocks risky sites and tests unknown sites before users are allowed to access them?", "o": ["Cisco Web Security Appliance (WSA)", "Cisco Advanced Malware Protection (AMP)", "Cisco Email Security Appliance (ESA)", "Cisco Talos"], "a": 0, "e": "The WSA combines protections for securing and controlling web traffic, with malware protection, application visibility and control, acceptable use policy controls, reporting and secure mobility."}, {"q": "Which Cisco appliance defends mission-critical email systems with spam blocking, advanced malware protection and outbound message control?", "o": ["Cisco Web Security Appliance (WSA)", "Cisco Advanced Malware Protection (AMP)", "Cisco Email Security Appliance (ESA)", "Cisco Adaptive Security Appliance (ASA)"], "a": 2, "e": "The ESA defends email systems and is constantly updated by real-time feeds from Cisco Talos. The slide summary mislabels it as WSA, but the correct abbreviation is ESA."}, {"q": "What does Cisco Talos provide to the specialized security appliances?", "o": ["A way to synchronize time across all network devices", "Security intelligence from a research group that detects and correlates threats in real time using the largest threat-detection network in the world", "Centralized authentication, authorization and accounting", "A local copy of every packet that passes through a switch"], "a": 1, "e": "AMP, WSA and ESA use the services of the Cisco Talos Security Intelligence and Research Group."}, {"q": "What is an access control list (ACL)?", "o": ["A database on SNMP agents that stores operational statistics about the device", "A set of signatures used to detect patterns of misuse", "A series of commands that control whether a device forwards or drops packets based on information in the packet header", "A table of connection states maintained by a stateful firewall"], "a": 2, "e": "ACLs limit traffic to increase performance, provide traffic flow control and basic security, filter by traffic type, and screen hosts. They can also select types of traffic to be analyzed, forwarded or processed in other ways."}, {"q": "What can a standard IPv4 ACL evaluate?", "o": ["Only the source IPv4 address of a packet", "The source and destination IPv4 addresses and the ports involved", "The protocol type and the destination TCP port", "The ToS marking and the input interface"], "a": 0, "e": "Standard ACLs permit or deny traffic only from source IPv4 addresses. The destination and the ports are not evaluated."}, {"q": "Which attribute can an extended IPv4 ACL filter on that a standard ACL cannot?", "o": ["Source IPv4 address", "The router self-zone", "The NTP stratum of the sender", "Destination TCP or UDP port"], "a": 3, "e": "Extended ACLs filter on protocol type, source and destination IPv4 addresses, source and destination TCP or UDP ports, and optional protocol type information. Standard ACLs filter only on source address."}, {"q": "How can standard and extended ACLs be identified?", "o": ["Only by a number", "Only by a name", "By either a number or a name", "By the MAC address of the interface they are applied to"], "a": 2, "e": "Standard and extended ACLs can be created using either a number or a name to identify the ACL and its list of statements."}, {"q": "What does ACL logging do?", "o": ["It generates and logs a message when traffic meets the permit or deny criteria in the ACL", "It copies matching traffic to a port with a network monitor attached", "It synchronizes the router clock with the logging server", "It encrypts the traffic that matches a permit statement"], "a": 0, "e": "By configuring ACL logging, an ACL message can be generated and logged when traffic meets the permit or deny criteria defined in the ACL."}, {"q": "How can a Cisco ACL deny TCP traffic from outside the network that is trying to establish a new TCP session?", "o": ["By allowing only TCP traffic that has the SYN bit set", "By permitting only UDP traffic from outside the network", "By enabling ACL logging on the outside interface", "By allowing only TCP traffic that has the ACK or RST bit set, so only established sessions are permitted"], "a": 3, "e": "Traffic that belongs to an established TCP session carries the ACK or RST bit, so an ACL that permits only that traffic blocks new sessions that start from outside."}, {"q": "Why can't a packet analyzer or IDS on a switched network see all the traffic on a network segment?", "o": ["Packet analyzers can read only encrypted traffic", "Packet analyzers can capture only traffic sent to the router self-zone", "Switches duplicate every frame to all ports, which hides the original", "Switches can isolate traffic, so sniffers and monitors cannot access all of it"], "a": 3, "e": "This limitation of packet analyzers (traffic sniffers) and network monitors such as an IDS is why port mirroring exists."}, {"q": "What does port mirroring do?", "o": ["It moves all traffic to the monitor port and drops the original frames", "It makes a switch send duplicate copies of passing traffic out a port with a network monitor attached, while the original traffic is forwarded as usual", "It copies traffic from a router to an NTP server", "It blocks traffic to the port where the monitor is attached"], "a": 1, "e": "Port mirroring lets a switch duplicate the traffic passing through it and send the copy to a monitor. Normal forwarding is not affected."}, {"q": "Which is one of the three primary functions of the syslog logging service?", "o": ["The ability to synchronize device clocks with a server", "The ability to authorize router commands on a per-user basis", "The ability to specify the destination of captured syslog messages", "The ability to distinguish packet flows using seven fields"], "a": 2, "e": "Syslog can gather logging information for monitoring and troubleshooting, select the type of logging information captured, and specify the destination of captured messages."}, {"q": "Which two elements make up an SNMP system?", "o": ["An SNMP manager and SNMP agents", "An SNMP agent and a NetFlow collector", "A network management system and a syslog server", "A stratum 1 server and stratum 2 clients"], "a": 0, "e": "The SNMP manager runs SNMP management software and is part of a network management system (NMS). The agents are the nodes being monitored and managed."}, {"q": "How do SNMP agents forward information directly to a network manager?", "o": ["By using traps", "By using the get action", "By using the set action", "By using port mirroring"], "a": 0, "e": "The manager uses the get action to collect information from an agent and the set action to change its configuration. Agents send traps to forward information directly to the manager."}, {"q": "What does Cisco NetFlow provide?", "o": ["Time synchronization for routers and switches", "Statistics on packets flowing through a Cisco router or multilayer switch", "Authentication, authorization and accounting for administrators", "Duplicate copies of switch traffic sent to a monitor port"], "a": 1, "e": "NetFlow data supports network and security monitoring, network planning, traffic analysis (including finding bottlenecks) and IP accounting for billing."}, {"q": "Which is NOT one of the seven fields NetFlow uses to distinguish packet flows?", "o": ["Destination port number", "Layer 3 protocol type", "Source MAC address", "Input logical interface"], "a": 2, "e": "The seven fields are source and destination IP address, source and destination port number, Layer 3 protocol type, Type of Service (ToS) marking, and input logical interface."}, {"q": "Why is NTP important on a network?", "o": ["It encrypts log messages as they travel to the syslog server", "It copies traffic to a device that analyzes it", "It collects traffic statistics for billing", "Without synchronized time, it is impossible to determine the order of events that occurred in different parts of the network"], "a": 3, "e": "NTP lets routers synchronize their time settings with an NTP server. A group of NTP clients that get time from a single source have more consistent time settings."}, {"q": "In the NTP hierarchy, what are stratum 0 devices?", "o": ["Servers directly connected to the authoritative time sources", "High-precision timekeeping devices that act as authoritative time sources, assumed accurate with little or no delay", "Clients that synchronize with stratum 1 servers using NTP packets", "Routers on which NTP has been disabled"], "a": 1, "e": "Stratum 0 devices are the authoritative time sources. Stratum 1 devices connect directly to them, and stratum 2 devices sync from stratum 1 over network connections."}, {"q": "Which NTP level is directly connected to the authoritative time sources and acts as the primary network time standard?", "o": ["Stratum 0", "Stratum 1", "Stratum 2", "Stratum 3"], "a": 1, "e": "Stratum 1 devices are directly connected to the stratum 0 authoritative sources and act as the primary network time standard."}, {"q": "How do stratum 2 devices obtain their time?", "o": ["Directly from authoritative time sources", "Over network connections from stratum 1 servers, using NTP packets", "From SNMP agents using traps", "From a syslog server"], "a": 1, "e": "Stratum 2 devices, such as NTP clients, synchronize using NTP packets from stratum 1 servers. They can also act as servers for stratum 3 devices."}, {"q": "Which AAA function requires users and administrators to prove that they are who they say they are?", "o": ["Authentication", "Authorization", "Accounting", "Availability"], "a": 0, "e": "Authentication can use username and password combinations, challenge and response questions, token cards and other methods. It provides a centralized way to control access to the network."}, {"q": "After a user is authenticated, which AAA function determines the resources the user can access and the operations the user is allowed to perform?", "o": ["Authentication", "Authorization", "Accounting", "Auditing"], "a": 1, "e": "Authorization services decide which resources an authenticated user can access and which operations the user may perform."}, {"q": "Which AAA function records what a user does, including what is accessed, the amount of time it is accessed, and any changes made?", "o": ["Authentication", "Authorization", "Accounting", "Access control"], "a": 2, "e": "Accounting keeps track of how network resources are used."}, {"q": "Which transport protocols do TACACS+ and RADIUS use?", "o": ["TACACS+ uses UDP and RADIUS uses TCP", "Both use TCP", "Both use UDP", "TACACS+ uses TCP and RADIUS uses UDP"], "a": 3, "e": "TACACS+ transports over TCP, while RADIUS uses UDP. TACACS+ is mostly Cisco supported, and RADIUS is an open RFC standard."}, {"q": "How do TACACS+ and RADIUS differ in confidentiality?", "o": ["TACACS+ encrypts only the password, while RADIUS encrypts the entire packet", "Both encrypt the entire packet", "Neither one encrypts any part of the packet", "TACACS+ encrypts the entire packet, while RADIUS encrypts only the password"], "a": 3, "e": "TACACS+ encrypts the entire packet. RADIUS encrypts only the password."}, {"q": "Which protocol can authorize router commands on a per-user or per-group basis?", "o": ["TACACS+ only", "RADIUS only", "Both TACACS+ and RADIUS", "Neither TACACS+ nor RADIUS"], "a": 0, "e": "TACACS+ provides per-user or per-group authorization of router commands. RADIUS has no such option, and it combines authentication and authorization while separating accounting."}, {"q": "What is a virtual private network (VPN)?", "o": ["A dedicated leased line that carries traffic for a single organization", "A private network created over a public network, usually the Internet, where the traffic is encrypted to keep it confidential", "A firewall zone that holds public-facing servers", "A protocol that keeps the clocks of network devices synchronized"], "a": 1, "e": "A VPN uses virtual connections routed through the Internet from the organization to the remote site. Its traffic is encrypted to keep the data confidential across the public network."}, {"q": "Which are common examples of Layer 3 VPNs?", "o": ["GRE, NTP and IPsec", "MPLS, RADIUS and IPsec", "GRE, MPLS and NetFlow", "GRE, MPLS and IPsec"], "a": 3, "e": "Layer 3 VPNs can be point-to-point site connections such as GRE and IPsec, or can give any-to-any connectivity to many sites using MPLS."}], "group": "practice"}, {"id": "q1", "group": "quiz", "label": "Module 1 quiz", "title": "Cybersecurity Threats, Vulnerabilities, and Attacks (1.6.2)", "qs": [{"q": "What type of attack occurs when data goes beyond the memory areas allocated to an application?", "o": ["Buffer overflow", "SQL injection", "RAM injection", "RAM spoofing"], "a": 0, "e": "A buffer overflow happens when data is written beyond the limits of a buffer. It can crash the system, compromise data or give an attacker higher privileges."}, {"q": "Which of the following statements describes a distributed denial of service (DDoS) attack?", "o": ["An attacker sends an enormous quantity of data that a server cannot handle", "An attacker monitors network traffic to learn authentication credentials", "A botnet of zombies, coordinated by an attacker, overwhelms a server with DoS attacks", "One computer accepts data packets based on the MAC address of another computer"], "a": 2, "e": "A DDoS attack uses many compromised systems (zombies) at once. Sending one huge flood from a single source is a plain DoS attack."}, {"q": "Employees report that network access is slow. Investigation shows one employee downloaded a third-party scanning program for the printer. What type of malware may have been introduced?", "o": ["Worm", "Trojan horse", "Spam", "Phishing"], "a": 0, "e": "A worm spreads through the network without user action and usually slows the network down."}, {"q": "The customer database file is now encrypted, and the organization receives a threatening email demanding payment for decryption. What type of attack is this?", "o": ["DoS attack", "Ransomware", "Man-in-the-middle attack", "Trojan horse"], "a": 1, "e": "Ransomware encrypts data so the user cannot access it, then demands payment to restore access."}, {"q": "A penetration test identified a backdoor on the network. What action should the organization take to find out if its systems have been compromised?", "o": ["Scan the systems for viruses", "Look for policy changes in Event Viewer", "Look for usernames that do not have passwords", "Look for unauthorized accounts"], "a": 3, "e": "After a successful penetration test, locate the vulnerabilities and check whether new unauthorized accounts have been created."}, {"q": "What non-technical method could a cybercriminal use to gather sensitive information from an organization?", "o": ["Man-in-the-middle", "Ransomware", "Pharming", "Social engineering"], "a": 3, "e": "Social engineering manipulates people, often by building trust or familiarity, to get sensitive information."}, {"q": "A caller says a manager's presentation files are corrupted, sternly demands that the secretary email them to a personal address, and says the secretary will be held personally responsible. Which social engineering tactic is this?", "o": ["Trusted partners", "Familiarity", "Urgency", "Intimidation"], "a": 3, "e": "Intimidation bullies a victim into an action that compromises security."}, {"q": "All employees receive an email saying their password will expire immediately and must be reset within five minutes. Which statement best describes this email?", "o": ["It is an impersonation attack", "It is a hoax", "It is a piggyback attack", "It is a DDoS attack"], "a": 1, "e": "A hoax is intended to deceive and causes unnecessary disruption, extra work and fear."}, {"q": "Which best practices can help defend against social engineering attacks? (Choose three.)", "o": ["Resist the urge to click on enticing web links", "Do not provide password resets in a chat window", "Deploy well-designed firewall appliances", "Enable a policy that states that the IT department should supply information over the phone only to managers", "Add more security guards", "Educate employees regarding security policies"], "a": [0, 1, 5], "e": "Defense against social engineering is mostly about people: training, not giving out resets over chat, and not clicking unknown links."}, {"q": "What do you call an impersonation attack that takes advantage of a trusted relationship between two systems?", "o": ["Spoofing", "Sniffing", "Spamming", "Man-in-the-middle"], "a": 0, "e": "In spoofing, an attacker disguises a device with a valid network address to bypass authentication. MAC and IP addresses can both be spoofed."}, {"q": "A cybercriminal sends a series of maliciously formatted packets to a database server, which causes the server to crash. What type of attack is this?", "o": ["Packet injection", "SQL injection", "Man-in-the-middle", "DoS"], "a": 3, "e": "A DoS attack tries to make a server or network resource unavailable to legitimate users."}, {"q": "Which resource can a cybersecurity specialist use to identify specific details about vulnerabilities?", "o": ["CVE national database", "NIST/NICE framework", "ISO/IEC 27000 model", "Infragard"], "a": 0, "e": "The CVE list gives each vulnerability a standard identifier, a short description and references. MITRE maintains it."}]}, {"id": "q2", "group": "quiz", "label": "Module 2 quiz", "title": "Securing Networks (2.3.2)", "qs": [{"q": "Which security measure is typically found both inside and outside a data center facility?", "o": ["A gate", "Exit sensors", "Security traps", "Continuous video surveillance", "Biometrics access"], "a": 3, "e": "Video surveillance is used inside and outside. Gates are outside perimeter security, and security traps, biometrics and exit sensors are inside perimeter security."}, {"q": "What is hyperjacking?", "o": ["Overclocking the mesh network that connects the data center servers", "Adding outdated security software to a virtual machine to gain access to a data center server", "Taking over a virtual machine hypervisor as part of a data center attack", "Using processors from multiple computers to increase data processing power"], "a": 2, "e": "The attacker hijacks the hypervisor and then uses the VM to attack other data center devices."}, {"q": "Which statement accurately characterizes the evolution of threats to network security?", "o": ["Internet architects planned for network security from the beginning", "Internal threats can cause even greater damage than external threats", "Early Internet users often engaged in activities that would harm other users", "Threats have become less sophisticated while the technical knowledge needed by an attacker has grown"], "a": 1, "e": "Internal users have direct access to the network and data, so intentional or accidental internal threats can be worse than external ones."}, {"q": "When considering network security, what is the most valuable asset of an organization?", "o": ["Customers", "Financial resources", "Personnel", "Data"], "a": 3, "e": "Data such as R&D, sales, financial, HR, legal, employee and customer data is likely the most valuable asset."}, {"q": "Which resource is affected by weak security settings on a company-owned device that is housed in another location?", "o": ["Hard copy", "Removable media", "Cloud storage device", "Social networking"], "a": 2, "e": "Cloud storage has many benefits, but data stored there can be exposed by weak security settings."}, {"q": "In the video about the anatomy of an attack, a threat actor got in through a network device, downloaded data and destroyed it. Which flaw allowed this?", "o": ["Open ports on the firewall", "Lack of a strong password policy", "A flat network with no subnets or VLANs", "Improper physical security to gain access to the building"], "a": 2, "e": "The flat network let the attacker reach and destroy all kinds of data after entering through a thermostat that was on the network but not scanned."}, {"q": "An IT security manager plans updates for a network of interconnected LANs with a VPN router, ASA firewall, IPS, AAA server, and Layer 2 and Layer 3 switches (the exhibit). Which type of network is this?", "o": ["WAN", "SOHO", "CAN", "Data center"], "a": 2, "e": "A campus area network (CAN) is distinguished by interconnected LANs."}, {"q": "Which two security features are commonly found in a WAN design? (Choose two.)", "o": ["Outside perimeter security including continuous video surveillance", "Firewalls protecting the main and remote sites", "Port security on all user-facing ports", "VPNs used by mobile workers between sites", "WPA2 for data encryption of all data between sites"], "a": [1, 3], "e": "WANs usually connect over the public Internet, so each site typically has a firewall and VPNs are used by remote workers and between sites."}, {"q": "Which security technology is commonly used by a teleworker to access resources on the main corporate office network?", "o": ["VPN", "IPS", "SecureX", "Biometric access"], "a": 0, "e": "VPNs are commonly used between corporate sites and by mobile or remote workers."}, {"q": "Which technology is used to secure, monitor and manage mobile devices?", "o": ["VPN", "Rootkit", "MDM", "ASA firewall"], "a": 2, "e": "Mobile Device Management secures, monitors and manages corporate-owned and employee-owned smartphones, tablets, laptops and desktops."}, {"q": "Which type of hacker commits crimes and does arguably unethical things, but not for personal gain or to cause damage? An example is someone who compromises a network without permission and then discloses the vulnerability publicly.", "o": ["White hat hackers", "Black hat hackers", "Gray hat hackers", "Script kiddies"], "a": 2, "e": "Gray hat hackers fall between ethical and criminal behavior."}, {"q": "Which type of hacker uses programming skills for good, ethical and legal purposes, for example by performing penetration tests to discover network vulnerabilities?", "o": ["Gray hat hackers", "Black hat hackers", "Hacktivists", "White hat hackers"], "a": 3, "e": "White hat hackers are the ethical ones."}, {"q": "Which type of hacker is an unethical criminal who violates computer and network security for personal gain or malicious reasons, such as attacking networks?", "o": ["White hat hackers", "Black hat hackers", "Gray hat hackers", "Vulnerability brokers"], "a": 1, "e": "Black hat hackers act for personal gain or malicious purposes."}, {"q": "Which term refers to threat actors who are either self-employed or working for large cybercrime organizations?", "o": ["Hacktivists", "State-sponsored hackers", "Cybercriminals", "Vulnerability brokers"], "a": 2, "e": "Cybercriminals are black hat hackers who steal billions of dollars from consumers and businesses each year."}, {"q": "Which statement describes the characteristics of indicators of attack (IOA)?", "o": ["They focus on the motivation behind an attack and the potential means by which threat actors have, or will, compromise vulnerabilities to gain access to assets", "They focus on identifying malware files, IP addresses of servers used in attacks, filenames and characteristic changes made to end system software", "They are shared through the AIS (Automated Indicator Sharing) system and help to limit the size of the attack surface", "They help cybersecurity personnel identify what has happened in an attack and develop defenses against it"], "a": 0, "e": "IOAs are about attacker strategies and support a proactive approach. The other three statements describe indicators of compromise (IOC) and AIS."}, {"q": "What are two reasons that internal threats may cause greater damage than external threats? (Choose two.)", "o": ["Internal users have direct access to the building and its infrastructure devices", "Internal users have better access to attacking tools", "Internal users may have knowledge of the corporate network, its resources and its confidential data", "State-sponsored hacking is typically carried out by internal users", "Internet users can easily conceal their attacking trails"], "a": [0, 2], "e": "Direct physical access and inside knowledge are what make internal threats dangerous."}, {"q": "Which term is used to describe a potential danger to an asset such as data or the network itself?", "o": ["Threat", "Risk", "Exploit", "Vulnerability"], "a": 0, "e": "A threat is a potential danger. A vulnerability is a weakness, an exploit is the mechanism used to take advantage of it, and risk is the likelihood and impact."}, {"q": "Which statement describes the term attack surface?", "o": ["It is the likelihood that a particular threat will exploit a particular vulnerability of an asset and result in an undesirable consequence", "It is the mechanism used to leverage a vulnerability to compromise an asset", "It is a weakness in a system or its design that could be exploited by a threat", "It is the total sum of the vulnerabilities in each system that are accessible to an attacker"], "a": 3, "e": "The other options define risk, exploit and vulnerability."}, {"q": "Critical data is replicated to a cloud service provider and also insured with an insurance company. Which risk management strategy is this?", "o": ["Risk avoidance", "Risk reduction", "Risk acceptance", "Risk transfer"], "a": 3, "e": "Risk transfer moves some or all of the risk to a willing third party such as a cloud provider or an insurer."}, {"q": "Which data loss vector is described as: an employee could perform an unauthorized transfer of data to a USB drive, or a USB drive containing valuable corporate data could be lost?", "o": ["Removable media", "Email/social networking", "Unencrypted devices", "Improper access control"], "a": 0, "e": "USB drives and other removable media make both theft and loss easy."}, {"q": "Which data loss vector is described as: intercepted email or IM messages could be captured and reveal confidential information?", "o": ["Removable media", "Unencrypted devices", "Improper access control", "Email/social networking"], "a": 3, "e": "Messages sent over email or IM can be intercepted."}, {"q": "Which data loss vector is described as: if the data is not stored using an encryption algorithm, a thief can retrieve valuable confidential data from a stolen corporate laptop?", "o": ["Removable media", "Email/social networking", "Improper access control", "Unencrypted devices"], "a": 3, "e": "Encrypting stored data protects it when a device is stolen."}, {"q": "Which data loss vector is described as: stolen or weak passwords that have been compromised can give an attacker easy access to corporate data?", "o": ["Removable media", "Email/social networking", "Unencrypted devices", "Improper access control"], "a": 3, "e": "Weak or stolen credentials, and loose access control, expose corporate data."}, {"q": "Which Cisco group is responsible for investigating and mitigating potential vulnerabilities in Cisco products?", "o": ["Cybersecurity Infrastructure and Security Agency (CISA)", "National Cyber Security Alliance (NCSA)", "Cisco Product Security Incident Response Team (PSIRT)", "Cisco Talos Intelligence Group"], "a": 2, "e": "Talos provides security and threat intelligence. CISA and NCSA are US organizations that promote cybersecurity."}, {"q": "What is an attack vector?", "o": ["It refers to attacks carried out specifically by internal users", "It is a tool that a threat actor uses to attack an organization", "It refers to a threat group that launches DDoS attacks", "A path by which a threat actor can gain access to a server, host or network"], "a": 3, "e": "Attack vectors can originate from inside or outside the corporate network."}]}, {"id": "q3", "group": "quiz", "label": "Module 3 quiz", "title": "Attacking the Foundation (3.4.2)", "qs": [{"q": "Which field in an IPv6 packet is used by the router to determine if a packet has expired and should be dropped?", "o": ["TTL", "Address Unreachable", "No Route to Destination", "Hop Limit"], "a": 3, "e": "IPv6 has no TTL field. Its Hop Limit field does the same job."}, {"q": "An attacker uses a laptop as a rogue access point to capture all network traffic from a targeted user. Which type of attack is this?", "o": ["Man in the middle", "Trust exploitation", "Buffer overflow", "Port redirection"], "a": 0, "e": "A man-in-the-middle attack places an unauthorized device between two legitimate devices to capture or redirect traffic."}, {"q": "Which field in the IPv4 header is used to prevent a packet from traversing a network endlessly?", "o": ["Sequence Number", "Time-to-Live", "Acknowledgment Number", "Differentiated Services"], "a": 1, "e": "TTL drops by one at each router. At zero the router discards the packet and sends an ICMP Time Exceeded message. Sequence and Acknowledgment Numbers are TCP fields."}, {"q": "What is involved in an IP address spoofing attack?", "o": ["A rogue node replies to an ARP request with its own MAC address indicated for the target IP address", "A legitimate network IP address is hijacked by a rogue node", "A rogue DHCP server provides false IP configuration parameters to legitimate DHCP clients", "Bogus DHCPDISCOVER messages are sent to consume all the available IP addresses on a DHCP server"], "a": 1, "e": "The rogue node poses as a valid host. The other options describe ARP poisoning, DHCP spoofing and DHCP starvation."}, {"q": "Which type of attack involves the unauthorized discovery and mapping of network systems and services?", "o": ["Reconnaissance", "DoS", "Access", "Trust exploitation"], "a": 0, "e": "Reconnaissance attacks discover and map the network and its systems."}, {"q": "In which TCP attack is the cybercriminal trying to overwhelm a target host with half-open TCP connections?", "o": ["SYN flood attack", "Reset attack", "Port scan attack", "Session hijacking attack"], "a": 0, "e": "The attacker floods the target with SYN requests from spoofed addresses and never sends the final ACK."}, {"q": "How is optional network layer information carried by IPv6 packets?", "o": ["Inside an options field that is part of the IPv6 packet header", "Inside the Flow Label field", "Inside the payload carried by the IPv6 packet", "Inside an extension header attached to the main IPv6 header"], "a": 3, "e": "Extension headers sit between the main IPv6 header and the payload."}, {"q": "A threat actor wants to interrupt a normal TCP communication between two hosts by sending a spoofed packet to both endpoints. Which TCP bit would be set?", "o": ["ACK", "FIN", "SYN", "RST"], "a": 3, "e": "A TCP reset attack tears the connection down with a spoofed RST packet."}, {"q": "A program floods a server with UDP packets, sweeping through known ports to find closed ones, and the server replies with ICMP port unreachable messages. Which two programs could launch this attack? (Choose two.)", "o": ["Wireshark", "Ping", "UDP Unicorn", "Smurf", "Low Orbit Ion Cannon"], "a": [2, 4], "e": "UDP Unicorn and Low Orbit Ion Cannon can launch UDP flood attacks that consume the bandwidth of the segment."}, {"q": "Which field in the IPv4 packet header is used to detect corruption in the IPv4 header?", "o": ["Source IPv4 address", "Protocol", "TTL", "Header checksum"], "a": 3, "e": "The header checksum field detects corruption of the IPv4 header."}, {"q": "What kind of ICMP message can threat actors use to map an internal IP network?", "o": ["ICMP echo request", "ICMP router discovery", "ICMP redirects", "ICMP mask reply"], "a": 3, "e": "Mask replies map an internal network. Redirects set up man-in-the-middle attacks, router discovery injects bogus routes, and unreachable messages support scanning."}, {"q": "Users complain about network performance. IT finds an attacker used a technique that affects the TCP three-way handshake. What is this attack called?", "o": ["DDoS", "DNS poisoning", "SYN flood", "Session hijacking"], "a": 2, "e": "A SYN flood exploits the three-way handshake by sending continuous SYN requests with spoofed source addresses."}]}, {"id": "q4", "group": "quiz", "label": "Module 4 quiz", "title": "Attacking What We Do (4.4.2)", "qs": [{"q": "Which action best describes a MAC address spoofing attack?", "o": ["Bombarding a switch with fake source MAC addresses", "Forcing the election of a rogue root bridge", "Flooding the LAN with excessive traffic", "Altering the MAC address of an attacking host to match that of a legitimate host"], "a": 3, "e": "Spoofing means impersonating a legitimate MAC address. Flooding a switch with fake source addresses is a different attack (MAC flooding)."}, {"q": "What is an objective of a DHCP spoofing attack?", "o": ["To gain illegal access to a DHCP server and modify its configuration", "To attack a DHCP server and make it unable to provide valid IP addresses to DHCP clients", "To provide false DNS server addresses to DHCP clients so that visits to a legitimate web server are directed to a fake server", "To intercept DHCP messages and alter the information before sending to DHCP clients"], "a": 2, "e": "The attacker runs a fake DHCP server that hands out false DNS information."}, {"q": "What is the primary means for mitigating virus and Trojan horse attacks?", "o": ["Encryption", "Antisniffer software", "Blocking ICMP echo and echo-replies", "Antivirus software"], "a": 3, "e": "Up-to-date antivirus software reduces the spread of viruses and Trojan horses."}, {"q": "What method can be used to mitigate ping sweeps?", "o": ["Deploying antisniffer software on all network devices", "Using encrypted or hashed authentication protocols", "Installing antivirus software on hosts", "Blocking ICMP echo and echo-replies at the network edge"], "a": 3, "e": "Blocking ICMP echo at edge routers stops ping sweeps, at the cost of also blocking ICMP diagnostic data."}, {"q": "What worm mitigation phase involves actively disinfecting infected systems?", "o": ["Quarantine", "Inoculation", "Containment", "Treatment"], "a": 3, "e": "The four phases are containment, inoculation, quarantine and treatment. Treatment ends the worm process, removes infected files and patches the exploited vulnerability."}, {"q": "What is the result of a DHCP starvation attack?", "o": ["Clients receive IP address assignments from a rogue DHCP server", "Legitimate clients are unable to lease IP addresses", "The attacker provides incorrect DNS and default gateway information to clients", "The IP addresses assigned to legitimate clients are hijacked"], "a": 1, "e": "The attacker sends many DHCPDISCOVER messages to lease the whole address pool, causing a DoS for DHCP clients."}, {"q": "Which term is used for bulk advertising emails flooded to as many end users as possible?", "o": ["Phishing", "Brute force", "Spam", "Adware"], "a": 2, "e": "Spam is unwanted bulk email sent to as many users as possible."}, {"q": "Which type of DNS attack involves the cybercriminal compromising a parent domain and creating multiple subdomains to be used during the attacks?", "o": ["Cache poisoning", "Amplification and reflection", "Shadowing", "Tunneling"], "a": 2, "e": "DNS shadowing compromises a parent domain and creates subdomains to use in attacks."}, {"q": "Which protocol would be the target of a cushioning attack?", "o": ["HTTP", "DNS", "ARP", "DHCP"], "a": 0, "e": "The HTTP 302 cushioning attack abuses the 302 Found status code to redirect the user's browser to a malicious site."}, {"q": "Which language is used to query a relational database?", "o": ["SQL", "Python", "C++", "Java"], "a": 0, "e": "Cybercriminals use SQL injection to craft malicious SQL queries against relational databases."}, {"q": "Which two attacks target web servers by exploiting vulnerabilities in the input functions of an application? (Choose two.)", "o": ["SQL injection", "Trust exploitation", "Port scanning", "Port redirection", "Cross-site scripting"], "a": [0, 4], "e": "SQL injection and cross-site scripting are command injection attacks that use input fields."}, {"q": "In which type of attack is falsified information used to redirect users to malicious Internet sites?", "o": ["ARP cache poisoning", "DNS amplification and reflection", "DNS cache poisoning", "Domain generation"], "a": 2, "e": "DNS cache poisoning plants false DNS information to redirect users."}, {"q": "What is a characteristic of a DNS amplification and reflection attack?", "o": ["Threat actors use a DoS attack that consumes the resources of the DNS open resolvers", "Threat actors use DNS open resolvers to increase the volume of attacks and to hide the true source of an attack", "Threat actors hide their phishing and malware delivery sites behind a quickly changing network of compromised DNS hosts", "Threat actors use malware to randomly generate domain names to act as rendezvous points"], "a": 1, "e": "Attackers send DNS messages to open resolvers using the victim's IP address as the source. The other options describe resource utilization, fast flux and domain generation."}]}, {"id": "q5", "group": "quiz", "label": "Module 5 quiz", "title": "Wireless Network Communication (5.4.2)", "qs": [{"q": "City Center Hospital requires that communication between employee mobile devices and the access points be encrypted. What is the purpose of this requirement?", "o": ["To ensure that users who connect to an AP are employees of the hospital", "To prevent a computer virus on a mobile device from infecting other devices", "To prevent the contents of intercepted messages from being read", "To block denial of service attacks originating on the Internet"], "a": 2, "e": "Encryption keeps intercepted traffic unreadable."}, {"q": "What feature can an administrator use to prevent unauthorized users from connecting to a wireless access point?", "o": ["Software firewall", "Proxy server", "WPA encryption", "MAC filtering"], "a": 3, "e": "MAC filtering limits which devices may connect. WPA alone does not guarantee an unauthorized user cannot find a way in."}, {"q": "What is an advantage of SSID cloaking?", "o": ["SSIDs are very difficult to discover because APs do not broadcast them", "It is the best way to secure a wireless network", "It provides free Internet access in public locations where knowing the SSID is of no concern", "Clients will have to manually identify the SSID to connect to the network"], "a": 3, "e": "SSID cloaking is weak security because the SSID is easy to discover. The best protection is authentication and encryption."}, {"q": "For which discovery mode will an AP generate the most traffic on a WLAN?", "o": ["Active mode", "Open mode", "Mixed mode", "Passive mode"], "a": 3, "e": "In passive mode the AP keeps broadcasting beacon frames. In active mode the client starts discovery. Mixed and open are not discovery modes."}, {"q": "Students at a college connect to the wireless network without using a password. Which mode is the access point using?", "o": ["Network", "Passive", "Shared-key", "Open"], "a": 3, "e": "Open authentication grants connectivity to any wireless device."}, {"q": "An employee connects to the company network wirelessly, then configures the phone as an access point for new employees to connect. Which type of security threat is this?", "o": ["Rogue access point", "Denial of service", "Spoofing", "Cracking"], "a": 0, "e": "The phone becomes a rogue AP that lets users reach the network without going through a company access point."}, {"q": "The company handbook forbids microwave ovens in offices. What wireless security risk is the company trying to avoid?", "o": ["Interception of data", "Improperly configured devices", "Accidental interference", "Rogue access points"], "a": 2, "e": "Microwave ovens and cordless phones can disrupt the performance and security of a WLAN."}, {"q": "Which two roles are typically performed by a wireless router used in a home or small business? (Choose two.)", "o": ["WLAN controller", "Ethernet switch", "Access point", "RADIUS authentication server", "Repeater"], "a": [1, 2], "e": "A SOHO wireless router acts as a router, an access point and an Ethernet switch. RADIUS runs on an external server and WLCs are for enterprises."}, {"q": "What method of wireless authentication is dependent on a RADIUS authentication server?", "o": ["WEP", "WPA Personal", "WPA2 Enterprise", "WPA2 Personal"], "a": 2, "e": "WPA2 Enterprise uses an external RADIUS server. WEP and WPA/WPA2 Personal use a pre-shared key."}, {"q": "Which wireless encryption method is the most secure?", "o": ["WPA2 with TKIP", "WPA", "WEP", "WPA2 with AES"], "a": 3, "e": "WPA2 uses AES, currently considered the strongest. TKIP belongs to WPA."}, {"q": "Which parameter is commonly used to identify a wireless network name when a home wireless AP is being configured?", "o": ["Ad hoc", "SSID", "ESS", "BESS"], "a": 1, "e": "The SSID names the wireless network and is required for a client to attach to an AP."}, {"q": "Which wireless parameter refers to the frequency bands used to transmit data to a wireless access point?", "o": ["Scanning mode", "SSID", "Security mode", "Channel settings"], "a": 3, "e": "An AP can be set to a specific band or channel to avoid interference."}, {"q": "Which device can control and manage a large number of corporate APs?", "o": ["Router", "LWAP", "Switch", "WLC"], "a": 3, "e": "A wireless LAN controller manages many lightweight access points (LWAPs) centrally."}, {"q": "A wireless engineer compares WPA2 and WPA3. How is WPA3 more secure when deployed on an open WLAN in a new cafe?", "o": ["WPA3 uses OWE to encrypt wireless traffic", "WPA3 uses DPP to securely onboard available IoT devices", "WPA3 prevents brute force attacks by using SAE", "WPA3 requires the use of a 192-bit cryptographic suite"], "a": 0, "e": "Opportunistic Wireless Encryption (OWE) encrypts all traffic on open networks."}]}, {"id": "q6", "group": "quiz", "label": "Module 6 quiz", "title": "Network Security Infrastructure (6.3.2)", "qs": [{"q": "What is the purpose of a personal firewall on a computer?", "o": ["To protect the computer from viruses and malware", "To increase the speed of the Internet connection", "To filter the traffic that is moving in and out of the PC", "To protect the hardware against fire hazard"], "a": 2, "e": "A personal firewall filters traffic. It cannot deny all illegal traffic, speed up a connection, or protect hardware."}, {"q": "What is the main difference between the implementation of IDS and IPS devices?", "o": ["An IDS can negatively impact the packet flow, whereas an IPS cannot", "An IDS uses signature-based technology to detect malicious packets, whereas an IPS uses profile-based technology", "An IDS needs to be deployed together with a firewall device, whereas an IPS can replace a firewall", "An IDS would allow malicious traffic to pass before it is addressed, whereas an IPS stops it immediately"], "a": 3, "e": "An IPS is inline and can stop an attack immediately, but may affect traffic flow. An IDS works on copies of traffic. Both use signatures, and neither replaces a firewall."}, {"q": "Which protocol provides authentication, integrity and confidentiality services and is a type of VPN?", "o": ["SP", "MD5", "IPsec", "AES"], "a": 2, "e": "IPsec offers authentication, integrity, access control and confidentiality for both remote-access and site-to-site VPNs."}, {"q": "What is a feature of the TACACS+ protocol?", "o": ["It encrypts the entire body of the packet for more secure communications", "It combines authentication and authorization as one process", "It hides passwords during transmission using PAP and sends the rest of the packet in plaintext", "It utilizes UDP to provide more efficient packet transfer"], "a": 0, "e": "TACACS+ separates authentication and authorization, encrypts all communication, and uses TCP port 49."}, {"q": "Which firewall feature ensures that packets coming into a network are legitimate responses to requests initiated from internal hosts?", "o": ["Packet filtering", "Stateful packet inspection", "Application filtering", "URL filtering"], "a": 1, "e": "Stateful inspection checks that incoming packets answer requests from inside hosts."}, {"q": "A network (marked A in the exhibit) holds corporate servers that hosts on the Internet access, and sits between two firewalls. What term describes it?", "o": ["Internal network", "Perimeter security boundary", "Untrusted network", "DMZ"], "a": 3, "e": "A demilitarized zone is protected by one or more firewalls and usually holds servers accessed by external users, such as a web server."}, {"q": "Which statement describes Cisco Cloud Web Security?", "o": ["It is a security appliance that provides an all-in-one solution for securing and controlling web traffic", "It is a cloud-based security service to scan traffic for malware and policy enforcement", "It is an advanced firewall solution to guard web servers against security threats", "It is a secure web server specifically designed for cloud computing"], "a": 1, "e": "Cloud Web Security uses web proxies in the Cisco cloud. The all-in-one appliance describes the WSA."}, {"q": "Which two statements are true about NTP servers in an enterprise network? (Choose two.)", "o": ["NTP servers at stratum 1 are directly connected to an authoritative time source", "There can only be one NTP server on an enterprise network", "NTP servers control the mean time between failures (MTBF) for key network devices", "NTP servers ensure an accurate time stamp on logging and debugging information", "All NTP servers synchronize directly to a stratum 1 time source"], "a": [0, 3], "e": "NTP keeps timestamps accurate. Stratum 1 devices connect directly to authoritative sources, and lower strata sync from them."}, {"q": "How is a source IP address used in a standard ACL?", "o": ["It is the address used by a router to determine the best path to forward packets", "It is used to determine the default gateway of the router that has the ACL applied", "It is the address that is unknown, so the ACL must be placed on the interface closest to the source address", "It is the criterion that is used to filter traffic"], "a": 3, "e": "A standard ACL filters only on the source IP address. Extended ACLs add destination, traffic type and message type."}, {"q": "Which network service allows administrators to monitor and manage network devices?", "o": ["SNMP", "NTP", "NetFlow", "Syslog"], "a": 0, "e": "SNMP is an application layer protocol for managing and monitoring routers, switches, servers and other devices."}, {"q": "What is a function of a proxy firewall?", "o": ["Drops or forwards traffic based on packet header information", "Connects to remote servers on behalf of clients", "Filters IP traffic between bridged interfaces", "Uses signatures to detect patterns in network traffic"], "a": 1, "e": "Proxy firewalls filter at the application layer and shield client information by connecting to servers for the clients."}, {"q": "What network monitoring technology enables a switch to copy and forward traffic sent and received on multiple interfaces out another interface toward a network analysis device?", "o": ["NetFlow", "Port mirroring", "Network tap", "SNMP"], "a": 1, "e": "Port mirroring copies frames to another port that has an analysis device attached."}]}, {"id": "exam", "group": "exam", "label": "Long exam", "title": "Network Security Checkpoint Exam (Modules 1 to 6)", "qs": [{"q": "What are two drawbacks to using HIPS? (Choose two.)", "o": ["With HIPS, the network administrator must verify support for all the different operating systems used in the network.", "HIPS installations are vulnerable to fragmentation attacks or variable TTL attacks.", "HIPS has difficulty constructing an accurate network picture or coordinating events that occur across the entire network.", "With HIPS, the success or failure of an attack cannot be readily determined.", "If the network traffic stream is encrypted, HIPS is unable to access unencrypted forms of the traffic."], "a": [0, 2], "e": "Two disadvantages of deploying HIPS are (1) that it cannot create a complete view of the network or have knowledge of events that might be occurring beyond an individual host and (2) every host operating system within the organization must be supported. However, an advantage of using HIPS is that it can monitor and protect the operating system as well as critical system processes on each network host."}, {"q": "Which three IPv4 header fields have no equivalent in an IPv6 header? (Choose three.)", "o": ["fragment offset", "protocol", "flag", "identification", "version", "TTL"], "a": [0, 2, 3], "e": "Unlike IPv4, IPv6 routers do not perform fragmentation. Therefore, all three fields supporting fragmentation in the IPv4 header are removed and have no equivalent in the IPv6 header. These three fields are fragment offset, flag, and identification. IPv6 does support host packet fragmentation through the use of extension headers, which are not part of the IPv6 header."}, {"q": "What is the first line of defense to protect a device from improper access control?", "o": ["end user license agreement (EULA)", "encryption", "shredding", "passwords"], "a": 3, "e": "Improper access control is a common data loss vector. Passwords are the first line of defense because stolen or weak passwords provide a threat actor access to machines and data on the network."}, {"q": "Which term describes a field in the IPv4 packet header used to detect corruption in the IPv4 header?", "o": ["version", "protocol", "destination IPv4 address", "header checksum"], "a": 3, "e": "The header checksum is used to determine if any errors have been introduced during transmission."}, {"q": "Which combination of WLAN authentication and encryption is recommended as a best practice for home users?", "o": ["WPA2 and AES", "WEP and RC4", "WPA and PSK", "EAP and AES", "WEP and TKIP"], "a": 0, "e": "WPA2 is the Wi-Fi alliance version of 802.11i, the industry standard for authentication. Neither WEP nor WPA possess the level of authentication provided by WPA2. AES aligns with WPA2 as an encryption standard, and is stronger than TKIP or RC4. PSK refers to pre-shared passwords, an authentication method that can be used by either WPA or WPA2. EAP is intended for use with enterprise networks which use a RADIUS server."}, {"q": "Match the DNS attack to the definition: the attacker sends falsified information to redirect users to malicious sites.", "o": ["Resource utilization attack", "Cache poisoning", "Amplification and reflection", "DNS tunneling"], "a": 1, "e": "Cache poisoning plants false DNS data so users are sent to malicious sites."}, {"q": "Which statement describes one of the rules that govern interface behavior in the context of implementing a zone-based policy firewall configuration?", "o": ["An administrator can assign interfaces to zones, regardless of whether the zone has been configured.", "An administrator can assign an interface to multiple security zones.", "By default, traffic is allowed to flow between a zone member interface and any interface that is not a zone member.", "By default, traffic is allowed to flow among interfaces that are members of the same zone."], "a": 3, "e": "An interface can belong to only one zone. Creating a zone is the first step in configuring a zone-based policy firewall. A zone cannot be assigned to an interface if the zone has not been created. Traffic can never flow between an interface that is assigned to a zone and an interface that has not been assigned to a zone."}, {"q": "What is an IPS signature?", "o": ["It is a set of rules used to detect typical intrusive activity.", "It is a security script that is used to detect unknown threats.", "It is the timestamp that is applied to logged security events and alarms.", "It is the authorization that is required to implement a security policy."], "a": 0, "e": "An IPS signature uniquely identifies specific malware, protocol anomalies, or malicious traffic. IPS sensors are tuned to look for matching signatures or abnormal traffic patterns. IPS signatures are conceptually similar to the virus.dat file used by virus scanners."}, {"q": "What three best practices can help defend against social engineering attacks? (Choose three.)", "o": ["Deploy well-designed firewall appliances.", "Add more security guards.", "Resist the urge to click on enticing web links.", "Educate employees regarding policies.", "Do not provide password resets in a chat window.", "Enable a policy that states that the IT department should supply information over the phone only to managers."], "a": [2, 3, 4], "e": "A cybersecurity specialist must be aware of the technologies and measures that are used as countermeasures to protect the organization from threats and vulnerabilities."}, {"q": "What kind of ICMP message can be used by threat actors to create a man-in-the-middle attack?", "o": ["ICMP redirects", "ICMP unreachable", "ICMP echo request", "ICMP mask reply"], "a": 0, "e": "Common ICMP messages of interest to threat actors include the following:; ICMP echo request and echo reply: used to perform host verification and DoS attacks; ICMP unreachable: used to perform network reconnaissance and scanning attacks; ICMP mask reply: used to map an internal IP network; ICMP redirects: used to lure a target host into sending all traffic through a compromised device and create a man-in-the- middle attack; ICMP router discovery: used to inject bogus route entries into the routing table of a target host"}, {"q": "Which security measure is best used to limit the success of a reconnaissance attack from within a campus area network?", "o": ["Implement restrictions on the use of ICMP echo-reply messages.", "Implement access lists on the border router.", "Implement a firewall at the edge of the network.", "Implement encryption for sensitive traffic."], "a": 3, "e": "The implementation of an access list may provide extra security by permitting denying a flow of traffic, but it will not provide a direct response to limit the success of the attack. The implementation of a firewall on the network edge may prevent reconnaissance attacks from the Internet, but attacks within the local network are not prevented. By implementing restrictions on the sending of ICMP echo-reply messages within a local network, devices may not respond to ping messages, but port scans are not prevented and clear-text data sent on the network are still vulnerable. The best security measure is to encrypt as much network traffic as possible, both user data and network management traffic."}, {"q": "Match the cyberattacker to the description: they make political statements to create awareness of issues that are important to them.", "o": ["Vulnerability brokers", "State-sponsored attackers", "Cybercriminals", "Hacktivists"], "a": 3, "e": "Hacktivists are gray hat hackers who protest political and social ideas."}, {"q": "The employees in a company receive an email stating that the account password will expire immediately and requires a password reset within 5 minutes. Which statement would classify this email?", "o": ["It is a hoax.", "It is a DDoS attack.", "It is an impersonation attack.", "It is a piggy-back attack."], "a": 0, "e": "Social engineering uses several different tactics to gain information from victims."}, {"q": "Which type of network attack involves randomly opening many Telnet requests to a router and results in a valid network administrator not being able to access the device?", "o": ["man-in-the-middle", "SYN flooding", "spoofing", "DNS poisoning"], "a": 1, "e": "The TCP SYN Flood attack exploits the TCP three-way handshake. The threat actor continually sends TCP SYN session request packets with a randomly spoofed source IP address to an intended target. The target device replies with a TCP SYN-ACK packet to the spoofed IP address and waits for a TCP ACK packet. Those responses never arrive. Eventually the target host is overwhelmed with half-open TCP connections and denies TCP services."}, {"q": "How do cybercriminals make use of a malicious iFrame?", "o": ["The attacker embeds malicious content in bus
