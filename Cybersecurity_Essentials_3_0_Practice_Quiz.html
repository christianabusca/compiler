iness appropriate files.", "The iFrame allows the browser to load a web page from another source.", "The attacker redirects traffic to an incorrect DNS server.", "The iFrame allows multiple DNS subdomains to be used."], "a": 1, "e": "An inline frame or iFrame is an HTML element that allows the browser to load a different web page from another source."}, {"q": "A network administrator of a small advertising company is configuring WLAN security by using the WPA2 PSK method. Which credential do office users need in order to connect their laptops to the WLAN?", "o": ["the company username and password through Active Directory service", "a user passphrase", "a username and password configured on the AP", "a key that matches the key on the AP"], "a": 3, "e": "When a WLAN is configured with WPA2 PSK, wireless users must know the pre-shared key to associate and authenticate with the AP."}, {"q": "What is a vulnerability that allows criminals to inject scripts into web pages viewed by users?", "o": ["Cross-site scripting", "XML injection", "buffer overflow", "SQL injection"], "a": 0, "e": "Cross-site scripting (XSS) allows criminals to inject scripts that contain malicious code into web applications."}, {"q": "Match the DNS attack to the definition: the attacker sends multiple packets that consume server resources.", "o": ["Cache poisoning", "Resource utilization attack", "Amplification and reflection", "DNS shadowing"], "a": 1, "e": "Resource utilization attacks exhaust the resources of DNS open resolvers."}, {"q": "Match the cyberattacker to the description: they gather intelligence or commit sabotage on specific goals on behalf of their government.", "o": ["Hacktivists", "State-sponsored attackers", "Vulnerability brokers", "Cybercriminals"], "a": 1, "e": "State-sponsored attackers steal government secrets, gather intelligence and sabotage networks of foreign governments and organizations."}, {"q": "An attacker is redirecting traffic to a false default gateway in an attempt to intercept the data traffic of a switched network. What type of attack could achieve this?", "o": ["DHCP spoofing", "ARP cache poisoning", "TCP SYN flood", "DNS tunneling"], "a": 0, "e": "In DHCP spoofing attacks, a threat actor configures a fake DHCP server on the network to issue DHCP addresses to clients with the aim of forcing the clients to use a false or invalid default gateway. A man-in-the-middle attack can be created by setting the default gateway address to the IP address of the threat actor. Next Article → OS and Endpoint Security Checkpoint Exam Answers ABOUT THE AUTHOR ITExam Editorial Team The ITExamAnswers Editorial Team is a dedicated group of certified IT professionals and network engineers. We rigorously review, verify, and update all exam materials to ensure you receive the most accurate and reliable resources for your certification journey. 600 Join the discussion  { } [ + ] View Comments All content is created and curated by our editorial team. This is not a user-generated platform. About | Content Moderation Policy | Privacy Policy | Privacy Manager | Contact"}, {"q": "A disgruntled employee is using Wireshark to discover administrative Telnet usernames and passwords. What type of network attack does this describe?", "o": ["reconnaissance", "port redirection", "trust exploitation", "denial of service"], "a": 0, "e": "Wireshark is a free download that allows network packet inspection. Someone using this tool for malicious intent would be performing a reconnaissance attack. Through the capture of network packets, weak security network connectivity protocols such as Telnet can be caught, inspected, and then analyzed for detailed network information, including passwords."}, {"q": "What is a characteristic of the WLAN passive discover mode?", "o": ["The beaconing feature on the AP is disabled.", "The client must know the name of the SSID to begin the discover process.", "The client begins the discover process by sending a probe request.", "The AP periodically sends beacon frames containing the SSID."], "a": 3, "e": "In passive mode, the wireless clients learn what networks and APs are available. The client learns this information from beacon frames, sent by the APs, that contain the WLAN SSID, supported standards, and security settings."}, {"q": "A security service company is conducting an audit in several risk areas within a major corporate client. What attack or data loss vector term would be used to describe providing access to corporate data by gaining access to stolen or weak passwords?", "o": ["an internal threat", "improper access control", "hard copy", "unencrypted devices"], "a": 1, "e": "Improper access control allows the exploitation of stolen or weak passwords to gain access to corporate data."}, {"q": "Which statement describes a VPN?", "o": ["VPNs use virtual connections to create a private network through a public network.", "VPNs use open source virtualization software to create the tunnel through the Internet.", "VPNs use dedicated physical connections to transfer data between remote users.", "VPNs use logical connections to create public networks through the Internet."], "a": 0, "e": "A VPN is a private network that is created over a public network. Instead of using dedicated physical connections, a VPN uses virtual connections routed through a public network between two network devices."}, {"q": "A social media site is describing a security breach in a sensitive branch of a national bank. In the post, it refers to a vulnerability. What statement describes that term?", "o": ["The likelihood that a particular threat will exploit a vulnerability of an asset and result in an undesirable consequence.", "A weakness in a system or its design that could be exploited by a threat.", "The actions that are taken to protect assets by mitigating a threat or reducing risk.", "The potential damage to the organization that is caused by the threat."], "a": 1, "e": "Review terms and descriptions from module 2."}, {"q": "What type of attack targets an SQL database using the input field of a user?", "o": ["SQL injection", "XML injection", "buffer overflow", "Cross-site scripting"], "a": 0, "e": "A criminal can insert a malicious SQL statement in an entry field on a website where the system does not filter the user input correctly."}, {"q": "Which risk management plan involves discontinuing an activity that creates a risk?", "o": ["risk retention", "risk sharing", "risk avoidance", "risk reduction"], "a": 2, "e": "During a risk assessment it may be determined that an activity involves more risk than benefit. In such a situation an organization may decide to avoid the risk altogether by discontinuing the activity. This is known as risk avoidance."}, {"q": "A user calls the help desk complaining that the password to access the wireless network has changed without warning. The user is allowed to change the password, but an hour later, the same thing occurs. What might be happening in this situation?", "o": ["rogue access point", "user laptop", "user error", "password policy", "weak password"], "a": 0, "e": "Man-in-the-middle attacks are a threat that results in lost credentials and data. These type of attacks can occur for different reasons including traffic sniffing."}, {"q": "A cyber criminal sends a series of maliciously formatted packets to the database server. The server cannot parse the packets and the event causes the server to crash. What is the type of attack the cyber criminal launches?", "o": ["SQL injection", "packet Injection", "DoS", "man-in-the-middle"], "a": 2, "e": "A cybersecurity specialist needs to be familiar with the characteristics of the different types of malware and attacks that threaten an organization."}, {"q": "What does the term vulnerability mean?", "o": ["a potential threat that a hacker creates", "a known target or victim machine", "a weakness that makes a target susceptible to an attack", "a computer that contains sensitive information", "a method of attack to exploit a target"], "a": 2, "e": "A vulnerability is not a threat, but it is a weakness that makes the PC or the software a target for attacks."}, {"q": "Match the DNS attack to the definition: the attacker uses open resolvers to increase the volume of attacks and mask the true source.", "o": ["Resource utilization attack", "Cache poisoning", "DNS shadowing", "Amplification and reflection"], "a": 3, "e": "Open resolvers amplify the attack traffic and hide who is really sending it."}, {"q": "What are the two methods that a wireless NIC can use to discover an AP? (Choose two.)", "o": ["sending an ARP request broadcast", "receiving a broadcast beacon frame", "sending a multicast frame", "transmitting a probe request", "initiating a three-way handshake"], "a": [1, 3], "e": "Two methods can be used by a wireless device to discover and register with an access point: passive mode and active mode. In passive mode, the AP sends a broadcast beacon frame that contains the SSID and other wireless settings. In active mode, the wireless device must be manually configured for the SSID, and then the device broadcasts a probe request."}, {"q": "Match the cyberattacker to the description: they discover exploits and report them to vendors.", "o": ["Hacktivists", "State-sponsored attackers", "Cybercriminals", "Vulnerability brokers"], "a": 3, "e": "Vulnerability brokers are typically gray hat hackers who report exploits to vendors, sometimes for rewards."}, {"q": "What is a function of SNMP?", "o": ["provides statistical analysis on packets flowing through a Cisco router or multilayer switch", "synchronizes the time across all devices on the network", "provides a message format for communication between network device managers and agents", "captures packets entering and exiting the network interface card"], "a": 2, "e": "SNMP is an application layer protocol that allows administrators to manage devices on the network by providing a messaging format for communication between network device managers and agents."}]}];
const L = ['A', 'B', 'C', 'D', 'E', 'F'];
const app = document.getElementById('app');
const state = { view: 'home', mod: null, order: [], pos: 0, answers: {}, sel: {}, best: {} };
const GROUPS = [
  ['exam', 'Long exam', 'One sitting across Modules 1 to 6. Some questions need more than one answer.'],
  ['quiz', 'Module quizzes', 'The short end-of-module quizzes, one per module.'],
  ['practice', 'Practice quizzes', '50 questions per module, written from the slides.']
];

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
const isMulti = q => Array.isArray(q.a);
const sameSet = (x, y) => x.length === y.length && x.every((v, i) => v === y[i]);
const isRight = (q, a) => a !== undefined && (isMulti(q) ? sameSet(a, q.a) : a === q.a);
const lets = (arr) => arr.map(i => L[i]).join(', ');

function start(modId, subset) {
  const m = MODULES.find(x => String(x.id) === String(modId));
  state.mod = m;
  state.order = subset && subset.length ? subset.slice() : m.qs.map((_, i) => i);
  state.pos = 0;
  state.answers = subset ? Object.assign({}, state.answers) : {};
  state.sel = {};
  if (subset) subset.forEach(i => delete state.answers[i]);
  state.view = 'quiz';
  render();
  window.scrollTo(0, 0);
}

function score() {
  let ok = 0, done = 0;
  state.order.forEach(i => {
    const a = state.answers[i];
    if (a !== undefined) { done++; if (isRight(state.mod.qs[i], a)) ok++; }
  });
  return { ok, done };
}

function render() {
  if (state.view === 'home') return renderHome();
  if (state.view === 'quiz') return renderQuiz();
  return renderResult();
}

function renderHome() {
  const sections = GROUPS.map(([g, name, blurb]) => {
    const ms = MODULES.filter(m => m.group === g);
    if (!ms.length) return '';
    const items = ms.map(m => {
      const b = state.best[m.id];
      const label = g === 'practice' ? `<span class="num">${esc(m.label)}.</span> ` : (g === 'quiz' ? `<span class="num">${esc(m.label)}.</span> ` : '');
      return `<li><button class="mod" data-mod="${m.id}">
        <span class="name">${label}${esc(m.title)}</span>
        <span class="meta">${m.qs.length} questions</span>
        <span class="score">${b === undefined ? '' : b + '/' + m.qs.length}<small>${b === undefined ? '' : 'best score'}</small></span>
      </button></li>`;
    }).join('');
    return `<h2 class="grp">${esc(name)}</h2><p class="grpsub">${esc(blurb)}</p><ul class="modlist">${items}</ul>`;
  }).join('');
  app.innerHTML = `
    <h1 class="home-title">Cybersecurity Essentials 3.0 practice quiz</h1>
    <p class="home-sub">Pick a set. Choose an answer to see right away whether it is correct and why.</p>
    ${sections}
    <p class="note">Scores are kept only while this page stays open.</p>`;
  app.querySelectorAll('.mod').forEach(b => b.addEventListener('click', () => start(b.dataset.mod)));
}

function renderQuiz() {
  const m = state.mod, qi = state.order[state.pos], q = m.qs[qi];
  const chosen = state.answers[qi];
  const answered = chosen !== undefined;
  const multi = isMulti(q);
  const sel = state.sel[qi] || [];
  const sc = score();
  const cols = Math.min(25, state.order.length);
  const cells = state.order.map((i, p) => {
    const a = state.answers[i];
    const cls = a === undefined ? '' : (isRight(m.qs[i], a) ? 'ok' : 'bad');
    return `<button class="cell ${cls} ${p === state.pos ? 'cur' : ''}" data-pos="${p}" aria-label="Go to question ${p + 1}"></button>`;
  }).join('');
  const opts = q.o.map((t, i) => {
    let cls = '';
    if (answered) {
      const isAns = multi ? q.a.includes(i) : i === q.a;
      const picked = multi ? chosen.includes(i) : i === chosen;
      if (isAns) cls = 'right'; else if (picked) cls = 'wrong'; else cls = 'dim';
    } else if (multi && sel.includes(i)) cls = 'sel';
    return `<button class="opt ${cls}" data-i="${i}" ${answered ? 'disabled' : ''} ${multi && !answered ? `aria-pressed="${sel.includes(i)}"` : ''}><span class="ltr">${L[i]}</span><span>${esc(t)}</span></button>`;
  }).join('');
  const hint = multi && !answered ? `<p class="hint">Select ${q.a.length} answers, then check.</p>` : '';
  let fb = '';
  if (answered) {
    const correctText = multi ? q.a.map(i => `${L[i]}. ${esc(q.o[i])}`).join('<br>') : `${L[q.a]}. ${esc(q.o[q.a])}`;
    if (isRight(q, chosen)) {
      fb = `<div class="fb ok" role="status"><h3>Correct</h3><p>${esc(q.e)}</p></div>`;
    } else {
      const you = multi ? lets(chosen) : L[chosen];
      fb = `<div class="fb bad" role="status"><h3>Not quite</h3>
        <p>You chose ${you}. The correct answer${multi ? 's are' : ' is'}<br><strong>${correctText}</strong></p>
        <p>${esc(q.e)}</p></div>`;
    }
  }
  const last = state.pos === state.order.length - 1;
  const check = multi && !answered ? `<button class="btn" id="check" ${sel.length === q.a.length ? '' : 'disabled'}>Check answer</button>` : '';
  app.innerHTML = `
    <div class="topbar">
      <button class="link" id="home">Home</button>
      <div class="modname">${esc(m.label)}: ${esc(m.title)}</div>
      <div class="tally">${sc.ok} correct</div>
    </div>
    <div class="cells" style="grid-template-columns:repeat(${cols},1fr)" role="group" aria-label="Question progress">${cells}</div>
    <section class="qcard">
      <p class="qcount">Question ${state.pos + 1} of ${state.order.length}</p>
      <h2 class="qtext">${esc(q.q)}</h2>
      ${hint}
      <div class="opts">${opts}</div>
      ${check ? `<div class="checkrow">${check}</div>` : ''}
      ${fb}
    </section>
    <div class="nav">
      <button class="btn ghost" id="prev" ${state.pos === 0 ? 'disabled' : ''}>Previous</button>
      ${last ? '<button class="btn" id="finish">See results</button>' : '<button class="btn" id="next">Next question</button>'}
    </div>`;
  app.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => choose(+b.dataset.i)));
  app.querySelectorAll('.cell').forEach(b => b.addEventListener('click', () => { state.pos = +b.dataset.pos; render(); }));
  document.getElementById('home').addEventListener('click', () => { state.view = 'home'; render(); });
  document.getElementById('prev').addEventListener('click', () => { if (state.pos > 0) { state.pos--; render(); } });
  const ck = document.getElementById('check'); if (ck) ck.addEventListener('click', submitMulti);
  const nx = document.getElementById('next'); if (nx) nx.addEventListener('click', () => { state.pos++; render(); window.scrollTo(0, 0); });
  const fn = document.getElementById('finish'); if (fn) fn.addEventListener('click', finish);
}

function choose(i) {
  const qi = state.order[state.pos], q = state.mod.qs[qi];
  if (state.answers[qi] !== undefined || i >= q.o.length) return;
  if (isMulti(q)) {
    const cur = (state.sel[qi] || []).slice();
    const at = cur.indexOf(i);
    if (at >= 0) cur.splice(at, 1); else cur.push(i);
    state.sel[qi] = cur;
    renderQuiz();
    return;
  }
  state.answers[qi] = i;
  renderQuiz();
  const fb = app.querySelector('.fb');
  if (fb) fb.scrollIntoView({ block: 'nearest' });
}

function submitMulti() {
  const qi = state.order[state.pos], q = state.mod.qs[qi];
  const cur = (state.sel[qi] || []).slice().sort((a, b) => a - b);
  if (state.answers[qi] !== undefined || cur.length !== q.a.length) return;
  state.answers[qi] = cur;
  renderQuiz();
  const fb = app.querySelector('.fb');
  if (fb) fb.scrollIntoView({ block: 'nearest' });
}

function finish() {
  state.view = 'result';
  const full = state.order.length === state.mod.qs.length;
  const sc = score();
  if (full && sc.done === state.order.length) {
    const prev = state.best[state.mod.id];
    if (prev === undefined || sc.ok > prev) state.best[state.mod.id] = sc.ok;
  }
  render();
  window.scrollTo(0, 0);
}

function renderResult() {
  const m = state.mod, sc = score();
  const total = state.order.length;
  const unanswered = total - sc.done;
  const missed = state.order.filter(i => state.answers[i] !== undefined && !isRight(m.qs[i], state.answers[i]));
  const pct = total ? Math.round(sc.ok / total * 100) : 0;
  const list = missed.map(i => {
    const q = m.qs[i], c = state.answers[i], multi = isMulti(q);
    const yours = multi ? c.map(k => `${L[k]}. ${esc(q.o[k])}`).join('; ') : `${L[c]}. ${esc(q.o[c])}`;
    const right = multi ? q.a.map(k => `${L[k]}. ${esc(q.o[k])}`).join('; ') : `${L[q.a]}. ${esc(q.o[q.a])}`;
    return `<div class="miss"><p class="mq">${esc(q.q)}</p>
      <p class="you">Your answer: ${yours}</p>
      <p class="ans">Correct answer: ${right}</p>
      <p class="why">${esc(q.e)}</p></div>`;
  }).join('');
  app.innerHTML = `
    <div class="topbar"><button class="link" id="home">Home</button><div class="modname">${esc(m.label)}: ${esc(m.title)}</div><div></div></div>
    <section class="result">
      <h2>${pct >= 80 ? 'Strong result' : pct >= 60 ? 'Getting there' : 'Keep practicing'}</h2>
      <p class="big">${sc.ok}<span> / ${total} (${pct}%)</span></p>
      ${unanswered ? `<p>${unanswered} question${unanswered > 1 ? 's' : ''} left unanswered.</p>` : ''}
      <div class="actions">
        ${missed.length ? '<button class="btn" id="retry-missed">Retry missed questions</button>' : ''}
        <button class="btn ghost" id="restart">Restart</button>
        <button class="btn ghost" id="back">Back to questions</button>
      </div>
      ${missed.length ? `<h3 style="margin-bottom:.75rem">Review: questions you missed</h3>${list}` : '<p>No missed questions. Nice work.</p>'}
    </section>`;
  document.getElementById('home').addEventListener('click', () => { state.view = 'home'; render(); });
  document.getElementById('restart').addEventListener('click', () => start(m.id));
  document.getElementById('back').addEventListener('click', () => { state.view = 'quiz'; state.pos = 0; render(); });
  const rm = document.getElementById('retry-missed'); if (rm) rm.addEventListener('click', () => start(m.id, missed));
}

document.addEventListener('keydown', e => {
  if (state.view !== 'quiz' || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toUpperCase();
  const idx = L.indexOf(k);
  if (idx >= 0 && k.length === 1) { choose(idx); return; }
  if (e.key === 'Enter' || e.key === 'ArrowRight') {
    const ck = document.getElementById('check');
    if (ck && !ck.disabled && document.activeElement.tagName !== 'BUTTON') { ck.click(); return; }
    const nx = document.getElementById('next'); if (nx && document.activeElement.tagName !== 'BUTTON') nx.click();
  }
  if (e.key === 'ArrowLeft') { const pv = document.getElementById('prev'); if (pv && !pv.disabled) pv.click(); }
});

render();
</script>
</body>
</html>
